aminated drinking water only"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q71","source":{"part":0,"qn":71}},{"part":0,"n":72,"q":"Which of the following is an example of an MDRO mentioned in the lecture?","options":["Measles virus","MRSA","Influenza virus","Rabies virus"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q72","source":{"part":0,"qn":72}},{"part":0,"n":74,"q":"For patients under contact precautions, the preferred placement is:","options":["An open waiting area","A shared room with unrelated patients","A positive-pressure room","A single-patient room, if available"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q74","source":{"part":0,"qn":74}},{"part":0,"n":75,"q":"If a single room is unavailable for a patient requiring contact precautions, an appropriate option is:","options":["Cohorting patients with the same organism","Removing all PPE requirements","Placing the patient in a public waiting area","Using an airborne isolation room in every case"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q75","source":{"part":0,"qn":75}},{"part":0,"n":76,"q":"Which PPE is required for contact precautions during interactions that may involve contact with the patient or their environment?","options":["Gown and gloves","Surgical mask only","Eye protection only","N95 respirator only"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q76","source":{"part":0,"qn":76}},{"part":0,"n":77,"q":"Under contact precautions, gown and gloves should be put on:","options":["After touching the patient","Upon room entry","Only when leaving the room","Before entering the hospital"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q77","source":{"part":0,"qn":77}},{"part":0,"n":78,"q":"Under contact precautions, contaminated PPE should be removed:","options":["After entering the next patient's room","Outside the hospital building","Before exiting the room, followed by hand hygiene","Only at the end of the shift"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q78","source":{"part":0,"qn":78}},{"part":0,"n":79,"q":"If equipment must be shared between patients under contact precautions, it should be:","options":["Covered with paper only","Used without cleaning if gloves are worn","Cleaned and disinfected before use on another patient","Discarded after every use regardless of type"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q79","source":{"part":0,"qn":79}},{"part":0,"n":196,"q":"Cohorting patients under Standard Precautions may be considered when patients:","options":["Require different isolation categories","Have different infections and different risk levels","Have no confirmed or suspected infection","Have the same infection type and similar risk levels"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q196","source":{"part":0,"qn":196}},{"part":0,"n":209,"q":"Contact precautions are intended to prevent transmission through:","options":["Large respiratory droplets only","Direct or indirect contact with the patient or their environment","Airborne particles only","Ingestion of contaminated food only"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q209","source":{"part":0,"qn":209}},{"part":0,"n":211,"q":"Which hand hygiene method is preferred for C. diCicile and norovirus according to the lecture?","options":["Soap-and-water hand hygiene","Alcohol-based hand rub only","Surgical scrub only","No hand hygiene after patient contact"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q211","source":{"part":0,"qn":211}},{"part":0,"n":212,"q":"During contact precautions, gown and gloves should be worn:","options":["For interactions that may involve contact with the patient or their environment","Only when transporting the patient","Only during invasive procedures","Only after leaving the room"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q212","source":{"part":0,"qn":212}},{"part":0,"n":213,"q":"When should PPE be donned under contact precautions?","options":["After leaving the room","Upon room entry","During patient transport only","After touching contaminated equipment"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q213","source":{"part":0,"qn":213}},{"part":0,"n":214,"q":"When should gown and gloves be removed under contact precautions?","options":["Only at the end of the shift","Before entering the room","After reaching the next patient's room","Before exiting the room, followed by hand hygiene"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q214","source":{"part":0,"qn":214}},{"part":0,"n":215,"q":"If shared patient-care equipment must be used for multiple patients under contact precautions, it should be:","options":["Cleaned and disinfected before use on another patient","Discarded after every patient regardless of type","Used without cleaning","Covered with ordinary paper only"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q215","source":{"part":0,"qn":215}},{"part":0,"n":216,"q":"For contact precautions, room cleaning should prioritize:","options":["Frequently touched surfaces and equipment near the patient","Floors only","Windows only","Areas outside the isolation room only"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q216","source":{"part":0,"qn":216}},{"part":0,"n":238,"q":"During radiological imaging of a patient under contact precautions, which protective measures are recommended?","options":["Gown and gloves with a disposable detector or cassette cover","N95 respirator only","Surgical mask only","No PPE if the patient is cooperative"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q238","source":{"part":0,"qn":238}},{"part":0,"n":244,"q":"Which practice is speciﬁcally prohibited when examining patients with suspected infectious conjunctivitis?","options":["Performing hand hygiene","Cleaning the slit-lamp surfaces","Using gloves","Sharing eye-drop bottles"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q244","source":{"part":0,"qn":244}}],"audios":[{"src":"Audio/INF-L3.m4a","title":"Infection control — lecture 3","start":0,"end":0}],"visuals":[{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 2","n":2,"asset":"images\\inf-transmission\\page-2.png","path":"Assets/inf-transmission/page-2.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 3","n":3,"asset":"images\\inf-transmission\\page-3.png","path":"Assets/inf-transmission/page-3.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 4","n":4,"asset":"images\\inf-transmission\\page-4.png","path":"Assets/inf-transmission/page-4.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 5","n":5,"asset":"images\\inf-transmission\\page-5.png","path":"Assets/inf-transmission/page-5.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 6","n":6,"asset":"images\\inf-transmission\\page-6.png","path":"Assets/inf-transmission/page-6.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 8","n":8,"asset":"images\\inf-transmission\\page-8.png","path":"Assets/inf-transmission/page-8.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 9","n":9,"asset":"images\\inf-transmission\\page-9.png","path":"Assets/inf-transmission/page-9.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 10","n":10,"asset":"images\\inf-transmission\\page-10.png","path":"Assets/inf-transmission/page-10.png"}]},{"id":"inf-airborne","titleAr":"احتياطات الانتقال الهوائي","titleEn":"Airborne precautions","summaryAr":"أمرضة الرذاذ النووي الأصغر من 5 ميكرون: غرفة الضغط السالب AIIR + كمامة N95 + تقييد دخول غير المحصنين + نقل المريض بالكمامة + تهوية الغرفة بعد الخروج.","summaryEn":"Droplet-nuclei diseases under 5 µm: AIIR negative-pressure rooms, N95 respirators, restricting non-immune staff, masked transport, and room air exchange after discharge.","objectivesAr":["اذكر أمثلة الأمراض الهوائية.","اشرح مواصفات AIIR.","علّق على فترة التهوية."],"objectivesEn":["List airborne disease examples.","Describe AIIR specifications.","Comment on the air-exchange wait."],"refs":[{"source":"inf-transmission","n":11},{"source":"inf-transmission","n":12},{"source":"inf-transmission","n":14},{"source":"inf-transmission","n":17},{"source":"inf-transmission","n":18}],"galleryRefs":[{"source":"inf-transmission","n":13},{"source":"inf-transmission","n":15},{"source":"inf-transmission","n":16}],"evidence":[{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 11","text":"• •Prevent transmission of diseases spread by infectious respiratory particles that stay suspended in the air and are inhaled, even far from the source (traditionally droplet nuclei < 5 µm •Examples: tuberculosis, measles, chickenpox and disseminated zoster, smallpox. COVID-19 Airborne precautions","egyptian":"الهوائي: عدوى بتنتقل بجزيئات تنفسية معلقة بته وتستنشق من مسافات بعيدة (نويات رذاذة أقل من 5 ميكرون) — أمثلة: الدرن والحصبة والجديري والزوستر المنتشر والجدري وكوفيد."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 12","text":"• •In an airborne infection isolation room (AIIR) with negative air pressure; mask the patient if they must leave the room. •Limited resources: mask the patient in a private room with the door closed until transfer to an AIIR facility or return home. •Restrict susceptible healthcare personnel from entering (measles, chickenpox, disseminated zoster, smallpox) if immune staff are available. Patient placement","egyptian":"وضع الهوائي: غرفة عزل AIIR ضغط سلبي + كمامة للمريض لو لازم يخرج + لو الموارد محدودة كمامة في غرفة خاصة بابها مقفول + امنع العاملين غير المحصنين (حصبة وجديري وزوستر وجدري)."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 14","text":"• •Wear a fit-tested NIOSH-approved N95 (or higher / equivalent FFP2) respirator before entering the patient's room. •Remove the respirator after leaving the room and closing the door. •Then perform hand hygiene. PPE","egyptian":"PPE الهوائي: كمامة N95 معتمدة NIOSH (أو FFP2) مختبرة القياس قبل دخول الغرفة + تنزع بعد الخروج وقفل الباب + بعدها نظافة اليدين."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 17","text":"• •Limit transport and movement to medically necessary purposes. •Instruct the patient to wear a surgical mask and observe cough etiquette. •Plan transport to limit exposure of others (e.g., no waiting in reception areas, empty elevator). •Transport staff need no mask or respirator if the patient is masked and skin lesions are covered. Transport and movement of patients","egyptian":"نقل الهوائي: للضرورة فقط + كمامة جراحية للمريض مع آداب الكحة + خطط النقل لتقليل تعرض الآخرين (ممنوع الانتظار في الاستقبال + مصعد فاضي) + طاقم النقل مش محتاج كمامة لو المريض مكمم والآفات مغطاة."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 18","text":"• •Routine cleaning of high-touch surfaces is standard. •Environmental services personnel should wear an N95 respirator on room entry. •After the patient has left, the room should remain unoccupied for enough time to allow for complete air exchange (1 hour or less, depending on the air handling capacity of the facility). Cleaning and disinfection of the rooms","egyptian":"تنظيف الهوائي: تنظيف روتيني للأسطح الملموسة + عامل النظافة يلبس N95 + بعد خروج المريض تفضل الغرفة فاضية وقت كافٍ لتبادل الهواء كامل (ساعة أو أقل حسب التهوية)."}],"quiz":[{"type":"mcq","q":"Airborne precautions require which respirator before room entry?","options":["Fit-tested NIOSH-approved N95 or higher","Any surgical mask","Cloth mask","No mask if the door is closed"],"answer":0,"why":"Wear a fit-tested NIOSH-approved N95 (or higher/equivalent FFP2) before entering.","source":{"source":"inf-transmission","n":14},"points":1},{"type":"mcq","q":"An AIIR is characterized by:","options":["Negative air pressure","Positive air pressure","Open windows","Shared ventilation"],"answer":0,"why":"The airborne infection isolation room has negative air pressure.","source":{"source":"inf-transmission","n":12},"points":1}],"cards":[{"id":"997677feaf","front":"Airborne diseases examples","back":"الدرن والحصبة والجديري والزوستر المنتشر والجدري وكوفيد.","en":"TB, measles, chickenpox, disseminated zoster, smallpox, COVID-19.","tag":"fact"},{"id":"ea946e0c5f","front":"What is an AIIR?","back":"غرفة عزل عدوى هوائية بضغط سلبي — والمريض يكمم لو خرج.","en":"Airborne infection isolation room with negative pressure; mask the patient if leaving.","tag":"fact"},{"id":"4815a52944","front":"Airborne PPE rule","back":"N95 معتمدة NIOSH (أو FFP2) مختبرة القياس قبل الدخول — تتنزع بعد الخروج وقفل الباب ثم نظافة اليدين.","en":"Fit-tested NIOSH N95/FFP2 before entry; remove after leaving and closing the door, then hand hygiene.","tag":"fact"},{"id":"e126c7fc12","front":"Room turnover after an airborne patient","back":"تفضل الغرفة فاضية لتبادل هواء كامل — ساعة أو أقل حسب التهوية.","en":"Keep the room unoccupied until complete air exchange — 1 hour or less depending on ventilation.","tag":"fact"},{"id":"3c14dcc8ff","front":"Airborne precautions require which respirator before room entry?","back":"Fit-tested NIOSH-approved N95 or higher — Wear a fit-tested NIOSH-approved N95 (or higher/equivalent FFP2) before entering.","en":"Fit-tested NIOSH-approved N95 or higher","tag":"quiz"},{"id":"c307fea8d2","front":"An AIIR is characterized by:","back":"Negative air pressure — The airborne infection isolation room has negative air pressure.","en":"Negative air pressure","tag":"quiz"}],"midterm":[{"part":0,"n":39,"q":"Airborne transmission occurs when infected particles:","options":["Require direct skin contact","Fall immediately onto nearby surfaces","Remain suspended in the air and can be inhaled","Are transmitted only through contaminated food"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q39","source":{"part":0,"qn":39}},{"part":0,"n":52,"q":"Respiratory hygiene requires covering the nose and mouth during coughing or sneezing using:","options":["A patient's gown","A reusable cloth shared between patients","Bare hands only","A tissue or the upper sleeve"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q52","source":{"part":0,"qn":52}},{"part":0,"n":70,"q":"Chickenpox and disseminated zoster may require:","options":["Standard Precautions only","Contact precautions only","Droplet precautions only","Airborne and contact precautions together"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q70","source":{"part":0,"qn":70}},{"part":0,"n":81,"q":"Airborne precautions are used for infectious respiratory particles that:","options":["Fall immediately within a few centimetres","Require direct skin contact","Are transmitted only through contaminated food","Remain suspended in the air and may be inhaled"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q81","source":{"part":0,"qn":81}},{"part":0,"n":82,"q":"Traditionally, droplet nuclei associated with airborne transmission are described in the lecture as:","options":["Larger than 100 µm","Exactly 10 µm","Larger than 20 µm","Smaller than 5 µm"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q82","source":{"part":0,"qn":82}},{"part":0,"n":83,"q":"Which of the following diseases requires airborne precautions according to the lecture?","options":["Pertussis","Mumps","Tuberculosis","Seasonal influenza"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q83","source":{"part":0,"qn":83}},{"part":0,"n":84,"q":"The preferred room for a patient requiring airborne precautions is:","options":["A shared room with an open door","A positive-pressure room","An airborne infection isolation room with negative air pressure","A general waiting room"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q84","source":{"part":0,"qn":84}},{"part":0,"n":85,"q":"Which respiratory protection should healthcare personnel wear before entering the room of a patient requiring airborne precautions?","options":["Surgical mask only","No respiratory protection if gloves are worn","Ordinary cloth mask","Fit-tested NIOSH-approved N95 or higher/equivalent FFP2 respirator"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q85","source":{"part":0,"qn":85}},{"part":0,"n":86,"q":"Droplet precautions prevent transmission through respiratory particles that:","options":["Are larger than 5 µm and travel short distances","Remain suspended in the air for long periods","Are transmitted only through contaminated needles","Enter the body only through ingestion"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q86","source":{"part":0,"qn":86}},{"part":0,"n":87,"q":"According to the lecture, large respiratory droplets generally travel approximately:","options":["More than 50 m","1–2 m","10–15 m","20–30 m"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q87","source":{"part":0,"qn":87}},{"part":0,"n":90,"q":"During radiological imaging of a patient requiring airborne precautions, which combination is appropriate?","options":["No special measures if portable imaging is used","Gown only for staff","Unmasked patient and surgical mask for staff","Masked patient, N95 for staB, and keeping the room empty until the air has cleared"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q90","source":{"part":0,"qn":90}},{"part":0,"n":195,"q":"Which action is recommended during respiratory hygiene?","options":["Leave used tissues on the patient's bed","Avoid wearing a surgical mask around patients with respiratory disease","Reuse tissues containing respiratory secretions","Cover the nose and mouth with a tissue or upper sleeve when coughing or sneezing"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q195","source":{"part":0,"qn":195}},{"part":0,"n":208,"q":"Which infection listed in the lecture may require both airborne and contact precautions?","options":["Norovirus","Pertussis","Chickenpox","Seasonal influenza"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q208","source":{"part":0,"qn":208}},{"part":0,"n":218,"q":"Airborne precautions are used for infectious respiratory particles that:","options":["Fall immediately after leaving the patient","Spread only through direct skin contact","Spread only through contaminated food","Remain suspended in air and may be inhaled even far from the source"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q218","source":{"part":0,"qn":218}},{"part":0,"n":219,"q":"Traditionally, the droplet nuclei associated with airborne transmission are described as:","options":["Greater than 10 µm","Exactly 10 µm","Less than 5 µm","Greater than 20 µm"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q219","source":{"part":0,"qn":219}},{"part":0,"n":220,"q":"Which room is preferred for a patient requiring airborne precautions?","options":["Ordinary waiting room","Positive-pressure room","Shared room without ventilation","Airborne infection isolation room with negative air pressure"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q220","source":{"part":0,"qn":220}},{"part":0,"n":221,"q":"If an airborne-isolation room is unavailable, the lecture recommends initially placing the patient in:","options":["A shared room with the door open","An operating theatre","A public waiting area","A private room with the door closed, with the patient masked until transfer or return home"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q221","source":{"part":0,"qn":221}},{"part":0,"n":222,"q":"Which respirator is recommended for healthcare workers entering the room of a patient requiring airborne precautions?","options":["Fit-tested NIOSH-approved N95 or higher/equivalent FFP2","Surgical mask only","Face shield only","Cloth mask"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q222","source":{"part":0,"qn":222}},{"part":0,"n":223,"q":"When should the respirator be removed under airborne precautions?","options":["Before closing the room door","Before entering the patient's room","After leaving the room and closing the door","While still beside the patient"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q223","source":{"part":0,"qn":223}},{"part":0,"n":224,"q":"After removing the respirator under airborne precautions, the healthcare worker should:","options":["Immediately enter another room","Touch the face and eyes","Perform hand hygiene","Reuse the respirator without checking it"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q224","source":{"part":0,"qn":224}},{"part":0,"n":225,"q":"During transport of a patient requiring airborne precautions, which action is recommended?","options":["The patient should wear a surgical mask and observe cough etiquette","The patient should remove all masks","The patient should wait in a crowded reception area","Transport should occur without planning"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q225","source":{"part":0,"qn":225}},{"part":0,"n":226,"q":"After a patient requiring airborne precautions has left the room, the room should remain unoccupied for:","options":["Exactly 5 minutes in every facility","At least 24 hours in every facility","No time at all","Enough time for complete air exchange, stated as 1 hour or less depending on air-handling capacity"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q226","source":{"part":0,"qn":226}},{"part":0,"n":228,"q":"According to the lecture, large respiratory droplets generally travel approximately:","options":["Unlimited distances","1–2 m before falling","10–20 m before falling","50 m before falling"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q228","source":{"part":0,"qn":228}},{"part":0,"n":234,"q":"During droplet precautions, when is an N95 respirator speciﬁcally recommended according to the lecture?","options":["During ordinary patient transport only","During all routine conversations","During routine room cleaning only","During aerosol-generating procedures"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q234","source":{"part":0,"qn":234}},{"part":0,"n":240,"q":"During radiology imaging of a patient requiring airborne precautions, the staC should use:","options":["No respiratory protection","Gloves only","Surgical mask only","N95 respirator"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q240","source":{"part":0,"qn":240}},{"part":0,"n":241,"q":"In radiology, after an airborne-precaution patient leaves the imaging room, the room should be:","options":["Kept empty until the air has cleared","Converted into a waiting room","Used without cleaning or ventilation","Immediately occupied by another patient"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q241","source":{"part":0,"qn":241}}],"audios":[{"src":"Audio/INF-L3.m4a","title":"Infection control — lecture 3","start":0,"end":0}],"visuals":[{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 11","n":11,"asset":"images\\inf-transmission\\page-11.png","path":"Assets/inf-transmission/page-11.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 12","n":12,"asset":"images\\inf-transmission\\page-12.png","path":"Assets/inf-transmission/page-12.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 14","n":14,"asset":"images\\inf-transmission\\page-14.png","path":"Assets/inf-transmission/page-14.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 17","n":17,"asset":"images\\inf-transmission\\page-17.png","path":"Assets/inf-transmission/page-17.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 18","n":18,"asset":"images\\inf-transmission\\page-18.png","path":"Assets/inf-transmission/page-18.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 13","n":13,"asset":"images\\inf-transmission\\page-13.png","path":"Assets/inf-transmission/page-13.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 15","n":15,"asset":"images\\inf-transmission\\page-15.png","path":"Assets/inf-transmission/page-15.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 16","n":16,"asset":"images\\inf-transmission\\page-16.png","path":"Assets/inf-transmission/page-16.png"}]},{"id":"inf-droplet","titleAr":"احتياطات الرذاذ وتطبيقات الأشعة","titleEn":"Droplet precautions and radiology practice","summaryAr":"قطرات أكبر من 5 ميكرون لمسافة 1-2م: مسافة الأسرة + كمامة جراحية للمريض والطاقم + N95 للإجراءات الرذاذة + تطبيقات الأشعة والبصريات لكل نوع احتياط.","summaryEn":"Droplets over 5 µm travelling 1-2 m: bed spacing, surgical masks for patient and staff, N95 for aerosol-generating procedures, plus radiology and optometry applications per precaution type.","objectivesAr":["ميّز الرذاذ عن الهوائي.","اذكر أمثلة أمراض الرذاذ.","لخّص بروتوكول قسم الأشعة."],"objectivesEn":["Distinguish droplet from airborne.","List droplet disease examples.","Summarize the radiology protocol."],"refs":[{"source":"inf-transmission","n":19},{"source":"inf-transmission","n":20},{"source":"inf-transmission","n":21},{"source":"inf-transmission","n":23},{"source":"inf-transmission","n":24},{"source":"inf-transmission","n":25},{"source":"inf-transmission","n":26}],"galleryRefs":[{"source":"inf-transmission","n":22}],"evidence":[{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 19","text":"• •Prevent transmission of diseases spread by large respiratory droplets (particles > 5 µm) that travel only short distances (about 1–2 m / 3–6 ft) before falling. •They are produced when the infected patient talks, coughs, or sneezes, and during some procedures (e.g., suctioning, bronchoscopy). •Examples: seasonal influenza, pertussis, mumps, rubella, adenovirus, rhinovirus, Neisseria meningitidis. Droplet precautions","egyptian":"الرذاذ: قطرات كبيرة أكبر من 5 ميكرون بتقطع مسافة قصيرة (1-2م) قبل ما تقع — بتنتج بالكلام والكحة والعطس وإجراءات زي الشفط والمنظار — أمثلة: الإنفلونزا الموسمية والسعال الديكي والنكاف والحصبة الألمانية والأدينوفيروس والرينوفيروس والنيسرية السحائية."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 20","text":"• •A single-patient room is preferred; if unavailable, patients with the same infection may share a room. •Separate beds by at least 1 m (3 ft); many facilities use 2 m (6 ft). Patient placement","egyptian":"وضع الرذاذ: غرفة مفردة أفضل ولو مش متاح مشاركة نفس العدوى + سراير متباعدة متر على الأقل وكثير من الأماكن بيستخدموا 2م."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 21","text":"• •Wear a surgical mask when entering the room; also put a mask on the patient. •Add eye protection, gloves and gown per Standard Precautions if splash risk. •For aerosol-generating procedures, wear an N95. PPE","egyptian":"PPE الرذاذ: كمامة جراحية عند دخول الغرفة + كمامة للمريض كمان + حماية عين وقفازات ورداء حسب القياسية لو خطر الرشاش + N95 للإجراءات المولدة للرذاذ."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 23","text":"• •Limit the movement and transport of the patient to medically necessary purposes. The patient should wear a surgical mask during transport and follow respiratory hygiene and cough etiquette. Transport and movement of patients","egyptian":"نقل الرذاذ: للضرورة فقط + كمامة جراحية للمريض مع آداب تنفسية."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 24","text":"• •Daily cleaning of high-touch and horizontal surfaces with a hospital-approved disinfectant. •Environmental services personnel should don a surgical mask before room entry. Cleaning and disinfection of the rooms","egyptian":"تنظيف الرذاذ: يومي للأسطح الملموسة والأفقية بمطهر معتمد + كمامة جراحية لعامل النظافة قبل الدخول."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 25","text":"• •Notify the radiology department before the patient arrives; keep the isolation sign in place. •Prefer portable imaging in the patient's room. If the patient must come, go straight in (no waiting area), ideally at the end of the list. •Contact: gown and gloves, disposable cover for the detector or cassette, then clean and disinfect the machine, table and probes. •Droplet: surgical mask for patient and staff. Airborne: masked patient, N95 for staff, room kept empty until the air has cleared. •Hand hygiene before and after every patient; remove PPE before leaving the room. Radiology","egyptian":"الأشعة: بلغ القسم قبل وصول المريض + فضّل التصوير المحمول في غرفته + لو لازم يجي يدخل على طول (بدون انتظار) ويفضل آخر القائمة + تماس: رداء وقفازات وغطاء أحاديUsage للكاشف + تطهير الجهاز والطاولة بعده + رذاذ: كمامة للمريض والطاقم + هوائي: مريض مكمم وN95 للطاقم والغرفة تفضل فاضية لتهويتها + نظافة يدين قبل وبعد كل مريض."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 26","text":"• •Contact: adenoviral conjunctivitis spreads easily, so use gloves and hand hygiene, and never share eye-drop bottles. •Clean slit-lamp chin and forehead rests, handles and other touched surfaces between patients; use a breath shield. •Use single-use or disinfected tonometer tips, trial lenses and diagnostic contact lenses, per the manufacturer's instructions. •Droplet: patient with cough or fever wears a surgical mask, stays 1–2 m from others, and non-urgent exams are postponed. •See suspected infectious cases at the end of the session and clean the room afterwards. Optometry","egyptian":"البصريات: التهاب الملتحمة الأدينوفيريسي شديد العدوى — قفازات ونظافة يدين وممنوع مشاركة قطرات العين + نظف ذقن وجبهة المصباح الشقي والمقابض بين المرضى + درع تنفس + أطرابوس ترمومتر وعدسات أحاديةUsage + رذاذ: كمامة للمريض وتباعد 1-2م وتأجيل غير الطارئ + الحالات المشتبهة آخر الجلسة وتنظيف بعدها."}],"quiz":[{"type":"mcq","q":"Droplet transmission involves particles that travel about:","options":["1-2 m before falling","Across the whole building","Only by direct touch","More than 10 m"],"answer":0,"why":"Large droplets over 5 µm travel only about 1-2 m (3-6 ft) before falling.","source":{"source":"inf-transmission","n":19},"points":1},{"type":"mcq","q":"For radiology, the best approach for an isolated patient is:","options":["Portable imaging in the patient's room when possible","Waiting in the reception with others","First on the list","Shared detector without cleaning"],"answer":0,"why":"Prefer portable imaging in the room; if the patient must come, go straight in, ideally at the end of the list.","source":{"source":"inf-transmission","n":25},"points":1}],"cards":[{"id":"7fbaabc361","front":"Droplet size and distance","back":"أكبر من 5 ميكرون وتقطع 1-2م قبل الوقوع.","en":"Over 5 µm, travelling about 1-2 m.","tag":"fact"},{"id":"49a5f2a2b6","front":"Droplet disease examples","back":"إنفلونزا وسعال دكي ونكاف وحصبة ألمانية وأدينوفيروس ورينوفيروس والنيسرية السحانية.","en":"Influenza, pertussis, mumps, rubella, adenovirus, rhinovirus, N. meningitidis.","tag":"fact"},{"id":"83fdcc4896","front":"Radiology isolation protocol","back":"بلغ قبل وصوله + تصوير محمول في الغرفة + لو لازم: دخول مباشر وآخر القائمة + غطاء أحاديUsage للكاشف + تطهير الجهاز بعده.","en":"Notify, prefer portable imaging, straight in at list end, disposable detector cover, clean machine after.","tag":"fact"},{"id":"1224b68787","front":"Droplet transmission involves particles that travel about:","back":"1-2 m before falling — Large droplets over 5 µm travel only about 1-2 m (3-6 ft) before falling.","en":"1-2 m before falling","tag":"quiz"},{"id":"a9c6c82b2b","front":"For radiology, the best approach for an isolated patient is:","back":"Portable imaging in the patient's room when possible — Prefer portable imaging in the room; if the patient must come, go straight in, ideally at the end of the list.","en":"Portable imaging in the patient's room when possible","tag":"quiz"}],"midterm":[{"part":0,"n":88,"q":"Which group contains diseases listed as examples of droplet transmission?","options":["Influenza, pertussis, mumps, and rubella","Tuberculosis, measles, and chickenpox","Rabies, tetanus, and Lyme disease","Cholera, typhoid, and malaria"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q88","source":{"part":0,"qn":88}},{"part":0,"n":89,"q":"During droplet precautions, the healthcare worker should generally wear:","options":["No mask if the patient is wearing one","Gloves only","A surgical mask when entering the patient's room","An N95 respirator for every routine room entry"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q89","source":{"part":0,"qn":89}},{"part":0,"n":227,"q":"Droplet precautions are designed to prevent transmission by particles that are traditionally described as:","options":["Invisible radioactive particles","Less than 5 µm","Greater than 5 µm","Less than 1 µm"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q227","source":{"part":0,"qn":227}},{"part":0,"n":229,"q":"Which of the following procedures is mentioned as potentially producing droplets?","options":["Bronchoscopy","Both A and B","Suctioning","Neither A nor B"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q229","source":{"part":0,"qn":229}},{"part":0,"n":230,"q":"Which group contains only examples of infections requiring droplet precautions listed in the lecture?","options":["Tuberculosis, measles, and smallpox","Rabies, Lyme disease, and malaria","Seasonal influenza, pertussis, mumps, and rubella","Scabies, C. difficile, and norovirus"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q230","source":{"part":0,"qn":230}},{"part":0,"n":231,"q":"Under droplet precautions, the preferred patient placement is:","options":["A positive-pressure operating room","A single-patient room","A general waiting area","A crowded shared room"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q231","source":{"part":0,"qn":231}},{"part":0,"n":232,"q":"If a single-patient room is unavailable for droplet precautions, patients with the same infection may share a room. The minimum bed separation stated in the lecture is:","options":["0.5 m","At least 5 m","At least 1 m","0.25 m"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q232","source":{"part":0,"qn":232}},{"part":0,"n":233,"q":"What type of mask should healthcare workers wear when entering a room under droplet precautions?","options":["No mask","N95 in every routine interaction","Cloth mask only","Surgical mask"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q233","source":{"part":0,"qn":233}},{"part":0,"n":235,"q":"Before an isolated patient arrives for radiological imaging, the radiology department should be:","options":["Notified in advance","Asked to remove the isolation sign","Kept unaware of the patient's infection status","Informed only after imaging"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q235","source":{"part":0,"qn":235}},{"part":0,"n":237,"q":"If an isolated patient must attend the radiology department, the lecture recommends:","options":["Taking the patient directly into the room, ideally at the end of the list","Removing the isolation sign before arrival","Sending the patient to the waiting area first","Placing the patient between routine appointments"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q237","source":{"part":0,"qn":237}},{"part":0,"n":242,"q":"Which action is required before and after every patient in the radiology setting?","options":["Replacing the imaging detector","Repeating the patient's examination","Hand hygiene","Changing the X-ray tube"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q242","source":{"part":0,"qn":242}},{"part":0,"n":243,"q":"Adenoviral conjunctivitis is especially relevant to optometry because it:","options":["Spreads easily through contact","Is transmitted only by radioactive particles","Requires airborne precautions in every case","Cannot contaminate examination equipment"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q243","source":{"part":0,"qn":243}},{"part":0,"n":245,"q":"Which slit-lamp components should be cleaned between patients?","options":["The room door only","The floor only","The electrical supply only","Chin and forehead rests and handles"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q245","source":{"part":0,"qn":245}},{"part":0,"n":246,"q":"Which measure is recommended when using a slit lamp in optometry?","options":["Avoid cleaning the chin rest","Reuse tonometer tips without disinfection","Use a breath shield","Share uncleaned diagnostic lenses"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q246","source":{"part":0,"qn":246}},{"part":0,"n":247,"q":"Tonometer tips and diagnostic contact lenses should be:","options":["Reused without cleaning","Shared between patients without processing","Washed with water only in every case","Single-use or disinfected according to the manufacturer's instructions"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q247","source":{"part":0,"qn":247}},{"part":0,"n":248,"q":"A patient with cough or fever attending an optometry clinic under droplet precautions should:","options":["Remove the mask during examination","Sit close to other patients","Wear a surgical mask and stay 1–2 m from others","Attend non-urgent examinations before other patients"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q248","source":{"part":0,"qn":248}},{"part":0,"n":249,"q":"How should suspected infectious cases be scheduled in the optometry clinic according to the lecture?","options":["At the beginning of the session","At the end of the session, followed by room cleaning","In the waiting room with other patients","Between every two routine patients"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q249","source":{"part":0,"qn":249}}],"audios":[{"src":"Audio/INF-L3.m4a","title":"Infection control — lecture 3","start":0,"end":0}],"visuals":[{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 19","n":19,"asset":"images\\inf-transmission\\page-19.png","path":"Assets/inf-transmission/page-19.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 20","n":20,"asset":"images\\inf-transmission\\page-20.png","path":"Assets/inf-transmission/page-20.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 21","n":21,"asset":"images\\inf-transmission\\page-21.png","path":"Assets/inf-transmission/page-21.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 23","n":23,"asset":"images\\inf-transmission\\page-23.png","path":"Assets/inf-transmission/page-23.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 24","n":24,"asset":"images\\inf-transmission\\page-24.png","path":"Assets/inf-transmission/page-24.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 25","n":25,"asset":"images\\inf-transmission\\page-25.png","path":"Assets/inf-transmission/page-25.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 26","n":26,"asset":"images\\inf-transmission\\page-26.png","path":"Assets/inf-transmission/page-26.png"},{"source":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","loc":"Page 22","n":22,"asset":"images\\inf-transmission\\page-22.png","path":"Assets/inf-transmission/page-22.png"}]},{"id":"inf-waste","titleAr":"إدارة النفايات الطبية","titleEn":"Medical waste management","summaryAr":"أنواع النفايات ومخاطرها + النفايات المشعة وأنصاف عمرها + خطة الإدارة: الفصل بالألوان والتداول والنقل والتخزين المؤقت 48 ساعة + تقنيات المعالجة من الحرق إلى التخزين للتحلل.","summaryEn":"Waste types and risks, radioactive waste and half-lives, and the management plan: color-coded segregation, handling, transport, 48-hour interim storage, and treatment technologies from incineration to decay-in-storage.","objectivesAr":["صنّف أنواع النفايات الطبية.","رتّب خطوات خطة الإدارة.","قارن تقنيات المعالجة."],"objectivesEn":["Classify medical waste types.","Order the management plan steps.","Compare treatment technologies."],"refs":[{"source":"inf-waste","n":2},{"source":"inf-waste","n":3},{"source":"inf-waste","n":4},{"source":"inf-waste","n":5},{"source":"inf-waste","n":7},{"source":"inf-waste","n":9},{"source":"inf-waste","n":10},{"source":"inf-waste","n":11},{"source":"inf-waste","n":12},{"source":"inf-waste","n":13},{"source":"inf-waste","n":14},{"source":"inf-waste","n":15},{"source":"inf-waste","n":16},{"source":"inf-waste","n":17},{"source":"inf-waste","n":18},{"source":"inf-waste","n":19},{"source":"inf-waste","n":20}],"galleryRefs":[{"source":"inf-waste","n":6},{"source":"inf-waste","n":8}],"evidence":[{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 2","text":"chem ical Types of medical waste:","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 3","text":"Associated Diseases: •VIRUSES: HIV, Hepatitis B, Hepatitis A,C& Ocular infection •transmitted through Infected needles, body Fluids, Human excreta, Blood, body fluids, Eye secretion •BACTERIA: Salmonella typhi, cholerae, Clostridium Tetani, Pseudomonas,, skin and soft tissue infections • can be transmitted through Human excreta and body fluid in hospital wards, Sharps such as needles, surgical blades in hospital waste. •PARASITES: Malaria, Cutaneous leishmaniasis, Filariasis, •can be transmitted through Human excreta, blood and body fluids in poorly managed sewage system.","egyptian":"أمراض مرتبطة بالنفايات: فيروسات (HIV والتهاب B وA وC وعدوى عينية عبر الإبر والسوائل) + بكتيريا (تيفoid وكوليرا وكزاز وزوائف وعدوى جلد عبر الفضلات والشارps) + طفيليات (ملاريا وليشمانيا وفيلاريا عبر صرف صحي سيئ)."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 4","text":"Radioactive Wastes •Produced as a result of: •in-vitro analysis of body tissue and fluid (PET using FDG) • in-vivo organ imaging and tumor localization (PET/CT Fluorine-18) •therapeutic practices (radiotherapy for tumor) •Some have relatively short half-lives causing them to lose activity quickly (e.g., technitium-99m – 6 hours; iodine-123 – 13 hours; phosphorus-32 – 14 days) • Others have long half-lives (carbon-14 – 5730 years)","egyptian":"النفايات المشعة بتنتج عن: تحاليل معملية (PET بالـ FDG) + تصوير أعضاء وتحديد أورام (PET/CT فلور-18) + علاج إشعاعي — بعضها نصف عمر قصير (تكنيشيوم-99m ست ساعات ويود-123 ثلاثة عشرة ساعة وفوسفور-32 أربعة عشر يوم) وغيرها طويل (كربون-14 ‏5730 سنة)."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 5","text":"Health Risks of Radioactive Waste •Health impacts determined by type and extent of exposure to ionizing radiation •Chromosomal damage • Headaches, dizziness, vomiting • Tissue destruction, hemorrhage, hair loss, diarrhea • death at high doses","egyptian":"مخاطر المشع تتحدد بنوع ومدى التعرض: تكسير كروموسومي + صداع ودوخ وقيان + تدمير نسيج ونزف وسقوط شعر وإسهال + الموت بجرعات عالية."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 7","text":"separation /Sorting •into color coded bags at the place where it is generated. •should be at the point of origin by the individuals most knowledgeable about the waste's origin and its hazard potential •Most errors in the medical waste management system occur at the segregation point","egyptian":"الفصل/الفرز: في أكياس مرمزة الألوان في مكان توليد النفاية نفسه — من أهل الخبرة بخطرها — ومعظم أخطاء نظام الإدارة بيحصلوا عند نقطة الفرز."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 9","text":"separation of Radioactive Waste •based on : •• Half-life •• Activity and radionuclide content •• Physical and chemical form –","egyptian":"فصل النفايات المشعة حسب: نصف العمر + النشاط والمحتوى النويدى + الشكل الفيزيائي والكيميائي."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 10","text":"Containers and labeling On every label Isotope, activity, date stored, initials and dose rate Radiation symbol Visible trefoil on container and bag Separate by half-life Short-lived waste never mixed with long- lived waste Lids and seals Closed containers; no loose waste","egyptian":"الترميز: على كل ملصق النظير والنشاط وتاريخ التخزين والأحرف الأولى ومعدل الجرعة + رمز الإشعاع (التريفويل) ظاهر على الحاوية والكيس + افصل حسب نصف العمر (القصير عمر مش يتخلط بالطويل) + حاويات مقفولة من غير نفايات سايبة."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 11","text":"II. Handling •is collecting and transporting waste within the facility. •Staff involved in handling should be vaccinated against HBV& tetanus. •Housekeepers should wear heavy utility gloves and eye protection during cleaning of the containers. •Plastic bags Should be impervious, tear resistant •Sharps containers should be puncture-resistant, leak proof on the sides and bottom, and closable. •containers should be discarded when they are 2/3 full or at least once per day; sealed, lifted by the top.","egyptian":"التداول: جمع ونقل داخل المنشأة — العاملون مطعمين HBV وكزاز + قفازات ثقيلة وحماية عين أثناء تنظيف الحاويات + أكياس بلاستيك مانعة ومقاومة للتمزق + حاويات الشارps مقاومة للثقب والتسرب وقابلة للقفل + تترمى لما تتملك ثلثين أو مرة يوميًا على الأقل وتتنقل من الأعلى."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 12","text":"III. Transport of medical waste •three types : •Collection from the immediate generating area and transport to the temporary storage area on the generating unit. •Transport from the temporary storage area on the generating unit to the long term central collection and storage area. •Transport from the facility to a treatment or disposal site. •Transportation should be done in sealed container/sanitation supervisor should ensure for leakage.","egyptian":"النقل 3 أنواع: من مكان التوليد للتخزين المؤقت في الوحدة + من المؤقت للتخزين المركزي طويل الأمد + من المنشأة لموقع المعالجة أو التخلص — في حاويات مقفولة ومشرف الصرف يتأكد من عدم التسرب."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 13","text":"IV. Interim storage: •Interim storage is storing waste within the facility until it can be transported for final disposal. •Waste should not be stored in the generation area for more than a period of 48 hours","egyptian":"التخزين المؤقت: تخزين داخل المنشأة لحين النقل النهائي — النفايات مش تفضل في مكان التوليد أكتر من 48 ساعة."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 14","text":"The waste storage room The room • Locked, restricted access • Radiation trefoil sign on door • Shielded walls and floor as required • Ventilated and fire-resistant Inside the room • Shielded, labeled containers • Separate bins by isotope and half-life • Spill tray under liquid waste • Survey meter kept nearby","egyptian":"غرفة التخزين: مقفولة بدخول مقيد + علامة الإشعاع على الباب + حوائط وأرضيات محجوبة حسب الحاجة + تهوية ومقاومة حريق — جواها: حاويات محجوبة ومسماه + فصل بالنظير ونصف العمر + صينية تنقيط تحت السوائل + مقياس مسح قريب."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 15","text":"V. Treatment & Disposal •General waste should be dumped at municipal dumping site. Sanitation officer should be responsible for proper coordination between municipal and hospital •Other wastes managed by different technologies according to their types •Treatment technologies •1.Incineration •2.Chemical Disinfection •3.Wet and dry thermal treatment •4.Microwave irradiation •5.Land disposal •6. Decay in Storage","egyptian":"المعالجة والتخلص: العامة لمكب البلدية بتنسيق مسؤول الصرف — والباقي حسب النوع: حرق + تطهير كيميائي + معالجة حرارية رطبة وجافة + ميكروويف + دفن أرضي + التخزين للتحلل."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 16","text":"Incineration •Incineration is a common method of commercial disposal typically used for pathological and pharmaceutical waste. •a high-temperature process that reduces organic and combustible waste to inorganic, incombustible matter and results in a very significant reduction of waste volume and weight •","egyptian":"الحرق Incineration: الطريقة التجارية الشائعة للنفايات الباثولوجية والدوائية — حرارة عالية بتحول العضوي لغير عضوي وبتقلل الحجم والوزن بشكل كبير."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 17","text":"Chemical Disinfection •This process involves the use of chemical agents for disinfection, such as chlorine, •. Chemical disinfection processes are most appropriate for liquid wastes, although they can still be used to treat solid wastes.","egyptian":"التطهير الكيميائي: استخدام مطهرات زي الكلور — الأنسب للنفايات السائلة ويمكن استخدامه للصلبة كمان."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 18","text":"thermal treatment •Autoclave: •In this method, wastes are sterilized or disinfected prior to disposal in a landfill. • Bags of waste are placed in a chamber and steam is introduced for a determined period of time at a specified pressure and temperature. This assures the destruction of microorganisms. •90% of regulated medical wastes are suitable for autoclaving. •Autoclaves are not suitable,, for pathological, cytotoxic, or other toxic chemical wastes.","egyptian":"الأوتوكلاف Autoclave: تعقيم أو تطهير النفايات قبل الدفن — أكياس النفايات في حجرة وبخار لوقت محدد بضغط وحرارة محددين — 90% من النفايات الطبية المنظمة تصلح للأوتوكلاف — مش صالحة للباثولوجية والسامة الخلوية والكيميائية السامة."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 19","text":"Land disposal • method of disposing of solid waste on land without creating hazards to public health or safety,","egyptian":"الدفن الأرضي: تخلص من النفايات الصلبة على الأرض بدون مخاطر على الصحة العامة أو السلامة."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 20","text":"Decay in Storage For radio active waste •Store the waste for at least 10 times the half-life of the longest lived radionuclide in the waste • Conduct a radiation survey to confirm that radioactivity is below the clearance level • Disinfect mixed radioactive infectious waste before discarding with regular waste •Long-term storage at an authorized radioactive waste disposal facility","egyptian":"التخزين للتحلل (للمشع): خزّن النفايات 10 أضعاف نصف عمر أطول نظير + مسح إشعاعي للتأكد إن النشاط تحت مستوى التخليص + طهر النفايات المشعة المختلطة بعدوى قبل رميها مع العادية + تخزين طويل الأمد في منشأة معتمدة."}],"quiz":[{"type":"mcq","q":"Most errors in medical waste management occur at:","options":["The segregation point","Transport","Final disposal","Storage"],"answer":0,"why":"Most errors occur at the segregation/separation point.","source":{"source":"inf-waste","n":7},"points":1},{"type":"mcq","q":"Waste should not be stored in the generation area for more than:","options":["48 hours","24 hours","1 week","2 hours"],"answer":0,"why":"Interim storage: not more than 48 hours in the generation area.","source":{"source":"inf-waste","n":13},"points":1}],"cards":[{"id":"40ac14fb4c","front":"Where do most waste management errors occur?","back":"عند نقطة الفصل/الفرز.","en":"At the segregation point.","tag":"fact"},{"id":"1279f648d5","front":"Interim storage limit","back":"48 ساعة كحد أقصى في مكان التوليد.","en":"48 hours maximum in the generation area.","tag":"fact"},{"id":"769a35b334","front":"Radioactive decay-in-storage rule","back":"خزّن 10 أضعاف نصف عمر أطول نظير + مسح إشعاعي قبل التخليص.","en":"Store for 10× the longest half-life, then survey below clearance.","tag":"fact"},{"id":"f1372fd1f3","front":"Autoclave suitability","back":"90% من النفايات المنظمة تصلح — ممنوعة للباثولوجية والسامة الخلوية والكيميائية.","en":"90% of regulated waste suits autoclaving; not pathological, cytotoxic or toxic chemical waste.","tag":"fact"},{"id":"b4bac6d074","front":"Most errors in medical waste management occur at:","back":"The segregation point — Most errors occur at the segregation/separation point.","en":"The segregation point","tag":"quiz"},{"id":"1a88db8fd2","front":"Waste should not be stored in the generation area for more than:","back":"48 hours — Interim storage: not more than 48 hours in the generation area.","en":"48 hours","tag":"quiz"}],"midterm":[{"part":0,"n":65,"q":"Sharps containers should be:","options":["Filled completely before disposal","Made of ordinary paper","Leak-proof and puncture-resistant","Easily punctured and open"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q65","source":{"part":0,"qn":65}},{"part":0,"n":91,"q":"The most important point for sorting medical waste is:","options":["The point of origin where the waste is generated","The central storage room","The hospital entrance","The municipal disposal site"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q91","source":{"part":0,"qn":91}},{"part":0,"n":92,"q":"Most errors in the medical waste management system occur during:","options":["Long-term storage","Final disposal","Waste segregation","Transportation outside the facility"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q92","source":{"part":0,"qn":92}},{"part":0,"n":93,"q":"Radioactive waste should be separated according to:","options":["The location of the waste bin only","Half-life, activity/radionuclide content, and physical and chemical form","The patient's age","Colour and container size only"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q93","source":{"part":0,"qn":93}},{"part":0,"n":94,"q":"Which of the following radioactive materials has the longest half-life?","options":["Phosphorus-32","Carbon-14","Technetium-99m","Iodine-123"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q94","source":{"part":0,"qn":94}},{"part":0,"n":95,"q":"According to the lecture, sharps containers should be discarded when they are:","options":["Half full","Two-thirds full or at least once per day","One-quarter full only","Completely full"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q95","source":{"part":0,"qn":95}},{"part":0,"n":96,"q":"Medical waste should not be stored in the generation area for more than:","options":["7 days","24 hours","12 hours","48 hours"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q96","source":{"part":0,"qn":96}},{"part":0,"n":97,"q":"Which treatment method is commonly used for pathological and pharmaceutical waste and significantly reduces waste volume and weight?","options":["Air drying","Decay in storage","Chemical disinfection","Incineration"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q97","source":{"part":0,"qn":97}},{"part":0,"n":99,"q":"According to the lecture, radioactive waste should be stored for at least:","options":["One half-life of the longest-lived radionuclide","Ten times the half-life of the longest-lived radionuclide","Five times the half-life of the shortest-lived radionuclide","Twenty-four hours regardless of radionuclide"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q99","source":{"part":0,"qn":99}},{"part":0,"n":101,"q":"Which factor is most important when selecting the appropriate method for managing medical waste?","options":["The location of the hospital","The number of hospital employees","The type and hazard potential of the waste","The color of the waste container"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q101","source":{"part":0,"qn":101}},{"part":0,"n":105,"q":"Radioactive waste may be produced during which of the following activities?","options":["In-vitro analysis of body tissues and fluids","In-vivo organ imaging and tumor localization","All of the above","Therapeutic practices"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q105","source":{"part":0,"qn":105}},{"part":0,"n":106,"q":"Which radioactive isotope is listed in the lecture as having a half-life of approximately 6 hours?","options":["Iodine-123","Phosphorus-32","Technetium-99m","Carbon-14"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q106","source":{"part":0,"qn":106}},{"part":0,"n":107,"q":"Which isotope has the longest half-life among the following?","options":["Technetium-99m","Carbon-14","Iodine-123","Phosphorus-32"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q107","source":{"part":0,"qn":107}},{"part":0,"n":108,"q":"What is the approximate half-life of Iodine-123 according to the lecture?","options":["14 days","13 hours","5730 years","6 hours"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q108","source":{"part":0,"qn":108}},{"part":0,"n":109,"q":"Which of the following is a possible health eCect of exposure to radioactive waste?","options":["All of the above","Chromosomal damage","Tissue destruction","Hair loss"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q109","source":{"part":0,"qn":109}},{"part":0,"n":110,"q":"The severity of health eCects caused by radioactive waste depends mainly on:","options":["The number of waste bags","The type and extent of exposure to ionizing radiation","The size of the hospital","The color of the radioactive container"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q110","source":{"part":0,"qn":110}},{"part":0,"n":111,"q":"At which stage do most errors in the medical waste management system occur?","options":["Transportation","Segregation","Final disposal","Interim storage"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q111","source":{"part":0,"qn":111}},{"part":0,"n":112,"q":"Medical waste segregation should be performed:","options":["After transportation outside the facility","Only in the central storage room","At the point where the waste is generated","At the final disposal site"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q112","source":{"part":0,"qn":112}},{"part":0,"n":113,"q":"Who should ideally perform waste segregation at the point of origin?","options":["Drivers transporting the waste","Visitors","Municipal workers only","Individuals most knowledgeable about the waste's origin and hazards"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q113","source":{"part":0,"qn":113}},{"part":0,"n":114,"q":"Radioactive waste should be separated according to all of the following EXCEPT:","options":["Physical and chemical form","Half-life","Patient's age","Activity and radionuclide content"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q114","source":{"part":0,"qn":114}},{"part":0,"n":115,"q":"Which information should be included on a radioactive waste container label?","options":["Isotope and activity","All of the above","Dose rate and initials","Date stored"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q115","source":{"part":0,"qn":115}},{"part":0,"n":116,"q":"Which symbol should be visibly displayed on radioactive waste containers and bags?","options":["Biohazard symbol only","Radiation trefoil symbol","Electrical hazard symbol","Fire symbol"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q116","source":{"part":0,"qn":116}},{"part":0,"n":117,"q":"Why should short-lived radioactive waste never be mixed with long-lived radioactive waste?","options":["To reduce the need for labeling","To increase the activity of the waste","To make all waste radioactive","To allow appropriate separation according to half-life"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q117","source":{"part":0,"qn":117}},{"part":0,"n":118,"q":"Which of the following is required for radioactive waste containers?","options":["Unlabeled plastic bags","Open containers without lids","Closed containers with lids and seals","Containers without radiation symbols"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q118","source":{"part":0,"qn":118}},{"part":0,"n":119,"q":"StaC involved in handling medical waste should be vaccinated against:","options":["Tuberculosis and rabies only","HBV and tetanus","Malaria and influenza only","Cholera and measles only"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q119","source":{"part":0,"qn":119}},{"part":0,"n":120,"q":"During cleaning of waste containers, housekeepers should wear:","options":["Surgical mask only","Examination gloves only","No protective equipment","Heavy utility gloves and eye protection"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q120","source":{"part":0,"qn":120}},{"part":0,"n":121,"q":"Which property should medical waste plastic bags have?","options":["Easily torn","Impervious and tear-resistant","Transparent and unsealed","Reusable without cleaning"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q121","source":{"part":0,"qn":121}},{"part":0,"n":122,"q":"A proper sharps container should be:","options":["Made of easily penetrated plastic","Open at the top during transportation","Puncture-resistant and leak-proof","Used without a closing mechanism"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q122","source":{"part":0,"qn":122}},{"part":0,"n":123,"q":"According to the medical waste lecture, sharps containers should be discarded when they are:","options":["Half full","Completely full","Two-thirds full or at least once per day","One-quarter full only"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q123","source":{"part":0,"qn":123}},{"part":0,"n":124,"q":"After closing a sharps container, it should be:","options":["Mixed with general waste","Emptied manually","Lifted by its top","Reopened to add more waste"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q124","source":{"part":0,"qn":124}},{"part":0,"n":125,"q":"Handling of medical waste refers to:","options":["Storing radioactive waste for decay only","Collecting and transporting waste within the facility","Destroying all waste by incineration","Separating waste at the municipal site"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q125","source":{"part":0,"qn":125}},{"part":0,"n":126,"q":"Which sequence correctly describes the three types of medical waste transportation?","options":["Generating area to temporary storage → central storage → treatment or disposal site","Central storage → generating area → patient room","Facility to disposal site → generating area → temporary storage","Treatment site → generating area → central storage"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q126","source":{"part":0,"qn":126}},{"part":0,"n":127,"q":"Medical waste transportation should be performed using:","options":["Uncovered plastic bags","Ordinary patient transport beds","Open carts","Sealed containers"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q127","source":{"part":0,"qn":127}},{"part":0,"n":128,"q":"Who should ensure that there is no leakage during medical waste transportation?","options":["The radiologist","The sanitation supervisor","The hospital receptionist","The patient"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q128","source":{"part":0,"qn":128}},{"part":0,"n":130,"q":"According to the lecture, waste should not remain in the generation area for more than:","options":["24 hours","7 days","12 hours","48 hours"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q130","source":{"part":0,"qn":130}},{"part":0,"n":131,"q":"Which of the following is a requirement for the radioactive waste storage room?","options":["Unrestricted access","Open windows without ventilation control","No radiation warning sign","Locked room with restricted access"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q131","source":{"part":0,"qn":131}},{"part":0,"n":132,"q":"The door of a radioactive waste storage room should display:","options":["Oxygen warning sign","Electrical hazard sign","Radiation trefoil sign","General waste symbol"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q132","source":{"part":0,"qn":132}},{"part":0,"n":133,"q":"Which feature is recommended inside a radioactive waste storage room for liquid waste?","options":["Spill tray","Paper covering","Open drainage","Ordinary waste basket"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q133","source":{"part":0,"qn":133}},{"part":0,"n":134,"q":"Why should a survey meter be kept near the radioactive waste storage area?","options":["To assess radiation levels","To measure room temperature","To weigh radioactive containers","To measure humidity"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q134","source":{"part":0,"qn":134}},{"part":0,"n":135,"q":"General medical waste should be disposed of at:","options":["An operating theatre","A sterile supply room","A municipal dumping site","A radioactive waste storage room"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q135","source":{"part":0,"qn":135}},{"part":0,"n":136,"q":"Which person is responsible for coordinating between the municipal authority and the hospital regarding general waste disposal?","options":["Sanitation officer","Laboratory technician","Radiographer","Anesthetist"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q136","source":{"part":0,"qn":136}},{"part":0,"n":137,"q":"Which of the following is NOT listed as a medical waste treatment technology in the lecture?","options":["Magnetic resonance imaging","Chemical disinfection","Incineration","Microwave irradiation"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q137","source":{"part":0,"qn":137}},{"part":0,"n":138,"q":"Incineration is commonly used for the disposal of:","options":["Reusable surgical instruments","Radioactive waste of all types","Pathological and pharmaceutical waste","General office paper only"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q138","source":{"part":0,"qn":138}},{"part":0,"n":139,"q":"Incineration is best described as:","options":["A high-temperature process that reduces organic and combustible waste","A method based only on ultraviolet light","A process that separates waste according to color","A low-temperature process that increases waste volume"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q139","source":{"part":0,"qn":139}},{"part":0,"n":142,"q":"In autoclaving, medical waste is treated using:","options":["Steam at a specified pressure and temperature for a determined period","Dry air at room temperature","Chemical freezing","Ultraviolet light only"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q142","source":{"part":0,"qn":142}},{"part":0,"n":143,"q":"What is the purpose of autoclaving medical waste before landﬁll disposal?","options":["To increase the number of microorganisms","To increase radioactive activity","To destroy microorganisms by sterilization or disinfection","To convert all waste into liquid"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q143","source":{"part":0,"qn":143}},{"part":0,"n":144,"q":"Approximately what percentage of regulated medical waste is suitable for autoclaving according to the lecture?","options":["10%","25%","90%","50%"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q144","source":{"part":0,"qn":144}},{"part":0,"n":145,"q":"Which type of waste is NOT suitable for autoclaving according to the lecture?","options":["Toxic chemical waste","All of the above","Pathological waste","Cytotoxic waste"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q145","source":{"part":0,"qn":145}},{"part":0,"n":146,"q":"Land disposal is deﬁned in the lecture as disposing of solid waste on land:","options":["Only after incineration","Only after radioactive decay","Without creating hazards to public health or safety","Without considering public safety"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q146","source":{"part":0,"qn":146}},{"part":0,"n":147,"q":"Decay in storage is a method used for:","options":["General office waste","Reusable instruments","Radioactive waste","Ordinary food waste"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q147","source":{"part":0,"qn":147}},{"part":0,"n":148,"q":"According to the lecture, radioactive waste should be stored for at least:","options":["One half-life of the shortest-lived radionuclide","Ten times the half-life of the longest-lived radionuclide","Five times the half-life of the shortest-lived radionuclide","One day regardless of isotope"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q148","source":{"part":0,"qn":148}},{"part":0,"n":149,"q":"After radioactive waste has been stored for decay, what should be performed before confirming its clearance?","options":["A temperature measurement","A radiation survey","A blood test","A bacterial culture"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q149","source":{"part":0,"qn":149}},{"part":0,"n":150,"q":"Mixed radioactive and infectious waste should be:","options":["Disinfected before being discarded with regular waste","Incinerated in every case","Mixed with long-lived radioactive waste","Discarded immediately with general waste"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q150","source":{"part":0,"qn":150}},{"part":0,"n":151,"q":"Long-term storage of radioactive waste should take place at:","options":["An authorized radioactive waste disposal facility","A patient room","Any hospital corridor","A general municipal bin"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q151","source":{"part":0,"qn":151}}],"audios":[{"src":"Audio/INF-L4.mp3","title":"Infection control — lecture 4","start":0,"end":0}],"visuals":[{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 2","n":2,"asset":"images\\inf-waste\\page-2.png","path":"Assets/inf-waste/page-2.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 3","n":3,"asset":"images\\inf-waste\\page-3.png","path":"Assets/inf-waste/page-3.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 4","n":4,"asset":"images\\inf-waste\\page-4.png","path":"Assets/inf-waste/page-4.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 5","n":5,"asset":"images\\inf-waste\\page-5.png","path":"Assets/inf-waste/page-5.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 7","n":7,"asset":"images\\inf-waste\\page-7.png","path":"Assets/inf-waste/page-7.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 9","n":9,"asset":"images\\inf-waste\\page-9.png","path":"Assets/inf-waste/page-9.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 10","n":10,"asset":"images\\inf-waste\\page-10.png","path":"Assets/inf-waste/page-10.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 11","n":11,"asset":"images\\inf-waste\\page-11.png","path":"Assets/inf-waste/page-11.png"}]},{"id":"inf-sterilization","titleAr":"التعقيم والمطهرة وتصنيف سبولدنج","titleEn":"Sterilization, disinfection levels and Spaulding","summaryAr":"تعريفات التعقيم والتطهير والمطهر والمعقم + مستويات التطهير الثلاثة بأمثلتها + تصنيف سبولدنج: حرج/شبه حرج/غير حرج بأمثلة الأشعة ومستوى المعالجة المطلوب.","summaryEn":"Definitions of sterilization, disinfection, disinfectant and antiseptic; the three disinfection levels with examples; and Spaulding's critical/semi-critical/non-critical classes with radiology examples and required processing.","objectivesAr":["ميّز المطهر عن المعقم.","رتّب مستويات التطهير.","طبّق تصنيف سبولدنج على أدوات الأشعة."],"objectivesEn":["Distinguish disinfectant from antiseptic.","Order the disinfection levels.","Apply Spaulding to radiology equipment."],"refs":[{"source":"inf-waste","n":22},{"source":"inf-waste","n":24},{"source":"inf-waste","n":25},{"source":"inf-waste","n":26},{"source":"inf-waste","n":29},{"source":"inf-waste","n":30},{"source":"inf-waste","n":31},{"source":"inf-waste","n":32}],"galleryRefs":[{"source":"inf-waste","n":23},{"source":"inf-waste","n":27},{"source":"inf-waste","n":28}],"evidence":[{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 22","text":"definitions •Disinfection: Process by which we can minimize the number of microorganisms except bacterial spores. •Steralization:the process of eliminating all forms of microorganisms, including bacteria, viruses, fungi, and spores, from medical instruments, equipment, and surfaces •Disinfectant: chemical substance to be used to disinfect (Inanimate) surface. •Antiseptic: Chemical substance can be used to disinfect (animate) surface.","egyptian":"تعريفات: التطهير Disinfection = تقليل عدد الميكروبات ما عدا الأبواغ + التعقيم Sterilization = القضاء على كل أشكال الحياة بما فيها الأبواغ + المطهر Disinfectant = مادة كيميائية لأسطح غير حية + المعقم Antiseptic = مادة كيميائية لأسطح حية."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 24","text":"High disinfection •Effectiveness: Kills most microorganisms, including bacteria, viruses, fungi, and spores, but not necessarily all spores (some highly resistant spores may survive). •Organisms Targeted: Includes Mycobacterium tuberculosis, all fungi& Hepatitis B virus •Disinfectant Examples: Glutaraldehyde Hydrogen peroxide Peracetic acid","egyptian":"التطهير العالي High: يقتل معظم الميكروبات بما فيها TB وفطريات وHBV (مش كل الأبواغ بالضرورة) — أمثلة: جلوتارالدهيد + بيروكسيد الهيدروجين + حمض البيراسيتيك."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 25","text":"Intermediate Disinfection •Effectiveness: Kills most bacteria, viruses, and fungi, but not bacterial spores •Organisms Targeted: Includes Staphylococcus aureus, Escherichia coli,HCV, influenza virus and fungi. •Disinfectant Examples: Alcohol (70%-90%) Iodophors ex betadine","egyptian":"التطهير المتوسط Intermediate: يقتل معظم البكتيريا والفيروسات والفطريات ما عدا الأبواغ — يشمل S. aureus وE. coli وHCV والإنفلونزا والفطريات — أمثلة: كحول 70-90% + أيودوفور زي البيتادين."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 26","text":"Low Disinfection •Effectiveness: Kills most bacteria and some viruses, but not resistant organisms like Mycobacterium tuberculosis or bacterial spores. •Organisms Targeted: Includes Streptococcus, Staphylococcus aureus, Hepatitis A, some fungi and ,HIV •Disinfectant Examples: Quaternary ammonium compounds(Sterillium ,cavicid) Phenolic compounds (phenic,dettol) Soap and water","egyptian":"التطهير المنخفض Low: يقتل معظم البكتيريا وبعض الفيروسات ما عدا TB والأبواغ — يشمل ستربتوكوكس وS. aureus وHAV وبعض الفطريات وHIV — أمثلة: مركبات الأمونيوم الرباعي (ستيريليوم وكافيسيد) + فينولات (ديتول) + صابون وماء."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 29","text":"Critical Touches Sterile tissue / bloodstream Requires Sterilization Semi-critical Touches Mucous membranes, non-intact skin Requires High-level disinfection Non-critical Touches Intact skin only Requires Low / intermediate- level","egyptian":"تصنيف سبولدنج Spaulding: حرج Critical بيلمس نسيج معقم أو مجرى الدم ← تعقيم + شبه حرج Semi-critical بيلمس أغشية مخاطية أو جلد غير سليم ← تطهير عالي + غير حرج Non-critical بيلمس جلد سليم فقط ← تطهير منخفض/متوسط."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 30","text":"Critical items Radiology examples • Biopsy needles under CT / US • Angiography catheters, guidewires • Interventional radiology instruments • Drainage catheters • Contrast syringes and tubing to the patient Required level Sterilization (or sterile single-use)","egyptian":"أمثلة حرجة في الأشعة: إبر الخزعة تحت CT/US + قسطرات الأنجيو والأسلاك الدليلية + أدوات التداخل + قسطرات التصريف + سرنجات التبايز وأنيبيباتها للمريض ← تعقيم (أو أحاديةUsage معقمة)."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 31","text":"Semi-critical items Radiology examples • Transvaginal / transrectal US probe • HSG cannula and instruments • Rectal tip in barium enema • US probe used on an open wound Required level High-level disinfection (minimum) A probe cover does not change the class. Covers can leak: disinfect after every patient.","egyptian":"أمثلة شبه حرجة: مسبار US عبر المهبل/المستقيم + كانيولا HSG وأدواتها + طرف المستقيم في الحقنة الشرجية بالباريوم + مسبار US على جرح مفتوح ← تطهير عالي كحد أدنى — والغطاء مش بيغير التصنيف: الأغطية بتتسرب فطهّر بعد كل مريض."},{"file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 32","text":"Non-critical items Radiology examples • Abdominal US probe on intact skin • Examination table, CT gantry • MRI coils, lead aprons, cassettes • Control panels, injector surface Required level Low or intermediate-level disinfection High-touch surfaces spread infection via hands. Blood spill: raise to intermediate level.","egyptian":"أمثلة غير حرجة: مسبار US البطن على جلد سليم + طاولة الفحص والقنطرة CT + كويلات MRI والمآزر الرصاصية والكاست + لوحات التحكم وسطح الحاقن ← منخفض/متوسط — وانسكاب الدم بيرفع المستوى للمتوسط."}],"quiz":[{"type":"mcq","q":"An antiseptic differs from a disinfectant because it:","options":["Is used on animate (living) surfaces","Is used on inanimate surfaces","Kills spores only","Is always alcohol-based"],"answer":0,"why":"Antiseptic = animate surface; disinfectant = inanimate surface.","source":{"source":"inf-waste","n":22},"points":1},{"type":"mcq","q":"Under Spaulding, transvaginal ultrasound probes are:","options":["Semi-critical requiring high-level disinfection","Critical requiring sterilization","Non-critical requiring low-level disinfection","Disposable"],"answer":0,"why":"Semi-critical items touch mucous membranes and require high-level disinfection at minimum; a probe cover does not change the class.","source":{"source":"inf-waste","n":31},"points":1}],"cards":[{"id":"1a7bd4ca4a","front":"Disinfection vs sterilization","back":"التطهير بيقلل الميكروبات ما عدا الأبواغ — التعقيم بيقتل كل شيء بما فيها الأبواغ.","en":"Disinfection minimizes organisms except spores; sterilization eliminates all including spores.","tag":"fact"},{"id":"f2e3a7c48c","front":"Disinfectant vs antiseptic","back":"المطهر لأسطح غير حية والمعقم لأسطح حية.","en":"Disinfectant: inanimate surfaces; antiseptic: animate surfaces.","tag":"fact"},{"id":"a2c7e92e0d","front":"High-level disinfection examples","back":"جلوتارالدهيد + بيروكسيد هيدروجين + حمض بيراسيتيك.","en":"Glutaraldehyde, hydrogen peroxide, peracetic acid.","tag":"fact"},{"id":"a17f62b92c","front":"Spaulding clas
