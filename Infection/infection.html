:root{

*{box-sizing:border-box}
html{background:var(--paper);color:var(--text);font-family:var(--sans)}
body{margin:0;min-height:100vh;background:var(--paper);-webkit-font-smoothing:antialiased}

a{color:inherit}
img{max-width:100%}
.topbar{min-height:64px;background:var(--ink);color:#f2f9f8;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(16px,calc((100vw - 1280px)/2));position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(14,27,36,.25)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:700;letter-spacing:.01em;font-size:1rem}
.brand-mark{width:30px;height:30px;border-radius:9px;background:#0a756c;display:grid;place-items:center;flex:none;padding:4px;box-shadow:inset 0 0 0 1px rgba(95,196,182,.35)}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tool-btn:hover{background:rgba(255,255,255,.12)}
.shell{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
.hero{background:linear-gradient(135deg,var(--ink) 0%,var(--ink2) 100%);color:#eaf5f3;min-height:190px;border-radius:22px;display:grid;grid-template-columns:minmax(0,1fr) 240px;align-items:center;gap:24px;padding:28px 36px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:'';position:absolute;inset-inline-end:90px;top:-110px;width:340px;height:340px;border:1px solid var(--teal-glow);border-radius:50%;box-shadow:0 0 0 30px rgba(93,191,177,.05),0 0 0 66px rgba(93,191,177,.035),0 0 0 104px rgba(93,191,177,.02)}
.hero-copy{position:relative;z-index:1;max-width:780px}
.eyebrow{color:#9fd8cf;font-size:.8rem;letter-spacing:.09em;margin:0 0 10px}
.hero h1{font-family:var(--serif);font-size:clamp(1.9rem,3.6vw,2.7rem);line-height:1.12;max-width:20ch;margin:0 0 10px;font-weight:600}

.hero-art{position:relative;z-index:1;display:flex;justify-content:center}
.scan-figure{width:150px;height:150px;border-radius:50%;border:1px solid rgba(108,204,191,.6);display:grid;place-items:center;position:relative;background:radial-gradient(circle,rgba(57,155,146,.16) 0 30%,transparent 31%)}
.scan-figure:before,.scan-figure:after{content:'';position:absolute;border-radius:50%;border:1px dashed rgba(190,229,222,.5)}
.scan-figure:before{inset:16px}
.scan-figure:after{inset:38px}
.scan-core{width:28px;height:28px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 9px rgba(238,162,54,.16)}
.scan-ray{position:absolute;width:1px;height:64px;background:linear-gradient(transparent,#bfe6de,transparent);transform-origin:bottom;bottom:50%;left:50%;transform:rotate(45deg)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(96px,1fr));gap:0;max-width:560px;margin-top:18px;border-top:1px solid rgba(255,255,255,.16);padding-top:12px}
.stat{padding-inline:16px;border-inline-start:1px solid rgba(255,255,255,.14)}
.stat:first-child{padding-inline-start:0;border:0}
.stat strong{display:block;font-size:1.35rem;font-weight:700;color:#fff}
.stat span{color:#a9c0c0;font-size:.8rem}
.progressline{display:flex;align-items:center;gap:12px;margin-top:16px;max-width:560px}
.progressbar{height:8px;background:rgba(255,255,255,.18);flex:1;position:relative;border-radius:999px;overflow:hidden}
.progressbar span{display:block;height:100%;background:var(--teal);width:0;transition:width .4s}
.progressline small{color:#a9c0c0;white-space:nowrap}
.content-grid{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.rail{background:var(--card);border:1px solid var(--line);padding:16px 12px;position:sticky;top:84px;max-height:calc(100vh - 102px);overflow:auto;border-radius:var(--radius);box-shadow:var(--shadow-sm)}

.lesson-link:hover{background:var(--teal-softer)}
.lesson-link.active{background:var(--ink);color:#fff}
.lesson-num{font-variant-numeric:tabular-nums;font-size:.76rem;color:var(--teal-strong);min-width:22px;padding-top:2px;font-weight:700}

.lesson-name{font-size:.89rem;flex:1}

.brand-group{display:flex;align-items:center;gap:10px}

.rail-backdrop{display:none;position:fixed;inset:0;background:rgba(14,27,36,.45);z-index:55}
.rail-close{position:absolute;top:12px;inset-inline-end:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:.85rem;cursor:pointer}

@media(min-width:901px){
.content-grid{grid-template-columns:minmax(0,1fr)}
.rail{display:none}
body.rail-open .rail{display:block;position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(330px,86vw);max-height:none;z-index:60;border-radius:0;border:0;border-inline-end:1px solid var(--line);box-shadow:26px 0 60px rgba(14,27,36,.16);animation:railInLtr .32s cubic-bezier(.2,.7,.3,1)}

}
@keyframes railInLtr{from{transform:translateX(-100%)}}

.main-panel{min-width:0}

.objectives{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}

.en-line{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;margin:0;border-radius:9px;transition:background .15s}

.evidence-wrap[open] .en-line,.evidence-wrap[open] .evidence .egyptian-note{animation:lineIn .5s cubic-bezier(.2,.7,.3,1) backwards;animation-delay:calc(var(--i,0)*70ms)}

.note-line{margin:0;display:flex;gap:8px;align-items:flex-start}

mark.tm{padding:1px 5px;border-radius:5px;font-weight:600}
mark.tm.t1{background:#d5efe9;color:#0a756c}
mark.tm.t2{background:#fdeec9;color:#8a5d18}

mark.tm.t4{background:#dbe9f7;color:#2b5d9c}
.egyptian-note{margin-top:12px;padding:11px 13px;background:var(--amber-soft);border:1px solid #ecd9ac;border-inline-start:4px solid var(--amber);color:#41372c;direction:rtl;text-align:right;border-radius:9px}
.egyptian-note strong{display:block;color:var(--amber-ink);font-size:.74rem;letter-spacing:.02em;margin-bottom:4px}

.quiz-panel{background:var(--card);border:1px solid var(--line);margin-top:16px;padding:24px 28px;box-shadow:var(--shadow);border-radius:var(--radius)}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px;flex-wrap:wrap}

.question{padding:18px 0;border-bottom:1px solid var(--line2)}
.question:last-of-type{border:0}
.q-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.74rem;margin-bottom:9px;flex-wrap:wrap}

.option:hover{background:var(--teal-softer);border-color:#c8ded9}
.option input{accent-color:var(--teal);margin-top:4px;width:16px;height:16px}
.answer-input,.essay-input{width:100%;border:1px solid #ccd9dc;border-radius:var(--radius-sm);padding:11px 13px;background:#fff;min-height:46px;color:var(--text)}
.essay-input{min-height:105px;resize:vertical}
.feedback{margin-top:10px;padding:11px 13px;border-inline-start:4px solid var(--teal);background:var(--teal-softer);font-size:.88rem;line-height:1.6;border-radius:9px}

.notice{background:var(--amber-soft);border:1px solid #eedaa8;color:#7a5f2b;padding:12px 16px;line-height:1.55;margin-top:16px;font-size:.85rem;border-radius:var(--radius-sm)}

.file-list{display:grid;gap:6px;margin-top:8px}
.file-link{font-size:.84rem;color:#2c6b66}
.index-subject{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(170px,.7fr) 1fr;align-items:center;gap:20px;padding:22px 26px}

.open-link{display:inline-flex;align-items:center;gap:7px;justify-self:end;text-decoration:none;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:.88rem;white-space:nowrap;font-weight:600;transition:background .15s}

.fc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px;flex-wrap:wrap}
.fc-head h3{margin:0;font-size:1.18rem}

const DATA={"id":"infection","titleAr":"مكافحة العدوى","titleEn":"Infection Control","lessons":[{"id":"inf-chain","titleAr":"سلسلة العدوى","titleEn":"The chain of infection","summaryAr":"الرابطات الست لانتشار الممرض: الممرض ومحدداته + المستودعات بأنواعها وحاملات المرض + مخارج ودخول العدوى + طرق الانتقال المباشرة وغير المباشرة + العائل القابل وعدوى الرعاية الصحية.","summaryEn":"The six links of pathogen spread: the agent with its determinants, reservoir types and carriers, portals of exit and entry, direct and indirect transmission, the susceptible host, and healthcare-associated infections.","objectivesAr":["رتّب روابط السلسلة الست.","صنّف أنواع الحاملين.","ميّز الانتقال المباشر عن غير المباشر."],"objectivesEn":["Order the six links.","Classify carrier types.","Distinguish direct from indirect transmission."],"refs":[{"source":"inf-chain","n":2},{"source":"inf-chain","n":4},{"source":"inf-chain","n":5},{"source":"inf-chain","n":6},{"source":"inf-chain","n":7},{"source":"inf-chain","n":8},{"source":"inf-chain","n":9},{"source":"inf-chain","n":10},{"source":"inf-chain","n":11},{"source":"inf-chain","n":12},{"source":"inf-chain","n":13},{"source":"inf-chain","n":14},{"source":"inf-chain","n":17}],"galleryRefs":[{"source":"inf-chain","n":3},{"source":"inf-chain","n":15},{"source":"inf-chain","n":16}],"evidence":[{"file":"1.Chain of infection.pdf","loc":"Page 2","text":"•the process by which a pathogen spreads from one host to the next •There are six steps in the chain of infection .and transmission will only take place if all six links are intact.","egyptian":"سلسلة العدوى = العملية اللي الممرض بينتشر بيها من عائل للتاني — 6 روابط، والانتقال مش بيحصل غير لو الـ 6 كاملين."},{"file":"1.Chain of infection.pdf","loc":"Page 4","text":"The pathogen (infectious agent ) •The first link in the chain of infection •Viruses •Bacteria •Fungi •Parasitic •Prions •How well any pathogen is able to thrive depends on three factors •Its pathogenicity – its ability to produce disease •Its degree of virulence – its severity or harmfulness •Its invasiveness – its tendency to spread","egyptian":"الممرض أول رابط: فيروسات وبكتيريا وفطريات وطفيليات وبريونات — وقوته على إمراضه بتعتمد على: الـ Pathogenicity (قدرته على إحداث المرض) + الـ Virulence (شدته وخطورته) + الـ Invasiveness (ميله للانتشار)."},{"file":"1.Chain of infection.pdf","loc":"Page 5","text":"The reservoir •A reservoir is the principal habitat in which a pathogen lives, flourishes and is able to multiply. •Human reservoirs •Animal & insect reservoirs •Environmental reservoirs","egyptian":"المستودع = الموطن الأساسي اللي الممرض يعيش ويتكاثر فيه: بن آدمي + حيواني وحشري + بيئي."},{"file":"1.Chain of infection.pdf","loc":"Page 6","text":"Human reservoirs •acute clinical cases: someone is infected and is displaying signs and symptoms of the disease •carriers someone has been colonized with an infectious agent but is not unwell Which one is more dangerous? The carrier","egyptian":"المستودع البشري: حالات سريرية حادة (عنده أعراض) أو حاملون (مستعمرين بالممرض من غير ما يمرضوا) — الأكثر خطورة هو الحامل لأنه بينقل من غير أعراض تبان."},{"file":"1.Chain of infection.pdf","loc":"Page 7","text":"•Types of carrier: •Incubatory carriers – people who are infectious even before their own symptoms start ex:chicken pox •Inapparent (healthy )carriers – in which an individual is able to transmit an infection to others, without ever developing the infection themselves ex:typhoid •Convalescent carriers – people who are in the recovery phase of their illness but who continue to be infectious for a short-term days or weeks ex:measles •Chronic carriers – anyone who has recovered but who continues to be a carrier for infection for long-term, years and even the entire life. Ex:HBV&HCV","egyptian":"أنواع الحاملين: حاضن Incubatory بينقل قبل ظهور أعراضه (الجديري المائي) + غير ظاهر Healthy بينقل من غير ما يمرض أبدًا (التيفود) + نقاهة Convalescent في طور التعافي بينقل أيام أو أسابيع (الحصبة) + مزمن Chronic بعد الشفاء بيظل حامل سنين أو العمر كله (HBV وHCV)."},{"file":"1.Chain of infection.pdf","loc":"Page 8","text":"Animal & insect reservoirs •Any infectious disease that is transmitted under natural conditions from animal to human is referred to as zoonosis. •Rabies (which is transmitted by dogs, cats, foxes and bats bites) •Lyme disease (which is transmitted via ticks) •Early Covid 19(which is transmitted by eating bats)","egyptian":"الزونوزيس = عدوى بتنتقل طبيعيًا من الحيوان للإنسان: داء الكلب (عضات كلاب وقطط وثعالب وخفافيش) + لايم (قراد) + كوفيد المبكر (أكل خفافيش)."},{"file":"1.Chain of infection.pdf","loc":"Page 9","text":"Environmental reservoirs •soil (which acts as a reservoir for Clostridium tetani, the causative agent of tetanus) •Water,air-conditioning systems, swimming pools . ( reservoir for Legionella pneumophila, the causative agent of Legionnaire’s disease). •Moist places such as sink-traps, drains and flower vases , contact lens soloutions & even antiseptic solutions can harbour Pseudomonas.","egyptian":"مستودعات بيئية: التربة (المطثية الكزازية) + المياه والتكييفات والمسابح (الليجيونيلا) + الأماكن الرطبة زي مصايد الأحواض والبالوعات ومحاليل العدسات وحتى المطهرات (الزوائف Pseudomonas)."},{"file":"1.Chain of infection.pdf","loc":"Page 10","text":"The portal of exit •The portal of exit is any route which enables a pathogen to leave the reservoir or host. •Alimentary – via vomiting, diarrhoea or biting •Genitourinary – via sexual transmission •Respiratory – through coughing, sneezing and talking •Skin – via skin lesions •Trans-placental – where transmission is from mother to foetus","egyptian":"منفذ الخروج: هضمي (قيء وإسهال وعض) + بولي تناسلي (اتصال) + تنفسي (كحة وعطس وكلام) + جلد (آفات) + عبر المشيمة من الأم للجنين."},{"file":"1.Chain of infection.pdf","loc":"Page 11","text":"The mode of transmission •A) Direct Transmission: occurs when the disease agent contacts a vulnerable host directly, without the need of an intermediary host, objects, or substance. •Direct Contact with mm or skin(STDs, HIV/AIDS, scabies, skin and eye infections) •Contact with Contaminated Soil( tetanus) •Droplet Infection(during coughing, sneezing, speaking or spitting.as common cold) •Inoculation into Skin or Mucosa rabies virus by dog bites, hepatitis B through contaminated needles and syringes •Transplacental (vertical)(TORCH)","egyptian":"الانتقال المباشر بدون وسيط: تلامس غشاء مخاطي أو جلد (STDs وHIV والجرب) + تربة ملوثة (الكزاز) + رذاذ مباشر (نزلة البرد) + تلقيح بالجلد (سعار بعضة كلب وHBV بإبرة ملوثة) + عبر المشيمة (TORCH)."},{"file":"1.Chain of infection.pdf","loc":"Page 12","text":"b)Indirect Transmission the 5Fs Plus Air Borne Transmission the 5Fs •Flies (vecror born) ex:plague •Fingers (typhoid fever, diarrhea, streptococcal infections) •Fomites (eye and skin infections) •Food (salmonella ,shigella) •Fluids (cholera) Air Borne Transmission contaminated infected nuclei of dust will be floating in the air Ex: SARS, measles, tuberculosis","egyptian":"الانتقال غير المباشر = الـ 5Fs + الهوائي: الذباب Flies (طاعون) + الأصابع Fingers (تيفود وإسهال وستربتوكوكس) + الفوميت Fomites (عدوى عين وجلد) + الغذاء Food (سالمونيلا وشيجيلا) + السوائل Fluids (كوليرا) + النويات الرذاذة العائمة (SARS والحصبة والدرن)."},{"file":"1.Chain of infection.pdf","loc":"Page 13","text":"The portal of entry •The portal of entry is the means by which an infection is able to enter a susceptible host. •Inhalation (via the respiratory tract) •Absorption (via mucous membranes such as the eyes) •Ingestion (via the gastrointestinal tract) •Inoculation (as the result of an inoculation injury)","egyptian":"منفذ الدخول: استنشاق (تنفسي) + امتصاص (أغشية مخاطية زي العين) + ابتلاع (هضمي) + تلقيح (إصابة إبرة)."},{"file":"1.Chain of infection.pdf","loc":"Page 14","text":"The susceptible host •How susceptible any host will be, depends on a variety of factors: •Their age – and in particular if they are very young or very old •presence of malnutrition or dehydration •Whether there is any underlying chronic disease •If the host suffers from immobility •If they are taking any medication which could disrupt or suppress their immune response •General resistance factors (such as mucous membranes, skin, cough reflex etc) that can help defend against infection","egyptian":"العائل القابل: قابليته بتعتمد على السن (صغير جدًا أو كبير جدًا) + سوء تغذية وجفاف + أمراض مزمنة + عدم الحركة + أدوية مثبطة للمناعة + عوامل المقاومة العامة (أغشية مخاطية وجلد ومنعكس الكحة)."},{"file":"1.Chain of infection.pdf","loc":"Page 17","text":"Health care-associated infections (HCAIs) •are infections that occur while receiving health care, developed in a hospital or other health care facility that first appear 48 hours or more after hospital admission, or within 30 days after having received health care.","egyptian":"عدوى الرعاية الصحية HCAI: عدوى بتظهر أثناء تلقي الرعاية — أول ظهور بعد 48 ساعة من الدخول أو خلال 30 يوم من استلام الرعاية."}],"quiz":[{"type":"mcq","q":"How many links must remain intact for transmission to occur in the chain of infection?","options":["All six","At least three","Only the pathogen and host","Four"],"answer":0,"why":"Transmission will only take place if all six links are intact.","source":{"source":"inf-chain","n":2},"points":1},{"type":"mcq","q":"Which carrier type transmits infection without ever developing the disease themselves?","options":["Inapparent (healthy) carrier","Incubatory carrier","Convalescent carrier","Chronic carrier"],"answer":0,"why":"Inapparent carriers transmit without ever developing the infection themselves, e.g. typhoid.","source":{"source":"inf-chain","n":7},"points":1}],"cards":[{"id":"9c032cc1da","front":"Name the six links of the chain of infection","back":"الممرض ← المستودع ← منفذ الخروج ← طريقة الانتقال ← منفذ الدخول ← العائل القابل — الست لازم يكونوا سليمين عشان الانتقال يحصل.","en":"Pathogen, reservoir, portal of exit, mode of transmission, portal of entry, susceptible host — all six must be intact.","tag":"fact"},{"id":"22b6c8df43","front":"Define pathogenicity, virulence and invasiveness","back":"الإمراضية = قدرته يسبب مرض؛ الضراوة = شدته؛ الغزوية = ميله للانتشار.","en":"Pathogenicity: ability to produce disease; virulence: severity; invasiveness: tendency to spread.","tag":"fact"},{"id":"f96e3935b4","front":"List the four carrier types with examples","back":"حاضن (جديري) + غير ظاهر (تيفود) + نقاهة (حصبة) + مزمن (HBV وHCV).","en":"Incubatory (chickenpox), inapparent (typhoid), convalescent (measles), chronic (HBV/HCV).","tag":"fact"},{"id":"1844e071fe","front":"What are the 5 Fs of indirect transmission?","back":"الذباب (طاعون) + الأصابع (تيفoid) + الفوميت (عدوى عين وجلد) + الغذاء (سالمونيلا) + السوائل (كوليرا) — مع الهوائي (SARS وحصبة ودرن).","en":"Flies (plague), fingers (typhoid), fomites, food (salmonella), fluids (cholera) — plus airborne.","tag":"fact"},{"id":"2c49e1843d","front":"How many links must remain intact for transmission to occur in the chain of infection?","back":"All six — Transmission will only take place if all six links are intact.","en":"All six","tag":"quiz"},{"id":"7f98e8157f","front":"Which carrier type transmits infection without ever developing the disease themselves?","back":"Inapparent (healthy) carrier — Inapparent carriers transmit without ever developing the infection themselves, e.g. typhoid.","en":"Inapparent (healthy) carrier","tag":"quiz"}],"midterm":[{"part":0,"n":2,"q":"Transmission of infection will occur only when:","options":["The reservoir is an infected human","All six links of the chain of infection are intact","The pathogen is highly virulent","The host is hospitalized"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q2","source":{"part":0,"qn":2}},{"part":0,"n":3,"q":"Which of the following represents the ﬁrst link in the chain of infection?","options":["Reservoir","Susceptible host","Portal of exit","Infectious agent"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q3","source":{"part":0,"qn":3}},{"part":0,"n":4,"q":"The ability of a pathogen to produce disease is known as:","options":["Resistance","Virulence","Invasiveness","Pathogenicity"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q4","source":{"part":0,"qn":4}},{"part":0,"n":5,"q":"The degree of harmfulness or severity of a pathogen is called:","options":["Invasiveness","Pathogenicity","Colonization","Virulence"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q5","source":{"part":0,"qn":5}},{"part":0,"n":6,"q":"A pathogen's tendency to spread within the host is referred to as:","options":["Pathogenicity","Reservoir capacity","Invasiveness","Immunity"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q6","source":{"part":0,"qn":6}},{"part":0,"n":7,"q":"Which of the following is NOT listed as a type of infectious agent in the lecture?","options":["Red blood cells","Bacteria","Fungi","Prions"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q7","source":{"part":0,"qn":7}},{"part":0,"n":8,"q":"A reservoir is best deﬁned as:","options":["The route through which a pathogen leaves the host","The principal habitat where a pathogen lives, flourishes, and multiplies","The route through which a pathogen enters the host","A person who has developed immunity"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q8","source":{"part":0,"qn":8}},{"part":0,"n":9,"q":"Which of the following is classiﬁed as a human reservoir?","options":["Swimming pool","Air-conditioning system","Soil","An infected person"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q9","source":{"part":0,"qn":9}},{"part":0,"n":10,"q":"A person who is infected and displays signs and symptoms of the disease is classiﬁed as:","options":["An acute clinical case","An incubatory carrier","An inapparent carrier","A chronic carrier"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q10","source":{"part":0,"qn":10}},{"part":0,"n":11,"q":"According to the lecture, which may be more dangerous as a source of infection?","options":["Vaccinated individual","Acute clinical case","Carrier","Recovered non-carrier"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q11","source":{"part":0,"qn":11}},{"part":0,"n":12,"q":"A person who can transmit an infection before developing symptoms is called:","options":["Convalescent carrier","Inapparent carrier","Incubatory carrier","Chronic carrier"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q12","source":{"part":0,"qn":12}},{"part":0,"n":13,"q":"Which disease is given as an example of an incubatory carrier?","options":["Measles","Hepatitis C","Chickenpox","Typhoid"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q13","source":{"part":0,"qn":13}},{"part":0,"n":14,"q":"An individual who transmits infection without ever developing the disease is classiﬁed as:","options":["Convalescent carrier","Incubatory carrier","Inapparent carrier","Chronic carrier"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q14","source":{"part":0,"qn":14}},{"part":0,"n":15,"q":"Typhoid is given in the lecture as an example of infection associated with:","options":["Chronic carriers","Inapparent carriers","Convalescent carriers","Incubatory carriers"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q15","source":{"part":0,"qn":15}},{"part":0,"n":16,"q":"A patient who continues to transmit infection for a short period during recovery is called:","options":["Convalescent carrier","Chronic carrier","Incubatory carrier","Inapparent carrier"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q16","source":{"part":0,"qn":16}},{"part":0,"n":17,"q":"Which disease is used as an example of a convalescent carrier?","options":["Typhoid","Measles","HBV","Chickenpox"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q17","source":{"part":0,"qn":17}},{"part":0,"n":18,"q":"A person who remains infectious for years or even throughout life after recovery is classiﬁed as:","options":["Chronic carrier","Incubatory carrier","Acute clinical case","Convalescent carrier"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q18","source":{"part":0,"qn":18}},{"part":0,"n":19,"q":"Which infections are given as examples of chronic carriage?","options":["Cholera and tetanus","Measles and chickenpox","HBV and HCV","Rabies and Lyme disease"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q19","source":{"part":0,"qn":19}},{"part":0,"n":20,"q":"An infectious disease transmitted naturally from animals to humans is known as:","options":["Opportunistic infection","Nosocomial infection","Colonization","Zoonosis"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q20","source":{"part":0,"qn":20}},{"part":0,"n":21,"q":"Rabies is listed in the lecture as an infection transmitted through bites from:","options":["Dogs, cats, foxes, and bats","Flies and fleas only","Mosquitoes only","Ticks only"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q21","source":{"part":0,"qn":21}},{"part":0,"n":22,"q":"Lyme disease is transmitted through:","options":["Contaminated water","Respiratory droplets","Ticks","Contaminated needles"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q22","source":{"part":0,"qn":22}},{"part":0,"n":25,"q":"Which of the following may act as a reservoir for Pseudomonas?","options":["Moist sink-traps and drains","Freshly sterilized instruments","Dry sterile surfaces only","Clean, dry hospital walls"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q25","source":{"part":0,"qn":25}},{"part":0,"n":26,"q":"The portal of exit refers to:","options":["The place where a pathogen multiplies","The route through which a pathogen enters a susceptible host","The immune response against infection","Any route that enables a pathogen to leave its reservoir or host"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q26","source":{"part":0,"qn":26}},{"part":0,"n":27,"q":"Vomiting and diarrhoea are examples of which portal of exit?","options":["Genitourinary","Transplacental","Alimentary","Respiratory"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q27","source":{"part":0,"qn":27}},{"part":0,"n":29,"q":"Transmission from an infected mother to her fetus occurs through the:","options":["Skin portal","Alimentary portal","Respiratory portal","Transplacental portal"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q29","source":{"part":0,"qn":29}},{"part":0,"n":30,"q":"Direct transmission occurs when:","options":["The pathogen remains suspended in the air for long periods","The pathogen contacts a vulnerable host without an intermediary","The pathogen is transmitted through an insect vector only","The pathogen requires contaminated food"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q30","source":{"part":0,"qn":30}},{"part":0,"n":31,"q":"Which of the following is an example of direct contact transmission?","options":["Scabies through direct skin contact","Salmonella through contaminated food","Plague through flies","Cholera through contaminated fluids"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q31","source":{"part":0,"qn":31}},{"part":0,"n":32,"q":"Tetanus may be transmitted through:","options":["Transplacental transmission","Direct contact with contaminated soil","Respiratory droplets","Contaminated air-conditioning systems"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q32","source":{"part":0,"qn":32}},{"part":0,"n":34,"q":"The ﬁve Fs of indirect transmission include all EXCEPT:","options":["Flies","Fever","Fingers","Fomites"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q34","source":{"part":0,"qn":34}},{"part":0,"n":35,"q":"Plague is given as an example of transmission through:","options":["Fingers","Flies","Food","Fluids"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q35","source":{"part":0,"qn":35}},{"part":0,"n":36,"q":"Which of the following is an example of fomite transmission?","options":["Rabies through animal bites","Cholera through fluids","Tetanus through contaminated soil","Eye and skin infections through contaminated objects"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q36","source":{"part":0,"qn":36}},{"part":0,"n":37,"q":"Salmonella and Shigella are listed as examples of infections transmitted through:","options":["Transplacental transmission","Food","Airborne particles","Animal bites"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q37","source":{"part":0,"qn":37}},{"part":0,"n":38,"q":"Cholera is listed under which of the ﬁve Fs?","options":["Flies","Fingers","Fomites","Fluids"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q38","source":{"part":0,"qn":38}},{"part":0,"n":40,"q":"Which of the following is a portal of entry?","options":["Inhalation through the respiratory tract","Coughing","Diarrhoea","Skin lesions releasing pathogens"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q40","source":{"part":0,"qn":40}},{"part":0,"n":46,"q":"According to the lecture, certain healthcare-associated pathogens may persist in the environment for:","options":["A maximum of one hour","A few seconds only","Days and, in some cases, months","Only while the patient is present"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q46","source":{"part":0,"qn":46}},{"part":0,"n":51,"q":"Which of the following is one of the three hand-hygiene methods mentioned in the lecture?","options":["Rinsing hands with saline only","Wearing two pairs of gloves","Using a dry towel without cleaning","Surgical hand scrub before surgery"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q51","source":{"part":0,"qn":51}},{"part":0,"n":54,"q":"A surgical mask should be worn when:","options":["Handling clean linen only","In contact with a patient with respiratory disease","Performing hand hygiene","Entering every empty room"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q54","source":{"part":0,"qn":54}},{"part":0,"n":55,"q":"A single-patient room is recommended for patients who:","options":["Have contagious suspected or confirmed infections","Have no risk of transmitting infection","Are waiting for routine discharge","Require no additional privacy"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q55","source":{"part":0,"qn":55}},{"part":0,"n":66,"q":"Transmission-based precautions are considered:","options":["The second tier of basic infection control","Measures used only after surgery","Optional measures for all patients","A replacement for Standard Precautions"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q66","source":{"part":0,"qn":66}},{"part":0,"n":67,"q":"Transmission-based precautions are used for patients who are:","options":["Always free from infection","Receiving medication without any infection risk","Only undergoing routine imaging","Known or suspected to be infected or colonized with certain infectious agents"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q67","source":{"part":0,"qn":67}},{"part":0,"n":68,"q":"Which statement about Standard and Transmission-Based Precautions is correct?","options":["Transmission-Based Precautions are always used in addition to Standard Precautions","Transmission-Based Precautions replace Standard Precautions","Standard Precautions are used only after Transmission-Based Precautions","They are mutually exclusive"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q68","source":{"part":0,"qn":68}},{"part":0,"n":69,"q":"The three types of Transmission-Based Precautions are:","options":["Sterile, clean, and contaminated","Contact, droplet, and airborne","Isolation, quarantine, and vaccination","Surgical, medical, and environmental"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q69","source":{"part":0,"qn":69}},{"part":0,"n":73,"q":"Which group contains only organisms listed in the lecture as multidrug-resistant organisms?","options":["Salmonella, Shigella, and cholera only","Rabies, Lyme disease, and tetanus","Influenza, measles, rubella, and mumps","VRE, MRSA, ESBL, CRE, and Candida auris"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q73","source":{"part":0,"qn":73}},{"part":0,"n":98,"q":"Which statement about autoclaving is correct?","options":["It is suitable for all pathological and cytotoxic wastes","It is used only for radioactive waste","It uses dry air only","It uses steam at a specified pressure and temperature for a determined period"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q98","source":{"part":0,"qn":98}},{"part":0,"n":103,"q":"According to the lecture, which bacterial organism is associated with tetanus?","options":["Pseudomonas","Salmonella typhi","Vibrio cholerae","Clostridium tetani"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q103","source":{"part":0,"qn":103}},{"part":0,"n":104,"q":"Which group contains diseases listed in the lecture as parasite-associated infections?","options":["Cholera, tetanus, and salmonellosis","Malaria, cutaneous leishmaniasis, and filariasis","HIV, hepatitis B, and hepatitis C","Influenza, measles, and rubella"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q104","source":{"part":0,"qn":104}},{"part":0,"n":129,"q":"Interim storage means:","options":["Transporting waste directly to a landfill","Storing waste within the facility until final disposal","Storing waste outside the hospital permanently","Treating waste using chemicals"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q129","source":{"part":0,"qn":129}},{"part":0,"n":167,"q":"Sterillium and Cavicide are listed in the lecture as examples of:","options":["Peracetic acid compounds","Quaternary ammonium compounds","Iodophors","Aldehydes"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q167","source":{"part":0,"qn":167}},{"part":0,"n":168,"q":"Dettol is listed in the lecture under which group?","options":["Aldehydes","Phenolic compounds","Oxidizing agents","Iodophors"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q168","source":{"part":0,"qn":168}},{"part":0,"n":169,"q":"Which comparison is correct according to the lecture?","options":["Intermediate-level disinfection kills bacterial spores","Low-level disinfection does not kill resistant organisms such as Mycobacterium tuberculosis","High-level disinfection is less effective than low-level disinfection","Sterilization does not eliminate spores"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q169","source":{"part":0,"qn":169}},{"part":0,"n":174,"q":"Angiography catheters and guidewires are classiﬁed as:","options":["Critical items","General environmental surfaces","Non-critical items","Semi-critical items"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q174","source":{"part":0,"qn":174}},{"part":0,"n":180,"q":"A rectal tip used in a barium enema examination is classiﬁed as:","options":["General waste","Semi-critical","Critical","Non-critical"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q180","source":{"part":0,"qn":180}},{"part":0,"n":206,"q":"Transmission-Based Precautions are considered:","options":["A replacement for Standard Precautions","Measures used only during surgery","The second tier of basic infection control","The first and only tier of infection control"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q206","source":{"part":0,"qn":206}},{"part":0,"n":207,"q":"Transmission-Based Precautions should be used:","options":["Only for patients in operating theatres","Only when Standard Precautions are stopped","Instead of Standard Precautions","In addition to Standard Precautions"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q207","source":{"part":0,"qn":207}},{"part":0,"n":210,"q":"Which group contains only multidrug-resistant organisms listed in the lecture?","options":["Influenza, measles, and rubella","Salmonella, cholera, and tetanus","Rabies, malaria, and Lyme disease","VRE, MRSA, ESBL, CRE, and Candida auris"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q210","source":{"part":0,"qn":210}},{"part":0,"n":236,"q":"What is preferred when imaging a patient under transmission-based precautions?","options":["Portable imaging in the patient's room","Using a shared imaging room without preparation","Sending the patient to a crowded waiting area","Delaying all imaging regardless of medical need"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q236","source":{"part":0,"qn":236}}],"audios":[{"src":"Audio/INF-L1.m4a","title":"Infection control — lecture 1","start":0,"end":0}],"visuals":[{"source":"inf-chain","file":"1.Chain of infection.pdf","loc":"Page 2","n":2,"asset":"images\\inf-chain\\page-2.png","path":"Assets/inf-chain/page-2.png"},{"source":"inf-chain","file":"1.Chain of infection.pdf","loc":"Page 4","n":4,"asset":"images\\inf-chain\\page-4.png","path":"Assets/inf-chain/page-4.png"},{"source":"inf-chain","file":"1.Chain of infection.pdf","loc":"Page 5","n":5,"asset":"images\\inf-chain\\page-5.png","path":"Assets/inf-chain/page-5.png"},{"source":"inf-chain","file":"1.Chain of infection.pdf","loc":"Page 6","n":6,"asset":"images\\inf-chain\\page-6.png","path":"Assets/inf-chain/page-6.png"},{"source":"inf-chain","file":"1.Chain of infection.pdf","loc":"Page 7","n":7,"asset":"images\\inf-chain\\page-7.png","path":"Assets/inf-chain/page-7.png"},{"source":"inf-chain","file":"1.Chain of infection.pdf","loc":"Page 8","n":8,"asset":"images\\inf-chain\\page-8.png","path":"Assets/inf-chain/page-8.png"},{"source":"inf-chain","file":"1.Chain of infection.pdf","loc":"Page 9","n":9,"asset":"images\\inf-chain\\page-9.png","path":"Assets/inf-chain/page-9.png"},{"source":"inf-chain","file":"1.Chain of infection.pdf","loc":"Page 10","n":10,"asset":"images\\inf-chain\\page-10.png","path":"Assets/inf-chain/page-10.png"}]},{"id":"inf-hygiene","titleAr":"الاحتياطات القياسية ونظافة اليدين","titleEn":"Standard precautions and hand hygiene","summaryAr":"الحد الأدنى المطبق على كل مريض: مكونات الاحتياطات القياسية + متى وكيف نغسل اليدين + آداب الجهاز التنفسي + وضع المريض والعزل الفردي والتجميع.","summaryEn":"The minimum applied to every patient: standard precaution components, when and how to perform hand hygiene, respiratory etiquette, and patient placement with cohorting.","objectivesAr":["عدّد مكونات الاحتياطات القياسية.","حدد لحظات نظافة اليدين.","اشرح التجميع Cohorting."],"objectivesEn":["List the standard precaution components.","Identify hand hygiene moments.","Explain cohorting."],"refs":[{"source":"inf-standard","n":2},{"source":"inf-standard","n":3},{"source":"inf-standard","n":4},{"source":"inf-standard","n":6},{"source":"inf-standard","n":7},{"source":"inf-standard","n":8},{"source":"inf-standard","n":9},{"source":"inf-standard","n":10},{"source":"inf-standard","n":11},{"source":"inf-standard","n":12}],"galleryRefs":[],"evidence":[{"file":"2.Standard Precaution_1.pdf","loc":"Page 2","text":"• •standard Precautions are the minimum infection prevention practices that apply to all patient care, regardless of suspected or confirmed infection status of the patient, in any setting where health care is delivered","egyptian":"الاحتياطات القياسية = الحد الأدنى لممارسات الوقاية المطبقة على كل مريض مهما كانت حالته المشتبهة أو المؤكدة، في أي مكان بتتقدم فيه الرعاية."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 3","text":"• •hand hygiene •respiratory hygiene and cough etiquette • patient placement •Personal protective equipment •aseptic technique •safe injections and sharps injury prevention • Environmental cleaning • handling of laundry and linen •waste management •Decontamination and reprocessing of reusable patient care items and equipment components","egyptian":"مكوناتها: نظافة اليدين + آداب تنفسية + وضع المريض + معدات حماية شخصية PPE + تقنية معقمة + حقن آمنة ووقاية من الشارps + تنظيف بيئي + غسيل وأغطية + إدارة نفايات + إزالة تلوث وإعادة معالجة الأدوات."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 4","text":"• •Hand Hygiene includes cleaning hands with soap and water or alcohol-based hand rub in order to remove germs, •transmission of several key healthcare-associated pathogens including MRSA, VRE and Clostridium difficile. All these pathogens have been demonstrated to persist in the environment for days (in some cases months) Hand hygiene","egyptian":"نظافة اليدين بغسل بالماء والصابون أو فرك بكحولي لإزالة الميكروبات — مسببات عدوى رئيسية زي MRSA وVRE وC. difficile بتعيش في البيئة أيام (وأحيانًا شهور)."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 6","text":"• •Before contact with a patient or patient environment this will protect the patient from harmful organisms carried on your hands. Before aseptic/clean procedure This prevents the patient’s own organisms from entering his or her body. Handling dressings or touching open wounds Performing invasive procedure","egyptian":"لحظات الغسل (قبل): قبل التعامل مع مريض أو بيئته (تحمي المريض) + قبل إجراء معقم/نظيف (تمنع ميكروبات المريض نفسه تدخل جسمه) + عند التعامل مع ضمائد أو لمس جروح مفتوحة + قبل إجراءات باضة."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 7","text":"• •After body fluid exposure This can help protect yourself and the health care environment from harmful patient organisms. After contact with a patient/patient env Help protect yourself and the health care environment from harmful patient organisms","egyptian":"لحظات الغسل (بعد): بعد التعرض لسوائل الجسم (تحميك وتحمي البيئة) + بعد التعامل مع مريض أو بيئته."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 8","text":"• Methods 1. Washing by soap and water. 2. Alcoholic hand rub after dirt removal. 3. Surgical hand scrub before surgery.","egyptian":"طرق نظافة اليدين: غسل صابون وماء + فرك كحولي بعد إزالة الأوساخ + غسل جراحي Scrub قبل العمليات."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 9","text":"• Respiratory hygiene:","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 10","text":"• • Cover nose, mouth during cough, sneeze with tissue or upper sleeve • Discard tissue with respiratory secretion • Wear surgical mask in contact with patient with respiratory disease Respiratory hygiene:","egyptian":"الآداب التنفسية: غطّ الأنف والفم عند الكحة والعطس بمنديل أو الأكمام + ارمِ المنديل الملوث بالإفرازات + البس كمامة جراحية عند التعامل مع مريض تنفسي."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 11","text":"• Single Patient Rooms :Recommended for: •Patients with known or suspected infections that are contagious (e.g., certain respiratory infections, draining wounds). •Patients requiring additional privacy or if their condition poses a risk to others. Patient placment","egyptian":"وضع المريض: حجرات فردية للمعدى أو المشتبه عدواهم المعدية (عدوى تنفسية أو جروح نازة) ولمن يحتاج خصوصية أو يشكل خطرًا."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 12","text":"• •Cohorting Patients: can be done when: •Patients have the same infection type (e.g., same pathogen) and are at similar risk levels. •This approach can be useful during outbreaks but should be done with caution to prevent cross- contamination.","egyptian":"التجميع Cohorting: مرضى بنفس العدوى ونفس مستوى الخطورة في غرفة واحدة — مفيد في الأوبئة بحذر لتجنب التلوث المتصالب."}],"quiz":[{"type":"mcq","q":"Standard precautions apply to:","options":["All patient care regardless of infection status","Only confirmed infected patients","Only isolation rooms","Only surgical procedures"],"answer":0,"why":"They are the minimum practices applied to all patient care in any setting.","source":{"source":"inf-standard","n":2},"points":1},{"type":"mcq","q":"Which method is preferred for hand hygiene when C. difficile is suspected?","options":["Soap and water","Alcohol-based rub only","Dry wiping","No preference"],"answer":0,"why":"C. difficile and norovirus: soap-and-water hand hygiene is preferred.","source":{"source":"inf-transmission","n":4},"points":1}],"cards":[{"id":"38b694b244","front":"Define standard precautions","back":"الحد الأدنى للوقاية المطبق على كل مريض مهما حالته في أي مكان رعاية.","en":"Minimum prevention practices applied to all patient care regardless of infection status.","tag":"fact"},{"id":"5690f69372","front":"List the hand hygiene methods","back":"صابون وماء + فرك كحولي بعد إزالة الأوساخ + غسل جراحي قبل العمليات.","en":"Soap and water, alcohol rub after dirt removal, surgical scrub.","tag":"fact"},{"id":"6407e61d42","front":"When is a single patient room recommended?","back":"لعدوى معدية مؤكدة أو مشتبهة (تنفسية أو جروح نازة) أو لمن يحتاج خصوصية أو يشكل خطرًا.","en":"Known/suspected contagious infections or patients posing a risk to others.","tag":"fact"},{"id":"ad6da52fff","front":"What is cohorting?","back":"مرضى بنفس العدوى ونفس الخطورة في غرفة واحدة — مفيد في الأوبضاء بحذر.","en":"Patients with the same infection sharing a room — useful in outbreaks, with caution.","tag":"fact"},{"id":"2fd042b276","front":"Standard precautions apply to:","back":"All patient care regardless of infection status — They are the minimum practices applied to all patient care in any setting.","en":"All patient care regardless of infection status","tag":"quiz"},{"id":"f13f499a27","front":"Which method is preferred for hand hygiene when C. difficile is suspected?","back":"Soap and water — C. difficile and norovirus: soap-and-water hand hygiene is preferred.","en":"Soap and water","tag":"quiz"}],"midterm":[{"part":0,"n":28,"q":"Transmission through coughing, sneezing, and talking is associated with which portal of exit?","options":["Alimentary","Respiratory","Genitourinary","Skin"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q28","source":{"part":0,"qn":28}},{"part":0,"n":41,"q":"Standard Precautions are best described as:","options":["Minimum infection-prevention practices applied to all patient care","Measures used only in intensive care units","Measures used only for patients with confirmed infections","Precautions used only during surgical procedures"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q41","source":{"part":0,"qn":41}},{"part":0,"n":42,"q":"Standard Precautions should be applied:","options":["Only when the patient has a fever","Only when blood exposure is expected","Only in hospital isolation rooms","Regardless of the patient's suspected or confirmed infection status"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q42","source":{"part":0,"qn":42}},{"part":0,"n":43,"q":"Which of the following is NOT listed as a component of Standard Precautions?","options":["Respiratory hygiene","Routine antibiotic administration","Hand hygiene","Safe injection practices"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q43","source":{"part":0,"qn":43}},{"part":0,"n":44,"q":"Hand hygiene includes:","options":["Using antiseptic only after surgery","Washing hands with water only","Wearing gloves without cleaning hands","Cleaning hands with soap and water or alcohol-based hand rub"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q44","source":{"part":0,"qn":44}},{"part":0,"n":45,"q":"Hand hygiene helps prevent transmission of healthcare-associated pathogens such as:","options":["All viruses transmitted exclusively by insects","Legionella and Plasmodium only","Clostridium tetani, rabies, and malaria only","MRSA, VRE, and Clostridium difficile"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q45","source":{"part":0,"qn":45}},{"part":0,"n":47,"q":"Hand hygiene should be performed before patient contact mainly to:","options":["Protect the healthcare worker from the patient's organisms only","Replace the need for PPE","Protect the patient from harmful organisms carried on healthcare workers' hands","Remove all bacterial spores in every situation"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q47","source":{"part":0,"qn":47}},{"part":0,"n":49,"q":"Which of the following requires hand hygiene before performing the procedure?","options":["Adjusting the room temperature","Handling dressings or touching open wounds","Leaving the hospital building","Reading the patient's medical record"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q49","source":{"part":0,"qn":49}},{"part":0,"n":50,"q":"After exposure to body ﬂuids, hand hygiene helps protect:","options":["The patient only","The healthcare worker and the healthcare environment","The patient's family only","The radiology equipment only"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q50","source":{"part":0,"qn":50}},{"part":0,"n":53,"q":"After using a tissue to cover a cough or sneeze, the tissue should be:","options":["Placed on the examination table","Discarded with respiratory secretions","Kept in the healthcare worker's pocket","Reused after drying"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q53","source":{"part":0,"qn":53}},{"part":0,"n":189,"q":"Which of the following is included among the components of Standard Precautions?","options":["Environmental cleaning","Hand hygiene","Handling of laundry and linen","All of the above"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q189","source":{"part":0,"qn":189}},{"part":0,"n":190,"q":"Standard Precautions apply to:","options":["Patients with suspected infections only","Patients with confirmed infections only","Intensive care patients only","All patient care, regardless of suspected or confirmed infection status"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q190","source":{"part":0,"qn":190}},{"part":0,"n":191,"q":"Which healthcare-associated pathogens are specifically mentioned in the hand hygiene section?","options":["MRSA, VRE, and Clostridium difficile","Salmonella, cholera, and tetanus","HIV, HBV, and malaria","Measles, mumps, and rubella"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q191","source":{"part":0,"qn":191}},{"part":0,"n":192,"q":"These pathogens are important in hand hygiene because they can:","options":["Be eliminated by ordinary ventilation alone","Spread only through airborne transmission","Persist in the environment for days and sometimes months","Survive only for a few seconds"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q192","source":{"part":0,"qn":192}},{"part":0,"n":194,"q":"Which hand hygiene method is speciﬁcally performed before surgery?","options":["Alcoholic hand rub only","Routine environmental cleaning","Surgical hand scrub","Washing gloves"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q194","source":{"part":0,"qn":194}}],"audios":[{"src":"Audio/INF-L2.m4a","title":"Infection control — lecture 2","start":0,"end":0}],"visuals":[{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 2","n":2,"asset":"images\\inf-standard\\page-2.png","path":"Assets/inf-standard/page-2.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 3","n":3,"asset":"images\\inf-standard\\page-3.png","path":"Assets/inf-standard/page-3.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 4","n":4,"asset":"images\\inf-standard\\page-4.png","path":"Assets/inf-standard/page-4.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 6","n":6,"asset":"images\\inf-standard\\page-6.png","path":"Assets/inf-standard/page-6.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 7","n":7,"asset":"images\\inf-standard\\page-7.png","path":"Assets/inf-standard/page-7.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 8","n":8,"asset":"images\\inf-standard\\page-8.png","path":"Assets/inf-standard/page-8.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 9","n":9,"asset":"images\\inf-standard\\page-9.png","path":"Assets/inf-standard/page-9.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 10","n":10,"asset":"images\\inf-standard\\page-10.png","path":"Assets/inf-standard/page-10.png"}]},{"id":"inf-ppe","titleAr":"معدات الحماية والحقن الآمن","titleEn":"PPE, aseptic technique and safe injections","summaryAr":"معدات الوقاية الشخصية واختيارها + التقنية المعقمة + قواعد الحقن الآمن + الوقاية من إصابات الإبر والشارps.","summaryEn":"Personal protective equipment and its choice, aseptic technique, safe injection rules, and needle-stick and sharps injury prevention.","objectivesAr":["ميّز أنواع PPE ومواضعها.","لخّص قواعد الحقن الآمن.","اشرح قاعدة إبرة جديدة لكل مريض."],"objectivesEn":["Match PPE types to situations.","Summarize safe injection rules.","Explain one needle per patient."],"refs":[{"source":"inf-standard","n":13},{"source":"inf-standard","n":14},{"source":"inf-standard","n":15},{"source":"inf-standard","n":16},{"source":"inf-standard","n":17}],"galleryRefs":[],"evidence":[{"file":"2.Standard Precaution_1.pdf","loc":"Page 13","text":"• •Equipment used to protect person during deals with patient or its towels or secretions, or body fluids •Choice of PPE depends on type of infection between patient and health care worker and type of disease transmission •E.g. gloves, gown, surgical mask, goggles face shield, eye protector glasses. •Disposable PPE must be discarded in biohozand bags Personal protective equipment","egyptian":"PPE: معدات بتحمي أثناء التعامل مع المريض أو إفرازاته وسوائله — الاختيار حسب نوع العدوى وطريقة انتقالها: قفازات ورداء وكمامة جراحية ونظارات واقية ودرع وجه — والـ PPE الأحاديUsage يترمي في أكياس البيوهزارد."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 14","text":"• •Aseptic technique is a fundamental practice in healthcare that aims to prevent contamination and reduce the risk of infection during medical procedures. Aseptic technique","egyptian":"التقنية المعقمة: ممارسة أساسية هدفها منع التلوث وتقليل خطر العدوى أثناء الإجراءات الطبية."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 15","text":"• •Use new needle and syringe in every medication vial. • Skin at site of injection is rubbed by antiseptic. • Preparation of medicine in a clean areas. • Medication vials septum are disinfected before use. • Wear disposal gloves during injection. •New needle and syringe for every patient. Safe injection practice","egyptian":"الحقن الآمن: إبرة وسرنجة جديدة لكل دواء + تطهير جلد موضع الحقن بمطهر + تحضير الدواء في مكان نظيف + تطهير سدادة القارورة + قفازات + إبرة وسرنجة جديدة لكل مريض."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 16","text":"• •Use a medication vials for one patient only if possible. •Don’t use the same syringes between patients even you changed the needle. • Don’t use the same syringes used to infuse medication into an IV tubing port for anther patients. • Hand hygiene during injection and medication preparation. •Needles, syringes are discarded into sharp containers as biohazard.","egyptian":"قواعد إضافية: القارورة لمريض واحد لو أمكن + ممنوع نفس السرنجة بين المرضى حتى لو غيرت الإبرة + ممنوع استخدام سرنجات خط الوريد لمريض تاني + نظافة يدين أثناء التحضير + الإبر والسرنجات تترمى في حاويات الشارps كبيوهزارد."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 17","text":"• •Used needle should be discarded immediately and not recapped, or cut, removed from syringe. •Any needles or sharps should be places in a leak proof puncture resistant container. •The container to be filed to 2/3 only not more than discarded as biohazard label. Needle stick and sharps injury prevention","egyptian":"وقاية الإبر: الإبرة المستخدمة تترمى فورًا بدون إعادة غطاء أو كسر أو فصل من السرنجة + في حاوية مانعة للتسرب والثقب + لحد ثلثيها فقط + كيس بيوهزارد."}],"quiz":[{"type":"mcq","q":"A used needle should be:","options":["Discarded immediately without recapping","Recapped before discarding","Cut before discarding","Removed from the syringe then discarded"],"answer":0,"why":"Used needles are discarded immediately and never recapped, cut or removed from the syringe.","source":{"source":"inf-standard","n":17},"points":1},{"type":"mcq","q":"Sharps containers should be discarded when filled to:","options":["2/3 only","Completely full","1/4","1/2"],"answer":0,"why":"The container is filled to 2/3 only, not more.","source":{"source":"inf-standard","n":17},"points":1}],"cards":[{"id":"4c951a2f84","front":"Name common PPE items","back":"قفازات ورداء وكمامة جراحية ونظارات واقية ودرع وجه — الأحاديUsage يترمى في بيوهزارد.","en":"Gloves, gown, surgical mask, goggles, face shield — disposable PPE goes to biohazard bags.","tag":"fact"},{"id":"93ad348923","front":"State the safe injection core rules","back":"إبرة وسرنجة جديدة لكل مريض + تطهير الجلد والسدادة + تحضير في مكان نظيف + قفازات + ممنوع نفس السرنجة حتى بإبرة جديدة.","en":"New needle and syringe per patient, disinfect skin and vial septum, clean preparation area, gloves, never share syringes.","tag":"fact"},{"id":"24b12412aa","front":"Sharps injury prevention rules","back":"الإبرة تترمى فورًا بدون إعادة غطاء أو كسر أو فصل + حاوية مقاومة للثقب والتسرب + لحد الثلتين.","en":"Discard immediately without recapping/cutting; puncture-proof leak-proof container; fill to 2/3 only.","tag":"fact"},{"id":"053adb8b87","front":"A used needle should be:","back":"Discarded immediately without recapping — Used needles are discarded immediately and never recapped, cut or removed from the syringe.","en":"Discarded immediately without recapping","tag":"quiz"},{"id":"c2f7ff340c","front":"Sharps containers should be discarded when filled to:","back":"2/3 only — The container is filled to 2/3 only, not more.","en":"2/3 only","tag":"quiz"}],"midterm":[{"part":0,"n":33,"q":"Hepatitis B transmission through contaminated needles is classiﬁed as:","options":["Droplet infection","Airborne transmission","Foodborne transmission","Inoculation into skin or mucosa"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q33","source":{"part":0,"qn":33}},{"part":0,"n":48,"q":"Hand hygiene before an aseptic or clean procedure is important because it:","options":["Replaces instrument sterilization","Prevents all airborne infections","Prevents the patient's own organisms from entering the body","Increases the patient's normal flora"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q48","source":{"part":0,"qn":48}},{"part":0,"n":57,"q":"Which statement about PPE is correct?","options":["PPE is unnecessary when handling body fluids","PPE is selected according to the infection type and transmission risk","PPE selection is independent of the transmission route","Gloves are the only type of PPE"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q57","source":{"part":0,"qn":57}},{"part":0,"n":58,"q":"Which of the following is considered PPE?","options":["Goggles and face shields","Waste storage room","Examination table","Medication vial"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q58","source":{"part":0,"qn":58}},{"part":0,"n":59,"q":"Disposable PPE should be discarded in:","options":["Ordinary linen bags","Biohazard bags","Food-waste containers","General paper-waste containers"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q59","source":{"part":0,"qn":59}},{"part":0,"n":60,"q":"Aseptic technique primarily aims to:","options":["Eliminate the need for hand hygiene","Prevent contamination and reduce infection risk during medical procedures","Replace all environmental cleaning","Increase microbial contamination"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q60","source":{"part":0,"qn":60}},{"part":0,"n":61,"q":"Which practice is essential for safe injection preparation?","options":["Preparing medication in an unclean area","Reusing a syringe after changing its needle","Skipping hand hygiene if gloves are worn","Using a new needle and syringe for every patient"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q61","source":{"part":0,"qn":61}},{"part":0,"n":62,"q":"Before using a medication vial, its septum should be:","options":["Left untouched regardless of contamination","Disinfected","Washed with ordinary water","Scratched with a needle"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q62","source":{"part":0,"qn":62}},{"part":0,"n":63,"q":"Which statement about syringe reuse is correct?","options":["A syringe may be reused if it contains the same medication","The same syringe may be used for different patients if the needle is changed","Syringe reuse is acceptable when gloves are worn","The same syringe must not be used between patients, even if the needle is changed"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q63","source":{"part":0,"qn":63}},{"part":0,"n":64,"q":"Used needles should be:","options":["Discarded immediately without recapping","Recapped before disposal","Bent to prevent reuse","Removed manually from the syringe"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q64","source":{"part":0,"qn":64}},{"part":0,"n":102,"q":"Which of the following infections may be associated with exposure to infected needles and body fluids?","options":["HIV and Hepatitis B","Malaria only","Tetanus only","Lyme disease only"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q102","source":{"part":0,"qn":102}},{"part":0,"n":193,"q":"Hand hygiene before an aseptic procedure helps to:","options":["Eliminate the need for gloves in all procedures","Increase the patient's normal flora","Replace the need for aseptic technique","Prevent the patient's own organisms from entering the body"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q193","source":{"part":0,"qn":193}},{"part":0,"n":197,"q":"The choice of PPE depends mainly on:","options":["The type of infection and its mode of transmission","The healthcare worker's preference only","The patient's age only","The room size"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q197","source":{"part":0,"qn":197}},{"part":0,"n":198,"q":"Which of the following is an appropriate objective of aseptic technique?","options":["To replace sterilization of critical items","To increase environmental microorganisms","To prevent contamination during medical procedures","To avoid hand hygiene"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q198","source":{"part":0,"qn":198}},{"part":0,"n":199,"q":"Before using a medication vial, its septum should be:","options":["Covered with a used needle","Disinfected","Washed with ordinary water only","Left untouched without preparation"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q199","source":{"part":0,"qn":199}},{"part":0,"n":200,"q":"Which injection practice is unsafe?","options":["Using a new needle and syringe for every patient","Performing hand hygiene during medication preparation","Using the same syringe between patients after changing the needle","Preparing medicine in a clean area"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q200","source":{"part":0,"qn":200}},{"part":0,"n":201,"q":"A syringe used to inject medication into an IV tubing port for one patient should:","options":["Be reused for another patient after changing the needle","Be reused if the medication is the same","Never be used for another patient","Be reused after wiping its external surface"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q201","source":{"part":0,"qn":201}},{"part":0,"n":202,"q":"What should be done with a used needle immediately after use?","options":["Recap it","Remove it from the syringe by hand","Cut it manually","Discard it without recapping"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q202","source":{"part":0,"qn":202}}],"audios":[{"src":"Audio/INF-L2.m4a","title":"Infection control — lecture 2","start":0,"end":0}],"visuals":[{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 13","n":13,"asset":"images\\inf-standard\\page-13.png","path":"Assets/inf-standard/page-13.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 14","n":14,"asset":"images\\inf-standard\\page-14.png","path":"Assets/inf-standard/page-14.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 15","n":15,"asset":"images\\inf-standard\\page-15.png","path":"Assets/inf-standard/page-15.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 16","n":16,"asset":"images\\inf-standard\\page-16.png","path":"Assets/inf-standard/page-16.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 17","n":17,"asset":"images\\inf-standard\\page-17.png","path":"Assets/inf-standard/page-17.png"}]},{"id":"inf-environmental","titleAr":"التنظيف البيئي والغسيل والتخلص من النفايات","titleEn":"Environmental cleaning, laundry and waste disposal","summaryAr":"تنظيف البيئة وإزالة الأوساخ + التعامل مع الغسيل والأغطية + التخلص من النفايات في أكياس البيوهزارد + إعادة معالجة الأدوات: تنظيف وتعقيم.","summaryEn":"Environmental cleaning, laundry and linen handling, biohazard waste disposal, and decontamination and reprocessing of reusable items.","objectivesAr":["رتّب خطوات التنظيف البيئي.","صف التعامل الصحيح مع الغسيل.","عرّف إعادة المعالجة."],"objectivesEn":["Order environmental cleaning steps.","Describe correct linen handling.","Define reprocessing."],"refs":[{"source":"inf-standard","n":18},{"source":"inf-standard","n":19},{"source":"inf-standard","n":20},{"source":"inf-standard","n":22}],"galleryRefs":[],"evidence":[{"file":"2.Standard Precaution_1.pdf","loc":"Page 18","text":"• •Removal of dirt, organic mater. •Use detergent, disinfection. •Allow air to dry the area or item Environmental cleaning","egyptian":"التنظيف البيئي: إزالة الأوساخ والمادة العضوية بمادة منظفة ومطهرة + ترك الهواء يجفف السطح أو الأداة."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 19","text":"• •Effective handling of laundry and linen is vital in controlling infection in healthcare settings. •reduce the risk of cross-contamination and protect both patients and healthcare workers •By appropriate segregation, transportation, laundering, and storage handling of laundry and linen","egyptian":"الغسيل والأغطية: التعامل الصحيح بيقلل التلوث المتصالب ويحمي المريض والعاملين — بالفصل الصحيح والنقل والغسيل والتخزين."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 20","text":"• Safety boxes resistant for puncture and leak are used then when filled to 2/3 they are transported after closing and labeling as biohazard material to be discarded. Other disposable PPE, b body, body fluid polluted items are discarded in biohazard bags resistant to leaks and puncture and labeled to be discarded. Waste disposal","egyptian":"التخلص من النفايات: صناديق أمان مقاومة للثقب والتسرب تمتلئ لحد التلتين وتنقل مقفولة ومسماه كبيوهزارد + الـ PPE والمتأثر بسوائل الجسم في أكياس بيوهزارد مقاومة ومسماه."},{"file":"2.Standard Precaution_1.pdf","loc":"Page 22","text":"• •Reprocessing includes cleaning, disinfecting, and sterilizing reusable items to make them safe for patient use. •Sterilization This is the complete elimination of all microorganisms, including spores, usually performed on critical items (those that enter sterile tissue). Decontamination and reprocessing of reusable patient care items and equipment","egyptian":"إعادة المعالجة = تنظيف + تطهير + تعقيم للأدوات القابلة لإعادة الاستخدام — والتعقيم قتل كل الميكروبات بما فيها الأبواغ للأدوات الحرجة الداخلة لنسيج معقم."}],"quiz":[{"type":"mcq","q":"Environmental cleaning involves all EXCEPT:","options":["Skipping drying after disinfection","Removal of dirt and organic matter","Use of detergent and disinfection","Allowing air to dry the area"],"answer":0,"why":"The steps are: remove dirt/organic matter, use detergent/disinfection, then allow air drying.","source":{"source":"inf-standard","n":18},"points":1},{"type":"mcq","q":"Reprocessing of reusable items includes:","options":["Cleaning, disinfecting and sterilizing","Disposal only","Washing with water only","Storage only"],"answer":0,"why":"Reprocessing includes cleaning, disinfecting and sterilizing to make items safe for reuse.","source":{"source":"inf-standard","n":22},"points":1}],"cards":[{"id":"3705e12942","front":"Outline environmental cleaning","back":"إزالة الأوساخ والمادة العضوية بم detergent ومطهر + ترك الهواء يجفف.","en":"Remove dirt and organic matter with detergent/disinfectant, then air dry.","tag":"fact"},{"id":"97b50bcfc0","front":"Define reprocessing","back":"تنظيف + تطهير + تعقيم للأدوات القابلة لإعادة الاستخدام.","en":"Cleaning, disinfecting and sterilizing reusable items for safe reuse.","tag":"fact"},{"id":"b56854df04","front":"Environmental cleaning involves all EXCEPT:","back":"Skipping drying after disinfection — The steps are: remove dirt/organic matter, use detergent/disinfection, then allow air drying.","en":"Skipping drying after disinfection","tag":"quiz"},{"id":"4295fedb4a","front":"Reprocessing of reusable items includes:","back":"Cleaning, disinfecting and sterilizing — Reprocessing includes cleaning, disinfecting and sterilizing to make items safe for reuse.","en":"Cleaning, disinfecting and sterilizing","tag":"quiz"}],"midterm":[{"part":0,"n":23,"q":"Soil acts as an environmental reservoir for which organism?","options":["Pseudomonas","Clostridium tetani","Legionella pneumophila","Salmonella typhi"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q23","source":{"part":0,"qn":23}},{"part":0,"n":24,"q":"Legionella pneumophila may be found in which environmental reservoirs?","options":["Human blood only","Dry skin and clothing","Sterile surgical instruments","Water, air-conditioning systems, and swimming pools"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q24","source":{"part":0,"qn":24}},{"part":0,"n":203,"q":"Environmental cleaning involves:","options":["Using detergent and disinfection","All of the above","Removal of dirt and organic matter","Allowing the area or item to air-dry"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q203","source":{"part":0,"qn":203}},{"part":0,"n":204,"q":"Appropriate handling of laundry and linen includes:","options":["Storing contaminated linen with clean linen","Mixing all linen before transportation","Segregation, transportation, laundering, and storage","Avoiding segregation"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q204","source":{"part":0,"qn":204}},{"part":0,"n":205,"q":"Reprocessing reusable patient-care equipment includes:","options":["Washing with water only","Disposal after every use in all cases","Cleaning only","Cleaning, disinfection, and sterilization"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q205","source":{"part":0,"qn":205}}],"audios":[{"src":"Audio/INF-L2.m4a","title":"Infection control — lecture 2","start":0,"end":0}],"visuals":[{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 18","n":18,"asset":"images\\inf-standard\\page-18.png","path":"Assets/inf-standard/page-18.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 19","n":19,"asset":"images\\inf-standard\\page-19.png","path":"Assets/inf-standard/page-19.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 20","n":20,"asset":"images\\inf-standard\\page-20.png","path":"Assets/inf-standard/page-20.png"},{"source":"inf-standard","file":"2.Standard Precaution_1.pdf","loc":"Page 22","n":22,"asset":"images\\inf-standard\\page-22.png","path":"Assets/inf-standard/page-22.png"}]},{"id":"inf-contact","titleAr":"احتياطات الانتقال بالتماس","titleEn":"Contact precautions","summaryAr":"الطابق الثاني فوق القياسية: أمراض التلامس المباشر وغير المباشر + المقاومة المتعددة MDRO + غرفة مفردة أو تجميع + رداء وقفازات ومعدات مخصصة + نقل المريض وتنظيف الغرفة.","summaryEn":"The second tier above standard: direct/indirect contact diseases, MDROs, single room or cohorting, gown and gloves, dedicated equipment, patient transport and room cleaning.","objectivesAr":["سمّ أمثلة أمراض التماس.","اشرح ترتيب لبس وخلع PPE.","علّق على نقل مريض التماس."],"objectivesEn":["Name contact-disease examples.","Explain PPE donning/doffing order.","Comment on transporting contact patients."],"refs":[{"source":"inf-transmission","n":2},{"source":"inf-transmission","n":3},{"source":"inf-transmission","n":4},{"source":"inf-transmission","n":5},{"source":"inf-transmission","n":6},{"source":"inf-transmission","n":8},{"source":"inf-transmission","n":9},{"source":"inf-transmission","n":10}],"galleryRefs":[{"source":"inf-transmission","n":7}],"evidence":[{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 2","text":"• Definition •Transmission-based precautions are the second tier of basic infection control. They are used for patients who are known or suspected to be infected or colonized with certain infectious agents that need additional control measures to prevent transmission. •They are always used in addition to Standard Precautions, never instead of them.","egyptian":"احتياطات الانتقال = الطابق الثاني بعد القياسية — للمرضى المؤكد أو المشتبه بعدوى تحتاج تدابير إضافية — وتستخدم مع القياسية دايمًا، مش بديل عنها."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 3","text":"• •Three types of transmission-based precautions have been developed: contact, droplet and airborne. •Some infections need a combination of precautions (e.g., chickenpox and disseminated zoster: airborne + contact).","egyptian":"3 أنواع: تماس Contact + رذاذ Droplet + هوائي Airborne — وبعض العدوى بتجمع أكتر من احتياط (الجديري والزوستر المنتشر: هوائي + تماس)."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 4","text":"• •Used for known or suspected infections that spread by direct or indirect contact with the patient or the patient's environment (room surfaces, equipment and objects). •Multidrug-resistant organisms (MDROs), colonized or infected: VRE, MRSA, ESBL, CRE, Candida auris. •Other examples: C. difficile and norovirus (soap- and-water hand hygiene preferred), scabies, acute viral conjunctivitis. Contact precautions","egyptian":"احتياط التماس: لأمراض بتنتشر بالتماس المباشر أو غير المباشر مع المريض أو بيئته — MDROs زي VRE وMRSA وESBL وCRE وCandida auris + C. difficile والنوروفيروس (غسل صابون وماء مفضل) + الجرب والتهاب الملتحمة الفيروسي."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 5","text":"• •In a single-patient room if available. •If not available: cohorting (patients with the same organism share a room). Patient placement","egyptian":"الوضع: غرفة مفردة لو متاحة + لو مش متاحة التجميع (نفس الميكروب يشاركوا غرفة)."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 6","text":"• •Gown and gloves •for all interactions that may involve contact with the patient or the patient's environment •Donning (put on): upon room entry •Doffing (remove): before exiting the room, then hand hygiene PPE","egyptian":"PPE للتماس: رداء وقفازات لكل تعامل可能 يمس المريض أو بيئته — اللبس عند الدخول والخلع قبل الخروج ثم نظافة اليدين."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 8","text":"• •Use disposable or dedicated patient-care equipment (e.g., blood pressure cuffs). •If common use of equipment for multiple patients is unavoidable, clean and disinfect it before use on another patient. Patient-care equipment","egyptian":"معدات المريض: استخدم معدات أحاديةUsage أو مخصصة (زي كفة الضغط) — ولو الاضطرار للمشاركة اغسل وطهر قبل مريض تاني."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 9","text":"• •Limit transport and movement to medically necessary purposes only. •Cover or contain the infected or colonized areas of the patient's body. •Remove and dispose of contaminated PPE and perform hand hygiene before leaving. •Don clean PPE to handle the patient at the destination. Transport and movement of patients","egyptian":"نقل مريض التماس: للضرورة الطبية فقط + غطِّ المناطق المصابة + انزع PPE الملوث ونظف إيديك قبل الخروج + البس PPE نضيف عند الوصول."},{"file":"3.Transmission based precautions 2027.pdf","loc":"Page 10","text":"• •Prioritize cleaning and disinfection: at least daily, or before use by another patient in outpatient settings. •Focus on frequently touched surfaces and equipment near the patient; use a hospital-approved disinfectant (sporicidal for C. difficile). Cleaning and disinfection of the rooms","egyptian":"تنظيف غرفة التماس: أولوية يومية أو قبل استخدام مريض تاني في العيادات + ركز على الأسطح الملموسة بكثرة + مطهر معتمد (سبوريسيدل للـ C. difficile)."}],"quiz":[{"type":"mcq","q":"Transmission-based precautions are used:","options":["In addition to standard precautions, never instead of them","Instead of standard precautions","Only after lab confirmation","Only in ICUs"],"answer":0,"why":"They are the second tier, always used in addition to standard precautions.","source":{"source":"inf-transmission","n":2},"points":1},{"type":"mcq","q":"Which organism list belongs under contact precautions?","options":["VRE, MRSA, ESBL, CRE, Candida auris","Influenza, mumps, rubella","Tuberculosis, measles, smallpox","Salmonella and cholera only"],"answer":0,"why":"Contact precautions cover MDROs: VRE, MRSA, ESBL, CRE and Candida auris among others.","source":{"source":"inf-transmission","n":4},"points":1}],"cards":[{"id":"8f58560feb","front":"What does the second tier mean?","back":"احتياطات الانتقال فوق القياسية دايمًا — معاها مش بدلها.","en":"Transmission-based precautions always IN ADDITION to standard precautions.","tag":"fact"},{"id":"7101d615b8","front":"Name contact precaution diseases","back":"MDROs (VRE وMRSA وESBL وCRE وCandida auris) + C. difficile والنوروفيروس والجرب والتهاب الملتحمة الفيروسي.","en":"MDROs (VRE, MRSA, ESBL, CRE, Candida auris), C. difficile, norovirus, scabies, viral conjunctivitis.","tag":"fact"},{"id":"7b9059bf2b","front":"Contact PPE and donning order","back":"رداء وقفازات عند الدخول — الخلع قبل الخروج ثم نظافة اليدين.","en":"Gown and gloves on entry; doff before exiting, then hand hygiene.","tag":"fact"},{"id":"0dff54e3fd","front":"Transmission-based precautions are used:","back":"In addition to standard precautions, never instead of them — They are the second tier, always used in addition to standard precautions.","en":"In addition to standard precautions, never instead of them","tag":"quiz"},{"id":"e5f50d22d8","front":"Which organism list belongs under contact precautions?","back":"VRE, MRSA, ESBL, CRE, Candida auris — Contact precautions cover MDROs: VRE, MRSA, ESBL, CRE and Candida auris among others.","en":"VRE, MRSA, ESBL, CRE, Candida auris","tag":"quiz"}],"midterm":[{"part":0,"n":56,"q":"Cohorting patients is appropriate when:","options":["Patients have the same infection type and similar risk levels","Patients have different infections and different risk levels","Patients have unrelated conditions","No infection-control measures are available"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q56","source":{"part":0,"qn":56}},{"part":0,"n":71,"q":"Contact precautions are intended to prevent infections transmitted through:","options":["Direct or indirect contact with the patient or the patient's environment","Large respiratory droplets only","Long-distance airborne particles only","Cont
