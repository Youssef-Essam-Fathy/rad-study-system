ses and required levels","back":"حرج ← تعقيم؛ شبه حرج ← تطهير عالي؛ غير حرج ← منخفض/متوسط.","en":"Critical → sterilization; semi-critical → high-level; non-critical → low/intermediate.","tag":"fact"},{"id":"ced7c15a40","front":"An antiseptic differs from a disinfectant because it:","back":"Is used on animate (living) surfaces — Antiseptic = animate surface; disinfectant = inanimate surface.","en":"Is used on animate (living) surfaces","tag":"quiz"},{"id":"da4d888aad","front":"Under Spaulding, transvaginal ultrasound probes are:","back":"Semi-critical requiring high-level disinfection — Semi-critical items touch mucous membranes and require high-level disinfection at minimum; a probe cover does not change the class.","en":"Semi-critical requiring high-level disinfection","tag":"quiz"}],"midterm":[{"part":0,"n":80,"q":"Which disinfectant is speciﬁcally recommended for environmental cleaning when dealing with C. difficile?","options":["Water only","A hospital-approved sporicidal disinfectant","Ordinary detergent without disinfection","Alcohol hand rub only"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q80","source":{"part":0,"qn":80}},{"part":0,"n":100,"q":"According to Spaulding classiﬁcation, a biopsy needle entering sterile tissue requires:","options":["High-level disinfection only","Low-level disinfection","Sterilization or a sterile single-use item","Intermediate-level disinfection"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q100","source":{"part":0,"qn":100}},{"part":0,"n":140,"q":"Which chemical agent is mentioned in the lecture as an example used for chemical disinfection?","options":["Barium sulfate","Sodium chloride","Glucose","Chlorine"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q140","source":{"part":0,"qn":140}},{"part":0,"n":141,"q":"Chemical disinfection is most appropriate for which type of waste?","options":["Liquid waste","Large pathological specimens only","Metallic implants","Radioactive sealed sources"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q141","source":{"part":0,"qn":141}},{"part":0,"n":152,"q":"Disinfection is a process that:","options":["Eliminates all microorganisms, including all bacterial spores","Removes only visible dirt","Eliminates radioactive contamination","Minimizes the number of microorganisms except bacterial spores"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q152","source":{"part":0,"qn":152}},{"part":0,"n":153,"q":"Sterilization is deﬁned as the process of:","options":["Killing bacteria but leaving viruses and fungi","Reducing microorganisms without affecting spores","Removing visible organic matter only","Eliminating all forms of microorganisms, including spores"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q153","source":{"part":0,"qn":153}},{"part":0,"n":154,"q":"Which statement correctly diCerentiates a disinfectant from an antiseptic?","options":["Both are used only on medical instruments","Disinfectants are used on animate surfaces, while antiseptics are used on inanimate surfaces","Disinfectants are used on inanimate surfaces, while antiseptics can be used on animate surfaces","Both are used only on intact skin"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q154","source":{"part":0,"qn":154}},{"part":0,"n":155,"q":"Which of the following is the highest level of disinfection described in the lecture?","options":["Low-level disinfection","Intermediate-level disinfection","Routine cleaning","High-level disinfection"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q155","source":{"part":0,"qn":155}},{"part":0,"n":156,"q":"High-level disinfection is effective against most microorganisms, including:","options":["Only ordinary bacteria","Only enveloped viruses","Bacteria, viruses, and fungi","Only bacterial spores"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q156","source":{"part":0,"qn":156}},{"part":0,"n":157,"q":"Which organism is speciﬁcally listed among the targets of high-level disinfection?","options":["Streptococcus only","Clostridium tetani spores only","Mycobacterium tuberculosis","Salmonella typhi only"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q157","source":{"part":0,"qn":157}},{"part":0,"n":158,"q":"Which of the following is an example of a high-level disinfectant?","options":["Soap and water","Glutaraldehyde","70% alcohol","Quaternary ammonium compounds"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q158","source":{"part":0,"qn":158}},{"part":0,"n":159,"q":"Which combination contains only high-level disinfectants listed in the lecture?","options":["Dettol, Sterillium, Cavicide","Alcohol, iodophors, soap and water","Phenolic compounds, alcohol, soap","Glutaraldehyde, hydrogen peroxide, peracetic acid"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q159","source":{"part":0,"qn":159}},{"part":0,"n":160,"q":"Intermediate-level disinfection is effective against most bacteria, viruses, and fungi, but it does NOT kill:","options":["Most fungi","Most viruses","Bacterial spores","Most bacteria"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q160","source":{"part":0,"qn":160}},{"part":0,"n":161,"q":"Which organism is listed in the lecture as a target of intermediate-level disinfection?","options":["Mycobacterium tuberculosis","Bacterial spores","Staphylococcus aureus","All highly resistant spores"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q161","source":{"part":0,"qn":161}},{"part":0,"n":162,"q":"Which concentration range of alcohol is listed for intermediate-level disinfection?","options":["10–20%","95–100%","30–40%","70–90%"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q162","source":{"part":0,"qn":162}},{"part":0,"n":163,"q":"Betadine is classiﬁed in the lecture under which disinfectant group?","options":["Iodophors","Quaternary ammonium compounds","Phenolic compounds","Glutaraldehyde"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q163","source":{"part":0,"qn":163}},{"part":0,"n":164,"q":"Low-level disinfection is effective against:","options":["Most bacteria and some viruses","All resistant microorganisms","All bacterial spores","Mycobacterium tuberculosis"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q164","source":{"part":0,"qn":164}},{"part":0,"n":165,"q":"Which of the following is NOT effectively targeted by low-level disinfection according to the lecture?","options":["Mycobacterium tuberculosis","Some fungi","Some viruses","Streptococcus"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q165","source":{"part":0,"qn":165}},{"part":0,"n":166,"q":"Which group contains examples of low-level disinfectants from the lecture?","options":["Hydrogen peroxide and glutaraldehyde","Alcohol and iodophors","Quaternary ammonium and phenolic compounds","Glutaraldehyde and peracetic acid"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q166","source":{"part":0,"qn":166}},{"part":0,"n":170,"q":"Spaulding classiﬁcation categorizes medical items according to:","options":["Their frequency of use only","The type of patient contact and the required level of processing","Their size","Their cost"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q170","source":{"part":0,"qn":170}},{"part":0,"n":171,"q":"Critical items are those that come into contact with:","options":["Intact skin only","Sterile tissue or the bloodstream","Clothing only","Mucous membranes only"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q171","source":{"part":0,"qn":171}},{"part":0,"n":172,"q":"What level of processing is required for critical items?","options":["Low-level disinfection","Intermediate-level disinfection","High-level disinfection only","Sterilization"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q172","source":{"part":0,"qn":172}},{"part":0,"n":173,"q":"Which of the following is classiﬁed as a critical item in radiology?","options":["MRI coil","Biopsy needle used under CT or ultrasound guidance","Abdominal ultrasound probe used on intact skin","CT examination table"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q173","source":{"part":0,"qn":173}},{"part":0,"n":175,"q":"Which of the following requires sterilization or a sterile single-use alternative?","options":["Lead apron","Interventional radiology instruments","MRI control panel","Examination table"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q175","source":{"part":0,"qn":175}},{"part":0,"n":176,"q":"Semi-critical items come into contact with:","options":["Mucous membranes or non-intact skin","Environmental surfaces only","Sterile tissue only","Intact skin only"],"answer":0,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q176","source":{"part":0,"qn":176}},{"part":0,"n":177,"q":"What is the minimum required processing level for semi-critical items?","options":["Intermediate-level disinfection","High-level disinfection","Routine cleaning only","Low-level disinfection"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q177","source":{"part":0,"qn":177}},{"part":0,"n":178,"q":"Which ultrasound probe is classiﬁed as semi-critical in the lecture?","options":["Probe used on the patient's intact abdominal skin only","Abdominal probe used on intact skin","Probe stored in the control room","Transvaginal probe"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q178","source":{"part":0,"qn":178}},{"part":0,"n":179,"q":"Which of the following is another example of a semi-critical radiology item?","options":["Lead apron","Examination table","HSG cannula","CT gantry"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q179","source":{"part":0,"qn":179}},{"part":0,"n":181,"q":"Does using a probe cover change the Spaulding classiﬁcation of an ultrasound probe?","options":["No, but cleaning is no longer required","Yes, it eliminates the need for disinfection","Yes, it changes a semi-critical probe into a non-critical item","No, the probe must still be disinfected according to its classification"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q181","source":{"part":0,"qn":181}},{"part":0,"n":182,"q":"Why should an ultrasound probe be disinfected after every patient even when a probe cover is used?","options":["Probe covers increase radiation exposure","Probe covers can leak","Probe covers destroy the probe","Probe covers are always radioactive"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q182","source":{"part":0,"qn":182}},{"part":0,"n":183,"q":"Non-critical items come into contact with:","options":["Mucous membranes","Sterile tissue","Bloodstream","Intact skin only"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q183","source":{"part":0,"qn":183}},{"part":0,"n":184,"q":"Which processing level is required for non-critical items?","options":["Sterilization in every case","High-level disinfection in every case","No cleaning or disinfection","Low- or intermediate-level disinfection"],"answer":3,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q184","source":{"part":0,"qn":184}},{"part":0,"n":185,"q":"Which of the following is a non-critical radiology item?","options":["Angiography catheter","Biopsy needle","Abdominal ultrasound probe used on intact skin","Transrectal ultrasound probe"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q185","source":{"part":0,"qn":185}},{"part":0,"n":186,"q":"Which group contains only non-critical radiology items listed in the lecture?","options":["HSG cannula, rectal tips, and transvaginal probes","Drainage catheters and contrast syringes","MRI coils, lead aprons, and cassettes","Biopsy needles, guidewires, and catheters"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q186","source":{"part":0,"qn":186}},{"part":0,"n":187,"q":"Which of the following is an example of a high-touch non-critical surface?","options":["Biopsy needle","Control panel","Drainage catheter","Angiography catheter"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q187","source":{"part":0,"qn":187}},{"part":0,"n":188,"q":"According to the lecture, a blood spill on a non-critical surface requires the disinfection level to be raised to:","options":["Low level","Intermediate level","Routine cleaning only","No disinfection"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q188","source":{"part":0,"qn":188}},{"part":0,"n":217,"q":"Which disinfectant property is speciﬁcally recommended when cleaning a room used by a patient with C. difficile?","options":["Fragrance only","Sporicidal activity","No disinfectant is needed","Detergent activity only"],"answer":1,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q217","source":{"part":0,"qn":217}},{"part":0,"n":239,"q":"After imaging a patient under contact precautions, which equipment should be cleaned and disinfected?","options":["Detector only","Patient's clothing only","Machine, table, and probes","Control panel only"],"answer":2,"why":"","type":"mcq","points":1,"label":"Midterm bank · Q239","source":{"part":0,"qn":239}}],"audios":[{"src":"Audio/INF-L4.mp3","title":"Infection control — lecture 4","start":0,"end":0}],"visuals":[{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 22","n":22,"asset":"images\\inf-waste\\page-22.png","path":"Assets/inf-waste/page-22.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 24","n":24,"asset":"images\\inf-waste\\page-24.png","path":"Assets/inf-waste/page-24.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 25","n":25,"asset":"images\\inf-waste\\page-25.png","path":"Assets/inf-waste/page-25.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 26","n":26,"asset":"images\\inf-waste\\page-26.png","path":"Assets/inf-waste/page-26.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 29","n":29,"asset":"images\\inf-waste\\page-29.png","path":"Assets/inf-waste/page-29.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 30","n":30,"asset":"images\\inf-waste\\page-30.png","path":"Assets/inf-waste/page-30.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 31","n":31,"asset":"images\\inf-waste\\page-31.png","path":"Assets/inf-waste/page-31.png"},{"source":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","loc":"Page 32","n":32,"asset":"images\\inf-waste\\page-32.png","path":"Assets/inf-waste/page-32.png"}]}],"sources":[{"id":"inf-chain","file":"1.Chain of infection.pdf","display":"Chain of infection","format":".pdf","records":[{"n":1,"text":"The Chain of infection Dr.Eman.A.Mahmoud Clinical microbiology & immunology Infection control consultant NLI","loc":"Page 1","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":2,"text":"•the process by which a pathogen spreads from one host to the next •There are six steps in the chain of infection .and transmission will only take place if all six links are intact.","loc":"Page 2","egyptian":"سلسلة العدوى = العملية اللي الممرض بينتشر بيها من عائل للتاني — 6 روابط، والانتقال مش بيحصل غير لو الـ 6 كاملين."},{"n":4,"text":"The pathogen (infectious agent ) •The first link in the chain of infection •Viruses •Bacteria •Fungi •Parasitic •Prions •How well any pathogen is able to thrive depends on three factors •Its pathogenicity – its ability to produce disease •Its degree of virulence – its severity or harmfulness •Its invasiveness – its tendency to spread","loc":"Page 4","egyptian":"الممرض أول رابط: فيروسات وبكتيريا وفطريات وطفيليات وبريونات — وقوته على إمراضه بتعتمد على: الـ Pathogenicity (قدرته على إحداث المرض) + الـ Virulence (شدته وخطورته) + الـ Invasiveness (ميله للانتشار)."},{"n":5,"text":"The reservoir •A reservoir is the principal habitat in which a pathogen lives, flourishes and is able to multiply. •Human reservoirs •Animal & insect reservoirs •Environmental reservoirs","loc":"Page 5","egyptian":"المستودع = الموطن الأساسي اللي الممرض يعيش ويتكاثر فيه: بن آدمي + حيواني وحشري + بيئي."},{"n":6,"text":"Human reservoirs •acute clinical cases: someone is infected and is displaying signs and symptoms of the disease •carriers someone has been colonized with an infectious agent but is not unwell Which one is more dangerous? The carrier","loc":"Page 6","egyptian":"المستودع البشري: حالات سريرية حادة (عنده أعراض) أو حاملون (مستعمرين بالممرض من غير ما يمرضوا) — الأكثر خطورة هو الحامل لأنه بينقل من غير أعراض تبان."},{"n":7,"text":"•Types of carrier: •Incubatory carriers – people who are infectious even before their own symptoms start ex:chicken pox •Inapparent (healthy )carriers – in which an individual is able to transmit an infection to others, without ever developing the infection themselves ex:typhoid •Convalescent carriers – people who are in the recovery phase of their illness but who continue to be infectious for a short-term days or weeks ex:measles •Chronic carriers – anyone who has recovered but who continues to be a carrier for infection for long-term, years and even the entire life. Ex:HBV&HCV","loc":"Page 7","egyptian":"أنواع الحاملين: حاضن Incubatory بينقل قبل ظهور أعراضه (الجديري المائي) + غير ظاهر Healthy بينقل من غير ما يمرض أبدًا (التيفود) + نقاهة Convalescent في طور التعافي بينقل أيام أو أسابيع (الحصبة) + مزمن Chronic بعد الشفاء بيظل حامل سنين أو العمر كله (HBV وHCV)."},{"n":8,"text":"Animal & insect reservoirs •Any infectious disease that is transmitted under natural conditions from animal to human is referred to as zoonosis. •Rabies (which is transmitted by dogs, cats, foxes and bats bites) •Lyme disease (which is transmitted via ticks) •Early Covid 19(which is transmitted by eating bats)","loc":"Page 8","egyptian":"الزونوزيس = عدوى بتنتقل طبيعيًا من الحيوان للإنسان: داء الكلب (عضات كلاب وقطط وثعالب وخفافيش) + لايم (قراد) + كوفيد المبكر (أكل خفافيش)."},{"n":9,"text":"Environmental reservoirs •soil (which acts as a reservoir for Clostridium tetani, the causative agent of tetanus) •Water,air-conditioning systems, swimming pools . ( reservoir for Legionella pneumophila, the causative agent of Legionnaire’s disease). •Moist places such as sink-traps, drains and flower vases , contact lens soloutions & even antiseptic solutions can harbour Pseudomonas.","loc":"Page 9","egyptian":"مستودعات بيئية: التربة (المطثية الكزازية) + المياه والتكييفات والمسابح (الليجيونيلا) + الأماكن الرطبة زي مصايد الأحواض والبالوعات ومحاليل العدسات وحتى المطهرات (الزوائف Pseudomonas)."},{"n":10,"text":"The portal of exit •The portal of exit is any route which enables a pathogen to leave the reservoir or host. •Alimentary – via vomiting, diarrhoea or biting •Genitourinary – via sexual transmission •Respiratory – through coughing, sneezing and talking •Skin – via skin lesions •Trans-placental – where transmission is from mother to foetus","loc":"Page 10","egyptian":"منفذ الخروج: هضمي (قيء وإسهال وعض) + بولي تناسلي (اتصال) + تنفسي (كحة وعطس وكلام) + جلد (آفات) + عبر المشيمة من الأم للجنين."},{"n":11,"text":"The mode of transmission •A) Direct Transmission: occurs when the disease agent contacts a vulnerable host directly, without the need of an intermediary host, objects, or substance. •Direct Contact with mm or skin(STDs, HIV/AIDS, scabies, skin and eye infections) •Contact with Contaminated Soil( tetanus) •Droplet Infection(during coughing, sneezing, speaking or spitting.as common cold) •Inoculation into Skin or Mucosa rabies virus by dog bites, hepatitis B through contaminated needles and syringes •Transplacental (vertical)(TORCH)","loc":"Page 11","egyptian":"الانتقال المباشر بدون وسيط: تلامس غشاء مخاطي أو جلد (STDs وHIV والجرب) + تربة ملوثة (الكزاز) + رذاذ مباشر (نزلة البرد) + تلقيح بالجلد (سعار بعضة كلب وHBV بإبرة ملوثة) + عبر المشيمة (TORCH)."},{"n":12,"text":"b)Indirect Transmission the 5Fs Plus Air Borne Transmission the 5Fs •Flies (vecror born) ex:plague •Fingers (typhoid fever, diarrhea, streptococcal infections) •Fomites (eye and skin infections) •Food (salmonella ,shigella) •Fluids (cholera) Air Borne Transmission contaminated infected nuclei of dust will be floating in the air Ex: SARS, measles, tuberculosis","loc":"Page 12","egyptian":"الانتقال غير المباشر = الـ 5Fs + الهوائي: الذباب Flies (طاعون) + الأصابع Fingers (تيفود وإسهال وستربتوكوكس) + الفوميت Fomites (عدوى عين وجلد) + الغذاء Food (سالمونيلا وشيجيلا) + السوائل Fluids (كوليرا) + النويات الرذاذة العائمة (SARS والحصبة والدرن)."},{"n":13,"text":"The portal of entry •The portal of entry is the means by which an infection is able to enter a susceptible host. •Inhalation (via the respiratory tract) •Absorption (via mucous membranes such as the eyes) •Ingestion (via the gastrointestinal tract) •Inoculation (as the result of an inoculation injury)","loc":"Page 13","egyptian":"منفذ الدخول: استنشاق (تنفسي) + امتصاص (أغشية مخاطية زي العين) + ابتلاع (هضمي) + تلقيح (إصابة إبرة)."},{"n":14,"text":"The susceptible host •How susceptible any host will be, depends on a variety of factors: •Their age – and in particular if they are very young or very old •presence of malnutrition or dehydration •Whether there is any underlying chronic disease •If the host suffers from immobility •If they are taking any medication which could disrupt or suppress their immune response •General resistance factors (such as mucous membranes, skin, cough reflex etc) that can help defend against infection","loc":"Page 14","egyptian":"العائل القابل: قابليته بتعتمد على السن (صغير جدًا أو كبير جدًا) + سوء تغذية وجفاف + أمراض مزمنة + عدم الحركة + أدوية مثبطة للمناعة + عوامل المقاومة العامة (أغشية مخاطية وجلد ومنعكس الكحة)."},{"n":17,"text":"Health care-associated infections (HCAIs) •are infections that occur while receiving health care, developed in a hospital or other health care facility that first appear 48 hours or more after hospital admission, or within 30 days after having received health care.","loc":"Page 17","egyptian":"عدوى الرعاية الصحية HCAI: عدوى بتظهر أثناء تلقي الرعاية — أول ظهور بعد 48 ساعة من الدخول أو خلال 30 يوم من استلام الرعاية."}],"visuals":[{"file":"images\\inf-chain\\page-1.png","loc":"Page 1","n":1,"path":"Assets/inf-chain/page-1.png"},{"file":"images\\inf-chain\\page-2.png","loc":"Page 2","n":2,"path":"Assets/inf-chain/page-2.png"},{"file":"images\\inf-chain\\page-3.png","loc":"Page 3","n":3,"path":"Assets/inf-chain/page-3.png"},{"file":"images\\inf-chain\\page-4.png","loc":"Page 4","n":4,"path":"Assets/inf-chain/page-4.png"},{"file":"images\\inf-chain\\page-5.png","loc":"Page 5","n":5,"path":"Assets/inf-chain/page-5.png"},{"file":"images\\inf-chain\\page-6.png","loc":"Page 6","n":6,"path":"Assets/inf-chain/page-6.png"},{"file":"images\\inf-chain\\page-7.png","loc":"Page 7","n":7,"path":"Assets/inf-chain/page-7.png"},{"file":"images\\inf-chain\\page-8.png","loc":"Page 8","n":8,"path":"Assets/inf-chain/page-8.png"},{"file":"images\\inf-chain\\page-9.png","loc":"Page 9","n":9,"path":"Assets/inf-chain/page-9.png"},{"file":"images\\inf-chain\\page-10.png","loc":"Page 10","n":10,"path":"Assets/inf-chain/page-10.png"},{"file":"images\\inf-chain\\page-11.png","loc":"Page 11","n":11,"path":"Assets/inf-chain/page-11.png"},{"file":"images\\inf-chain\\page-12.png","loc":"Page 12","n":12,"path":"Assets/inf-chain/page-12.png"},{"file":"images\\inf-chain\\page-13.png","loc":"Page 13","n":13,"path":"Assets/inf-chain/page-13.png"},{"file":"images\\inf-chain\\page-14.png","loc":"Page 14","n":14,"path":"Assets/inf-chain/page-14.png"},{"file":"images\\inf-chain\\page-15.png","loc":"Page 15","n":15,"path":"Assets/inf-chain/page-15.png"},{"file":"images\\inf-chain\\page-16.png","loc":"Page 16","n":16,"path":"Assets/inf-chain/page-16.png"},{"file":"images\\inf-chain\\page-17.png","loc":"Page 17","n":17,"path":"Assets/inf-chain/page-17.png"},{"file":"images\\inf-chain\\page-18.png","loc":"Page 18","n":18,"path":"Assets/inf-chain/page-18.png"},{"file":"images\\inf-chain\\page-19.png","loc":"Page 19","n":19,"path":"Assets/inf-chain/page-19.png"}]},{"id":"inf-standard","file":"2.Standard Precaution_1.pdf","display":"Standard precautions","format":".pdf","records":[{"n":1,"text":"Dr.Eman.A.Mahmoud Clinical microbiology & immunology Infection control consultant NLI","loc":"Page 1","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":2,"text":"• •standard Precautions are the minimum infection prevention practices that apply to all patient care, regardless of suspected or confirmed infection status of the patient, in any setting where health care is delivered","loc":"Page 2","egyptian":"الاحتياطات القياسية = الحد الأدنى لممارسات الوقاية المطبقة على كل مريض مهما كانت حالته المشتبهة أو المؤكدة، في أي مكان بتتقدم فيه الرعاية."},{"n":3,"text":"• •hand hygiene •respiratory hygiene and cough etiquette • patient placement •Personal protective equipment •aseptic technique •safe injections and sharps injury prevention • Environmental cleaning • handling of laundry and linen •waste management •Decontamination and reprocessing of reusable patient care items and equipment components","loc":"Page 3","egyptian":"مكوناتها: نظافة اليدين + آداب تنفسية + وضع المريض + معدات حماية شخصية PPE + تقنية معقمة + حقن آمنة ووقاية من الشارps + تنظيف بيئي + غسيل وأغطية + إدارة نفايات + إزالة تلوث وإعادة معالجة الأدوات."},{"n":4,"text":"• •Hand Hygiene includes cleaning hands with soap and water or alcohol-based hand rub in order to remove germs, •transmission of several key healthcare-associated pathogens including MRSA, VRE and Clostridium difficile. All these pathogens have been demonstrated to persist in the environment for days (in some cases months) Hand hygiene","loc":"Page 4","egyptian":"نظافة اليدين بغسل بالماء والصابون أو فرك بكحولي لإزالة الميكروبات — مسببات عدوى رئيسية زي MRSA وVRE وC. difficile بتعيش في البيئة أيام (وأحيانًا شهور)."},{"n":5,"text":"• When","loc":"Page 5","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":6,"text":"• •Before contact with a patient or patient environment this will protect the patient from harmful organisms carried on your hands. Before aseptic/clean procedure This prevents the patient’s own organisms from entering his or her body. Handling dressings or touching open wounds Performing invasive procedure","loc":"Page 6","egyptian":"لحظات الغسل (قبل): قبل التعامل مع مريض أو بيئته (تحمي المريض) + قبل إجراء معقم/نظيف (تمنع ميكروبات المريض نفسه تدخل جسمه) + عند التعامل مع ضمائد أو لمس جروح مفتوحة + قبل إجراءات باضة."},{"n":7,"text":"• •After body fluid exposure This can help protect yourself and the health care environment from harmful patient organisms. After contact with a patient/patient env Help protect yourself and the health care environment from harmful patient organisms","loc":"Page 7","egyptian":"لحظات الغسل (بعد): بعد التعرض لسوائل الجسم (تحميك وتحمي البيئة) + بعد التعامل مع مريض أو بيئته."},{"n":8,"text":"• Methods 1. Washing by soap and water. 2. Alcoholic hand rub after dirt removal. 3. Surgical hand scrub before surgery.","loc":"Page 8","egyptian":"طرق نظافة اليدين: غسل صابون وماء + فرك كحولي بعد إزالة الأوساخ + غسل جراحي Scrub قبل العمليات."},{"n":9,"text":"• Respiratory hygiene:","loc":"Page 9","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":10,"text":"• • Cover nose, mouth during cough, sneeze with tissue or upper sleeve • Discard tissue with respiratory secretion • Wear surgical mask in contact with patient with respiratory disease Respiratory hygiene:","loc":"Page 10","egyptian":"الآداب التنفسية: غطّ الأنف والفم عند الكحة والعطس بمنديل أو الأكمام + ارمِ المنديل الملوث بالإفرازات + البس كمامة جراحية عند التعامل مع مريض تنفسي."},{"n":11,"text":"• Single Patient Rooms :Recommended for: •Patients with known or suspected infections that are contagious (e.g., certain respiratory infections, draining wounds). •Patients requiring additional privacy or if their condition poses a risk to others. Patient placment","loc":"Page 11","egyptian":"وضع المريض: حجرات فردية للمعدى أو المشتبه عدواهم المعدية (عدوى تنفسية أو جروح نازة) ولمن يحتاج خصوصية أو يشكل خطرًا."},{"n":12,"text":"• •Cohorting Patients: can be done when: •Patients have the same infection type (e.g., same pathogen) and are at similar risk levels. •This approach can be useful during outbreaks but should be done with caution to prevent cross- contamination.","loc":"Page 12","egyptian":"التجميع Cohorting: مرضى بنفس العدوى ونفس مستوى الخطورة في غرفة واحدة — مفيد في الأوبئة بحذر لتجنب التلوث المتصالب."},{"n":13,"text":"• •Equipment used to protect person during deals with patient or its towels or secretions, or body fluids •Choice of PPE depends on type of infection between patient and health care worker and type of disease transmission •E.g. gloves, gown, surgical mask, goggles face shield, eye protector glasses. •Disposable PPE must be discarded in biohozand bags Personal protective equipment","loc":"Page 13","egyptian":"PPE: معدات بتحمي أثناء التعامل مع المريض أو إفرازاته وسوائله — الاختيار حسب نوع العدوى وطريقة انتقالها: قفازات ورداء وكمامة جراحية ونظارات واقية ودرع وجه — والـ PPE الأحاديUsage يترمي في أكياس البيوهزارد."},{"n":14,"text":"• •Aseptic technique is a fundamental practice in healthcare that aims to prevent contamination and reduce the risk of infection during medical procedures. Aseptic technique","loc":"Page 14","egyptian":"التقنية المعقمة: ممارسة أساسية هدفها منع التلوث وتقليل خطر العدوى أثناء الإجراءات الطبية."},{"n":15,"text":"• •Use new needle and syringe in every medication vial. • Skin at site of injection is rubbed by antiseptic. • Preparation of medicine in a clean areas. • Medication vials septum are disinfected before use. • Wear disposal gloves during injection. •New needle and syringe for every patient. Safe injection practice","loc":"Page 15","egyptian":"الحقن الآمن: إبرة وسرنجة جديدة لكل دواء + تطهير جلد موضع الحقن بمطهر + تحضير الدواء في مكان نظيف + تطهير سدادة القارورة + قفازات + إبرة وسرنجة جديدة لكل مريض."},{"n":16,"text":"• •Use a medication vials for one patient only if possible. •Don’t use the same syringes between patients even you changed the needle. • Don’t use the same syringes used to infuse medication into an IV tubing port for anther patients. • Hand hygiene during injection and medication preparation. •Needles, syringes are discarded into sharp containers as biohazard.","loc":"Page 16","egyptian":"قواعد إضافية: القارورة لمريض واحد لو أمكن + ممنوع نفس السرنجة بين المرضى حتى لو غيرت الإبرة + ممنوع استخدام سرنجات خط الوريد لمريض تاني + نظافة يدين أثناء التحضير + الإبر والسرنجات تترمى في حاويات الشارps كبيوهزارد."},{"n":17,"text":"• •Used needle should be discarded immediately and not recapped, or cut, removed from syringe. •Any needles or sharps should be places in a leak proof puncture resistant container. •The container to be filed to 2/3 only not more than discarded as biohazard label. Needle stick and sharps injury prevention","loc":"Page 17","egyptian":"وقاية الإبر: الإبرة المستخدمة تترمى فورًا بدون إعادة غطاء أو كسر أو فصل من السرنجة + في حاوية مانعة للتسرب والثقب + لحد ثلثيها فقط + كيس بيوهزارد."},{"n":18,"text":"• •Removal of dirt, organic mater. •Use detergent, disinfection. •Allow air to dry the area or item Environmental cleaning","loc":"Page 18","egyptian":"التنظيف البيئي: إزالة الأوساخ والمادة العضوية بمادة منظفة ومطهرة + ترك الهواء يجفف السطح أو الأداة."},{"n":19,"text":"• •Effective handling of laundry and linen is vital in controlling infection in healthcare settings. •reduce the risk of cross-contamination and protect both patients and healthcare workers •By appropriate segregation, transportation, laundering, and storage handling of laundry and linen","loc":"Page 19","egyptian":"الغسيل والأغطية: التعامل الصحيح بيقلل التلوث المتصالب ويحمي المريض والعاملين — بالفصل الصحيح والنقل والغسيل والتخزين."},{"n":20,"text":"• Safety boxes resistant for puncture and leak are used then when filled to 2/3 they are transported after closing and labeling as biohazard material to be discarded. Other disposable PPE, b body, body fluid polluted items are discarded in biohazard bags resistant to leaks and puncture and labeled to be discarded. Waste disposal","loc":"Page 20","egyptian":"التخلص من النفايات: صناديق أمان مقاومة للثقب والتسرب تمتلئ لحد التلتين وتنقل مقفولة ومسماه كبيوهزارد + الـ PPE والمتأثر بسوائل الجسم في أكياس بيوهزارد مقاومة ومسماه."},{"n":21,"text":"•","loc":"Page 21","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":22,"text":"• •Reprocessing includes cleaning, disinfecting, and sterilizing reusable items to make them safe for patient use. •Sterilization This is the complete elimination of all microorganisms, including spores, usually performed on critical items (those that enter sterile tissue). Decontamination and reprocessing of reusable patient care items and equipment","loc":"Page 22","egyptian":"إعادة المعالجة = تنظيف + تطهير + تعقيم للأدوات القابلة لإعادة الاستخدام — والتعقيم قتل كل الميكروبات بما فيها الأبواغ للأدوات الحرجة الداخلة لنسيج معقم."}],"visuals":[{"file":"images\\inf-standard\\page-1.png","loc":"Page 1","n":1,"path":"Assets/inf-standard/page-1.png"},{"file":"images\\inf-standard\\page-2.png","loc":"Page 2","n":2,"path":"Assets/inf-standard/page-2.png"},{"file":"images\\inf-standard\\page-3.png","loc":"Page 3","n":3,"path":"Assets/inf-standard/page-3.png"},{"file":"images\\inf-standard\\page-4.png","loc":"Page 4","n":4,"path":"Assets/inf-standard/page-4.png"},{"file":"images\\inf-standard\\page-5.png","loc":"Page 5","n":5,"path":"Assets/inf-standard/page-5.png"},{"file":"images\\inf-standard\\page-6.png","loc":"Page 6","n":6,"path":"Assets/inf-standard/page-6.png"},{"file":"images\\inf-standard\\page-7.png","loc":"Page 7","n":7,"path":"Assets/inf-standard/page-7.png"},{"file":"images\\inf-standard\\page-8.png","loc":"Page 8","n":8,"path":"Assets/inf-standard/page-8.png"},{"file":"images\\inf-standard\\page-9.png","loc":"Page 9","n":9,"path":"Assets/inf-standard/page-9.png"},{"file":"images\\inf-standard\\page-10.png","loc":"Page 10","n":10,"path":"Assets/inf-standard/page-10.png"},{"file":"images\\inf-standard\\page-11.png","loc":"Page 11","n":11,"path":"Assets/inf-standard/page-11.png"},{"file":"images\\inf-standard\\page-12.png","loc":"Page 12","n":12,"path":"Assets/inf-standard/page-12.png"},{"file":"images\\inf-standard\\page-13.png","loc":"Page 13","n":13,"path":"Assets/inf-standard/page-13.png"},{"file":"images\\inf-standard\\page-14.png","loc":"Page 14","n":14,"path":"Assets/inf-standard/page-14.png"},{"file":"images\\inf-standard\\page-15.png","loc":"Page 15","n":15,"path":"Assets/inf-standard/page-15.png"},{"file":"images\\inf-standard\\page-16.png","loc":"Page 16","n":16,"path":"Assets/inf-standard/page-16.png"},{"file":"images\\inf-standard\\page-17.png","loc":"Page 17","n":17,"path":"Assets/inf-standard/page-17.png"},{"file":"images\\inf-standard\\page-18.png","loc":"Page 18","n":18,"path":"Assets/inf-standard/page-18.png"},{"file":"images\\inf-standard\\page-19.png","loc":"Page 19","n":19,"path":"Assets/inf-standard/page-19.png"},{"file":"images\\inf-standard\\page-20.png","loc":"Page 20","n":20,"path":"Assets/inf-standard/page-20.png"},{"file":"images\\inf-standard\\page-21.png","loc":"Page 21","n":21,"path":"Assets/inf-standard/page-21.png"},{"file":"images\\inf-standard\\page-22.png","loc":"Page 22","n":22,"path":"Assets/inf-standard/page-22.png"}]},{"id":"inf-transmission","file":"3.Transmission based precautions 2027.pdf","display":"Transmission-based precautions","format":".pdf","records":[{"n":1,"text":"Dr.Eman.A.Mahmoud Clinical microbiology & immunology Infection control consultant NLI","loc":"Page 1","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":2,"text":"• Definition •Transmission-based precautions are the second tier of basic infection control. They are used for patients who are known or suspected to be infected or colonized with certain infectious agents that need additional control measures to prevent transmission. •They are always used in addition to Standard Precautions, never instead of them.","loc":"Page 2","egyptian":"احتياطات الانتقال = الطابق الثاني بعد القياسية — للمرضى المؤكد أو المشتبه بعدوى تحتاج تدابير إضافية — وتستخدم مع القياسية دايمًا، مش بديل عنها."},{"n":3,"text":"• •Three types of transmission-based precautions have been developed: contact, droplet and airborne. •Some infections need a combination of precautions (e.g., chickenpox and disseminated zoster: airborne + contact).","loc":"Page 3","egyptian":"3 أنواع: تماس Contact + رذاذ Droplet + هوائي Airborne — وبعض العدوى بتجمع أكتر من احتياط (الجديري والزوستر المنتشر: هوائي + تماس)."},{"n":4,"text":"• •Used for known or suspected infections that spread by direct or indirect contact with the patient or the patient's environment (room surfaces, equipment and objects). •Multidrug-resistant organisms (MDROs), colonized or infected: VRE, MRSA, ESBL, CRE, Candida auris. •Other examples: C. difficile and norovirus (soap- and-water hand hygiene preferred), scabies, acute viral conjunctivitis. Contact precautions","loc":"Page 4","egyptian":"احتياط التماس: لأمراض بتنتشر بالتماس المباشر أو غير المباشر مع المريض أو بيئته — MDROs زي VRE وMRSA وESBL وCRE وCandida auris + C. difficile والنوروفيروس (غسل صابون وماء مفضل) + الجرب والتهاب الملتحمة الفيروسي."},{"n":5,"text":"• •In a single-patient room if available. •If not available: cohorting (patients with the same organism share a room). Patient placement","loc":"Page 5","egyptian":"الوضع: غرفة مفردة لو متاحة + لو مش متاحة التجميع (نفس الميكروب يشاركوا غرفة)."},{"n":6,"text":"• •Gown and gloves •for all interactions that may involve contact with the patient or the patient's environment •Donning (put on): upon room entry •Doffing (remove): before exiting the room, then hand hygiene PPE","loc":"Page 6","egyptian":"PPE للتماس: رداء وقفازات لكل تعامل可能 يمس المريض أو بيئته — اللبس عند الدخول والخلع قبل الخروج ثم نظافة اليدين."},{"n":8,"text":"• •Use disposable or dedicated patient-care equipment (e.g., blood pressure cuffs). •If common use of equipment for multiple patients is unavoidable, clean and disinfect it before use on another patient. Patient-care equipment","loc":"Page 8","egyptian":"معدات المريض: استخدم معدات أحاديةUsage أو مخصصة (زي كفة الضغط) — ولو الاضطرار للمشاركة اغسل وطهر قبل مريض تاني."},{"n":9,"text":"• •Limit transport and movement to medically necessary purposes only. •Cover or contain the infected or colonized areas of the patient's body. •Remove and dispose of contaminated PPE and perform hand hygiene before leaving. •Don clean PPE to handle the patient at the destination. Transport and movement of patients","loc":"Page 9","egyptian":"نقل مريض التماس: للضرورة الطبية فقط + غطِّ المناطق المصابة + انزع PPE الملوث ونظف إيديك قبل الخروج + البس PPE نضيف عند الوصول."},{"n":10,"text":"• •Prioritize cleaning and disinfection: at least daily, or before use by another patient in outpatient settings. •Focus on frequently touched surfaces and equipment near the patient; use a hospital-approved disinfectant (sporicidal for C. difficile). Cleaning and disinfection of the rooms","loc":"Page 10","egyptian":"تنظيف غرفة التماس: أولوية يومية أو قبل استخدام مريض تاني في العيادات + ركز على الأسطح الملموسة بكثرة + مطهر معتمد (سبوريسيدل للـ C. difficile)."},{"n":11,"text":"• •Prevent transmission of diseases spread by infectious respiratory particles that stay suspended in the air and are inhaled, even far from the source (traditionally droplet nuclei < 5 µm •Examples: tuberculosis, measles, chickenpox and disseminated zoster, smallpox. COVID-19 Airborne precautions","loc":"Page 11","egyptian":"الهوائي: عدوى بتنتقل بجزيئات تنفسية معلقة بته وتستنشق من مسافات بعيدة (نويات رذاذة أقل من 5 ميكرون) — أمثلة: الدرن والحصبة والجديري والزوستر المنتشر والجدري وكوفيد."},{"n":12,"text":"• •In an airborne infection isolation room (AIIR) with negative air pressure; mask the patient if they must leave the room. •Limited resources: mask the patient in a private room with the door closed until transfer to an AIIR facility or return home. •Restrict susceptible healthcare personnel from entering (measles, chickenpox, disseminated zoster, smallpox) if immune staff are available. Patient placement","loc":"Page 12","egyptian":"وضع الهوائي: غرفة عزل AIIR ضغط سلبي + كمامة للمريض لو لازم يخرج + لو الموارد محدودة كمامة في غرفة خاصة بابها مقفول + امنع العاملين غير المحصنين (حصبة وجديري وزوستر وجدري)."},{"n":13,"text":"•","loc":"Page 13","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":14,"text":"• •Wear a fit-tested NIOSH-approved N95 (or higher / equivalent FFP2) respirator before entering the patient's room. •Remove the respirator after leaving the room and closing the door. •Then perform hand hygiene. PPE","loc":"Page 14","egyptian":"PPE الهوائي: كمامة N95 معتمدة NIOSH (أو FFP2) مختبرة القياس قبل دخول الغرفة + تنزع بعد الخروج وقفل الباب + بعدها نظافة اليدين."},{"n":15,"text":"•","loc":"Page 15","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":17,"text":"• •Limit transport and movement to medically necessary purposes. •Instruct the patient to wear a surgical mask and observe cough etiquette. •Plan transport to limit exposure of others (e.g., no waiting in reception areas, empty elevator). •Transport staff need no mask or respirator if the patient is masked and skin lesions are covered. Transport and movement of patients","loc":"Page 17","egyptian":"نقل الهوائي: للضرورة فقط + كمامة جراحية للمريض مع آداب الكحة + خطط النقل لتقليل تعرض الآخرين (ممنوع الانتظار في الاستقبال + مصعد فاضي) + طاقم النقل مش محتاج كمامة لو المريض مكمم والآفات مغطاة."},{"n":18,"text":"• •Routine cleaning of high-touch surfaces is standard. •Environmental services personnel should wear an N95 respirator on room entry. •After the patient has left, the room should remain unoccupied for enough time to allow for complete air exchange (1 hour or less, depending on the air handling capacity of the facility). Cleaning and disinfection of the rooms","loc":"Page 18","egyptian":"تنظيف الهوائي: تنظيف روتيني للأسطح الملموسة + عامل النظافة يلبس N95 + بعد خروج المريض تفضل الغرفة فاضية وقت كافٍ لتبادل الهواء كامل (ساعة أو أقل حسب التهوية)."},{"n":19,"text":"• •Prevent transmission of diseases spread by large respiratory droplets (particles > 5 µm) that travel only short distances (about 1–2 m / 3–6 ft) before falling. •They are produced when the infected patient talks, coughs, or sneezes, and during some procedures (e.g., suctioning, bronchoscopy). •Examples: seasonal influenza, pertussis, mumps, rubella, adenovirus, rhinovirus, Neisseria meningitidis. Droplet precautions","loc":"Page 19","egyptian":"الرذاذ: قطرات كبيرة أكبر من 5 ميكرون بتقطع مسافة قصيرة (1-2م) قبل ما تقع — بتنتج بالكلام والكحة والعطس وإجراءات زي الشفط والمنظار — أمثلة: الإنفلونزا الموسمية والسعال الديكي والنكاف والحصبة الألمانية والأدينوفيروس والرينوفيروس والنيسرية السحائية."},{"n":20,"text":"• •A single-patient room is preferred; if unavailable, patients with the same infection may share a room. •Separate beds by at least 1 m (3 ft); many facilities use 2 m (6 ft). Patient placement","loc":"Page 20","egyptian":"وضع الرذاذ: غرفة مفردة أفضل ولو مش متاح مشاركة نفس العدوى + سراير متباعدة متر على الأقل وكثير من الأماكن بيستخدموا 2م."},{"n":21,"text":"• •Wear a surgical mask when entering the room; also put a mask on the patient. •Add eye protection, gloves and gown per Standard Precautions if splash risk. •For aerosol-generating procedures, wear an N95. PPE","loc":"Page 21","egyptian":"PPE الرذاذ: كمامة جراحية عند دخول الغرفة + كمامة للمريض كمان + حماية عين وقفازات ورداء حسب القياسية لو خطر الرشاش + N95 للإجراءات المولدة للرذاذ."},{"n":23,"text":"• •Limit the movement and transport of the patient to medically necessary purposes. The patient should wear a surgical mask during transport and follow respiratory hygiene and cough etiquette. Transport and movement of patients","loc":"Page 23","egyptian":"نقل الرذاذ: للضرورة فقط + كمامة جراحية للمريض مع آداب تنفسية."},{"n":24,"text":"• •Daily cleaning of high-touch and horizontal surfaces with a hospital-approved disinfectant. •Environmental services personnel should don a surgical mask before room entry. Cleaning and disinfection of the rooms","loc":"Page 24","egyptian":"تنظيف الرذاذ: يومي للأسطح الملموسة والأفقية بمطهر معتمد + كمامة جراحية لعامل النظافة قبل الدخول."},{"n":25,"text":"• •Notify the radiology department before the patient arrives; keep the isolation sign in place. •Prefer portable imaging in the patient's room. If the patient must come, go straight in (no waiting area), ideally at the end of the list. •Contact: gown and gloves, disposable cover for the detector or cassette, then clean and disinfect the machine, table and probes. •Droplet: surgical mask for patient and staff. Airborne: masked patient, N95 for staff, room kept empty until the air has cleared. •Hand hygiene before and after every patient; remove PPE before leaving the room. Radiology","loc":"Page 25","egyptian":"الأشعة: بلغ القسم قبل وصول المريض + فضّل التصوير المحمول في غرفته + لو لازم يجي يدخل على طول (بدون انتظار) ويفضل آخر القائمة + تماس: رداء وقفازات وغطاء أحاديUsage للكاشف + تطهير الجهاز والطاولة بعده + رذاذ: كمامة للمريض والطاقم + هوائي: مريض مكمم وN95 للطاقم والغرفة تفضل فاضية لتهويتها + نظافة يدين قبل وبعد كل مريض."},{"n":26,"text":"• •Contact: adenoviral conjunctivitis spreads easily, so use gloves and hand hygiene, and never share eye-drop bottles. •Clean slit-lamp chin and forehead rests, handles and other touched surfaces between patients; use a breath shield. •Use single-use or disinfected tonometer tips, trial lenses and diagnostic contact lenses, per the manufacturer's instructions. •Droplet: patient with cough or fever wears a surgical mask, stays 1–2 m from others, and non-urgent exams are postponed. •See suspected infectious cases at the end of the session and clean the room afterwards. Optometry","loc":"Page 26","egyptian":"البصريات: التهاب الملتحمة الأدينوفيريسي شديد العدوى — قفازات ونظافة يدين وممنوع مشاركة قطرات العين + نظف ذقن وجبهة المصباح الشقي والمقابض بين المرضى + درع تنفس + أطرابوس ترمومتر وعدسات أحاديةUsage + رذاذ: كمامة للمريض وتباعد 1-2م وتأجيل غير الطارئ + الحالات المشتبهة آخر الجلسة وتنظيف بعدها."},{"n":27,"text":"• •CDC. Transmission-Based Precautions, Infection Control guidance for healthcare providers (page reviewed April 2024). •CDC/HICPAC. Guideline for Isolation Precautions: Preventing Transmission of Infectious Agents in Healthcare Settings (2007). •WHO. Global technical consultation report on proposed terminology for pathogens that transmit through the air (April 2024). Sources","loc":"Page 27","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":28,"text":"• Any questions?","loc":"Page 28","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."}],"visuals":[{"file":"images\\inf-transmission\\page-1.png","loc":"Page 1","n":1,"path":"Assets/inf-transmission/page-1.png"},{"file":"images\\inf-transmission\\page-2.png","loc":"Page 2","n":2,"path":"Assets/inf-transmission/page-2.png"},{"file":"images\\inf-transmission\\page-3.png","loc":"Page 3","n":3,"path":"Assets/inf-transmission/page-3.png"},{"file":"images\\inf-transmission\\page-4.png","loc":"Page 4","n":4,"path":"Assets/inf-transmission/page-4.png"},{"file":"images\\inf-transmission\\page-5.png","loc":"Page 5","n":5,"path":"Assets/inf-transmission/page-5.png"},{"file":"images\\inf-transmission\\page-6.png","loc":"Page 6","n":6,"path":"Assets/inf-transmission/page-6.png"},{"file":"images\\inf-transmission\\page-7.png","loc":"Page 7","n":7,"path":"Assets/inf-transmission/page-7.png"},{"file":"images\\inf-transmission\\page-8.png","loc":"Page 8","n":8,"path":"Assets/inf-transmission/page-8.png"},{"file":"images\\inf-transmission\\page-9.png","loc":"Page 9","n":9,"path":"Assets/inf-transmission/page-9.png"},{"file":"images\\inf-transmission\\page-10.png","loc":"Page 10","n":10,"path":"Assets/inf-transmission/page-10.png"},{"file":"images\\inf-transmission\\page-11.png","loc":"Page 11","n":11,"path":"Assets/inf-transmission/page-11.png"},{"file":"images\\inf-transmission\\page-12.png","loc":"Page 12","n":12,"path":"Assets/inf-transmission/page-12.png"},{"file":"images\\inf-transmission\\page-13.png","loc":"Page 13","n":13,"path":"Assets/inf-transmission/page-13.png"},{"file":"images\\inf-transmission\\page-14.png","loc":"Page 14","n":14,"path":"Assets/inf-transmission/page-14.png"},{"file":"images\\inf-transmission\\page-15.png","loc":"Page 15","n":15,"path":"Assets/inf-transmission/page-15.png"},{"file":"images\\inf-transmission\\page-16.png","loc":"Page 16","n":16,"path":"Assets/inf-transmission/page-16.png"},{"file":"images\\inf-transmission\\page-17.png","loc":"Page 17","n":17,"path":"Assets/inf-transmission/page-17.png"},{"file":"images\\inf-transmission\\page-18.png","loc":"Page 18","n":18,"path":"Assets/inf-transmission/page-18.png"},{"file":"images\\inf-transmission\\page-19.png","loc":"Page 19","n":19,"path":"Assets/inf-transmission/page-19.png"},{"file":"images\\inf-transmission\\page-20.png","loc":"Page 20","n":20,"path":"Assets/inf-transmission/page-20.png"},{"file":"images\\inf-transmission\\page-21.png","loc":"Page 21","n":21,"path":"Assets/inf-transmission/page-21.png"},{"file":"images\\inf-transmission\\page-22.png","loc":"Page 22","n":22,"path":"Assets/inf-transmission/page-22.png"},{"file":"images\\inf-transmission\\page-23.png","loc":"Page 23","n":23,"path":"Assets/inf-transmission/page-23.png"},{"file":"images\\inf-transmission\\page-24.png","loc":"Page 24","n":24,"path":"Assets/inf-transmission/page-24.png"},{"file":"images\\inf-transmission\\page-25.png","loc":"Page 25","n":25,"path":"Assets/inf-transmission/page-25.png"},{"file":"images\\inf-transmission\\page-26.png","loc":"Page 26","n":26,"path":"Assets/inf-transmission/page-26.png"},{"file":"images\\inf-transmission\\page-27.png","loc":"Page 27","n":27,"path":"Assets/inf-transmission/page-27.png"},{"file":"images\\inf-transmission\\page-28.png","loc":"Page 28","n":28,"path":"Assets/inf-transmission/page-28.png"}]},{"id":"inf-waste","file":"4.Medical waste management& steriliz summary.pdf","display":"Medical waste management and sterilization","format":".pdf","records":[{"n":1,"text":"Medical waste management DR.EMAN.A.MAHMOUD CLINICAL MICROBIOLOGY & IMMUNOLOGY INFECTION CONTROL CONSULTANT NLI","loc":"Page 1","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":2,"text":"chem ical Types of medical waste:","loc":"Page 2","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":3,"text":"Associated Diseases: •VIRUSES: HIV, Hepatitis B, Hepatitis A,C& Ocular infection •transmitted through Infected needles, body Fluids, Human excreta, Blood, body fluids, Eye secretion •BACTERIA: Salmonella typhi, cholerae, Clostridium Tetani, Pseudomonas,, skin and soft tissue infections • can be transmitted through Human excreta and body fluid in hospital wards, Sharps such as needles, surgical blades in hospital waste. •PARASITES: Malaria, Cutaneous leishmaniasis, Filariasis, •can be transmitted through Human excreta, blood and body fluids in poorly managed sewage system.","loc":"Page 3","egyptian":"أمراض مرتبطة بالنفايات: فيروسات (HIV والتهاب B وA وC وعدوى عينية عبر الإبر والسوائل) + بكتيريا (تيفoid وكوليرا وكزاز وزوائف وعدوى جلد عبر الفضلات والشارps) + طفيليات (ملاريا وليشمانيا وفيلاريا عبر صرف صحي سيئ)."},{"n":4,"text":"Radioactive Wastes •Produced as a result of: •in-vitro analysis of body tissue and fluid (PET using FDG) • in-vivo organ imaging and tumor localization (PET/CT Fluorine-18) •therapeutic practices (radiotherapy for tumor) •Some have relatively short half-lives causing them to lose activity quickly (e.g., technitium-99m – 6 hours; iodine-123 – 13 hours; phosphorus-32 – 14 days) • Others have long half-lives (carbon-14 – 5730 years)","loc":"Page 4","egyptian":"النفايات المشعة بتنتج عن: تحاليل معملية (PET بالـ FDG) + تصوير أعضاء وتحديد أورام (PET/CT فلور-18) + علاج إشعاعي — بعضها نصف عمر قصير (تكنيشيوم-99m ست ساعات ويود-123 ثلاثة عشرة ساعة وفوسفور-32 أربعة عشر يوم) وغيرها طويل (كربون-14 ‏5730 سنة)."},{"n":5,"text":"Health Risks of Radioactive Waste •Health impacts determined by type and extent of exposure to ionizing radiation •Chromosomal damage • Headaches, dizziness, vomiting • Tissue destruction, hemorrhage, hair loss, diarrhea • death at high doses","loc":"Page 5","egyptian":"مخاطر المشع تتحدد بنوع ومدى التعرض: تكسير كروموسومي + صداع ودوخ وقيان + تدمير نسيج ونزف وسقوط شعر وإسهال + الموت بجرعات عالية."},{"n":6,"text":"Medical waste management plan","loc":"Page 6","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":7,"text":"separation /Sorting •into color coded bags at the place where it is generated. •should be at the point of origin by the individuals most knowledgeable about the waste's origin and its hazard potential •Most errors in the medical waste management system occur at the segregation point","loc":"Page 7","egyptian":"الفصل/الفرز: في أكياس مرمزة الألوان في مكان توليد النفاية نفسه — من أهل الخبرة بخطرها — ومعظم أخطاء نظام الإدارة بيحصلوا عند نقطة الفرز."},{"n":9,"text":"separation of Radioactive Waste •based on : •• Half-life •• Activity and radionuclide content •• Physical and chemical form –","loc":"Page 9","egyptian":"فصل النفايات المشعة حسب: نصف العمر + النشاط والمحتوى النويدى + الشكل الفيزيائي والكيميائي."},{"n":10,"text":"Containers and labeling On every label Isotope, activity, date stored, initials and dose rate Radiation symbol Visible trefoil on container and bag Separate by half-life Short-lived waste never mixed with long- lived waste Lids and seals Closed containers; no loose waste","loc":"Page 10","egyptian":"الترميز: على كل ملصق النظير والنشاط وتاريخ التخزين والأحرف الأولى ومعدل الجرعة + رمز الإشعاع (التريفويل) ظاهر على الحاوية والكيس + افصل حسب نصف العمر (القصير عمر مش يتخلط بالطويل) + حاويات مقفولة من غير نفايات سايبة."},{"n":11,"text":"II. Handling •is collecting and transporting waste within the facility. •Staff involved in handling should be vaccinated against HBV& tetanus. •Housekeepers should wear heavy utility gloves and eye protection during cleaning of the containers. •Plastic bags Should be impervious, tear resistant •Sharps containers should be puncture-resistant, leak proof on the sides and bottom, and closable. •containers should be discarded when they are 2/3 full or at least once per day; sealed, lifted by the top.","loc":"Page 11","egyptian":"التداول: جمع ونقل داخل المنشأة — العاملون مطعمين HBV وكزاز + قفازات ثقيلة وحماية عين أثناء تنظيف الحاويات + أكياس بلاستيك مانعة ومقاومة للتمزق + حاويات الشارps مقاومة للثقب والتسرب وقابلة للقفل + تترمى لما تتملك ثلثين أو مرة يوميًا على الأقل وتتنقل من الأعلى."},{"n":12,"text":"III. Transport of medical waste •three types : •Collection from the immediate generating area and transport to the temporary storage area on the generating unit. •Transport from the temporary storage area on the generating unit to the long term central collection and storage area. •Transport from the facility to a treatment or disposal site. •Transportation should be done in sealed container/sanitation supervisor should ensure for leakage.","loc":"Page 12","egyptian":"النقل 3 أنواع: من مكان التوليد للتخزين المؤقت في الوحدة + من المؤقت للتخزين المركزي طويل الأمد + من المنشأة لموقع المعالجة أو التخلص — في حاويات مقفولة ومشرف الصرف يتأكد من عدم التسرب."},{"n":13,"text":"IV. Interim storage: •Interim storage is storing waste within the facility until it can be transported for final disposal. •Waste should not be stored in the generation area for more than a period of 48 hours","loc":"Page 13","egyptian":"التخزين المؤقت: تخزين داخل المنشأة لحين النقل النهائي — النفايات مش تفضل في مكان التوليد أكتر من 48 ساعة."},{"n":14,"text":"The waste storage room The room • Locked, restricted access • Radiation trefoil sign on door • Shielded walls and floor as required • Ventilated and fire-resistant Inside the room • Shielded, labeled containers • Separate bins by isotope and half-life • Spill tray under liquid waste • Survey meter kept nearby","loc":"Page 14","egyptian":"غرفة التخزين: مقفولة بدخول مقيد + علامة الإشعاع على الباب + حوائط وأرضيات محجوبة حسب الحاجة + تهوية ومقاومة حريق — جواها: حاويات محجوبة ومسماه + فصل بالنظير ونصف العمر + صينية تنقيط تحت السوائل + مقياس مسح قريب."},{"n":15,"text":"V. Treatment & Disposal •General waste should be dumped at municipal dumping site. Sanitation officer should be responsible for proper coordination between municipal and hospital •Other wastes managed by different technologies according to their types •Treatment technologies •1.Incineration •2.Chemical Disinfection •3.Wet and dry thermal treatment •4.Microwave irradiation •5.Land disposal •6. Decay in Storage","loc":"Page 15","egyptian":"المعالجة والتخلص: العامة لمكب البلدية بتنسيق مسؤول الصرف — والباقي حسب النوع: حرق + تطهير كيميائي + معالجة حرارية رطبة وجافة + ميكروويف + دفن أرضي + التخزين للتحلل."},{"n":16,"text":"Incineration •Incineration is a common method of commercial disposal typically used for pathological and pharmaceutical waste. •a high-temperature process that reduces organic and combustible waste to inorganic, incombustible matter and results in a very significant reduction of waste volume and weight •","loc":"Page 16","egyptian":"الحرق Incineration: الطريقة التجارية الشائعة للنفايات الباثولوجية والدوائية — حرارة عالية بتحول العضوي لغير عضوي وبتقلل الحجم والوزن بشكل كبير."},{"n":17,"text":"Chemical Disinfection •This process involves the use of chemical agents for disinfection, such as chlorine, •. Chemical disinfection processes are most appropriate for liquid wastes, although they can still be used to treat solid wastes.","loc":"Page 17","egyptian":"التطهير الكيميائي: استخدام مطهرات زي الكلور — الأنسب للنفايات السائلة ويمكن استخدامه للصلبة كمان."},{"n":18,"text":"thermal treatment •Autoclave: •In this method, wastes are sterilized or disinfected prior to disposal in a landfill. • Bags of waste are placed in a chamber and steam is introduced for a determined period of time at a specified pressure and temperature. This assures the destruction of microorganisms. •90% of regulated medical wastes are suitable for autoclaving. •Autoclaves are not suitable,, for pathological, cytotoxic, or other toxic chemical wastes.","loc":"Page 18","egyptian":"الأوتوكلاف Autoclave: تعقيم أو تطهير النفايات قبل الدفن — أكياس النفايات في حجرة وبخار لوقت محدد بضغط وحرارة محددين — 90% من النفايات الطبية المنظمة تصلح للأوتوكلاف — مش صالحة للباثولوجية والسامة الخلوية والكيميائية السامة."},{"n":19,"text":"Land disposal • method of disposing of solid waste on land without creating hazards to public health or safety,","loc":"Page 19","egyptian":"الدفن الأرضي: تخلص من النفايات الصلبة على الأرض بدون مخاطر على الصحة العامة أو السلامة."},{"n":20,"text":"Decay in Storage For radio active waste •Store the waste for at least 10 times the half-life of the longest lived radionuclide in the waste • Conduct a radiation survey to confirm that radioactivity is below the clearance level • Disinfect mixed radioactive infectious waste before discarding with regular waste •Long-term storage at an authorized radioactive waste disposal facility","loc":"Page 20","egyptian":"التخزين للتحلل (للمشع): خزّن النفايات 10 أضعاف نصف عمر أطول نظير + مسح إشعاعي للتأكد إن النشاط تحت مستوى التخليص + طهر النفايات المشعة المختلطة بعدوى قبل رميها مع العادية + تخزين طويل الأمد في منشأة معتمدة."},{"n":21,"text":"Steralization & disinfection","loc":"Page 21","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":22,"text":"definitions •Disinfection: Process by which we can minimize the number of microorganisms except bacterial spores. •Steralization:the process of eliminating all forms of microorganisms, including bacteria, viruses, fungi, and spores, from medical instruments, equipment, and surfaces •Disinfectant: chemical substance to be used to disinfect (Inanimate) surface. •Antiseptic: Chemical substance can be used to disinfect (animate) surface.","loc":"Page 22","egyptian":"تعريفات: التطهير Disinfection = تقليل عدد الميكروبات ما عدا الأبواغ + التعقيم Sterilization = القضاء على كل أشكال الحياة بما فيها الأبواغ + المطهر Disinfectant = مادة كيميائية لأسطح غير حية + المعقم Antiseptic = مادة كيميائية لأسطح حية."},{"n":23,"text":"Levels of disinfection","loc":"Page 23","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":24,"text":"High disinfection •Effectiveness: Kills most microorganisms, including bacteria, viruses, fungi, and spores, but not necessarily all spores (some highly resistant spores may survive). •Organisms Targeted: Includes Mycobacterium tuberculosis, all fungi& Hepatitis B virus •Disinfectant Examples: Glutaraldehyde Hydrogen peroxide Peracetic acid","loc":"Page 24","egyptian":"التطهير العالي High: يقتل معظم الميكروبات بما فيها TB وفطريات وHBV (مش كل الأبواغ بالضرورة) — أمثلة: جلوتارالدهيد + بيروكسيد الهيدروجين + حمض البيراسيتيك."},{"n":25,"text":"Intermediate Disinfection •Effectiveness: Kills most bacteria, viruses, and fungi, but not bacterial spores •Organisms Targeted: Includes Staphylococcus aureus, Escherichia coli,HCV, influenza virus and fungi. •Disinfectant Examples: Alcohol (70%-90%) Iodophors ex betadine","loc":"Page 25","egyptian":"التطهير المتوسط Intermediate: يقتل معظم البكتيريا والفيروسات والفطريات ما عدا الأبواغ — يشمل S. aureus وE. coli وHCV والإنفلونزا والفطريات — أمثلة: كحول 70-90% + أيودوفور زي البيتادين."},{"n":26,"text":"Low Disinfection •Effectiveness: Kills most bacteria and some viruses, but not resistant organisms like Mycobacterium tuberculosis or bacterial spores. •Organisms Targeted: Includes Streptococcus, Staphylococcus aureus, Hepatitis A, some fungi and ,HIV •Disinfectant Examples: Quaternary ammonium compounds(Sterillium ,cavicid) Phenolic compounds (phenic,dettol) Soap and water","loc":"Page 26","egyptian":"التطهير المنخفض Low: يقتل معظم البكتيريا وبعض الفيروسات ما عدا TB والأبواغ — يشمل ستربتوكوكس وS. aureus وHAV وبعض الفطريات وHIV — أمثلة: مركبات الأمونيوم الرباعي (ستيريليوم وكافيسيد) + فينولات (ديتول) + صابون وماء."},{"n":28,"text":"Spaudling classification","loc":"Page 28","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":29,"text":"Critical Touches Sterile tissue / bloodstream Requires Sterilization Semi-critical Touches Mucous membranes, non-intact skin Requires High-level disinfection Non-critical Touches Intact skin only Requires Low / intermediate- level","loc":"Page 29","egyptian":"تصنيف سبولدنج Spaulding: حرج Critical بيلمس نسيج معقم أو مجرى الدم ← تعقيم + شبه حرج Semi-critical بيلمس أغشية مخاطية أو جلد غير سليم ← تطهير عالي + غير حرج Non-critical بيلمس جلد سليم فقط ← تطهير منخفض/متوسط."},{"n":30,"text":"Critical items Radiology examples • Biopsy needles under CT / US • Angiography catheters, guidewires • Interventional radiology instruments • Drainage catheters • Contrast syringes and tubing to the patient Required level Sterilization (or sterile single-use)","loc":"Page 30","egyptian":"أمثلة حرجة في الأشعة: إبر الخزعة تحت CT/US + قسطرات الأنجيو والأسلاك الدليلية + أدوات التداخل + قسطرات التصريف + سرنجات التبايز وأنيبيباتها للمريض ← تعقيم (أو أحاديةUsage معقمة)."},{"n":31,"text":"Semi-critical items Radiology examples • Transvaginal / transrectal US probe • HSG cannula and instruments • Rectal tip in barium enema • US probe used on an open wound Required level High-level disinfection (minimum) A probe cover does not change the class. Covers can leak: disinfect after every patient.","loc":"Page 31","egyptian":"أمثلة شبه حرجة: مسبار US عبر المهبل/المستقيم + كانيولا HSG وأدواتها + طرف المستقيم في الحقنة الشرجية بالباريوم + مسبار US على جرح مفتوح ← تطهير عالي كحد أدنى — والغطاء مش بيغير التصنيف: الأغطية بتتسرب فطهّر بعد كل مريض."},{"n":32,"text":"Non-critical items Radiology examples • Abdominal US probe on intact skin • Examination table, CT gantry • MRI coils, lead aprons, cassettes • Control panels, injector surface Required level Low or intermediate-level disinfection High-touch surfaces spread infection via hands. Blood spill: raise to intermediate level.","loc":"Page 32","egyptian":"أمثلة غير حرجة: مسبار US البطن على جلد سليم + طاولة الفحص والقنطرة CT + كويلات MRI والمآزر الرصاصية والكاست + لوحات التحكم وسطح الحاقن ← منخفض/متوسط — وانسكاب الدم بيرفع المستوى للمتوسط."}],"visuals":[{"file":"images\\inf-waste\\page-1.png","loc":"Page 1","n":1,"path":"Assets/inf-waste/page-1.png"},{"file":"images\\inf-waste\\page-2.png","loc":"Page 2","n":2,"path":"Assets/inf-waste/page-2.png"},{"file":"images\\inf-waste\\page-3.png", function objectiveScore(lesson,answers,bank){const quiz=bank||lesson.quiz;let got=0,total=0,detail=[];for(let i=0;i<quiz.length;i++){const q=quiz[i],a=answers[i];if(q.type==='essay'){detail.push({i,essay:true});continue}total+=q.points||1;let earned=0,correct=false;if(q.type==='mcq'){correct=a!==''&&a!==undefined&&a!==null&&Number(a)===q.answer;earned=correct?q.points:0}else if(q.type==='tf'){correct=String(a)===String(q.answer);earned=correct?q.points:0}else if(q.type==='short'){const value=norm(a||'');const groups=q.keywords||[];const matches=groups.filter(g=>(Array.isArray(g)?g:[g]).some(k=>value.includes(norm(k))));const required=q.required||groups.length||1;earned=Math.min(q.points,Math.round((matches.length/required)*(q.points||1)*100)/100);correct=earned>=q.points}got+=earned;detail.push({i,earned,total:q.points,correct,matches:q.type==='short'?(q.keywords||[]).filter(g=>(Array.isArray(g)?g:[g]).some(k=>norm(a||'').includes(norm(k)))):[]})}return {got,total,detail,pct:total?Math.round(got/total*100):0}}

function splitSentences(text){const guarded=text.replace(/(\d)\.(?=\d)/g,"$1\u0001").replace(/(\d{1,2})\.\s+(?=[A-Z0-9])/g,"$1\u0002");const parts=guarded.split("•").flatMap(seg=>(seg.match(/[^.!?]+[.!?]+["']?\s*|[^.!?]+$/g)||[seg]).map(s=>s.replace(/\u0001/g,".").replace(/\u0002/g,". ").trim()).filter(Boolean));const out=[];let pending='';for(const p of parts){if(/^\d{1,2}\.$/.test(p)){pending=p;continue}out.push(pending?pending+' '+p:p);pending=''}if(pending)out.push(pending);return out}
function parseBlocks(text){const markerRe=/(^|\s)(\d{1,2})\.\s+(?=[A-Z0-9])/g;const marks=[];let m;while((m=markerRe.exec(text))){const n=Number(m[2]);if(marks.length&&n!==marks[marks.length-1].n+1)break;marks.push({n,start:m.index+m[1].length,markStart:m.index})}

function noteHTML(t){const holds=[];const guarded=String(t).replace(/\([^)]*\)/g,m=>{holds.push(m);return '\u0002'+(holds.length-1)+'\u0003'});const parts=guarded.split(/\s*(?:؛|،|—|\+)\s*/).map(s=>s.replace(/\u0002(\d+)\u0003/g,(_,i)=>holds[Number(i)]).trim()).filter(Boolean);if(parts.length<2)return `<p>${hl(esc(t))}</p>`;return `<div class="note-lines">${parts.map((s,i)=>`<p class="note-line" style="--i:${Math.min(i,12)}"><span class="nb" aria-hidden="true">▪</span><span>${hl(esc(s))}</span></p>`).join('')}</div>`}

if(!f||!Number.isInteger(f.lesson)||!f.ends){if(f)try{localStorage.removeItem(FOCUS_KEY)}catch(e){};return}
if(f.paused){focusSession=f;return}
if(f.ends<=Date.now()){logFocus(f.lesson,f.total);try{localStorage.removeItem(FOCUS_KEY)}catch(e){};return}
focusSession=f;openLesson(Math.min(Math.max(0,f.lesson),DATA.lessons.length-1));enterFocus()}
function submitLesson(ev){ev.preventDefault();const l=DATA.lessons[current],form=ev.currentTarget,answers={};l.quiz.forEach((q,i)=>{const el=form.elements['a'+i];answers[i]=q.type==='mcq'||q.type==='tf'?(form.querySelector(`[name="a${i}"]:checked`)||{}).value||'':el?.value||''});const result=objectiveScore(l,answers);const prior=state.attempts[l.id];const best=prior?Math.max(prior.pct,result.pct):result.pct;state.attempts[l.id]={answers,got:result.got,total:result.total,pct:result.pct,detail:result.detail,at:Date.now()};state.completed=Array.from(new Set([...state.completed,l.id]));state.mastery[l.id]={pct:best,due:Date.now()+(best>=80?3:1)*86400000};save();renderLesson()}
function submitMidterm(ev){ev.preventDefault();const l=DATA.lessons[current],form=ev.currentTarget,answers={};(l.midterm||[]).forEach((q,i)=>{const el=form.elements['m'+i];answers[i]=q.type==='mcq'||q.type==='tf'?(form.querySelector(`[name="m${i}"]:checked`)||{}).value||'':el?.value||''});const result=objectiveScore(l,answers,l.midterm);state.midterm[l.id]={answers,got:result.got,total:result.total,pct:result.pct,detail:result.detail,at:Date.now()};save();renderLesson()}
function exportState(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${DATA.id}-progress.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importState(file){if(!file||file.size>1000000){alert(text('invalid'));return}const fr=new FileReader();fr.onload=()=>{try{const x=JSON.parse(fr.result);if(x.version!==2||x.subject!==DATA.id||!x.attempts||typeof x.attempts!=='object'||!x.mastery||typeof x.mastery!=='object')throw 0;state={version:2,subject:DATA.id,completed:Array.isArray(x.completed)?x.completed.filter(id=>DATA.lessons.some(l=>l.id===id)):[],mastery:x.mastery,attempts:x.attempts,midterm:x.midterm&&typeof x.midterm==='object'?x.midterm:{},current:Number.isInteger(x.current)?Math.max(0,Math.min(DATA.lessons.length-1,x.current)):0};current=state.current;save();renderLesson();alert(text('imported'))}catch(e){alert(text('invalid'))}};fr.readAsText(file)}
function cardTag(t){return t==='quiz'?text('tagQuiz'):text('tagFact')}
function fcHeadHTML(){const deckOptions=[[text('fcDeckLesson'),'lesson'],[text('fcDeckAll'),'all'],[text('fcDeckUnknown'),'unknown']].map(([label,val])=>`<option value="${val}" ${FC.mode===val?'selected':''}>${esc(label)}</option>`).join('');return `<div class="fc-head"><div><h3>${esc(text('fcTitle'))}</h3><p>${esc(text('fcSub'))}</p></div><div class="fc-controls"><select id="fcDeck" aria-label="Deck">${deckOptions}</select><button class="secondary" type="button" data-fc="shuffle">${esc(text('fcShuffle'))}</button></div></div>`}
function renderCards(){const panel=$('#fcPanel');if(!panel)return;if(!FC.list.length){const msg=FC.mode==='unknown'?text('fcEmptyUnknown'):text('fcEmpty');panel.innerHTML=fcHeadHTML()+`<div class="fc-empty"><p>${esc(msg)}</p><button class="primary" type="button" data-fc="all">${esc(text('fcDeckAll'))}</button></div>`;return}
if(FC.i>=FC.list.length){const knownInDeck=FC.list.filter(x=>cardsState.known[x.c.id]).length;panel.innerHTML=fcHeadHTML()+`<div class="fc-done"><strong>${esc(text('fcDone'))}</strong><p>${esc(text('fcDoneSub'))} · ${knownInDeck}/${FC.list.length} ${esc(text('fcKnownStats'))}</p><div class="fc-actions"><button class="primary" type="button" data-fc="restart">${esc(text('fcRestart'))}</button><button class="secondary" type="button" data-fc="unknown">${esc(text('fcDeckUnknown'))}</button></div></div>`;return}
const item=FC.list[FC.i];const l=DATA.lessons[item.li];const knownInDeck=FC.list.filter(x=>cardsState.known[x.c.id]).length;const pct=Math.round(FC.i/FC.list.length*100);
panel.innerHTML=fcHeadHTML()+`<div class="fc-stage"><div class="fc-card ${FC.flipped?'flipped':''}" id="fcCard" data-fc="flip" tabindex="0" role="button" aria-label="Flashcard"><div class="fc-face fc-front" dir="ltr"><span class="fc-tag">${esc(cardTag(item.c.tag))}</span><div class="fc-text">${esc(item.c.front)}</div><p class="fc-hint">${esc(text('fcFlipHint'))}</p></div><div class="fc-face fc-back" dir="rtl"><span class="fc-tag">${esc(cardTag(item.c.tag))}</span><div class="fc-text">${esc(item.c.back)}</div><div class="fc-en" dir="ltr">${esc(item.c.tag==='fact'?item.c.en:item.c.front)}</div><p class="fc-hint">${esc(text('fcFlipHint'))}</p></div></div></div><div class="fc-actions"><button class="secondary" type="button" data-fc="again">${esc(text('fcAgain'))} ↻</button><button class="primary" type="button" data-fc="known">${esc(text('fcKnown'))} ✓</button></div><div class="fc-nav"><button class="secondary" type="button" data-fc="prev" ${FC.i===0?'disabled':''} aria-label="${esc(text('fcPrev'))}">←</button><span class="fc-counter">${FC.i+1} ${esc(text('of'))} ${FC.list.length}</span><button class="secondary" type="button" data-fc="next" ${FC.i===FC.list.length-1?'disabled':''} aria-label="${esc(text('fcNext'))}">→</button></div><div class="fc-progressline"><div class="progressbar" aria-hidden="true"><span style="width:${pct}%"></span></div><small>${knownInDeck}/${FC.list.length} ${esc(text('fcKnownStats'))}</small></div><p class="fc-lesson">${esc(lang==='ar'?l.titleAr:l.titleEn)}</p>`}
function fcBuild(mode){FC.mode=mode;FC.i=0;FC.flipped=false;const pool=[];if(mode==='lesson'){const l=DATA.lessons[current];(l?.cards||[]).forEach(c=>pool.push({c,li:current}))}else{DATA.lessons.forEach((l,li)=>{l.cards.forEach(c=>{if(mode!=='unknown'||!cardsState.known[c.id])pool.push({c,li})})})}FC.list=pool;renderCards()}
function fcShuffle(){if(!FC.list.length)return;for(let i=FC.list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=FC.list[i];FC.list[i]=FC.list[j];FC.list[j]=t}FC.i=0;FC.flipped=false;renderCards()}
function fcFlip(){if(!FC.list.length||FC.i>=FC.list.length)return;FC.flipped=!FC.flipped;const el=$('#fcCard');if(el&&el.classList)el.classList.toggle('flipped',FC.flipped)}
function fcNext(){if(!FC.list.length)return;FC.flipped=false;if(FC.i<FC.list.length)FC.i++;renderCards()}
function fcPrev(){if(!FC.list.length)return;FC.flipped=false;FC.i=Math.max(0,FC.i-1);renderCards()}
function fcMark(known){const item=FC.list[FC.i];if(!item)return;if(known)cardsState.known[item.c.id]=1;else delete cardsState.known[item.c.id];saveCards();fcNext()}
function fcState(){return{mode:FC.mode,size:FC.list.length,index:Math.min(FC.i,Math.max(0,FC.list.length-1)),flipped:FC.flipped,known:Object.keys(cardsState.known).length,tab}}
function switchTab(name){tab=name;['lesson','cards','sources'].forEach(t=>{const el=$('#tab-'+t);if(el)el.hidden=t!==name});const tabs=document.querySelectorAll('.tab');if(tabs)tabs.forEach(b=>{const on=b.dataset.tab===name;b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false')});if(name==='cards')fcBuild(FC.mode)}
let endArmed=null;
function disarmEnd(){if(endArmed){clearTimeout(endArmed);endArmed=null}const b=$('#focusEnd');if(!b)return;b.classList.remove('armed');b.textContent='✕'}
function focusEndClick(){if(!focusSession)return;if(endArmed){clearTimeout(endArmed);endArmed=null;finishFocus(true);return}const b=$('#focusEnd');b.classList.add('armed');b.textContent=text('focusSure');endArmed=setTimeout(disarmEnd,3500)}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#homeLink').textContent=text('back');$('#languageBtn').textContent=text('language');$('#exportBtn').textContent=text('export');$('#importLabel').textContent=text('import');$('#progressLabel').textContent=text('progress');$('#masteryLabel').textContent=text('mastery');$('#reviewDueLabel').textContent=text('reviewDue');$('#storageNote').textContent=text('storage');$('#medicalNote').textContent=text('medical');$('#allSourcesTitle').textContent=text('allSources');$('#saveStatus').textContent=storageWorks?text('saved'):text('storageError');$('#tabBtnLesson').textContent=text('tabLesson');$('#tabBtnCards').textContent=text('tabCards');$('#tabBtnSources').textContent=text('tabSources');document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=lang==='ar'?el.dataset.ar:el.dataset.en);renderLesson();if(tab==='cards')fcBuild(FC.mode);$('#languageBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('study-system:lang',lang)}catch(e){};render()};$('#exportBtn').onclick=exportState;$('#importFile').onchange=e=>{importState(e.target.files?.[0]);e.target.value=''};$('#mobileLessons').onchange=e=>openLesson(Number(e.target.value));$('#railToggle').onclick=()=>setRail(!railOpen);$('#railBackdrop').onclick=()=>setRail(false);$('#focusViewLesson').onclick=()=>setFocusView('lesson');$('#focusViewCards').onclick=()=>setFocusView('cards');$('#focusPauseBtn').onclick=()=>{if(!focusSession)return;focusSession.paused?focusPlay():pauseFocus()};$('#fcPanel').addEventListener('change',e=>{if(e.target&&e.target.id==='fcDeck')fcBuild(e.target.value)});$('#fcPanel').onclick=e=>{const b=e.target.closest('[data-fc]');if(!b)return;const act=b.dataset.fc;if(act==='flip')fcFlip();else if(act==='known')fcMark(true);else if(act==='again')fcMark(false);else if(act==='next')fcNext();else if(act==='prev')fcPrev();else if(act==='shuffle')fcShuffle();else if(act==='restart')fcBuild(FC.mode);else if(act==='all')fcBuild('all');else if(act==='unknown')fcBuild('unknown')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('#focusPrevLesson').onclick=()=>focusStep(-1);$('#focusNextLesson').onclick=()=>focusStep(1);$('#focusEnd').onclick=focusEndClick;$('#breakSkip').onclick=skipBreak;document.addEventListener('keydown',e=>{const t=e.target,tag=t?t.tagName:'';if(['INPUT','TEXTAREA'].includes(tag))return;if(e.key==='Escape'&&!document.body.classList.contains('focus-mode')){if(railOpen)setRail(false);return}if(document.body.classList.contains('focus-mode')){if(tag==='SELECT')return;if(focusView==='cards'){if(e.code==='Space'||e.key===' '){e.preventDefault();fcFlip()}else if(e.key==='ArrowRight')fcNext();else if(e.key==='ArrowLeft')fcPrev()}else{if(e.key==='ArrowRight')focusStep(1);else if(e.key==='ArrowLeft')focusStep(-1)}return}if(tab!=='cards')return;if(e.code==='Space'||e.key===' '){e.preventDefault();fcFlip()}else if(e.key==='ArrowRight')fcNext();else if(e.key==='ArrowLeft')fcPrev()})}
function renderSourceLibrary(){const all=DATA.sources.map(s=>`<details class="evidence-wrap"><summary>${esc(s.display)} · ${s.records.length} ${esc(text('sourceText'))}</summary>${s.records.map(r=>excerptHTML({...r,file:s.file})).join('')}</details>`).join('');$('#sourceLibrary').innerHTML=all||`<p class="empty">${esc(text('empty'))}</p>`}
load();current=state.current||0;loadCards();
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b&&b.closest('#rail, #reviewList')){openLesson(Number(b.dataset.open));setRail(false)}else if(e.target.closest('#railClose')){setRail(false)}});
document.addEventListener('DOMContentLoaded',()=>{renderSourceLibrary();render();setRail(railPref());restoreFocus()});
</script></body></html>
