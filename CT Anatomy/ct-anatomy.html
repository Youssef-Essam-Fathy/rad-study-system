c":"Page 38","n":38,"path":"Assets/cta-brain/page-38.png"},{"file":"images\\2.BRAIN\\page-39.png","loc":"Page 39","n":39,"path":"Assets/cta-brain/page-39.png"},{"file":"images\\2.BRAIN\\page-40.png","loc":"Page 40","n":40,"path":"Assets/cta-brain/page-40.png"},{"file":"images\\2.BRAIN\\page-41.png","loc":"Page 41","n":41,"path":"Assets/cta-brain/page-41.png"},{"file":"images\\2.BRAIN\\page-42.png","loc":"Page 42","n":42,"path":"Assets/cta-brain/page-42.png"},{"file":"images\\2.BRAIN\\page-43.png","loc":"Page 43","n":43,"path":"Assets/cta-brain/page-43.png"},{"file":"images\\2.BRAIN\\page-44.png","loc":"Page 44","n":44,"path":"Assets/cta-brain/page-44.png"},{"file":"images\\2.BRAIN\\page-45.png","loc":"Page 45","n":45,"path":"Assets/cta-brain/page-45.png"},{"file":"images\\2.BRAIN\\page-46.png","loc":"Page 46","n":46,"path":"Assets/cta-brain/page-46.png"},{"file":"images\\2.BRAIN\\page-47.png","loc":"Page 47","n":47,"path":"Assets/cta-brain/page-47.png"},{"file":"images\\2.BRAIN\\page-48.png","loc":"Page 48","n":48,"path":"Assets/cta-brain/page-48.png"},{"file":"images\\2.BRAIN\\page-49.png","loc":"Page 49","n":49,"path":"Assets/cta-brain/page-49.png"},{"file":"images\\2.BRAIN\\page-50.png","loc":"Page 50","n":50,"path":"Assets/cta-brain/page-50.png"},{"file":"images\\2.BRAIN\\page-51.png","loc":"Page 51","n":51,"path":"Assets/cta-brain/page-51.png"},{"file":"images\\2.BRAIN\\page-52.png","loc":"Page 52","n":52,"path":"Assets/cta-brain/page-52.png"},{"file":"images\\2.BRAIN\\page-53.png","loc":"Page 53","n":53,"path":"Assets/cta-brain/page-53.png"},{"file":"images\\2.BRAIN\\page-54.png","loc":"Page 54","n":54,"path":"Assets/cta-brain/page-54.png"},{"file":"images\\2.BRAIN\\page-55.png","loc":"Page 55","n":55,"path":"Assets/cta-brain/page-55.png"},{"file":"images\\2.BRAIN\\page-56.png","loc":"Page 56","n":56,"path":"Assets/cta-brain/page-56.png"},{"file":"images\\2.BRAIN\\page-57.png","loc":"Page 57","n":57,"path":"Assets/cta-brain/page-57.png"}]},{"id":"cta-lung1","file":"5.CT Lung Anatomy P 1.pptx","display":"CT lung anatomy part 1","format":".pptx","records":[{"n":1,"text":"CT Lung Anatomy: A Foundation for Diagnosis Dr Ahmed Elsawaf MD","loc":"Slide 1","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":2,"text":"Introduction: Why Mastering Anatomy is Your First Tool You cannot recognize the abnormal until you intimately know the normal. Anatomy provides the roadmap for describing disease location (e.g., \"right lower lobe nodule\" vs. \"a spot in the lung\"). It informs your differential diagnosis (e.g., a mass in the anterior mediastinum has a different differential than one in the lung apex). Today, we will build a systematic approach to navigating a CT chest, from the great vessels down to the secondary pulmonary lobule.","loc":"Slide 2","egyptian":"مش هتعرف الشاذ إلا لو حافظ الطبيعي — التشريح خريطة تحديد مكان المرض (عقدة في الفص السفلي الأيمن مش «بقعة في الرئة») وهو اللي بيوجه التشخيص التفريقي (كتلة أمام المنصف غير كتلة قمة الرئة)."},{"n":3,"text":"The Systematic Search Pattern: Your Diagnostic Checklist A structured approach: Trachea & Central Airways Mediastinum & Great Vessels Hila (Pulmonary Vessels & Lymph Nodes) Lungs (Lobes, Fissures, Parenchyma) Pleura & Chest Wall Upper Abdomen (Liver, Spleen, Adrenals - \"Don't miss!\") Always use the same pattern . This is how you avoid missing a small nodule because you were distracted by a large hiatal hernia.\"","loc":"Slide 3","egyptian":"نمط الفحص المنظم بنفس الترتيب كل مرة: القصبة والمسالك ← المنصف والأوعية الكبيرة ← السرتين (أوعية وعقد) ← الرئتين (فصوص وشقوق وبرانشيم) ← الجنبة والقفص الصدري ← البطن الأعلى (كبد وطحال وكظر — متسيبهاش!) — الثبات ده هو اللي بيمنع تفويت عقدة صغيرة وأنت مشتت بفتق حجابي كبير."},{"n":4,"text":"The Airways: From Trachea to Segmental Bronchi","loc":"Slide 4","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":5,"text":"Trachea:","loc":"Slide 5","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":6,"text":"Carina and main bronchi:","loc":"Slide 6","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":7,"text":"Key Structures: Trachea: C-shaped cartilaginous rings. Carina: The ridge separating the right and left mainstem bronchi. Mainstem Bronchi: The right is wider, shorter, and more vertical than the left (why foreign bodies go right!). Lobar and Segmental Bronchi: Learn the names of the major segments (e.g., RUL apical, LLL superior).","loc":"Slide 7","egyptian":"القصبة حلقات غضروفية على شكل C؛ والكارينا الحرف الفاصل بين الشعبتين — واليمنى أعرض وأقصر وأكثر عمودية (عشان كده الأجسام الغريبة بتروح يمين!)؛ وبعدها شعب فصية وقطعية لازم تحفظ أسماءها (زي قمي العلوي الأيمن وعلوي السفلي الأيسر)."},{"n":8,"text":"Clinical Pearl: \"In the axial plane, an airway and its accompanying pulmonary artery should be the same size. If the airway is dilated and the artery looks small, think bronchiectasis .\"","loc":"Slide 8","egyptian":"لؤلؤة إكلينيكية: في القطاع الأكسيل الشعيبة مع شريانها الرئوي لازم نفس الحجم — لو الشعيبة متوسعة والشريان صغير: فكر في Bronchiectasis."},{"n":9,"text":"The Vasculature: Arteries vs. Veins","loc":"Slide 9","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":10,"text":"Pulmonary arteries (in blue):","loc":"Slide 10","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":11,"text":"Pulmonary veins (in red)","loc":"Slide 11","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":12,"text":"Pulmonary trunk divides into two arteries:","loc":"Slide 12","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":13,"text":"Four pulmonary veins (2 right and 2 left):","loc":"Slide 13","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":14,"text":"Pulmonary Arteries: Carry deoxygenated blood. Pulmonary trunk…..right and left main pulmonary arteries…..lobar branches ….segmental and subsegmental branches Follow the bronchi. They branch together.","loc":"Slide 14","egyptian":"الشرايين الرئوية شايلة دم غير مؤكسج: الجذع الرئوي ← أيمن وأيسر ← فروع فصية ← قطعية وتحت قطعية — ماشية مع الشعب وبتتفرع معاها."},{"n":15,"text":"Pulmonary Veins: Carry oxygenated blood. Four pulmonary veins: right superior, right inferior, left superior and left inferior veins Run between segments towards the left atrium.","loc":"Slide 15","egyptian":"الأوردة الرئوية شايلة دم مؤكسج وعددها 4: أعلى وأسفل يمين وأعلى وأسفل يسار — ماشية بين القطع في اتجاه الأذين الأيسر."},{"n":16,"text":"Lobes and Fissures: The Lung's compartments","loc":"Slide 16","egyptian":"الفصوص والشقوق: يمين 3 فصوص (علوي وأوسط وسفلي) ويسار 2 (علوي وسفلي) — الشق الرئيسي (المائل) بيفصل العلوي/الأوسط عن السفلي وغالبًا ناقص؛ والأصلي (الأفقي) يمين بس بيفصل العلوي عن الأوسط."},{"n":17,"text":"[Slide 18] Fissures in CT","loc":"Slide 17","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":19,"text":"One air (trachea) …one lobe (upper lobe)","loc":"Slide 19","egyptian":"قاعدة القراءة: هواء واحد (قصبة) = فص واحد (العلوي)."},{"n":20,"text":"Two air (two bronchi)…two lobes (upper and lower)","loc":"Slide 20","egyptian":"هوائي اتنين (شعبتين) = فصين (العلوي والسفلي)."},{"n":21,"text":"Heart level (middle lobe and lingula)","loc":"Slide 21","egyptian":"مستوى القلب = الفص الأوسط واللسينة."},{"n":22,"text":"Right Lung: 3 Lobes (Upper, Middle, Lower) Left Lung: 2 Lobes (Upper, Lower) Key Fissures: Major (Oblique) Fissure: Separates upper/middle from lower lobes. Often incomplete. Minor (Horizontal) Fissure: Right side only. Separates RUL from RML.","loc":"Slide 22","egyptian":"اليمين 3 فصوص واليسار 2 — الرئيسي بيفصل فوق من تحت والأصلي يمين بس."},{"n":23,"text":"Thank you","loc":"Slide 23","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."}],"visuals":[{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-d36494bd6f20.jpg","loc":"Slide 5","n":5,"path":"Assets/cta-lung1/visual-d36494bd6f20.jpg"},{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-4bf4557868c3.jpg","loc":"Slide 6","n":6,"path":"Assets/cta-lung1/visual-4bf4557868c3.jpg"},{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-8a4aec483927.png","loc":"Slide 8","n":8,"path":"Assets/cta-lung1/visual-8a4aec483927.png"},{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-be0ef2ee4b29.png","loc":"Slide 9","n":9,"path":"Assets/cta-lung1/visual-be0ef2ee4b29.png"},{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-b984ab933082.jpg","loc":"Slide 13","n":13,"path":"Assets/cta-lung1/visual-b984ab933082.jpg"},{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-f5fef44b7419.png","loc":"Slide 16","n":16,"path":"Assets/cta-lung1/visual-f5fef44b7419.png"},{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-d121b25be8b4.jpeg","loc":"Slide 19","n":19,"path":"Assets/cta-lung1/visual-d121b25be8b4.jpeg"},{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-610adea2e223.jpg","loc":"Slide 19","n":19,"path":"Assets/cta-lung1/visual-610adea2e223.jpg"},{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-266e0339f92e.jpeg","loc":"Slide 20","n":20,"path":"Assets/cta-lung1/visual-266e0339f92e.jpeg"},{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-610adea2e223.jpg","loc":"Slide 20","n":20,"path":"Assets/cta-lung1/visual-610adea2e223.jpg"},{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-578bc4792f2a.jpg","loc":"Slide 21","n":21,"path":"Assets/cta-lung1/visual-578bc4792f2a.jpg"},{"file":"images\\5.CT-Lung-Anatomy-P-1\\visual-610adea2e223.jpg","loc":"Slide 21","n":21,"path":"Assets/cta-lung1/visual-610adea2e223.jpg"}]},{"id":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","display":"CT lung anatomy part 2","format":".pdf","records":[{"n":1,"text":"CT Lung Anatomy: A Foundation for Diagnosis Part 2 Dr Ahmed Elsawaf MD","loc":"Page 1","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":2,"text":"LUNG SEGMENTS","loc":"Page 2","egyptian":"القطع الرئوية: عنوان دقيق لمكان المرض."},{"n":3,"text":"Right Lung (10 segments) RUL: 3 segments - Apical, Posterior, Anterior RML: 2 segments - Lateral, Medial RLL: 5 segments - Superior, Medial basal, Anterior basal, Lateral basal, Posterior basal Left Lung (8 segments) LUL: 4 segments. The apical and posterior segments often fuse to form the apicoposterior segment. The anterior segment. The lingula has a superior and inferior segment, analogous to the RML. LLL: Usually 4 segments. The superior, anterior, lateral basal and posterior basal…………(no medial segment)","loc":"Page 3","egyptian":"اليمين 10 قطع: العلوي 3 (قمي وخلفي وأمامي) والأوسط 2 (وحشي وإنسي) والسفلي 5 (علوي + قاعدية: إنسي وأمامي ووحشي وخلفي)؛ اليسار 8: العلوي 4 (القمي مع الخلفي بيلتحموا قمي-خلفي + الأمامي + اللسينة قطع علوي وسفلي بديل الأوسط) والسفلي 4 (علوي + قاعدية أمامي ووحشي وخلفي — مفيش إنسي!)."},{"n":4,"text":"The Mediastinum: A Compartmental Approach","loc":"Page 4","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":7,"text":"Use the simplified 4-compartment model: Superior Mediastinum: aortic arch and branches (brachiocephalic, left common carotid and left subclavian), two brachiocephalic veins (ending into SVC) Anterior Mediastinum: Thymus, lymph nodes, fat. Middle Mediastinum: Heart, pericardium, great vessels Posterior Mediastinum: Descending aorta, esophagus, azygos/hemiazygos veins, nerves, lymph nodes.","loc":"Page 7","egyptian":"المنصف بنموذج 4 حجرات: علوي (قوس الأورطى وفروعه والعضديان الرأسيان اللي بيكملوا SVC) وأمامي (التوتة والعقد والدهون) وأوسط (القلب والتامور والأوعية الكبيرة) وخلفي (الأورطى الهابط والمريء والفنجاني ونصف الفنجاني والأعصاب والعقد)."},{"n":8,"text":"•Clinical Pearl: \"When you see a mass, first localize it to a compartment. This instantly narrows your differential diagnosis from 50 possibilities to about 5.\"","loc":"Page 8","egyptian":"لؤلؤة: أول ما تشوف كتلة حدد حجرة المنصف الأول — ده بيقفل التشخيص التفريقي من 50 لحد 5."},{"n":9,"text":"The Hilum: Don't Get Lost","loc":"Page 9","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":10,"text":"The Hilum: Don't Get Lost •From anterior to posterior: •Vein, Artery, Bronchus •(V-A-B).","loc":"Page 10","egyptian":"السرة من الأمام للخلف: وريد ← شريان ← شعبة (و-ش-ق V-A-B) — الترتيب اللي مش هتضيع معاه."},{"n":11,"text":"Identify the hilum","loc":"Page 11","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":12,"text":"The Lung Parenchyma: Secondary Pulmonary Lobule","loc":"Page 12","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":15,"text":"HIGH RESOLUTION CT (HRCT) • Define it: The smallest unit of lung surrounded by connective tissue septa. • Components: • Centrilobular Artery & Bronchiole (center) • Lymphatics & Septa (periphery) • Lobular Core vs. Septal/Peripheral Disease: This is the key to HRCT interpretation","loc":"Page 15","egyptian":"الـ HRCT والفصيص الثانوي: أصغر وحدة رئة محاطة بحواجز نسيج ضام — مكوناته: الشريان والقصيبة المركزيين (لب الفصيص) والأوعية اللمفاوية والحواجز (المحيط)؛ والتفريق بين مرض اللب ومرض الحواجز هو مفتاح قراءة الـ HRCT."},{"n":16,"text":"•Upper Abdomen (Liver, Spleen, Adrenals - \"Don't miss!\")","loc":"Page 16","egyptian":"البطن الأعلى جزء من فحص الصدر: كبد وطحال وكظر — متسيبهاش!"},{"n":17,"text":"Summary: Anatomy is the language of radiology. A systematic approach prevents errors. Your Homework: Look at 1 normal CT this week (Radiopedia, normal CT chest case) Use an anatomy atlas","loc":"Page 17","egyptian":"الخلاصة: التشريح لغة الأشعة والنمط المنظم بيمنع الأخطاء — الواجب: حالة CT صدر طبيعي على Radiopaedia + أطلس تشريح."},{"n":18,"text":"Thank you","loc":"Page 18","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."}],"visuals":[{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-1.png","loc":"Page 1","n":1,"path":"Assets/cta-lung2/page-1.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-2.png","loc":"Page 2","n":2,"path":"Assets/cta-lung2/page-2.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-3.png","loc":"Page 3","n":3,"path":"Assets/cta-lung2/page-3.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-4.png","loc":"Page 4","n":4,"path":"Assets/cta-lung2/page-4.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-5.png","loc":"Page 5","n":5,"path":"Assets/cta-lung2/page-5.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-6.png","loc":"Page 6","n":6,"path":"Assets/cta-lung2/page-6.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-7.png","loc":"Page 7","n":7,"path":"Assets/cta-lung2/page-7.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-8.png","loc":"Page 8","n":8,"path":"Assets/cta-lung2/page-8.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-9.png","loc":"Page 9","n":9,"path":"Assets/cta-lung2/page-9.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-10.png","loc":"Page 10","n":10,"path":"Assets/cta-lung2/page-10.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-11.png","loc":"Page 11","n":11,"path":"Assets/cta-lung2/page-11.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-12.png","loc":"Page 12","n":12,"path":"Assets/cta-lung2/page-12.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-13.png","loc":"Page 13","n":13,"path":"Assets/cta-lung2/page-13.png"},{"file":"images\\6.CT-Lung-Anatomy-P-2\\page-14.png","loc":"Pa "},{"kind":"q","t":"وَٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ ۚ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى ٱلْخَٰشِعِينَ","ref":"سُورَةُ البَقَرَةِ · آية 45"},{"kind":"z","t":"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","ref":"متفق عليه"},{"kind":"q","t":"فَٱذْكُرُونِىٓ أَذْكُرْكُمْ وَٱشْكُرُوا۟ لِى وَلَا تَكْفُرُونِ","ref":"سُورَةُ البَقَرَةِ · آية 152"},{"kind":"q","t":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ ۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ","ref":"سُورَةُ البَقَرَةِ · آية 153"},{"kind":"z","t":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ","ref":"مأثور"},{"kind":"q","t":"وَلَنَبْلُوَنَّكُم بِشَىْءٍۢ مِّنَ ٱلْخَوْفِ وَٱلْجُوعِ وَنَقْصٍۢ مِّنَ ٱلْأَمْوَٰلِ وَٱلْأَنفُسِ وَٱلثَّمَرَٰتِ ۗ وَبَشِّرِ ٱلصَّٰبِرِينَ","ref":"سُورَةُ البَقَرَةِ · آية 155"},{"kind":"q","t":"وَإِذَا سَأَلَكَ عِبَادِى عَنِّى فَإِنِّى قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ ٱلدَّاعِ إِذَا دَعَانِ ۖ فَلْيَسْتَجِيبُوا۟ لِى وَلْيُؤْمِنُوا۟ بِى لَعَلَّهُمْ يَرْشُدُونَ","ref":"سُورَةُ البَقَرَةِ · آية 186"},{"kind":"z","t":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ","ref":"صحيح البخاري"},{"kind":"q","t":"كُتِبَ عَلَيْكُمُ ٱلْقِتَالُ وَهُوَ كُرْهٌۭ لَّكُمْ ۖ وَعَسَىٰٓ أَن تَكْرَهُوا۟ شَيْـًۭٔا وَهُوَ خَيْرٌۭ لَّكُمْ ۖ وَعَسَىٰٓ أَن تُحِبُّوا۟ شَيْـًۭٔا وَهُوَ شَرٌّۭ لَّكُمْ ۗ وَٱللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ","ref":"سُورَةُ البَقَرَةِ · آية 216"},{"kind":"q","t":"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ ٱلْوَهَّابُ","ref":"سُورَةُ آلِ عِمۡرَانَ · آية 8"},{"kind":"z","t":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلًا مُتَقَبَّلًا","ref":"ابن ماجه"},{"kind":"q","t":"وَلَا تَهِنُوا۟ وَلَا تَحْزَنُوا۟ وَأَنتُمُ ٱلْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ","ref":"سُورَةُ آلِ عِمۡرَانَ · آية 139"},{"kind":"q","t":"ٱلَّذِينَ قَالَ لَهُمُ ٱلنَّاسُ إِنَّ ٱلنَّاسَ قَدْ جَمَعُوا۟ لَكُمْ فَٱخْشَوْهُمْ فَزَادَهُمْ إِيمَٰنًۭا وَقَالُوا۟ حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ","ref":"سُورَةُ آلِ عِمۡرَانَ · آية 173"},{"kind":"z","t":"اللَّهُمَّ أَعِنِّي عَلَىٰ ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ","ref":"أبو داود والنسائي"},{"kind":"q","t":"وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ وَلَا تَنَٰزَعُوا۟ فَتَفْشَلُوا۟ وَتَذْهَبَ رِيحُكُمْ ۖ وَٱصْبِرُوٓا۟ ۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ","ref":"سُورَةُ الأَنفَالِ · آية 46"},{"kind":"q","t":"ٱلَّذِينَ ءَامَنُوا۟ وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ ٱللَّهِ ۗ أَلَا بِذِكْرِ ٱللَّهِ تَطْمَئِنُّ ٱلْقُلُوبُ","ref":"سُورَةُ الرَّعۡدِ · آية 28"},{"kind":"q","t":"قَالَ رَبِّ ٱشْرَحْ لِى صَدْرِى","ref":"سُورَةُ طه · آية 25"},{"kind":"q","t":"فَتَعَٰلَى ٱللَّهُ ٱلْمَلِكُ ٱلْحَقُّ ۗ وَلَا تَعْجَلْ بِٱلْقُرْءَانِ مِن قَبْلِ أَن يُقْضَىٰٓ إِلَيْكَ وَحْيُهُۥ ۖ وَقُل رَّبِّ زِدْنِى عِلْمًۭا","ref":"سُورَةُ طه · آية 114"},{"kind":"q","t":"وَٱلَّذِينَ جَٰهَدُوا۟ فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا ۚ وَإِنَّ ٱللَّهَ لَمَعَ ٱلْمُحْسِنِينَ","ref":"سُورَةُ العَنكَبُوتِ · آية 69"},{"kind":"q","t":"۞ قُلْ يَٰعِبَادِىَ ٱلَّذِينَ أَسْرَفُوا۟ عَلَىٰٓ أَنفُسِهِمْ لَا تَقْنَطُوا۟ مِن رَّحْمَةِ ٱللَّهِ ۚ إِنَّ ٱللَّهَ يَغْفِرُ ٱلذُّنُوبَ جَمِيعًا ۚ إِنَّهُۥ هُوَ ٱلْغَفُورُ ٱلرَّحِيمُ","ref":"سُورَةُ الزُّمَرِ · آية 53"},{"kind":"q","t":"وَقَالَ رَبُّكُمُ ٱدْعُونِىٓ أَسْتَجِبْ لَكُمْ ۚ إِنَّ ٱلَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِى سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ","ref":"سُورَةُ غَافِرٍ · آية 60"},{"kind":"q","t":"وَلَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ وَنَعْلَمُ مَا تُوَسْوِسُ بِهِۦ نَفْسُهُۥ ۖ وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ ٱلْوَرِيدِ","ref":"سُورَةُ قٓ · آية 16"},{"kind":"q","t":"فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَأَمْسِكُوهُنَّ بِمَعْرُوفٍ أَوْ فَارِقُوهُنَّ بِمَعْرُوفٍۢ وَأَشْهِدُوا۟ ذَوَىْ عَدْلٍۢ مِّنكُمْ وَأَقِيمُوا۟ ٱلشَّهَٰدَةَ لِلَّهِ ۚ ذَٰلِكُمْ يُوعَظُ بِهِۦ مَن كَانَ يُؤْمِنُ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ ۚ وَمَن يَتَّقِ ٱللَّهَ يَجْعَل لَّهُۥ مَخْرَجًۭا","ref":"سُورَةُ الطَّلَاقِ · آية 2"},{"kind":"q","t":"وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى ٱللَّهِ فَهُوَ حَسْبُهُۥٓ ۚ إِنَّ ٱللَّهَ بَٰلِغُ أَمْرِهِۦ ۚ قَدْ جَعَلَ ٱللَّهُ لِكُلِّ شَىْءٍۢ قَدْرًۭا","ref":"سُورَةُ الطَّلَاقِ · آية 3"},{"kind":"q","t":"وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ ۖ وَلَئِن كَفَرْتُمْ إِنَّ عَذَابِى لَشَدِيدٌۭ","ref":"سُورَةُ إِبۡرَاهِيمَ · آية 7"},{"kind":"q","t":"إِنَّ ٱلَّذِينَ قَالُوا۟ رَبُّنَا ٱللَّهُ ثُمَّ ٱسْتَقَٰمُوا۟ تَتَنَزَّلُ عَلَيْهِمُ ٱلْمَلَٰٓئِكَةُ أَلَّا تَخَافُوا۟ وَلَا تَحْزَنُوا۟ وَأَبْشِرُوا۟ بِٱلْجَنَّةِ ٱلَّتِى كُنتُمْ تُوعَدُونَ","ref":"سُورَةُ فُصِّلَتۡ · آية 30"},{"kind":"q","t":"أَمَّن يُجِيبُ ٱلْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ ٱلسُّوٓءَ وَيَجْعَلُكُمْ خُلَفَآءَ ٱلْأَرْضِ ۗ أَءِلَٰهٌۭ مَّعَ ٱللَّهِ ۚ قَلِيلًۭا مَّا تَذَكَّرُونَ","ref":"سُورَةُ النَّمۡلِ · آية 62"},{"kind":"q","t":"يَٰٓأَيُّهَا ٱلنَّاسُ قَدْ جَآءَتْكُم مَّوْعِظَةٌۭ مِّن رَّبِّكُمْ وَشِفَآءٌۭ لِّمَا فِى ٱلصُّدُورِ وَهُدًۭى وَرَحْمَةٌۭ لِّلْمُؤْمِنِينَ","ref":"سُورَةُ يُونُسَ · آية 57"},{"kind":"q","t":"لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","ref":"سُورَةُ البَقَرَةِ · آية 286"}]};

function objectiveScore(lesson,answers,bank){const quiz=bank||lesson.quiz;let got=0,total=0,detail=[];for(let i=0;i<quiz.length;i++){const q=quiz[i],a=answers[i];if(q.type==='essay'){detail.push({i,essay:true});continue}total+=q.points||1;let earned=0,correct=false;if(q.type==='mcq'){correct=a!==''&&a!==undefined&&a!==null&&Number(a)===q.answer;earned=correct?q.points:0}else if(q.type==='tf'){correct=String(a)===String(q.answer);earned=correct?q.points:0}else if(q.type==='short'){const value=norm(a||'');const groups=q.keywords||[];const matches=groups.filter(g=>(Array.isArray(g)?g:[g]).some(k=>value.includes(norm(k))));const required=q.required||groups.length||1;earned=Math.min(q.points,Math.round((matches.length/required)*(q.points||1)*100)/100);correct=earned>=q.points}got+=earned;detail.push({i,earned,total:q.points,correct,matches:q.type==='short'?(q.keywords||[]).filter(g=>(Array.isArray(g)?g:[g]).some(k=>norm(a||'').includes(norm(k)))):[]})}return {got,total,detail,pct:total?Math.round(got/total*100):0}}

function splitSentences(text){const guarded=text.replace(/(\d)\.(?=\d)/g,"$1\u0001").replace(/(\d{1,2})\.\s+(?=[A-Z0-9])/g,"$1\u0002");const parts=guarded.split("•").flatMap(seg=>(seg.match(/[^.!?]+[.!?]+["']?\s*|[^.!?]+$/g)||[seg]).map(s=>s.replace(/\u0001/g,".").replace(/\u0002/g,". ").trim()).filter(Boolean));const out=[];let pending='';for(const p of parts){if(/^\d{1,2}\.$/.test(p)){pending=p;continue}out.push(pending?pending+' '+p:p);pending=''}if(pending)out.push(pending);return out}
function parseBlocks(text){const markerRe=/(^|\s)(\d{1,2})\.\s+(?=[A-Z0-9])/g;const marks=[];let m;while((m=markerRe.exec(text))){const n=Number(m[2]);if(marks.length&&n!==marks[marks.length-1].n+1)break;marks.push({n,start:m.index+m[1].length,markStart:m.index})}

function parseChecklist(text){if((text.match(/☐/g)||[]).length<3)return null;const segs=text.split(/(?=☐)/).map(s=>s.trim()).filter(Boolean);if(segs.length<4)return null;const blocks=[{type:'head',text:segs[0]}];for(let i=1;i<segs.length;i++){let item=segs[i].replace(/^☐\s*/,'');const dot=item.indexOf('. ');if(dot>-1){blocks.push({type:'check',text:item.slice(0,dot).replace(/\.\s*$/,'').trim()});const head2=item.slice(dot+2).trim();if(head2)blocks.push({type:'head',text:head2})}else blocks.push({type:'check',text:item})}return blocks}
function noteHTML(t){const holds=[];const guarded=String(t).replace(/\([^)]*\)/g,m=>{holds.push(m);return '\u0002'+(holds.length-1)+'\u0003'});const parts=guarded.split(/\s*(?:؛|،|—|\+)\s*/).map(s=>s.replace(/\u0002(\d+)\u0003/g,(_,i)=>holds[Number(i)]).trim()).filter(Boolean);if(parts.length<2)return `<p>${hl(esc(t))}</p>`;return `<div class="note-lines">${parts.map((s,i)=>`<p class="note-line" style="--i:${Math.min(i,12)}"><span class="nb" aria-hidden="true">▪</span><span>${hl(esc(s))}</span></p>`).join('')}</div>`}

if(!f||!Number.isInteger(f.lesson)||!f.ends){if(f)try{localStorage.removeItem(FOCUS_KEY)}catch(e){};return}
if(f.paused){focusSession=f;return}
if(f.ends<=Date.now()){logFocus(f.lesson,f.total);try{localStorage.removeItem(FOCUS_KEY)}catch(e){};return}
focusSession=f;openLesson(Math.min(Math.max(0,f.lesson),DATA.lessons.length-1));enterFocus()}
function submitLesson(ev){ev.preventDefault();const l=DATA.lessons[current],form=ev.currentTarget,answers={};l.quiz.forEach((q,i)=>{const el=form.elements['a'+i];answers[i]=q.type==='mcq'||q.type==='tf'?(form.querySelector(`[name="a${i}"]:checked`)||{}).value||'':el?.value||''});const result=objectiveScore(l,answers);const prior=state.attempts[l.id];const best=prior?Math.max(prior.pct,result.pct):result.pct;state.attempts[l.id]={answers,got:result.got,total:result.total,pct:result.pct,detail:result.detail,at:Date.now()};state.completed=Array.from(new Set([...state.completed,l.id]));state.mastery[l.id]={pct:best,due:Date.now()+(best>=80?3:1)*86400000};save();renderLesson()}
function submitMidterm(ev){ev.preventDefault();const l=DATA.lessons[current],form=ev.currentTarget,answers={};(l.midterm||[]).forEach((q,i)=>{const el=form.elements['m'+i];answers[i]=q.type==='mcq'||q.type==='tf'?(form.querySelector(`[name="m${i}"]:checked`)||{}).value||'':el?.value||''});const result=objectiveScore(l,answers,l.midterm);state.midterm[l.id]={answers,got:result.got,total:result.total,pct:result.pct,detail:result.detail,at:Date.now()};save();renderLesson()}
function exportState(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${DATA.id}-progress.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importState(file){if(!file||file.size>1000000){alert(text('invalid'));return}const fr=new FileReader();fr.onload=()=>{try{const x=JSON.parse(fr.result);if(x.version!==2||x.subject!==DATA.id||!x.attempts||typeof x.attempts!=='object'||!x.mastery||typeof x.mastery!=='object')throw 0;state={version:2,subject:DATA.id,completed:Array.isArray(x.completed)?x.completed.filter(id=>DATA.lessons.some(l=>l.id===id)):[],mastery:x.mastery,attempts:x.attempts,midterm:x.midterm&&typeof x.midterm==='object'?x.midterm:{},current:Number.isInteger(x.current)?Math.max(0,Math.min(DATA.lessons.length-1,x.current)):0};current=state.current;save();renderLesson();alert(text('imported'))}catch(e){alert(text('invalid'))}};fr.readAsText(file)}
function cardTag(t){return t==='quiz'?text('tagQuiz'):text('tagFact')}
function fcHeadHTML(){const deckOptions=[[text('fcDeckLesson'),'lesson'],[text('fcDeckAll'),'all'],[text('fcDeckUnknown'),'unknown']].map(([label,val])=>`<option value="${val}" ${FC.mode===val?'selected':''}>${esc(label)}</option>`).join('');return `<div class="fc-head"><div><h3>${esc(text('fcTitle'))}</h3><p>${esc(text('fcSub'))}</p></div><div class="fc-controls"><select id="fcDeck" aria-label="Deck">${deckOptions}</select><button class="secondary" type="button" data-fc="shuffle">${esc(text('fcShuffle'))}</button></div></div>`}
function renderCards(){const panel=$('#fcPanel');if(!panel)return;if(!FC.list.length){const msg=FC.mode==='unknown'?text('fcEmptyUnknown'):text('fcEmpty');panel.innerHTML=fcHeadHTML()+`<div class="fc-empty"><p>${esc(msg)}</p><button class="primary" type="button" data-fc="all">${esc(text('fcDeckAll'))}</button></div>`;return}
if(FC.i>=FC.list.length){const knownInDeck=FC.list.filter(x=>cardsState.known[x.c.id]).length;panel.innerHTML=fcHeadHTML()+`<div class="fc-done"><strong>${esc(text('fcDone'))}</strong><p>${esc(text('fcDoneSub'))} · ${knownInDeck}/${FC.list.length} ${esc(text('fcKnownStats'))}</p><div class="fc-actions"><button class="primary" type="button" data-fc="restart">${esc(text('fcRestart'))}</button><button class="secondary" type="button" data-fc="unknown">${esc(text('fcDeckUnknown'))}</button></div></div>`;return}
const item=FC.list[FC.i];const l=DATA.lessons[item.li];const knownInDeck=FC.list.filter(x=>cardsState.known[x.c.id]).length;const pct=Math.round(FC.i/FC.list.length*100);
panel.innerHTML=fcHeadHTML()+`<div class="fc-stage"><div class="fc-card ${FC.flipped?'flipped':''}" id="fcCard" data-fc="flip" tabindex="0" role="button" aria-label="Flashcard"><div class="fc-face fc-front" dir="ltr"><span class="fc-tag">${esc(cardTag(item.c.tag))}</span><div class="fc-text">${esc(item.c.front)}</div><p class="fc-hint">${esc(text('fcFlipHint'))}</p></div><div class="fc-face fc-back" dir="rtl"><span class="fc-tag">${esc(cardTag(item.c.tag))}</span><div class="fc-text">${esc(item.c.back)}</div><div class="fc-en" dir="ltr">${esc(item.c.tag==='fact'?item.c.en:item.c.front)}</div><p class="fc-hint">${esc(text('fcFlipHint'))}</p></div></div></div><div class="fc-actions"><button class="secondary" type="button" data-fc="again">${esc(text('fcAgain'))} ↻</button><button class="primary" type="button" data-fc="known">${esc(text('fcKnown'))} ✓</button></div><div class="fc-nav"><button class="secondary" type="button" data-fc="prev" ${FC.i===0?'disabled':''} aria-label="${esc(text('fcPrev'))}">←</button><span class="fc-counter">${FC.i+1} ${esc(text('of'))} ${FC.list.length}</span><button class="secondary" type="button" data-fc="next" ${FC.i===FC.list.length-1?'disabled':''} aria-label="${esc(text('fcNext'))}">→</button></div><div class="fc-progressline"><div class="progressbar" aria-hidden="true"><span style="width:${pct}%"></span></div><small>${knownInDeck}/${FC.list.length} ${esc(text('fcKnownStats'))}</small></div><p class="fc-lesson">${esc(lang==='ar'?l.titleAr:l.titleEn)}</p>`}
function fcBuild(mode){FC.mode=mode;FC.i=0;FC.flipped=false;const pool=[];if(mode==='lesson'){const l=DATA.lessons[current];(l?.cards||[]).forEach(c=>pool.push({c,li:current}))}else{DATA.lessons.forEach((l,li)=>{l.cards.forEach(c=>{if(mode!=='unknown'||!cardsState.known[c.id])pool.push({c,li})})})}FC.list=pool;renderCards()}
function fcShuffle(){if(!FC.list.length)return;for(let i=FC.list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=FC.list[i];FC.list[i]=FC.list[j];FC.list[j]=t}FC.i=0;FC.flipped=false;renderCards()}
function fcFlip(){if(!FC.list.length||FC.i>=FC.list.length)return;FC.flipped=!FC.flipped;const el=$('#fcCard');if(el&&el.classList)el.classList.toggle('flipped',FC.flipped)}
function fcNext(){if(!FC.list.length)return;FC.flipped=false;if(FC.i<FC.list.length)FC.i++;renderCards()}
function fcPrev(){if(!FC.list.length)return;FC.flipped=false;FC.i=Math.max(0,FC.i-1);renderCards()}
function fcMark(known){const item=FC.list[FC.i];if(!item)return;if(known)cardsState.known[item.c.id]=1;else delete cardsState.known[item.c.id];saveCards();fcNext()}
function fcState(){return{mode:FC.mode,size:FC.list.length,index:Math.min(FC.i,Math.max(0,FC.list.length-1)),flipped:FC.flipped,known:Object.keys(cardsState.known).length,tab}}
function switchTab(name){tab=name;['lesson','cards','sources'].forEach(t=>{const el=$('#tab-'+t);if(el)el.hidden=t!==name});const tabs=document.querySelectorAll('.tab');if(tabs)tabs.forEach(b=>{const on=b.dataset.tab===name;b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false')});if(name==='cards')fcBuild(FC.mode)}
let endArmed=null;
function disarmEnd(){if(endArmed){clearTimeout(endArmed);endArmed=null}const b=$('#focusEnd');if(!b)return;b.classList.remove('armed');b.textContent='✕'}
function focusEndClick(){if(!focusSession)return;if(endArmed){clearTimeout(endArmed);endArmed=null;finishFocus(true);return}const b=$('#focusEnd');b.classList.add('armed');b.textContent=text('focusSure');endArmed=setTimeout(disarmEnd,3500)}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#homeLink').textContent=text('back');$('#languageBtn').textContent=text('language');$('#exportBtn').textContent=text('export');$('#importLabel').textContent=text('import');$('#progressLabel').textContent=text('progress');$('#masteryLabel').textContent=text('mastery');$('#reviewDueLabel').textContent=text('reviewDue');$('#storageNote').textContent=text('storage');$('#medicalNote').textContent=text('medical');$('#allSourcesTitle').textContent=text('allSources');$('#saveStatus').textContent=storageWorks?text('saved'):text('storageError');$('#tabBtnLesson').textContent=text('tabLesson');$('#tabBtnCards').textContent=text('tabCards');$('#tabBtnSources').textContent=text('tabSources');document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=lang==='ar'?el.dataset.ar:el.dataset.en);renderLesson();if(tab==='cards')fcBuild(FC.mode);$('#languageBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('study-system:lang',lang)}catch(e){};render()};$('#exportBtn').onclick=exportState;$('#importFile').onchange=e=>{importState(e.target.files?.[0]);e.target.value=''};$('#mobileLessons').onchange=e=>openLesson(Number(e.target.value));$('#railToggle').onclick=()=>setRail(!railOpen);$('#railBackdrop').onclick=()=>setRail(false);$('#focusViewLesson').onclick=()=>setFocusView('lesson');$('#focusViewCards').onclick=()=>setFocusView('cards');$('#focusPauseBtn').onclick=()=>{if(!focusSession)return;focusSession.paused?focusPlay():pauseFocus()};$('#fcPanel').addEventListener('change',e=>{if(e.target&&e.target.id==='fcDeck')fcBuild(e.target.value)});$('#fcPanel').onclick=e=>{const b=e.target.closest('[data-fc]');if(!b)return;const act=b.dataset.fc;if(act==='flip')fcFlip();else if(act==='known')fcMark(true);else if(act==='again')fcMark(false);else if(act==='next')fcNext();else if(act==='prev')fcPrev();else if(act==='shuffle')fcShuffle();else if(act==='restart')fcBuild(FC.mode);else if(act==='all')fcBuild('all');else if(act==='unknown')fcBuild('unknown')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('#focusPrevLesson').onclick=()=>focusStep(-1);$('#focusNextLesson').onclick=()=>focusStep(1);$('#focusEnd').onclick=focusEndClick;$('#breakSkip').onclick=skipBreak;document.addEventListener('keydown',e=>{const t=e.target,tag=t?t.tagName:'';if(['INPUT','TEXTAREA'].includes(tag))return;if(e.key==='Escape'&&!document.body.classList.contains('focus-mode')){if(railOpen)setRail(false);return}if(document.body.classList.contains('focus-mode')){if(tag==='SELECT')return;if(focusView==='cards'){if(e.code==='Space'||e.key===' '){e.preventDefault();fcFlip()}else if(e.key==='ArrowRight')fcNext();else if(e.key==='ArrowLeft')fcPrev()}else{if(e.key==='ArrowRight')focusStep(1);else if(e.key==='ArrowLeft')focusStep(-1)}return}if(tab!=='cards')return;if(e.code==='Space'||e.key===' '){e.preventDefault();fcFlip()}else if(e.key==='ArrowRight')fcNext();else if(e.key==='ArrowLeft')fcPrev()})}
function renderSourceLibrary(){const all=DATA.sources.map(s=>`<details class="evidence-wrap"><summary>${esc(s.display)} · ${s.records.length} ${esc(text('sourceText'))}</summary>${s.records.map(r=>excerptHTML({...r,file:s.file})).join('')}</details>`).join('');$('#sourceLibrary').innerHTML=all||`<p class="empty">${esc(text('empty'))}</p>`}
load();current=state.current||0;loadCards();
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b&&b.closest('#rail, #reviewList')){openLesson(Number(b.dataset.open));setRail(false)}else if(e.target.closest('#railClose')){setRail(false)}});
document.addEventListener('DOMContentLoaded',()=>{renderSourceLibrary();render();setRail(railPref());restoreFocus()});
</script></body></html>
