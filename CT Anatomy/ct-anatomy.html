production","Coordination of movement and balance","Reasoning"],"answer":2,"why":"The cerebellum coordinates movement, posture, and balance.","type":"mcq","points":1,"label":"Midterm bank · Brain Q39","source":{"part":0,"qn":39}},{"part":0,"n":47,"q":"Which part of the corpus callosum is specifically labeled in the lecture?","options":["Body only","Fornix","Rostrum only","Genu and splenium"],"answer":3,"why":"Genu and splenium are specifically illustrated.","type":"mcq","points":1,"label":"Midterm bank · Brain Q47","source":{"part":0,"qn":47}}],"audios":[{"src":"Audio/CTA-Brain-2.m4a","title":"Brain anatomy — lecture 2","start":0,"end":0}],"visuals":[{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 40","n":40,"asset":"images\\2.BRAIN\\page-40.png","path":"Assets/cta-brain/page-40.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 41","n":41,"asset":"images\\2.BRAIN\\page-41.png","path":"Assets/cta-brain/page-41.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 43","n":43,"asset":"images\\2.BRAIN\\page-43.png","path":"Assets/cta-brain/page-43.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 44","n":44,"asset":"images\\2.BRAIN\\page-44.png","path":"Assets/cta-brain/page-44.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 45","n":45,"asset":"images\\2.BRAIN\\page-45.png","path":"Assets/cta-brain/page-45.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 46","n":46,"asset":"images\\2.BRAIN\\page-46.png","path":"Assets/cta-brain/page-46.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 47","n":47,"asset":"images\\2.BRAIN\\page-47.png","path":"Assets/cta-brain/page-47.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 48","n":48,"asset":"images\\2.BRAIN\\page-48.png","path":"Assets/cta-brain/page-48.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 49","n":49,"asset":"images\\2.BRAIN\\page-49.png","path":"Assets/cta-brain/page-49.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 50","n":50,"asset":"images\\2.BRAIN\\page-50.png","path":"Assets/cta-brain/page-50.png"}]},{"id":"cta-brain-veins","titleAr":"الجيوب الوريدية والتصوير الوريدي","titleEn":"Dural venous sinuses and venography","summaryAr":"الجيوب بين طبقتي الأم الصلبة + الجيوب الممتدة والملتقى + الكهفي والصخريين + التصوير الوريدي وبعد التباين.","summaryEn":"Sinuses between dural layers, falx sinuses and confluence, cavernous and petrosal sinuses, CT venography and post-contrast brain.","objectivesAr":["تتبع الصرف الوريدي للدماغ.","سمّ جيوب الشوكة.","صف جريان الكهفي."],"objectivesEn":["Trace the venous drainage.","Name the falx sinuses.","Describe cavernous sinus flow."],"refs":[{"source":"cta-brain","n":51},{"source":"cta-brain","n":52},{"source":"cta-brain","n":53},{"source":"cta-brain","n":54},{"source":"cta-brain","n":55},{"source":"cta-brain","n":56}],"galleryRefs":[],"evidence":[{"file":"2.BRAIN.pdf","loc":"Page 51","text":"The Venous Drainage of the Central Nervous System • The dural venous sinuses lie between the periosteal and meningeal layers of the dura mater. They are best thought of as collecting pools of blood, which drain the brain. • Unlike most veins of the body, the dural venous sinuses do not have valves. • All the dural venous sinuses ultimately drain into the internal jugular vein.","egyptian":"الجيوب الوريدية الجامعة بين طبقتي الأم الجامعة — دمول تجميع بتصرف الدماغ، ومفيش فيها صمامات، وكلها في الآخر بتصرف في الوريد الوداجي الداخلي."},{"file":"2.BRAIN.pdf","loc":"Page 52","text":"• The straight, superior, and inferior sagittal sinuses are found in the falx cerebri . They converge at the confluence of sinuses (overlying the internal occipital protuberance). • The straight sinus is a continuation of the great cerebral vein and the inferior sagittal sinus. • From the confluence, the transverse sinus continues bi-laterally and curves into the sigmoid sinus to meet the opening of the internal jugular vein. • The cavernous sinus drains the ophthalmic veins and can be found on either side of the sella turcica. From here, the blood returns to the internal jugular vein via the superior or inferior petrosal sinuses. The Venous SINUSES","egyptian":"المستقيم والسهمي العلوي والسفلي جوه منجل المخ وبيتقابلوا في ملتقى الجيوب فوق النتوء القذالي الداخلي — والمستقيم تكملة الوريد الدماغي الكبير مع السهمي السفلي؛ ومن الملتقى المستعرض بيكمّل على الجانبين ويلف في السigmoidي لحد فتحة الوداجي الداخلي؛ والكهفي بيصرف الأوردة الحجاجية وجنبي السرج وبيرجع الدم للوداجي عبر الجيب الصخري العلوي أو السفلي."},{"file":"2.BRAIN.pdf","loc":"Page 53","text":"Ct venography","egyptian":"الـ CTV: تصوير وريدي بالتباين بيوضح الجيوب الجامعة ومساراتها."},{"file":"2.BRAIN.pdf","loc":"Page 54","text":"Post contrast Ct brain","egyptian":"بعد التباين: الأوعية والبنى تغمق (تعزز) — صور مرجعية لتوزيع التروية."},{"file":"2.BRAIN.pdf","loc":"Page 55","text":"Post contrast Ct brain","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"file":"2.BRAIN.pdf","loc":"Page 56","text":"Post contrast Ct brain","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."}],"quiz":[{"type":"mcq","q":"Where do the dural venous sinuses lie?","options":["Between the periosteal and meningeal layers of dura","Between arachnoid and pia","Inside the diploic space","Along the falx only"],"answer":0,"why":"The sinuses lie between the two dural layers, which separate only to form them.","source":{"source":"cta-brain","n":51},"points":1},{"type":"mcq","q":"Which sinuses converge at the confluence of sinuses?","options":["Straight, superior and inferior sagittal","Cavernous and petrosal","Transverse and sigmoid","Superior and inferior petrosal"],"answer":0,"why":"The straight, superior and inferior sagittal sinuses converge at the confluence over the internal occipital protuberance.","source":{"source":"cta-brain","n":52},"points":1}],"cards":[{"id":"bfd0bf8502","front":"Where do dural sinuses lie and drain?","back":"بين طبقتي الجامعة، بلا صمامات، بتصرّف في الوداجي الداخلي.","en":"Between dural layers, valveless, draining to the internal jugular vein.","tag":"fact"},{"id":"957cad0d5e","front":"Which sinuses run in the falx and where do they meet?","back":"المستقيم والسهمي العلوي والسفلي — بيلتقوا في ملتقى الجيوب.","en":"Straight and superior/inferior sagittal, converging at the confluence.","tag":"fact"},{"id":"22c2df3c58","front":"Describe the cavernous sinus drainage","back":"بيصرف الأوردة الحجاجية جنبي السرج وبيصرف للوداجي عبر الصخري العلوي أو السفلي.","en":"Drains ophthalmic veins beside the sella; returns to the IJV via superior or inferior petrosal sinuses.","tag":"fact"},{"id":"06dfd55ad8","front":"Where do the dural venous sinuses lie?","back":"Between the periosteal and meningeal layers of dura — The sinuses lie between the two dural layers, which separate only to form them.","en":"Between the periosteal and meningeal layers of dura","tag":"quiz"},{"id":"47924ddda8","front":"Which sinuses converge at the confluence of sinuses?","back":"Straight, superior and inferior sagittal — The straight, superior and inferior sagittal sinuses converge at the confluence over the internal occipital protuberance.","en":"Straight, superior and inferior sagittal","tag":"quiz"}],"midterm":[{"part":0,"n":34,"q":"CSF is ultimately absorbed into the dural venous sinuses via:","options":["Foramina of Monro","Cerebral aqueduct","Arachnoid villi","Choroid plexus"],"answer":2,"why":"Arachnoid villi absorb CSF into dural venous sinuses.","type":"mcq","points":1,"label":"Midterm bank · Brain Q34","source":{"part":0,"qn":34}}],"audios":[{"src":"Audio/CTA-Brain-2.m4a","title":"Brain anatomy — lecture 2","start":0,"end":0}],"visuals":[{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 51","n":51,"asset":"images\\2.BRAIN\\page-51.png","path":"Assets/cta-brain/page-51.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 52","n":52,"asset":"images\\2.BRAIN\\page-52.png","path":"Assets/cta-brain/page-52.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 53","n":53,"asset":"images\\2.BRAIN\\page-53.png","path":"Assets/cta-brain/page-53.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 54","n":54,"asset":"images\\2.BRAIN\\page-54.png","path":"Assets/cta-brain/page-54.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 55","n":55,"asset":"images\\2.BRAIN\\page-55.png","path":"Assets/cta-brain/page-55.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 56","n":56,"asset":"images\\2.BRAIN\\page-56.png","path":"Assets/cta-brain/page-56.png"}]},{"id":"cta-lung-airways","titleAr":"الطرق الهوائية والأوعية الرئوية","titleEn":"Airways and pulmonary vessels","summaryAr":"نمط الفحص المنظم + القصبة والكارينا والشعب + لؤلؤة القصبات المتسعة + الشرايين بجوار الشعب مقابل الأوردة الأربعة.","summaryEn":"The systematic search pattern, trachea/carina/bronchi, the bronchiectasis pearl, arteries following bronchi versus the four veins.","objectivesAr":["رتّب نمط الفحص المنظم.","قارن الشعبة اليمنى باليسرى.","ميّز الشريان عن الوريد."],"objectivesEn":["Order the search pattern.","Compare right vs left bronchus.","Tell artery from vein."],"refs":[{"source":"cta-lung1","n":2},{"source":"cta-lung1","n":3},{"source":"cta-lung1","n":7},{"source":"cta-lung1","n":8},{"source":"cta-lung1","n":14},{"source":"cta-lung1","n":15}],"galleryRefs":[{"source":"cta-lung1","n":4},{"source":"cta-lung1","n":5},{"source":"cta-lung1","n":6},{"source":"cta-lung1","n":9},{"source":"cta-lung1","n":10},{"source":"cta-lung1","n":11},{"source":"cta-lung1","n":12},{"source":"cta-lung1","n":13}],"evidence":[{"file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 2","text":"Introduction: Why Mastering Anatomy is Your First Tool You cannot recognize the abnormal until you intimately know the normal. Anatomy provides the roadmap for describing disease location (e.g., \"right lower lobe nodule\" vs. \"a spot in the lung\"). It informs your differential diagnosis (e.g., a mass in the anterior mediastinum has a different differential than one in the lung apex). Today, we will build a systematic approach to navigating a CT chest, from the great vessels down to the secondary pulmonary lobule.","egyptian":"مش هتعرف الشاذ إلا لو حافظ الطبيعي — التشريح خريطة تحديد مكان المرض (عقدة في الفص السفلي الأيمن مش «بقعة في الرئة») وهو اللي بيوجه التشخيص التفريقي (كتلة أمام المنصف غير كتلة قمة الرئة)."},{"file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 3","text":"The Systematic Search Pattern: Your Diagnostic Checklist A structured approach: Trachea & Central Airways Mediastinum & Great Vessels Hila (Pulmonary Vessels & Lymph Nodes) Lungs (Lobes, Fissures, Parenchyma) Pleura & Chest Wall Upper Abdomen (Liver, Spleen, Adrenals - \"Don't miss!\") Always use the same pattern . This is how you avoid missing a small nodule because you were distracted by a large hiatal hernia.\"","egyptian":"نمط الفحص المنظم بنفس الترتيب كل مرة: القصبة والمسالك ← المنصف والأوعية الكبيرة ← السرتين (أوعية وعقد) ← الرئتين (فصوص وشقوق وبرانشيم) ← الجنبة والقفص الصدري ← البطن الأعلى (كبد وطحال وكظر — متسيبهاش!) — الثبات ده هو اللي بيمنع تفويت عقدة صغيرة وأنت مشتت بفتق حجابي كبير."},{"file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 7","text":"Key Structures: Trachea: C-shaped cartilaginous rings. Carina: The ridge separating the right and left mainstem bronchi. Mainstem Bronchi: The right is wider, shorter, and more vertical than the left (why foreign bodies go right!). Lobar and Segmental Bronchi: Learn the names of the major segments (e.g., RUL apical, LLL superior).","egyptian":"القصبة حلقات غضروفية على شكل C؛ والكارينا الحرف الفاصل بين الشعبتين — واليمنى أعرض وأقصر وأكثر عمودية (عشان كده الأجسام الغريبة بتروح يمين!)؛ وبعدها شعب فصية وقطعية لازم تحفظ أسماءها (زي قمي العلوي الأيمن وعلوي السفلي الأيسر)."},{"file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 8","text":"Clinical Pearl: \"In the axial plane, an airway and its accompanying pulmonary artery should be the same size. If the airway is dilated and the artery looks small, think bronchiectasis .\"","egyptian":"لؤلؤة إكلينيكية: في القطاع الأكسيل الشعيبة مع شريانها الرئوي لازم نفس الحجم — لو الشعيبة متوسعة والشريان صغير: فكر في Bronchiectasis."},{"file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 14","text":"Pulmonary Arteries: Carry deoxygenated blood. Pulmonary trunk…..right and left main pulmonary arteries…..lobar branches ….segmental and subsegmental branches Follow the bronchi. They branch together.","egyptian":"الشرايين الرئوية شايلة دم غير مؤكسج: الجذع الرئوي ← أيمن وأيسر ← فروع فصية ← قطعية وتحت قطعية — ماشية مع الشعب وبتتفرع معاها."},{"file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 15","text":"Pulmonary Veins: Carry oxygenated blood. Four pulmonary veins: right superior, right inferior, left superior and left inferior veins Run between segments towards the left atrium.","egyptian":"الأوردة الرئوية شايلة دم مؤكسج وعددها 4: أعلى وأسفل يمين وأعلى وأسفل يسار — ماشية بين القطع في اتجاه الأذين الأيسر."}],"quiz":[{"type":"mcq","q":"Why do inhaled foreign bodies tend to go to the right bronchus?","options":["It is wider, shorter and more vertical","It is longer and narrower","The left has more cartilage","The carina deviates left"],"answer":0,"why":"The right main bronchus is wider, shorter and more vertical than the left.","source":{"source":"cta-lung1","n":7},"points":1},{"type":"mcq","q":"In the axial plane, an airway noticeably larger than its accompanying pulmonary artery suggests:","options":["Bronchiectasis","A normal variant","Pulmonary embolism","A pulmonary varix"],"answer":0,"why":"Airway and artery should match in size; a dilated airway with a small artery means bronchiectasis.","source":{"source":"cta-lung1","n":8},"points":1}],"cards":[{"id":"03bdeff8a3","front":"Recite the systematic search pattern","back":"قصبة ومسالك ← منصف وأوعية ← سرتين ← رئتين ← جنبة وقفص ← بطن أعلى.","en":"Airways, mediastinum/great vessels, hila, lungs, pleura/chest wall, upper abdomen.","tag":"fact"},{"id":"97e96b46c3","front":"Right vs left main bronchus","back":"الأيمن أعرض وأقصر وأكثر عمودية — الأجسام الغريبة بتيجي عليه.","en":"Right: wider, shorter, more vertical — foreign bodies go right.","tag":"fact"},{"id":"6abd44c0a4","front":"How do pulmonary arteries and veins differ?","back":"الشرايين دم غير مؤكسج ماشية مع الشعب؛ الأوردة 4 (يمين/يسار فوق وتحت) بين القطع للأذين الأيسر.","en":"Arteries: deoxygenated, follow bronchi; four veins run intersegmental to the left atrium.","tag":"fact"},{"id":"268e485b1f","front":"The bronchiectasis pearl","back":"الشعيبة والشريان نفس الحجم في القطاع — شعيبة متوسعة مع شريان صغير = توسع قصبات.","en":"Airway equals artery in size; dilated airway with small artery = bronchiectasis.","tag":"fact"},{"id":"ed0d43f53f","front":"Why do inhaled foreign bodies tend to go to the right bronchus?","back":"It is wider, shorter and more vertical — The right main bronchus is wider, shorter and more vertical than the left.","en":"It is wider, shorter and more vertical","tag":"quiz"},{"id":"1bc1541d2c","front":"In the axial plane, an airway noticeably larger than its accompanying pulmonary artery suggests:","back":"Bronchiectasis — Airway and artery should match in size; a dilated airway with a small artery means bronchiectasis.","en":"Bronchiectasis","tag":"quiz"}],"midterm":[{"part":0,"n":22,"q":"The first step of the systematic search pattern is:","options":["Pleura","Upper abdomen","Hila","Trachea and central airways"],"answer":3,"why":"Pattern: airways first, ending with the upper abdomen check.","type":"mcq","points":1,"label":"Midterm bank · Q22","source":{"part":0,"qn":22}},{"part":0,"n":23,"q":"Pulmonary arteries carry:","options":["Oxygenated blood","CSF","Deoxygenated blood","Lymph"],"answer":2,"why":"Arteries carry deoxygenated blood from the right heart; veins carry oxygenated to the left atrium.","type":"mcq","points":1,"label":"Midterm bank · Q23","source":{"part":0,"qn":23}},{"part":0,"n":24,"q":"The four pulmonary veins drain into the:","options":["IVC","Right atrium","Left atrium","SVC"],"answer":2,"why":"Right and left superior and inferior veins run to the left atrium.","type":"mcq","points":1,"label":"Midterm bank · Q24","source":{"part":0,"qn":24}}],"audios":[{"src":"Audio/CTA-Chest-1.m4a","title":"Lung anatomy — lecture 1","start":0,"end":0}],"visuals":[{"source":"cta-lung1","file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 8","n":8,"asset":"images\\5.CT-Lung-Anatomy-P-1\\visual-8a4aec483927.png","path":"Assets/cta-lung1/visual-8a4aec483927.png"},{"source":"cta-lung1","file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 5","n":5,"asset":"images\\5.CT-Lung-Anatomy-P-1\\visual-d36494bd6f20.jpg","path":"Assets/cta-lung1/visual-d36494bd6f20.jpg"},{"source":"cta-lung1","file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 6","n":6,"asset":"images\\5.CT-Lung-Anatomy-P-1\\visual-4bf4557868c3.jpg","path":"Assets/cta-lung1/visual-4bf4557868c3.jpg"},{"source":"cta-lung1","file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 9","n":9,"asset":"images\\5.CT-Lung-Anatomy-P-1\\visual-be0ef2ee4b29.png","path":"Assets/cta-lung1/visual-be0ef2ee4b29.png"},{"source":"cta-lung1","file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 13","n":13,"asset":"images\\5.CT-Lung-Anatomy-P-1\\visual-b984ab933082.jpg","path":"Assets/cta-lung1/visual-b984ab933082.jpg"}]},{"id":"cta-lung-lobes","titleAr":"الفصوص والشقوق الرئوية","titleEn":"Lung lobes and fissures","summaryAr":"يمين 3 فصوص ويسار 2 + الشق الرئيسي والأصلي + قاعدة «هواء واحد فص واحد» لقراءة الشقوق على المقاطع.","summaryEn":"Right three lobes, left two; major and minor fissures; the one-air-one-lobe rule for reading fissures on axial cuts.","objectivesAr":["عدّ فصوص كل رئة.","ميّز الرئيسي عن الأصلي.","طبّق قاعدة الهواء الواحد."],"objectivesEn":["Count each lung's lobes.","Distinguish major from minor fissure.","Apply the one-air rule."],"refs":[{"source":"cta-lung1","n":16},{"source":"cta-lung1","n":18},{"source":"cta-lung1","n":19},{"source":"cta-lung1","n":20},{"source":"cta-lung1","n":21},{"source":"cta-lung1","n":22}],"galleryRefs":[{"source":"cta-lung1","n":17}],"evidence":[{"file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 16","text":"Lobes and Fissures: The Lung's compartments","egyptian":"الفصوص والشقوق: يمين 3 فصوص (علوي وأوسط وسفلي) ويسار 2 (علوي وسفلي) — الشق الرئيسي (المائل) بيفصل العلوي/الأوسط عن السفلي وغالبًا ناقص؛ والأصلي (الأفقي) يمين بس بيفصل العلوي عن الأوسط."},{"file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 19","text":"One air (trachea) …one lobe (upper lobe)","egyptian":"قاعدة القراءة: هواء واحد (قصبة) = فص واحد (العلوي)."},{"file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 20","text":"Two air (two bronchi)…two lobes (upper and lower)","egyptian":"هوائي اتنين (شعبتين) = فصين (العلوي والسفلي)."},{"file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 21","text":"Heart level (middle lobe and lingula)","egyptian":"مستوى القلب = الفص الأوسط واللسينة."},{"file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 22","text":"Right Lung: 3 Lobes (Upper, Middle, Lower) Left Lung: 2 Lobes (Upper, Lower) Key Fissures: Major (Oblique) Fissure: Separates upper/middle from lower lobes. Often incomplete. Minor (Horizontal) Fissure: Right side only. Separates RUL from RML.","egyptian":"اليمين 3 فصوص واليسار 2 — الرئيسي بيفصل فوق من تحت والأصلي يمين بس."}],"quiz":[{"type":"mcq","q":"At a level showing two bronchi (two air columns), how many lobes are you imaging?","options":["Two lobes","One lobe","Three lobes","Four lobes"],"answer":0,"why":"The rule: one air = one lobe; two air = two lobes (upper and lower).","source":{"source":"cta-lung1","n":20},"points":1},{"type":"mcq","q":"Which fissure is found only on the right side?","options":["Minor (horizontal) fissure","Major (oblique) fissure","Accessory fissure","Azygos fissure"],"answer":0,"why":"The minor horizontal fissure separates the right upper from the right middle lobe.","source":{"source":"cta-lung1","n":22},"points":1}],"cards":[{"id":"61a5a1b5af","front":"Count lobes per side","back":"يمين 3 (علوي أوسط سفلي)؛ يسار 2 (علوي وسفلي).","en":"Right 3; left 2.","tag":"fact"},{"id":"3c080b029d","front":"Major vs minor fissure","back":"الرئيسي مائل بيفصل فوق من تحت وغالبًا ناقص؛ الأصلي أفقي يمين بس.","en":"Major oblique separates upper/middle from lower; minor horizontal right-only.","tag":"fact"},{"id":"f2dd74ddbb","front":"Apply the one-air rule","back":"هواء واحد = فص واحد؛ هوائي اثنان = فصين؛ مستوى القلب = الأوسط واللسينة.","en":"One airway = one lobe; two = two lobes; heart level = middle lobe and lingula.","tag":"fact"},{"id":"3447747cb4","front":"At a level showing two bronchi (two air columns), how many lobes are you imaging?","back":"Two lobes — The rule: one air = one lobe; two air = two lobes (upper and lower).","en":"Two lobes","tag":"quiz"},{"id":"62d4590699","front":"Which fissure is found only on the right side?","back":"Minor (horizontal) fissure — The minor horizontal fissure separates the right upper from the right middle lobe.","en":"Minor (horizontal) fissure","tag":"quiz"}],"midterm":[{"part":0,"n":25,"q":"The major (oblique) fissure separates:","options":["RUL from RML","Upper/middle from lower lobes","Right from left lung","Segment from segment"],"answer":1,"why":"Oblique separates upper/middle from lower; horizontal (right only) separates RUL from RML.","type":"mcq","points":1,"label":"Midterm bank · Q25","source":{"part":0,"qn":25}},{"part":0,"n":26,"q":"At heart level on axial cuts you expect:","options":["Only lower lobes","Middle lobe and lingula","The carina","Three lobes per side"],"answer":1,"why":"Heart level shows the right middle lobe and the lingula.","type":"mcq","points":1,"label":"Midterm bank · Q26","source":{"part":0,"qn":26}},{"part":0,"n":27,"q":"On CT, fissures typically appear as:","options":["A dense white band","An air column","A calcified stripe","A thin avascular line"],"answer":3,"why":"Fissures show as thin paucity-of-vessels lines rather than dense bands.","type":"mcq","points":1,"label":"Midterm bank · Q27","source":{"part":0,"qn":27}}],"audios":[{"src":"Audio/CTA-Chest-1.m4a","title":"Lung anatomy — lecture 1","start":0,"end":0}],"visuals":[{"source":"cta-lung1","file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 16","n":16,"asset":"images\\5.CT-Lung-Anatomy-P-1\\visual-f5fef44b7419.png","path":"Assets/cta-lung1/visual-f5fef44b7419.png"},{"source":"cta-lung1","file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 19","n":19,"asset":"images\\5.CT-Lung-Anatomy-P-1\\visual-d121b25be8b4.jpeg","path":"Assets/cta-lung1/visual-d121b25be8b4.jpeg"},{"source":"cta-lung1","file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 19","n":19,"asset":"images\\5.CT-Lung-Anatomy-P-1\\visual-610adea2e223.jpg","path":"Assets/cta-lung1/visual-610adea2e223.jpg"},{"source":"cta-lung1","file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 20","n":20,"asset":"images\\5.CT-Lung-Anatomy-P-1\\visual-266e0339f92e.jpeg","path":"Assets/cta-lung1/visual-266e0339f92e.jpeg"},{"source":"cta-lung1","file":"5.CT Lung Anatomy P 1.pptx","loc":"Slide 21","n":21,"asset":"images\\5.CT-Lung-Anatomy-P-1\\visual-578bc4792f2a.jpg","path":"Assets/cta-lung1/visual-578bc4792f2a.jpg"}]},{"id":"cta-lung-segments","titleAr":"القطع الرئوية: 10 يمين و8 يسار","titleEn":"Lung segments: 10 right, 8 left","summaryAr":"قطع الفص العلوي والأوسط والسفلي الأيمن + الأيسر باندماج القمي الخلفي واللسان وفقدان الإنسي الأنسي.","summaryEn":"Right upper/middle/lower segments; left fusion of apicoposterior, lingula, and the absent medial basal segment.","objectivesAr":["عدّ قطع كل فص.","سمّ القطع المندمجة يسارًا.","علّق على الغائب الأنسي."],"objectivesEn":["Count segments per lobe.","Name the fused left segments.","Note the absent medial one."],"refs":[{"source":"cta-lung2","n":2},{"source":"cta-lung2","n":3}],"galleryRefs":[],"evidence":[{"file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 2","text":"LUNG SEGMENTS","egyptian":"القطع الرئوية: عنوان دقيق لمكان المرض."},{"file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 3","text":"Right Lung (10 segments) RUL: 3 segments - Apical, Posterior, Anterior RML: 2 segments - Lateral, Medial RLL: 5 segments - Superior, Medial basal, Anterior basal, Lateral basal, Posterior basal Left Lung (8 segments) LUL: 4 segments. The apical and posterior segments often fuse to form the apicoposterior segment. The anterior segment. The lingula has a superior and inferior segment, analogous to the RML. LLL: Usually 4 segments. The superior, anterior, lateral basal and posterior basal…………(no medial segment)","egyptian":"اليمين 10 قطع: العلوي 3 (قمي وخلفي وأمامي) والأوسط 2 (وحشي وإنسي) والسفلي 5 (علوي + قاعدية: إنسي وأمامي ووحشي وخلفي)؛ اليسار 8: العلوي 4 (القمي مع الخلفي بيلتحموا قمي-خلفي + الأمامي + اللسينة قطع علوي وسفلي بديل الأوسط) والسفلي 4 (علوي + قاعدية أمامي ووحشي وخلفي — مفيش إنسي!)."}],"quiz":[{"type":"mcq","q":"How many segments does the right lung have, and the left?","options":["10 right, 8 left","8 right, 10 left","10 right, 10 left","9 right, 8 left"],"answer":0,"why":"Right lung 10 segments; left lung 8 with the apicoposterior fusion and no medial basal segment.","source":{"source":"cta-lung2","n":3},"points":1},{"type":"mcq","q":"Which segment is characteristically absent in the left lower lobe?","options":["Medial basal","Anterior basal","Lateral basal","Posterior basal"],"answer":0,"why":"The left lower lobe has superior, anterior basal, lateral basal and posterior basal — no medial basal.","source":{"source":"cta-lung2","n":3},"points":1}],"cards":[{"id":"415aeaef20","front":"Right lung segments","back":"علوي 3 (قمي خلفي أمامي) + أوسط 2 (وحشي إنسي) + سفلي 5 (علوي + 4 قاعدية).","en":"RUL 3, RML 2, RLL 5 (superior + 4 basal).","tag":"fact"},{"id":"f45a3a139e","front":"Left lung segments and its two quirks","back":"8: قمي-خلفي ملتحم + أمامي + لسينة (علوي/سفلي) + سفلي 4 (مفيش إنسي).","en":"8: fused apicoposterior, lingula replaces middle, no medial basal.","tag":"fact"},{"id":"8c09c54839","front":"How many segments does the right lung have, and the left?","back":"10 right, 8 left — Right lung 10 segments; left lung 8 with the apicoposterior fusion and no medial basal segment.","en":"10 right, 8 left","tag":"quiz"},{"id":"308fb79b37","front":"Which segment is characteristically absent in the left lower lobe?","back":"Medial basal — The left lower lobe has superior, anterior basal, lateral basal and posterior basal — no medial basal.","en":"Medial basal","tag":"quiz"}],"midterm":[{"part":0,"n":28,"q":"The right middle lobe has:","options":["Anterior basal only","Superior and inferior","Apical and posterior","Lateral and medial segments"],"answer":3,"why":"RML: lateral and medial segments.","type":"mcq","points":1,"label":"Midterm bank · Q28","source":{"part":0,"qn":28}},{"part":0,"n":29,"q":"The lingula is analogous to:","options":["The right upper lobe","The right middle lobe","The left lower lobe","The apicoposterior segment"],"answer":1,"why":"Superior and inferior lingular segments mirror the RML.","type":"mcq","points":1,"label":"Midterm bank · Q29","source":{"part":0,"qn":29}},{"part":0,"n":30,"q":"The left upper lobe has 4 segments because:","options":["The lingula is absent","The medial basal persists","There is no anterior segment","Apical and posterior fuse into apicoposterior"],"answer":3,"why":"Apical + posterior fuse; plus anterior, plus superior and inferior lingula.","type":"mcq","points":1,"label":"Midterm bank · Q30","source":{"part":0,"qn":30}}],"audios":[{"src":"Audio/CTA-Chest-2.m4a","title":"Lung anatomy — lecture 2","start":0,"end":0}],"visuals":[{"source":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 2","n":2,"asset":"images\\6.CT-Lung-Anatomy-P-2\\page-2.png","path":"Assets/cta-lung2/page-2.png"},{"source":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 3","n":3,"asset":"images\\6.CT-Lung-Anatomy-P-2\\page-3.png","path":"Assets/cta-lung2/page-3.png"}]},{"id":"cta-lung-mediastinum","titleAr":"المنصف بأربع حجرات والسرة","titleEn":"Mediastinum compartments and the hilum","summaryAr":"النموذج الرباعي: علوي/أمامي/أوسط/خلفي بمحتوياتهم + لؤلؤة تحديد الحجرة + السرة بترتيب و-ش-ق من الأمام للخلف.","summaryEn":"The four-compartment model with contents, the localize-first pearl, and the hilum read anterior-to-posterior as V-A-B.","objectivesAr":["رتّب حجرات المنصف.","حدد محتويات كل حجرة.","رتّب عناصر السرة."],"objectivesEn":["Order the mediastinal compartments.","List each compartment's contents.","Order the hilar elements."],"refs":[{"source":"cta-lung2","n":4},{"source":"cta-lung2","n":7},{"source":"cta-lung2","n":8},{"source":"cta-lung2","n":10}],"galleryRefs":[{"source":"cta-lung2","n":5},{"source":"cta-lung2","n":6},{"source":"cta-lung2","n":9},{"source":"cta-lung2","n":11}],"evidence":[{"file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 4","text":"The Mediastinum: A Compartmental Approach","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 7","text":"Use the simplified 4-compartment model: Superior Mediastinum: aortic arch and branches (brachiocephalic, left common carotid and left subclavian), two brachiocephalic veins (ending into SVC) Anterior Mediastinum: Thymus, lymph nodes, fat. Middle Mediastinum: Heart, pericardium, great vessels Posterior Mediastinum: Descending aorta, esophagus, azygos/hemiazygos veins, nerves, lymph nodes.","egyptian":"المنصف بنموذج 4 حجرات: علوي (قوس الأورطى وفروعه والعضديان الرأسيان اللي بيكملوا SVC) وأمامي (التوتة والعقد والدهون) وأوسط (القلب والتامور والأوعية الكبيرة) وخلفي (الأورطى الهابط والمريء والفنجاني ونصف الفنجاني والأعصاب والعقد)."},{"file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 8","text":"•Clinical Pearl: \"When you see a mass, first localize it to a compartment. This instantly narrows your differential diagnosis from 50 possibilities to about 5.\"","egyptian":"لؤلؤة: أول ما تشوف كتلة حدد حجرة المنصف الأول — ده بيقفل التشخيص التفريقي من 50 لحد 5."},{"file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 10","text":"The Hilum: Don't Get Lost •From anterior to posterior: •Vein, Artery, Bronchus •(V-A-B).","egyptian":"السرة من الأمام للخلف: وريد ← شريان ← شعبة (و-ش-ق V-A-B) — الترتيب اللي مش هتضيع معاه."}],"quiz":[{"type":"mcq","q":"In the four-compartment model, the thymus, lymph nodes and fat belong to:","options":["The anterior mediastinum","The superior mediastinum","The middle mediastinum","The posterior mediastinum"],"answer":0,"why":"Anterior compartment: thymus, lymph nodes and fat.","source":{"source":"cta-lung2","n":7},"points":1},{"type":"mcq","q":"From anterior to posterior, the hilar structures read as:","options":["Vein, Artery, Bronchus (V-A-B)","Artery, Vein, Bronchus","Bronchus, Artery, Vein","Vein, Bronchus, Artery"],"answer":0,"why":"The hilum runs anterior-to-posterior as Vein-Artery-Bronchus.","source":{"source":"cta-lung2","n":10},"points":1}],"cards":[{"id":"6632a918fd","front":"The four mediastinal compartments and contents","back":"علوي (قوس وفروعه + عضديان)؛ أمامي (توتة عقد دهون)؛ أوسط (قلب تامور أوعية)؛ خلفي (أورطى مريء فنجاني أعصاب عقد).","en":"Superior: arch and branches; anterior: thymus/nodes/fat; middle: heart/pericardium; posterior: aorta, esophagus, azygos, nerves.","tag":"fact"},{"id":"0507aaa4eb","front":"The hilum order and the mass pearl","back":"السرة: و-ش-ق من قدام لورا؛ والكتلة: حدد الحجرة الأول يقفل التفريقي.","en":"Hilum: V-A-B anterior to posterior; a mass — localize the compartment first.","tag":"fact"},{"id":"1370470e15","front":"In the four-compartment model, the thymus, lymph nodes and fat belong to:","back":"The anterior mediastinum — Anterior compartment: thymus, lymph nodes and fat.","en":"The anterior mediastinum","tag":"quiz"},{"id":"f5f1fd5d2f","front":"From anterior to posterior, the hilar structures read as:","back":"Vein, Artery, Bronchus (V-A-B) — The hilum runs anterior-to-posterior as Vein-Artery-Bronchus.","en":"Vein, Artery, Bronchus (V-A-B)","tag":"quiz"}],"midterm":[{"part":0,"n":31,"q":"The superior mediastinum contains:","options":["The heart and pericardium","Thymus and fat only","Aortic arch, its branches and two brachiocephalic veins","Esophagus and azygos"],"answer":2,"why":"Arch with brachiocephalic, left carotid, left subclavian, plus brachiocephalic veins ending in SVC.","type":"mcq","points":1,"label":"Midterm bank · Q31","source":{"part":0,"qn":31}},{"part":0,"n":32,"q":"Descending aorta and esophagus belong to:","options":["Superior mediastinum","Posterior mediastinum","Anterior mediastinum","Middle mediastinum"],"answer":1,"why":"Posterior: descending aorta, esophagus, azygos/hemiazygos, nerves, nodes.","type":"mcq","points":1,"label":"Midterm bank · Q32","source":{"part":0,"qn":32}},{"part":0,"n":33,"q":"Localizing a mass to a mediastinal compartment first:","options":["Narrows the differential from about 50 to about 5","Has no diagnostic value","Replaces biopsy","Only helps in trauma"],"answer":0,"why":"The clinical pearl: compartment first — it instantly narrows the differential.","type":"mcq","points":1,"label":"Midterm bank · Q33","source":{"part":0,"qn":33}}],"audios":[{"src":"Audio/CTA-Chest-2.m4a","title":"Lung anatomy — lecture 2","start":0,"end":0}],"visuals":[{"source":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 4","n":4,"asset":"images\\6.CT-Lung-Anatomy-P-2\\page-4.png","path":"Assets/cta-lung2/page-4.png"},{"source":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 7","n":7,"asset":"images\\6.CT-Lung-Anatomy-P-2\\page-7.png","path":"Assets/cta-lung2/page-7.png"},{"source":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 8","n":8,"asset":"images\\6.CT-Lung-Anatomy-P-2\\page-8.png","path":"Assets/cta-lung2/page-8.png"},{"source":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 10","n":10,"asset":"images\\6.CT-Lung-Anatomy-P-2\\page-10.png","path":"Assets/cta-lung2/page-10.png"},{"source":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 5","n":5,"asset":"images\\6.CT-Lung-Anatomy-P-2\\page-5.png","path":"Assets/cta-lung2/page-5.png"},{"source":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 6","n":6,"asset":"images\\6.CT-Lung-Anatomy-P-2\\page-6.png","path":"Assets/cta-lung2/page-6.png"},{"source":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 9","n":9,"asset":"images\\6.CT-Lung-Anatomy-P-2\\page-9.png","path":"Assets/cta-lung2/page-9.png"},{"source":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 11","n":11,"asset":"images\\6.CT-Lung-Anatomy-P-2\\page-11.png","path":"Assets/cta-lung2/page-11.png"}]},{"id":"cta-lung-lobule","titleAr":"الفصيص الرئوي الثانوي والـ HRCT","titleEn":"Secondary pulmonary lobule and HRCT","summaryAr":"أصغر وحدة محاطة بحواجز + الشريان والقصيبة المركزيان + الأمراض المركزية مقابل المحيطية + فحص البطن الأعلى كعادة ثابتة.","summaryEn":"The smallest septa-bound unit, centrilobular artery and bronchiole, core versus septal disease patterns, and the upper-abdomen habit.","objectivesAr":["عرّف الفصيص الثانوي.","حدد مكوناته.","فرّق أمراض اللب عن الحواجز."],"objectivesEn":["Define the secondary lobule.","Identify its components.","Separate core from septal disease."],"refs":[{"source":"cta-lung2","n":12},{"source":"cta-lung2","n":15},{"source":"cta-lung2","n":16},{"source":"cta-lung2","n":17}],"galleryRefs":[{"source":"cta-lung2","n":13},{"source":"cta-lung2","n":14}],"evidence":[{"file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 12","text":"The Lung Parenchyma: Secondary Pulmonary Lobule","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 15","text":"HIGH RESOLUTION CT (HRCT) • Define it: The smallest unit of lung surrounded by connective tissue septa. • Components: • Centrilobular Artery & Bronchiole (center) • Lymphatics & Septa (periphery) • Lobular Core vs. Septal/Peripheral Disease: This is the key to HRCT interpretation","egyptian":"الـ c0afc","front":"The upper-abdomen habit","back":"كل فحص صدر بينتهي ببطن أعلى: كبد وطحال وكظر — متسيبهاش.","en":"End every chest review with liver, spleen and adrenals.","tag":"fact"},{"id":"e89ef418d7","front":"The secondary pulmonary lobule is best defined as:","back":"The smallest lung unit surrounded by connective-tissue septa — It is the smallest unit of lung surrounded by connective tissue septa.","en":"The smallest lung unit surrounded by connective-tissue septa","tag":"quiz"},{"id":"4806c02bc9","front":"Which structures sit at the CENTER of the secondary lobule?","back":"Centrilobular artery and bronchiole — Center: centrilobular artery and bronchiole; periphery: lymphatics and septa.","en":"Centrilobular artery and bronchiole","tag":"quiz"}],"midterm":[{"part":0,"n":34,"q":"The secondary pulmonary lobule is surrounded by:","options":["The major fissure","Peribronchial cuffs","Connective-tissue septa","The visceral pleura"],"answer":2,"why":"Definition: smallest lung unit surrounded by connective tissue septa.","type":"mcq","points":1,"label":"Midterm bank · Q34","source":{"part":0,"qn":34}},{"part":0,"n":35,"q":"Septal thickening localizes disease to:","options":["The airways only","The vessels only","The lobule periphery","The lobular core"],"answer":2,"why":"Periphery = septa and lymphatics; core = centrilobular artery and bronchiole.","type":"mcq","points":1,"label":"Midterm bank · Q35","source":{"part":0,"qn":35}},{"part":0,"n":36,"q":"The taught homework after this lecture is:","options":["One normal CT chest case plus an anatomy atlas","A lung ultrasound","An MRI spine","A chest X-ray only"],"answer":0,"why":"Review one normal CT chest (e.g. Radiopaedia) with an anatomy atlas.","type":"mcq","points":1,"label":"Midterm bank · Q36","source":{"part":0,"qn":36}}],"audios":[{"src":"Audio/CTA-Chest-2.m4a","title":"Lung anatomy — lecture 2","start":0,"end":0}],"visuals":[{"source":"cta-lung2","file":"6.CT Lung Anatomy P 2 .pdf","loc":"Page 12","n":12,"asset": ":"First x-ray photograph","loc":"Slide 5","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":6,"text":"X-Ray machine","loc":"Slide 6","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":7,"text":"Advantages Primary imaging tool. Cheap. Available. Disadvantages Radiation exposure. Contraindications e.g. pregnancy","loc":"Slide 7","egyptian":"الأشعة السينية: أداة التصوير الأولية — رخيصة ومتاحة، لكن عيبها التعرض للإشعاع وموانعها زي الحمل."},{"n":8,"text":"X-Ray antero-posterior view","loc":"Slide 8","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":9,"text":"X-Ray lateral view","loc":"Slide 9","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":10,"text":"X-Ray oblique view","loc":"Slide 10","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":11,"text":"X-Ray dynamic study","loc":"Slide 11","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":12,"text":"COMPUTED TOMOGRAPHY (CT)","loc":"Slide 12","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":13,"text":"Hounsfield","loc":"Slide 13","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":14,"text":"Ct machine","loc":"Slide 14","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":15,"text":"Advantages Fast. Accurate specially in areas of complex anatomy e.g. spine and pelvis. Sensitive Disadvantages Radiation exposure. Contraindications e.g. pregnancy.","loc":"Slide 15","egyptian":"الـ CT: سريع ودقيق خصوصًا في مناطق التشريح المعقد زي العمود الفقري والحوض وحساس — وله نفس عيوب الأشعة: إشعاع وموانع الحمل."},{"n":16,"text":"[Slide 17] Ct axial cuts","loc":"Slide 16","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":18,"text":"Ct coronal cuts","loc":"Slide 18","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":19,"text":"Ct sagittal cuts","loc":"Slide 19","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":20,"text":"Ct 3D","loc":"Slide 20","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":21,"text":"MAGNETIC RESONANCE IMAGING (MRI)","loc":"Slide 21","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":22,"text":"Bloch and purcell","loc":"Slide 22","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":23,"text":"Mri machine","loc":"Slide 23","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":24,"text":"Advantages Excellent resolution. Soft tissue. Disadvantages Expensive. Long time Claustrophobia in closed MRI. Contraindications e.g. cardiac valve prosthesis, nonferromagnetic metallic internal fixators, intra-cranial aneurysm clips.","loc":"Slide 24","egyptian":"الـ MRI: دقة ممتازة وأفضل في الأنسجة الرخوة — لكن غالي وطويل وقد يسبب رهاب الأماكن المغلقة، وموانعه: صمامات قلبية وثبتات معدنية غير حديدية وكلبات أم دم داخل القحف."},{"n":25,"text":"[Slide 26] ULTRASOUND (US)","loc":"Slide 25","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":27,"text":"Ultrasound machine","loc":"Slide 27","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":28,"text":"Advantages No radiation exposure Simple. Fast. Cost-effective. Patient friendly specially for claustrophobic patients not fit for MRI Disadvantages Needs high operator experience.","loc":"Slide 28","egyptian":"الموجات فوق الصوتية: مفيش إشعاع خالص وبسيطة وسريعة واقتصادية ومناسبة لمرضى الرهاب اللي مش هيقدروا MRI — عيبها إنها محتاجة خبرة عالية من الفاحص."},{"n":29,"text":"Fluid (joint effusion)","loc":"Slide 29","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":30,"text":"PLANES OF THE BODY:- • Sagittal : A plane extending along the long axis of the body dividing it into right and left sides. • Coronal : A plane extending through the body dividing it into anterior and posterior parts. • Axial: A plane extending across or through the axis of the body, extending from side to side, dividing the body into superior and inferior portions.","loc":"Slide 30","egyptian":"المستويات: السهمي على المحور الطولي بيقسم الجسم يمين وشمال؛ والإكليلي بيقسم أمام وخلف؛ والأكسيل عرضي بيقسم لفوق وتحت."},{"n":31,"text":"Ct axial cuts","loc":"Slide 31","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":32,"text":"Ct coronal cuts","loc":"Slide 32","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":33,"text":"Ct sagittal cuts","loc":"Slide 33","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":34,"text":"Hounsfield unit Based on a series of complex mathematical processes, the computer reconstructs the image from a series of digital numbers. The numbers generated are registered on the Hounsfield scale, by which bone is 1,000, water is 0, and air is -1,000","loc":"Slide 34","egyptian":"مقياس Hounsfield: الكمبيوتر بيعيد بناء الصورة من أرقام رقمية — العظم +1000 والماء 0 والهواء -1000، والأنسجة بينهم تدرجات."},{"n":35,"text":"Identify? Air, fat, fluid and bone","loc":"Slide 35","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":36,"text":"CT windowing is an image processing technique that adjusts the brightness and contrast of a CT scan by manipulating its greyscale values to highlight specific tissues or structures , such as bone or soft tissue","loc":"Slide 36","egyptian":"النوافذ: تقنية بتظبط السطوع والتباين بدرجات الرمادي عشان تبرز نسيج معين — رئة للرئة ومنصف للقلب والأوعية وعظم للعظام ومخ للدماغ."},{"n":37,"text":"Lung window","loc":"Slide 37","egyptian":"نافذة الرئة: الهواء أسود واضح وتفاصيل البرانشيم ظاهرة."},{"n":38,"text":"Mediastinum window","loc":"Slide 38","egyptian":"نافذة المنصف: بتبرز القلب والأوعية الكبيرة والأنسجة الرخوة الوسيطة."},{"n":39,"text":"Bone window","loc":"Slide 39","egyptian":"نافذة العظم: تفاصيل العظام والغضاريف والكلس واضحة جدًا."},{"n":40,"text":"Brain window","loc":"Slide 40","egyptian":"نافذة المخ: مخصوصة لدرجات الرمادي والأبيض والسائل النخاعي في الدماغ."},{"n":41,"text":"Thank you","loc":"Slide 41","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."}],"visuals":[{"file":"images\\1.introduction-of-CT-Anatomy\\visual-deae67fe15a1.jpeg","loc":"Slide 1","n":1,"path":"Assets/cta-intro/visual-deae67fe15a1.jpeg"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-26ae4b7cc832.png","loc":"Slide 3","n":3,"path":"Assets/cta-intro/visual-26ae4b7cc832.png"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-1d8f762043f8.jpeg","loc":"Slide 4","n":4,"path":"Assets/cta-intro/visual-1d8f762043f8.jpeg"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-3eb7dd996282.jpeg","loc":"Slide 5","n":5,"path":"Assets/cta-intro/visual-3eb7dd996282.jpeg"},{"file":" ction-of-CT-Anatomy\\visual-75856d9f97ac.png","loc":"Slide 26","n":26,"path":"Assets/cta-intro/visual-75856d9f97ac.png"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-19b8ef5cb120.png","loc":"Slide 27","n":27,"path":"Assets/cta-intro/visual-19b8ef5cb120.png"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-6400f0fccc9d.jpeg","loc":"Slide 29","n":29,"path":"Assets/cta-intro/visual-6400f0fccc9d.jpeg"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-bd130c7cbf79.png","loc":"Slide 30","n":30,"path":"Assets/cta-intro/visual-bd130c7cbf79.png"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-fc17122b3e7b.png","loc":"Slide 31","n":31,"path":"Assets/cta-intro/visual-fc17122b3e7b.png"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-6a2a37914581.jpeg","loc":"Slide 31","n":31,"path":"Assets/cta-intro/visual-6a2a37914581.jpeg"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-b1d61774b796.png","loc":"Slide 32","n":32,"path":"Assets/cta-intro/visual-b1d61774b796.png"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-0b472c46e121.jpeg","loc":"Slide 32","n":32,"path":"Assets/cta-intro/visual-0b472c46e121.jpeg"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-7fd8d253a76e.jpeg","loc":"Slide 33","n":33,"path":"Assets/cta-intro/visual-7fd8d253a76e.jpeg"},{"file":"images\\1.introduction-of-CT-Anatomy\\visual-0b7f25617081.jpeg","loc":"Slide 33","n":33,"path":"Assets/cta-intro/visual-0b7f25617081.jpeg"}]},{"id":"cta-brain","file":"2.BRAIN.pdf","display":"Cross-sectional anatomy of the brain","format":".pdf","records":[{"n":1,"text":"CROSS SECTIONAL ANATOMY OF THE BRAIN Dr.Mohamed Kamel,MD. Lecturer of diagnostic radiology Faculty of medicine-Menoufia university","loc":"Page 1","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":2,"text":"Brain protective layers • Skull . • Meninges. • Cerebrospinsal fluid (CSF).","loc":"Page 2","egyptian":"أغلفة حماية الدماغ: الجمجمة العظمية + السحايا الثلاثة + السائل النخاعي اللي بيلعب حواليهم وبيحمي."},{"n":3,"text":"SKULL • The skull is formed from 8 bones ; frontal, parietal (2), temporal (2), sphenoid, occipital and ethmoid. • They ossify separately and gradually become united at the skull sutures. • The skull has inner and outer tables of cortical bone with central cancellous bone called dipolic space.","loc":"Page 3","egyptian":"الجمجمة 8 عظام: الجبهي والجداري (2) والصدغي (2) والوتدي والقذالي والغربالي — بتتعظم منفصلة وبعدين بتتحد عند الغرز؛ والجمجمة فيها طاولة داخلية وخارجية من عظم قشري وبينهم العظم الإسفنجي (المساحة الديبلوية)."},{"n":4,"text":"Sutures • The main sutures of the skull are the coronal, sagittal, lambdoid and squamosal sutures. • Coronal suture - unites the frontal bone with theparietal bones • Sagittal suture - unites the 2 parietal bones in the midline • Lambdoid suture - unites the parietal bones with the occipital bone • Squamosal suture - unites the squamous portion of the temporal bone with the parietal bones • Metopic suture - (if present) unites the 2 fontal bones","loc":"Page 4","egyptian":"الغرز: الإكليلي بيوحد الجبهي مع الجداريين؛ والسهمي بيوحد الجداريين في النص؛ واللامي بيوحد الجداريين مع القذالي؛ والحرشفي بين الحرشفي للصدغي والجداري؛ والميتوبيك (لو موجود) بين نصفي الجبهي."},{"n":6,"text":"Inside the skull are three distinct areas: anterior, middle, and posterior fossae. • Anterior cranial fossa accommodates the anterior part of the frontal lobes • Middle cranial fossa accommodate the temporal lobes • Posterior cranial fossa accommodates the cerebellum and brain stem • Pituitary fossa (PF) accommodates the pituitary gland","loc":"Page 6","egyptian":"جوه الجمجمة 3 مناطق: الحفرة الأمامية للفصوص الجبهية، والوسطى للفصوص الصدغية، والخلفية للمخيخ وجذع الدماغ — وحفرة النخامية للغدة النخامية."},{"n":7,"text":"Meninges • The brain and spinal cord are covered and protected by three layers of tissue called meninges. From the outermost layer inward they are: • Outer layer:the dura mater. • Middle layer: arachnoid mater. • Inner layer: pia mater.","loc":"Page 7","egyptian":"السحايا 3 طبقات من بره لجوه: الأم الجامعة (الصلبة) ثم العنكبوتية ثم الأم الحنون الملتصقة بالدماغ."},{"n":8,"text":"Meninges… • The dura mater is a strong, thick membrane that closely lines the inside of the skull; its two layers, the periosteal and meningeal dura, are fused and separate only to form venous sinuses. • There are two special dural folds, the falx cerebri and the tentorium cerebelli. The falx separates the right and left hemispheres of the brain and the tentorium separates the cerebrum from the cerebellum. They are visible on CT imaging. Elsewhere the meningeal layers are not visible .","loc":"Page 8","egyptian":"الأم الجامعة غلاف قوي مبطن لجوه الجمجمة بطبقتين ملتصقتين (سمحاقية وجنفية) بيفترقوا بس عند الجيوب الوريدية؛ وليها طيتين ظاهرتين على CT: منجل المخ بين نصفي الكرة والخيمة بين المخ والمخيخ — باقي السحايا مش ظاهرة على الـ CT."},{"n":10,"text":"Meninges… • The arachnoid mater is a thin, web-like membrane that covers the entire brain. The space between the dura and arachnoid membranes is called the subdural space. • The pia mater hugs the surface of the brain following its folds and grooves. The space between the arachnoid and pia is called the subarachnoid space. It is where the cerebrospinal fluid bathes and cushions the brain.","loc":"Page 10","egyptian":"العنكبوتية غشاء رقيق نسيجي بيغطي الدماغ كله — والمساحة بينها وبين الجامعة اسمها تحت الجامعة Subdural؛ والأم الحنون بتغلف سطح الدماغ بثنياته — والمساحة بينهم تحت العنكبوتية Subarachnoid وفيها السائل النخاعي بيلعب ويحمي الدماغ."},{"n":11,"text":"CSF spaces • The brain is surrounded by cerebrospinal fluid (CSF) within the sulci, fissures and basal cisterns and ventricles together form the 'CSF spaces', also known as the 'extra- axial spaces'. • The brain surface is formed by folds of the cerebral cortex known as gyri. Between these gyri there are furrows, known as sulci, which contain CSF.","loc":"Page 11","egyptian":"مساحات السائل: السائل النخاعي بيملا الأثلام والشقوق والصهاريج القاعدية والبطينات — واسمها التاني المساحات خارج المحورية؛ وسطح الدماغ من ثنيات قشرية اسمها التلافيف Gyri وبينهم الأثلام Sulci فيها سائل."},{"n":12,"text":"ventricles • Two lateral ventricles. • Third ventricle. • Fourth ventricle.","loc":"Page 12","egyptian":"البطينات 4: جانبيان + ثالث + رابع."},{"n":13,"text":"Lateral ventricles • The paired lateral ventricles are located on either side of the brain. • Each ventricle has trigone, body,frontal , temporal & occipital horns • They contain the choroid plexus which produces CSF. Note : The choroid plexus is almost always calcified in adults.","loc":"Page 13","egyptian":"البطونين الجانبيين على كل جانب وكل واحد له مثلث وجسم وقرون: جبهي وصدغي وقذالي — وجواهم الضفيرة المشيمية اللي بتفرز السائل، وهي في البالغين مكلسة تقريبًا دايمًا (علامة تعريف مفيدة)."},{"n":14,"text":"Third ventricle • The third ventricle is located centrally. • The lateral ventricles communicate with the third ventricle via small holes (foramina of Monro).","loc":"Page 14","egyptian":"البطين الثالث في المنتصف؛ والجانبيين بيتواصلوا معاه عبر ثقبَي مونرو."},{"n":15,"text":"Fourth ventricle • Is located in the posterior fossa between the brain stem and cerebellum. • It communicates with the third ventricle above via a very narrow canal, the aqueduct of Sylvius . • Basal cisterns CSF in the basal cisterns surrounds the brain stem structures.","loc":"Page 15","egyptian":"البطين الرابع في الحفرة الخلفية بين جذع الدماغ والمخيخ — بيتواصل مع الثالث فوق عبر قناة سيلفيوس الضيقة؛ وسائل الصهاريج القاعدية بيطوق بنى الجذع."},{"n":16,"text":"Fissures • The interhemispheric fissure separates both cerebral hemispheres. • The Sylvian fissures separate the frontal and temporal lobes.","loc":"Page 16","egyptian":"الشقوق: الشق بين النصفين بيفصل نصفي كرة المخ؛ وشقوق سيلفيوس بتفصل الجبهي عن الصدغي."},{"n":17,"text":"Main CSF CISTERNS:","loc":"Page 17","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":22,"text":"Brain. •The brain is composed of the: •Cerebrum. •Cerebellum. •Brain stem.","loc":"Page 22","egyptian":"الدماغ مكوّن من: المخ + المخيخ + جذع الدماغ."},{"n":23,"text":"Brain. • The cerebrum is the largest part of the brain and is composed of right and left hemispheres. It performs higher functions like interpreting, touch, vision and hearing, as well as speech, reasoning, emotions, learning, and fine control of movement. • The cerebral hemispheres have distinct fissures, which divide the brain into lobes. Each hemisphere has 4 lobes: frontal, temporal, parietal, and occipital.","loc":"Page 23","egyptian":"المخ أكبر جزء ومن نصفي كرة — مسؤول عن الوظائف العليا: اللمس والبصر والسمع والكلام والتفكير والمشاعر والتعلم والتحكم الدقيق للحركة؛ وكل نصف كرة 4 فصوص: جبهي وصدغي وجداري وقذالي."},{"n":24,"text":"Brain lobes - CT brain (superior slice) On both sides the frontal lobes are separated from the parietal lobes by the central sulcus Note: The large frontal lobes as compared to parietal and occipital lobes Brain lobes - CT brain (inferior slice) the frontal lobes at anterior cranial fossae .The temporal lobes at middle cranial fossae .The cerebellum and brain stem at the posterior fossa","loc":"Page 24","egyptian":"على القطاع العلوي: الجبهيان متشالين عن الجداريين بالثلم المركزي — ولاحظ حجم الجبهيين الكبير مقارنة بالجداري والقذالي؛ وعلى السفلي: الجبهي في الحفرة الأمامية والصدغي في الوسطى والمخيخ وجذع الدماغ في الخلفية."},{"n":25,"text":"Brain... • The cerebellum is located under the cerebrum. • it’s two hemishperes with midline structure named vermis. • Its function is to coordinate muscle movements, maintain posture, and balance. • Note the gyri in cerebellum is named foli","loc":"Page 25","egyptian":"المخيخ تحت المخ: نصفي كرة وبينهم الدودة Vermis في النص — وظيفته تنسيق الحركة والحفاظ على الوضعية والتوازن؛ وثنياته اسمها الأوراق Folli."},{"n":26,"text":"Brain... • The brainstem is the lower extension of the brain, located in front of the cerebellum and connected to the spinal cord. • It consists of three structures; the midbrain, pons and medulla oblongata. • It performs many automatic functions such as breathing, heart rate, body temperature, wake and sleep cycles, digestion, sneezing, coughing, vomiting, and swallowing. Ten of the twelve cranial nerves originate in the brainstem. Destruction of these regions of the brain will cause \"brain death.\" Without these key functions, humans cannot survive.","loc":"Page 26","egyptian":"جذع الدماغ امتداد سفلي قدام المخيخ ومتصل بالنخاع الشوكي — من 3 أجزاء: الدماغ المتوسط والجسر والبصلة؛ ووظايفه التلقائية: التنفس وضربات القلب والحرارة ودورات النوم والهضم والعطس والكحة والتقيؤ والبلع — و10 من الأعصاب المخية الـ 12 بيطلعوا منه؛ وتدميره = موت الدماغ."},{"n":27,"text":"• The brain consists of grey and white matter structures which are differentiated on CT by differences in density. • White matter has a high content of myelinated axons. • Grey matter contains relatively few axons and a higher number of cell bodies. • As myelin is a fatty substance it is of relatively low density compared to the cellular grey matter. White matter, therefore, appears blacker than grey matter. Grey / white matter","loc":"Page 27","egyptian":"الدماغ مادة رمادية وبيضاء بتتفرق على CT بالكثافة: البيضاء مليانة ألياف ميالينية والرمارية أجسام خلوية — والميالين مادة دهنية كثافتها أقل، فالبيضاء تظهر أسود من الرمادية."},{"n":28,"text":"Grey matter structures Important grey matter structures visible on CT : • Cortex, insula. • Basal ganglia( lentiform nucleus + caudate nucleus ). • Thalamus .","loc":"Page 28","egyptian":"أهم الرمادية الظاهرة على CT: القشرة والجزيرة + العقد القاعدية (النواة العدسية + النواة الذيلية) + المهاد."},{"n":29,"text":"White matter structures The internal capsules are white matter tracts which connect with the corona radiata superiorly with the brain stem inferiorly. The corpus callosum is a white matter tract located in the midline. It arches over the lateral ventricles and connects white matter of the left and right cerebral hemispheres.","loc":"Page 29","egyptian":"البيضاء: الكبسولات الداخلية ماصلات بتربط التاج المشع فوق بجذع الدماغ تحت؛ والجسم الثفني في المنتصف بيقوس فوق البطينين الجانبيين وبيوصل مادة البيضاء بين نصفي المخ."},{"n":31,"text":"AXIAL SECTIONS OF CT HEAD POSTERIOR FOSSA CUTS -ABOVE THE FORAMEN MAGNUM LEVEL -LEVEL OF THE FOURTH VENTRICLE -ABOVE THE FOURTH VENTRICULAR LEVEL -TENTORIAL SUPRATENTORIAL CUTS -THIRD VENTRICULAR LEVEL -LATERAL VENTRICULAR LEVEL -ABOVE THE VENTRICULAR LEVEL","loc":"Page 31","egyptian":"المقاطع الأكسية للرأس بالترتيب من تحت لفوق — تحت الخيمة: فوق مستوى الثقب الكبير ثم مستوى البطين الرابع ثم فوقه ثم المستوى الخيمي؛ وفوق الخيمة: مستوى البطين الثالث ثم الجانبيين ثم فوق البطينات."},{"n":40,"text":"Arterial blood supply of the brain • There are two paired arteries responsible for the blood supply to the brain:- • Anterior circulation:Internal carotid arteries (ICAs). • Posterior circulation: (vertebro- basilar system). • The terminal branches of these arteries form an anastomotic circle, called the Circle of Willis. The branches arise from this circle supply the majority of the cerebrum.","loc":"Page 40","egyptian":"تروية الدماغ من زوجين شرايين: أمامي = الكاروتيد الداخلية ICA وخلفي = الفقري-القاعدي؛ وفروعهم النهائية بيكوّنوا دائرة تشريك اسمها دائرة ويليس وفروعها بتروي معظم المخ."},{"n":41,"text":"Internal carotid arteries • The (ICAs) originate at the bifurcation of CCAs, at the level of (C4). • They ascend within the carotid sheath, and enter the brain via the carotid canal of the temporal bone. • No branches to the face or neck. • It has seven segments ; cervical, petrous, lacerum, cavernous, clinoid, ophthalmic and supraclinoid. • Supraclinoid segment gives rise to anterior cerebral artery ( ACA) and middle cerebral artery (MCA).","loc":"Page 41","egyptian":"الـ ICA بتبدأ عند تفرع الكاروتيد المشترك عند مستوى الفقرة C4 — بتصعد في غمد الكاروتيد وتدخل القحف عبر القناة الكاروتيدية في الصدغي؛ مالهاش فروع للوجه أو الرقبة؛ وليها 7 قطع: عنقي وصخري وخرقي وكهفي وسريري وحجاجي وفوق السريري — وفوق السريري بيطلع الدماغي الأمامي ACA والأوسط MCA."},{"n":42,"text":"Internal carotid artery segments","loc":"Page 42","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":43,"text":"The ACA is divided into five segments • A1(pre-communicating) : horizontal , terminating at the anterior communicating A. • A2 (post-communicating, infracallosal):vertical from ACOM, to callosomarginal A. at the genu of the corpus callosum . • A3 (precallosal): distal to the callosomarginal artery, turns directly posterior above the corpus callosum • A4 (supracallosal): above the body of the corpus callosum . • A5 (postcallosal): above the body of the corpus callosum posterior to the plane of the coronal suture.","loc":"Page 43","egyptian":"الـ ACA خمس قطع: A1 أفقي قبل الموصلية الأمامية؛ A2 رأسي بعدها تحت الغرابي؛ A3 قدام الثفني بيلف فوقه؛ A4 فوق جسم الثفني؛ A5 خلف مستوى الغرز الإكليلي."},{"n":44,"text":"Middle cerebral artery segments • Horizontal M1-segment supply parts of basal ganglia and internal capsule. • Sylvian M2-segment supply the temporal lobe and insular cortex , parts of parietal and frontal lobes • Cortical M3-segment supply the lateral cerebral cortex","loc":"Page 44","egyptian":"الـ MCA: M1 أفقي بيرجو أجزاء من العقد القاعدية والكبسولة الداخلية؛ M2 سيلفيوس بيرجو الصدغي والجزيرة وأجزاء من الجداري والجبهي؛ M3 قشري للقشرة الجانبية."},{"n":45,"text":"Vertebral Arteries • Arise from the subclavian arteries, then ascend through foramena transversarium. • Enter the cranial cavity via the foramen magnum. • After this, the two vertebral arteries converge to form the basilar artery. • The basilar artery terminates by bifurcating into the posterior cerebral arteries ( PCA).","loc":"Page 45","egyptian":"الشريانان الفقريان من تحت الترقوة بيصعدوا عبر الثقوب المستعرضة ويدخلوا عبر الثقب الكبير — وبعدين بيندمجوا في القاعدي اللي بيتفرع في الآخر للدماغيين الخلفيين PCA."},{"n":46,"text":"The PCA is divided into 4 segments: • P1: from its origin at the termination of the basilar artery to posterior communicating artery (PCOM), within interpeduncular cistern • P2: from the PCOM around the midbrain • P3: within the quadrigeminal cistern • P4: cortical segment.","loc":"Page 46","egyptian":"الـ PCA أربع قطع: P1 من تفرع القاعدي للموصلية الخلفية جوه الصهريج بين الساقين؛ P2 حوالين الدماغ المتوسط؛ P3 جوه الصهريج الرباعي؛ P4 قشري."},{"n":47,"text":"Arterial Circle of Willis • The terminal branches of the vertebral and internal carotid arteries all anastomose to form a circular blood vessel, called the Circle of Willis. • There are three main (paired) constituents of the Circle of Willis: • ACAs ( A1 segment). • ICAs ( C7 segment). • PCAs (P1 segment). • To complete the circle, two ‘connecting vessels’ are also present: • Anterior communicating artery (Acom) : – connects the two ACAs. • Posterior communicating artery (Pcom) :– branch of the internal carotid artery connects the ICA to the PCA.","loc":"Page 47","egyptian":"دائرة ويليس من 3 مكونات رئيسية مزدوجة: A1 (للأمامي) وC7 (للكاروتيد) وP1 (للخلفي) — ويكمّلوا الدائرة موصلين: الأمامي Acom بين الأحمرين والخلفي Pcom فرع من الكاروتيد بيوصله بالخلفي."},{"n":48,"text":"Regional Blood Supply to the brain • Cerebrum: • ACA:supply the antero-medial portion. • MCA: supply the lateral portion. • PCA: supply the posterior cerebrum & mid brain. • Cerebellum and brain stem are supplied by branches arise from vertebro-basilar arteries","loc":"Page 48","egyptian":"التروية الإقليمية: ACA للجزء الأمامي-الأنسي من المخ وMCA للجانبي وPCA للخلفي والمتوسط — والمخيخ وجذع الدماغ من فروع الفقري-القاعدي."},{"n":49,"text":"Ct angiography","loc":"Page 49","egyptian":"الـ CTA: تصوير شرايين بالتباين بيوضح الدائرة وفروعها بالتفصيل."},{"n":50,"text":"Ct angiography","loc":"Page 50","egyptian":"الـ CTA: إعادة بناء ثلاثية الأبعاد للأوعية الدماغية."},{"n":51,"text":"The Venous Drainage of the Central Nervous System • The dural venous sinuses lie between the periosteal and meningeal layers of the dura mater. They are best thought of as collecting pools of blood, which drain the brain. • Unlike most veins of the body, the dural venous sinuses do not have valves. • All the dural venous sinuses ultimately drain into the internal jugular vein.","loc":"Page 51","egyptian":"الجيوب الوريدية الجامعة بين طبقتي الأم الجامعة — دمول تجميع بتصرف الدماغ، ومفيش فيها صمامات، وكلها في الآخر بتصرف في الوريد الوداجي الداخلي."},{"n":52,"text":"• The straight, superior, and inferior sagittal sinuses are found in the falx cerebri . They converge at the confluence of sinuses (overlying the internal occipital protuberance). • The straight sinus is a continuation of the great cerebral vein and the inferior sagittal sinus. • From the confluence, the transverse sinus continues bi-laterally and curves into the sigmoid sinus to meet the opening of the internal jugular vein. • The cavernous sinus drains the ophthalmic veins and can be found on either side of the sella turcica. From here, the blood returns to the internal jugular vein via the superior or inferior petrosal sinuses. The Venous SINUSES","loc":"Page 52","egyptian":"المستقيم والسهمي العلوي والسفلي جوه منجل المخ وبيتقابلوا في ملتقى الجيوب فوق النتوء القذالي الداخلي — والمستقيم تكملة الوريد الدماغي الكبير مع السهمي السفلي؛ ومن الملتقى المستعرض بيكمّل على الجانبين ويلف في السigmoidي لحد فتحة الوداجي الداخلي؛ والكهفي بيصرف الأوردة الحجاجية وجنبي السرج وبيرجع الدم للوداجي عبر الجيب الصخري العلوي أو السفلي."},{"n":53,"text":"Ct venography","loc":"Page 53","egyptian":"الـ CTV: تصوير وريدي بالتباين بيوضح الجيوب الجامعة ومساراتها."},{"n":54,"text":"Post contrast Ct brain","loc":"Page 54","egyptian":"بعد التباين: الأوعية والبنى تغمق (تعزز) — صور مرجعية لتوزيع التروية."},{"n":55,"text":"Post contrast Ct brain","loc":"Page 55","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."},{"n":56,"text":"Post contrast Ct brain","loc":"Page 56","egyptian":"بالمصري: راجع المقتطف الأصلي فوق مع المصطلح الطبي الإنجليزي؛ ده جزء من الفكرة الأساسية المعروضة في الدرس."}],"visuals":[{"file":"images\\2.BRAIN\\page-1.png","loc":"Page 1","n":1,"path":"Assets/cta-brain/page-1.png"},{"file":"images\\2.BRAIN\\page-2.png","loc":"Page 2","n":2,"path":"Assets/cta-brain/page-2.png"},{"file":"images\\2.BRAIN\\page-3.png","loc":"Page 3","n":3,"path":"Assets/cta-brain/page-3.png"},{"file":"images\\2.BRAIN\\page-4.png","loc":"Page 4","n":4,"path":"Assets/cta-brain/page-4.png"},{"file":"images\\2.BRAIN\\page-5.png","loc":"Page 5","n":5,"path":"Assets/cta-brain/page-5.png"},{"file":"images\\2.BRAIN\\page-6.png","loc":"Page 6","n":6,"path":"Assets/cta-brain/page-6.png"},{"file":"images\\2.BRAIN\\page-7.png","loc":"Page 7","n":7,"path":"Assets/cta-brain/page-7.png"},{"file":"images\\2.BRAIN\\page-8.png","loc":"Page 8","n":8,"path":"Assets/cta-brain/page-8.png"},{"file":"images\\2.BRAIN\\page-9.png","loc":"Page 9","n":9,"path":"Assets/cta-brain/page-9.png"},{"file":"images\\2.BRAIN\\page-10.png","loc":"Page 10","n":10,"path":"Assets/cta-brain/page-10.png"},{"file":"images\\2.BRAIN\\page-11.png","loc":"Page 11","n":11,"path":"Assets/cta-brain/page-11.png"},{"file":"images\\2.BRAIN\\page-12.png","loc":"Page 12","n":12,"path":"Assets/cta-brain/page-12.png"},{"file":"images\\2.BRAIN\\page-13.png","loc":"Page 13","n":13,"path":"Assets/cta-brain/page-13.png"},{"file":"images\\2.BRAIN\\page-14.png","loc":"Page 14","n":14,"path":"Assets/cta-brain/page-14.png"},{"file":"images\\2.BRAIN\\page-15.png","loc":"Page 15","n":15,"path":"Assets/cta-brain/page-15.png"},{"file":"images\\2.BRAIN\\page-16.png","loc":"Page 16","n":16,"path":"Assets/cta-brain/page-16.png"},{"file":"images\\2.BRAIN\\page-17.png","loc":"Page 17","n":17,"path":"Assets/cta-brain/page-17.png"},{"file":"images\\2.BRAIN\\page-18.png","loc":"Page 18","n":18,
