:root{

--muted:#5d7280;--text:#1b2a35;--text2:#3a5160;

}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--text);font-family:var(--sans)}
body{margin:0;min-height:100vh;background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
a{color:inherit}
img{max-width:100%}
.topbar{min-height:64px;background:var(--ink);color:#f2f9f8;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(16px,calc((100vw - 1280px)/2));position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(14,27,36,.25)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:700;letter-spacing:.01em;font-size:1rem}
.brand-mark{width:30px;height:30px;border-radius:9px;background:#0a756c;display:grid;place-items:center;flex:none;padding:4px;box-shadow:inset 0 0 0 1px rgba(95,196,182,.35)}
.brand-mark svg{width:100%;height:100%;display:block}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool-btn{border:0;color:#f2f9f8;background:transparent;border-radius:8px;padding:8px 12px;font-size:.86rem;text-decoration:none;min-height:38px;display:inline-flex;align-items:center}
.tool-btn:hover{background:rgba(255,255,255,.12)}
.shell{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
.hero{background:linear-gradient(135deg,var(--ink) 0%,var(--ink2) 100%);color:#eaf5f3;min-height:190px;border-radius:22px;display:grid;grid-template-columns:minmax(0,1fr) 240px;align-items:center;gap:24px;padding:28px 36px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:'';position:absolute;inset-inline-end:90px;top:-110px;width:340px;height:340px;border:1px solid var(--teal-glow);border-radius:50%;box-shadow:0 0 0 30px rgba(93,191,177,.05),0 0 0 66px rgba(93,191,177,.035),0 0 0 104px rgba(93,191,177,.02)}
.hero-copy{position:relative;z-index:1;max-width:780px}
.eyebrow{color:#9fd8cf;font-size:.8rem;letter-spacing:.09em;margin:0 0 10px}
.hero h1{font-family:var(--serif);font-size:clamp(1.9rem,3.6vw,2.7rem);line-height:1.12;max-width:20ch;margin:0 0 10px;font-weight:600}
.hero p{color:#c3d6d4;line-height:1.65;max-width:64ch;margin:0}
.hero-art{position:relative;z-index:1;display:flex;justify-content:center}
.scan-figure{width:150px;height:150px;border-radius:50%;border:1px solid rgba(108,204,191,.6);display:grid;place-items:center;position:relative;background:radial-gradient(circle,rgba(57,155,146,.16) 0 30%,transparent 31%)}
.scan-figure:before,.scan-figure:after{content:'';position:absolute;border-radius:50%;border:1px dashed rgba(190,229,222,.5)}
.scan-figure:before{inset:16px}
.scan-figure:after{inset:38px}
.scan-core{width:28px;height:28px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 9px rgba(238,162,54,.16)}
.scan-ray{position:absolute;width:1px;height:64px;background:linear-gradient(transparent,#bfe6de,transparent);transform-origin:bottom;bottom:50%;left:50%;transform:rotate(45deg)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(96px,1fr));gap:0;max-width:560px;margin-top:18px;border-top:1px solid rgba(255,255,255,.16);padding-top:12px}
.stat{padding-inline:16px;border-inline-start:1px solid rgba(255,255,255,.14)}
.stat:first-child{padding-inline-start:0;border:0}
.stat strong{display:block;font-size:1.35rem;font-weight:700;color:#fff}
.stat span{color:#a9c0c0;font-size:.8rem}
.progressline{display:flex;align-items:center;gap:12px;margin-top:16px;max-width:560px}
.progressbar{height:8px;background:rgba(255,255,255,.18);flex:1;position:relative;border-radius:999px;overflow:hidden}
.progressbar span{display:block;height:100%;background:var(--teal);width:0;transition:width .4s}
.progressline small{color:#a9c0c0;white-space:nowrap}
.content-grid{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.rail{background:var(--card);border:1px solid var(--line);padding:16px 12px;position:sticky;top:84px;max-height:calc(100vh - 102px);overflow:auto;border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.rail-title{font-size:.78rem;color:var(--muted);margin:4px 10px 10px;font-weight:600;letter-spacing:.04em}
.lesson-link{width:100%;border:0;background:transparent;text-align:inherit;display:flex;gap:10px;align-items:flex-start;padding:11px 10px;border-radius:var(--radius-sm);color:var(--text);line-height:1.4;transition:background .15s}
.lesson-link:hover{background:var(--teal-softer)}
.lesson-link.active{background:var(--ink);color:#fff}
.lesson-num{font-variant-numeric:tabular-nums;font-size:.76rem;color:var(--teal-strong);min-width:22px;padding-top:2px;font-weight:700}
.lesson-link.active .lesson-num{color:var(--amber)}
.lesson-name{font-size:.89rem;flex:1}
.lesson-state{font-size:.68rem;color:var(--muted);white-space:nowrap;padding-top:2px}
.lesson-link.active .lesson-state{color:#b9cdc9}
.brand-group{display:flex;align-items:center;gap:10px}
.burger-btn{font-size:1.15rem;padding:8px 12px}
.rail-backdrop{display:none;position:fixed;inset:0;background:rgba(14,27,36,.45);z-index:55}
.rail-close{position:absolute;top:12px;inset-inline-end:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:.85rem;cursor:pointer}
.rail-close:hover{color:var(--red);border-color:var(--red)}
@media(min-width:901px){
.content-grid{grid-template-columns:minmax(0,1fr)}
.rail{display:none}
body.rail-open .rail{display:block;position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(330px,86vw);max-height:none;z-index:60;border-radius:0;border:0;border-inline-end:1px solid var(--line);box-shadow:26px 0 60px rgba(14,27,36,.16);animation:railInLtr .32s cubic-bezier(.2,.7,.3,1)}
[dir=rtl] body.rail-open .rail{animation-name:railInRtl}

}
@keyframes railInLtr{from{transform:translateX(-100%)}}
@keyframes railInRtl{from{transform:translateX(100%)}}
.main-panel{min-width:0}

.summary{font-size:1rem;line-height:1.8;max-width:76ch;margin:0;color:var(--text2)}
.objectives{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.objectives strong{font-size:.85rem;color:var(--muted);font-weight:600;margin-inline-end:4px}
.objective{border:1px solid #cfe6e1;background:var(--teal-softer);color:#20574f;padding:7px 12px;font-size:.82rem;border-radius:999px}

.evidence cite{display:block;color:var(--muted);font-size:.74rem;font-style:normal;margin-bottom:6px;direction:ltr;text-align:left}
.en-lines{display:grid;gap:4px;direction:ltr;text-align:left}
.en-line{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;margin:0;border-radius:9px;transition:background .15s}
.en-line:hover{background:rgba(15,145,135,.08)}
.en-line .ln{flex:none;width:21px;height:21px;border-radius:50%;background:var(--teal-soft);color:var(--teal-strong);font-size:.66rem;font-weight:700;display:grid;place-items:center;margin-top:2px;font-variant-numeric:tabular-nums}

.tname{font-weight:700;color:var(--text)}
.evidence-wrap[open] .en-line,.evidence-wrap[open] .evidence .egyptian-note{animation:lineIn .5s cubic-bezier(.2,.7,.3,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.evidence-wrap[open] .evidence .egyptian-note{--i:13}

.note-lines{display:grid;gap:5px;margin-top:2px}
.note-line{margin:0;display:flex;gap:8px;align-items:flex-start}
.note-line .nb{flex:none;color:var(--amber-ink);font-size:.68rem;line-height:1.9}
.note-line span:last-child{flex:1;line-height:1.75}
@keyframes lineIn{from{opacity:0;transform:translateY(8px)}}
mark.tm{padding:1px 5px;border-radius:5px;font-weight:600}
mark.tm.t1{background:#d5efe9;color:#0a756c}
mark.tm.t2{background:#fdeec9;color:#8a5d18}
mark.tm.t3{background:#eadff5;color:#6b3fa0}
mark.tm.t4{background:#dbe9f7;color:#2b5d9c}
.egyptian-note{margin-top:12px;padding:11px 13px;background:var(--amber-soft);border:1px solid #ecd9ac;border-inline-start:4px solid var(--amber);color:#41372c;direction:rtl;text-align:right;border-radius:9px}
.egyptian-note strong{display:block;color:var(--amber-ink);font-size:.74rem;letter-spacing:.02em;margin-bottom:4px}
.egyptian-note p{direction:rtl;text-align:right;font-size:.92rem;line-height:1.75;margin:0}
.quiz-panel{background:var(--card);border:1px solid var(--line);margin-top:16px;padding:24px 28px;box-shadow:var(--shadow);border-radius:var(--radius)}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px;flex-wrap:wrap}
.section-heading h3{font-size:1.18rem;margin:0}
.section-heading p{font-size:.8rem;color:var(--muted);margin:0}
form.ltr,form.ltr .question,form.ltr .option{direction:ltr;text-align:left}
form.ltr .check-row{direction:ltr}
.question{padding:18px 0;border-bottom:1px solid var(--line2)}
.question:last-of-type{border:0}
.q-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.74rem;margin-bottom:9px;flex-wrap:wrap}
.q-type{color:var(--text2);font-weight:500}

.question h4{margin:0 0 12px;font-size:1rem;line-height:1.55}
.options{display:grid;gap:8px}
.option{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);line-height:1.5;transition:background .15s,border-color .15s}
.option:hover{background:var(--teal-softer);border-color:#c8ded9}
.option input{accent-color:var(--teal);margin-top:4px;width:16px;height:16px}
.answer-input,.essay-input{width:100%;border:1px solid #ccd9dc;border-radius:var(--radius-sm);padding:11px 13px;background:#fff;min-height:46px;color:var(--text)}
.essay-input{min-height:105px;resize:vertical}
.feedback{margin-top:10px;padding:11px 13px;border-inline-start:4px solid var(--teal);background:var(--teal-softer);font-size:.88rem;line-height:1.6;border-radius:9px}

.check-row{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.primary{border:0;background:var(--teal);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;min-height:44px;transition:background .15s}

.secondary:hover{background:var(--paper)}
.secondary:disabled{opacity:.45;cursor:default}
.score{color:var(--good);font-weight:700}
.score.low{color:var(--red)}
.notice{background:var(--amber-soft);border:1px solid #eedaa8;color:#7a5f2b;padding:12px 16px;line-height:1.55;margin-top:16px;font-size:.85rem;border-radius:var(--radius-sm)}
.notice.info{background:var(--teal-softer);border-color:#cfe4df;color:#335a54}
.footer{margin-top:18px;color:var(--muted);font-size:.8rem;line-height:1.6}
.empty{padding:26px;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:var(--radius-sm)}
.source-visuals{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}

.visual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;align-items:start}
.source-visual{margin:0;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .15s}

.source-visual img{display:block;width:100%;max-height:320px;object-fit:contain;background:#fff;border-bottom:1px solid var(--line2)}
.source-visual figcaption{padding:9px 12px;color:var(--teal-strong);font-size:.72rem;font-weight:600;direction:ltr;text-align:center;background:var(--teal-softer)}
.source-visual.img-missing{min-height:120px}

.file-list{display:grid;gap:6px;margin-top:8px}
.file-link{font-size:.84rem;color:#2c6b66}
.index-subject{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(170px,.7fr) 1fr;align-items:center;gap:20px;padding:22px 26px}

.index-subject h2{font-family:var(--serif);font-weight:600;margin:0 0 4px;font-size:1.45rem}

.subject-tag{font-size:.82rem;color:#3f6f6a}
.subject-chip{display:inline-block;margin:8px 8px 0 0;font-size:.72rem;background:var(--teal-soft);color:var(--teal-strong);padding:4px 10px;border-radius:999px;font-weight:600}
.open-link{display:inline-flex;align-items:center;gap:7px;justify-self:end;text-decoration:none;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:.88rem;white-space:nowrap;font-weight:600;transition:background .15s}

.open-link svg{width:15px;height:15px;flex:none}
.import-box{background:var(--card);border:1px solid var(--line);padding:20px 24px;margin-top:20px;border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.import-box h3{margin:0 0 5px}
.import-box p{color:var(--muted);font-size:.86rem;line-height:1.55}
.import-results{display:grid;gap:8px;margin-top:12px}
.import-item{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0;font-size:.88rem}
.fc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px;flex-wrap:wrap}
.fc-head h3{margin:0;font-size:1.18rem}
.fc-head p{margin:0;font-size:.8rem;color:var(--muted)}
.fc-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fc-controls select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;min-height:42px;color:var(--text)}
.fc-stage{perspective:1400px;margin:6px 0 14px}

.fc-front{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.fc-back{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#ecf6f4;transform:rotateY(180deg);border:1px solid var(--ink2)}
.fc-tag{font-size:.72rem;font-weight:500;color:var(--muted);position:absolute;top:16px;inset-inline-start:16px}

.fc-front .fc-text{font-weight:600;color:var(--text)}

.fc-back .fc-en{direction:ltr;margin-top:4px;padding-top:10px;border-top:1px solid rgba(255,255,255,.16);font-size:.9rem;font-weight:600;color:#cfe9e3;max-width:56ch}

const DATA={"id":"ct-anatomy","titleAr":"تشريح الـ CT","titleEn":"CT Anatomy","lessons":[{"id":"cta-intro","titleAr":"مدخل التشريح المقطعي ووسائل التصوير","titleEn":"Introduction to imaging & cross-sectional anatomy","summaryAr":"مقدمة المادة: وسائل التصوير (أشعة، CT، MRI، موجات) بمزايا وعيوب كل واحدة + مستويات الجسم + وحدات Hounsfield والنوافذ.","summaryEn":"The course opener: imaging modalities with pros and cons, body planes, Hounsfield units and CT windowing.","objectivesAr":["قارن بين وسائل التصوير.","عرّف مستويات الجسم الثلاثة.","اذكر وحدات هونسفيلد الأساسية."],"objectivesEn":["Compare the imaging modalities.","Define the three body planes.","State the basic Hounsfield values."],"refs":[{"source":"cta-intro","n":7},{"source":"cta-intro","n":15},{"source":"cta-intro","n":24},{"source":"cta-intro","n":28},{"source":"cta-intro","n":30},{"source":"cta-intro","n":34},{"source":"cta-intro","n":36},{"source":"cta-intro","n":37},{"source":"cta-intro","n":38},{"source":"cta-intro","n":39},{"source":"cta-intro","n":40}],"galleryRefs":[{"source":"cta-intro","n":3},{"source":"cta-intro","n":4},{"source":"cta-intro","n":5},{"source":"cta-intro","n":6},{"source":"cta-intro","n":8},{"source":"cta-intro","n":9},{"source":"cta-intro","n":10},{"source":"cta-intro","n":11},{"source":"cta-intro","n":13},{"source":"cta-intro","n":14},{"source":"cta-intro","n":17},{"source":"cta-intro","n":18},{"source":"cta-intro","n":19},{"source":"cta-intro","n":20}],"evidence":[{"file":"1.introduction of CT Anatomy.pptx","loc":"Slide 7","text":"Advantages Primary imaging tool. Cheap. Available. Disadvantages Radiation exposure. Contraindications e.g. pregnancy","egyptian":"الأشعة السينية: أداة التصوير الأولية — رخيصة ومتاحة، لكن عيبها التعرض للإشعاع وموانعها زي الحمل."},{"file":"1.introduction of CT Anatomy.pptx","loc":"Slide 15","text":"Advantages Fast. Accurate specially in areas of complex anatomy e.g. spine and pelvis. Sensitive Disadvantages Radiation exposure. Contraindications e.g. pregnancy.","egyptian":"الـ CT: سريع ودقيق خصوصًا في مناطق التشريح المعقد زي العمود الفقري والحوض وحساس — وله نفس عيوب الأشعة: إشعاع وموانع الحمل."},{"file":"1.introduction of CT Anatomy.pptx","loc":"Slide 24","text":"Advantages Excellent resolution. Soft tissue. Disadvantages Expensive. Long time Claustrophobia in closed MRI. Contraindications e.g. cardiac valve prosthesis, nonferromagnetic metallic internal fixators, intra-cranial aneurysm clips.","egyptian":"الـ MRI: دقة ممتازة وأفضل في الأنسجة الرخوة — لكن غالي وطويل وقد يسبب رهاب الأماكن المغلقة، وموانعه: صمامات قلبية وثبتات معدنية غير حديدية وكلبات أم دم داخل القحف."},{"file":"1.introduction of CT Anatomy.pptx","loc":"Slide 28","text":"Advantages No radiation exposure Simple. Fast. Cost-effective. Patient friendly specially for claustrophobic patients not fit for MRI Disadvantages Needs high operator experience.","egyptian":"الموجات فوق الصوتية: مفيش إشعاع خالص وبسيطة وسريعة واقتصادية ومناسبة لمرضى الرهاب اللي مش هيقدروا MRI — عيبها إنها محتاجة خبرة عالية من الفاحص."},{"file":"1.introduction of CT Anatomy.pptx","loc":"Slide 30","text":"PLANES OF THE BODY:- • Sagittal : A plane extending along the long axis of the body dividing it into right and left sides. • Coronal : A plane extending through the body dividing it into anterior and posterior parts. • Axial: A plane extending across or through the axis of the body, extending from side to side, dividing the body into superior and inferior portions.","egyptian":"المستويات: السهمي على المحور الطولي بيقسم الجسم يمين وشمال؛ والإكليلي بيقسم أمام وخلف؛ والأكسيل عرضي بيقسم لفوق وتحت."},{"file":"1.introduction of CT Anatomy.pptx","loc":"Slide 34","text":"Hounsfield unit Based on a series of complex mathematical processes, the computer reconstructs the image from a series of digital numbers. The numbers generated are registered on the Hounsfield scale, by which bone is 1,000, water is 0, and air is -1,000","egyptian":"مقياس Hounsfield: الكمبيوتر بيعيد بناء الصورة من أرقام رقمية — العظم +1000 والماء 0 والهواء -1000، والأنسجة بينهم تدرجات."},{"file":"1.introduction of CT Anatomy.pptx","loc":"Slide 36","text":"CT windowing is an image processing technique that adjusts the brightness and contrast of a CT scan by manipulating its greyscale values to highlight specific tissues or structures , such as bone or soft tissue","egyptian":"النوافذ: تقنية بتظبط السطوع والتباين بدرجات الرمادي عشان تبرز نسيج معين — رئة للرئة ومنصف للقلب والأوعية وعظم للعظام ومخ للدماغ."},{"file":"1.introduction of CT Anatomy.pptx","loc":"Slide 37","text":"Lung window","egyptian":"نافذة الرئة: الهواء أسود واضح وتفاصيل البرانشيم ظاهرة."},{"file":"1.introduction of CT Anatomy.pptx","loc":"Slide 38","text":"Mediastinum window","egyptian":"نافذة المنصف: بتبرز القلب والأوعية الكبيرة والأنسجة الرخوة الوسيطة."},{"file":"1.introduction of CT Anatomy.pptx","loc":"Slide 39","text":"Bone window","egyptian":"نافذة العظم: تفاصيل العظام والغضاريف والكلس واضحة جدًا."},{"file":"1.introduction of CT Anatomy.pptx","loc":"Slide 40","text":"Brain window","egyptian":"نافذة المخ: مخصوصة لدرجات الرمادي والأبيض والسائل النخاعي في الدماغ."}],"quiz":[{"type":"mcq","q":"Which imaging modality is described as having no radiation exposure but requiring high operator experience?","options":["Ultrasound","CT","MRI","X-ray"],"answer":0,"why":"The US slide lists no radiation and simple fast cost-effective use, with operator dependence as its disadvantage.","source":{"source":"cta-intro","n":28},"points":1},{"type":"mcq","q":"On the Hounsfield scale as taught, which pairing is correct?","options":["Bone +1000, water 0, air -1000","Bone 0, water +1000, air -100","Bone -1000, water 0, air +1000","Bone +100, water +50, air 0"],"answer":0,"why":"The scale anchors bone at 1,000, water at 0 and air at -1,000.","source":{"source":"cta-intro","n":34},"points":1}],"cards":[{"id":"fa02b0ba8e","front":"Compare the four imaging modalities in one line each","back":"أشعة: أولية رخيصة متاحة (إشعاع+حمل)؛ CT: سريع دقيق للمعقد (إشعاع)؛ MRI: أدق للرخوة (غالي/طويل/موانع معدنية)؛ موجات: بلا إشعاع وسريعة (خبرة الفاحص).","en":"X-ray: first-line cheap (radiation, pregnancy); CT: fast, accurate in complex anatomy (radiation); MRI: excellent soft-tissue resolution (cost, time, metal contraindications); US: no radiation, operator-dependent.","tag":"fact"},{"id":"d3e521d8fd","front":"Define the three body planes","back":"السهمي: طولي بيقسم يمين/شمال؛ الإكليلي: بيقسم أمام/خلف؛ الأكسيل: عرضي بيقسم فوق/تحت.","en":"Sagittal divides right/left; coronal divides anterior/posterior; axial divides superior/inferior.","tag":"fact"},{"id":"7dd23a670c","front":"Anchor Hounsfield values","back":"العظم +1000 والماء 0 والهواء -1000.","en":"Bone +1000, water 0, air -1000.","tag":"fact"},{"id":"a547f42149","front":"What is CT windowing and name the four taught windows","back":"تظبيط سطوع وتباين الصورة لإبراز نسيج — نوافذ: الرئة والمنصف والعظم والمخ.","en":"Adjusting brightness/contrast to highlight a tissue: lung, mediastinum, bone and brain windows.","tag":"fact"},{"id":"d3d20b891c","front":"Which imaging modality is described as having no radiation exposure but requiring high operator experience?","back":"Ultrasound — The US slide lists no radiation and simple fast cost-effective use, with operator dependence as its disadvantage.","en":"Ultrasound","tag":"quiz"},{"id":"b2296d01d6","front":"On the Hounsfield scale as taught, which pairing is correct?","back":"Bone +1000, water 0, air -1000 — The scale anchors bone at 1,000, water at 0 and air at -1,000.","en":"Bone +1000, water 0, air -1000","tag":"quiz"}],"midterm":[{"part":0,"n":1,"q":"Which modality is described as the primary imaging tool that is cheap and available?","options":["MRI","PET","X-ray","Ultrasound"],"answer":2,"why":"The X-ray slide lists primary tool, cheap and available, with radiation and pregnancy as drawbacks.","type":"mcq","points":1,"label":"Midterm bank · Q1","source":{"part":0,"qn":1}},{"part":0,"n":2,"q":"CT is especially accurate in which areas according to the lecture?","options":["Areas of complex anatomy such as spine and pelvis","The fetus","Bone marrow only","Superficial soft tissue only"],"answer":0,"why":"The CT slide highlights accuracy in complex anatomy like spine and pelvis.","type":"mcq","points":1,"label":"Midterm bank · Q2","source":{"part":0,"qn":2}},{"part":0,"n":3,"q":"A plane dividing the body into anterior and posterior parts is the:","options":["Sagittal plane","Axial plane","Oblique plane","Coronal plane"],"answer":3,"why":"Coronal divides anterior from posterior; sagittal right/left; axial superior/inferior.","type":"mcq","points":1,"label":"Midterm bank · Q3","source":{"part":0,"qn":3}}],"audios":[{"src":"Audio/CTA-Intro.m4a","title":"CT anatomy — introduction","start":0,"end":0}],"visuals":[{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 30","n":30,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-bd130c7cbf79.png","path":"Assets/cta-intro/visual-bd130c7cbf79.png"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 3","n":3,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-26ae4b7cc832.png","path":"Assets/cta-intro/visual-26ae4b7cc832.png"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 4","n":4,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-1d8f762043f8.jpeg","path":"Assets/cta-intro/visual-1d8f762043f8.jpeg"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 5","n":5,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-3eb7dd996282.jpeg","path":"Assets/cta-intro/visual-3eb7dd996282.jpeg"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 6","n":6,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-dee1a58952c4.jpeg","path":"Assets/cta-intro/visual-dee1a58952c4.jpeg"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 8","n":8,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-96a39934bd71.jpg","path":"Assets/cta-intro/visual-96a39934bd71.jpg"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 8","n":8,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-d0705305cd3a.jpg","path":"Assets/cta-intro/visual-d0705305cd3a.jpg"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 8","n":8,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-1b4a850d1070.jpg","path":"Assets/cta-intro/visual-1b4a850d1070.jpg"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 9","n":9,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-fea35930bcd0.jpg","path":"Assets/cta-intro/visual-fea35930bcd0.jpg"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 9","n":9,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-94d27200a48c.jpg","path":"Assets/cta-intro/visual-94d27200a48c.jpg"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 9","n":9,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-82bfbabcef7a.jpg","path":"Assets/cta-intro/visual-82bfbabcef7a.jpg"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 10","n":10,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-c48146d72297.jpg","path":"Assets/cta-intro/visual-c48146d72297.jpg"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 10","n":10,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-ea05afe8791c.jpeg","path":"Assets/cta-intro/visual-ea05afe8791c.jpeg"},{"source":"cta-intro","file":"1.introduction of CT Anatomy.pptx","loc":"Slide 11","n":11,"asset":"images\\1.introduction-of-CT-Anatomy\\visual-3b8da4c48fc8.jpg","path":"Assets/cta-intro/visual-3b8da4c48fc8.jpg"}]},{"id":"cta-brain-skull","titleAr":"جمجمة الدماغ وغرزها وحفرياتها","titleEn":"Skull, sutures and cranial fossae","summaryAr":"غلاف الدماغ العظمي: 8 عظام + الغرز الرئيسية + الحفريات الثلاث والغدة النخامية + طاولتا الجمجمة والمساحة الديبلوية.","summaryEn":"The bony cover: 8 bones, main sutures, the three fossae plus pituitary fossa, and inner/outer tables with diploic space.","objectivesAr":["عدّ عظام الجمجمة.","رتّب الغرز الرئيسية.","اربط كل حفرة بمحتوها."],"objectivesEn":["Count the skull bones.","Order the main sutures.","Match each fossa to its content."],"refs":[{"source":"cta-brain","n":2},{"source":"cta-brain","n":3},{"source":"cta-brain","n":4},{"source":"cta-brain","n":6}],"galleryRefs":[{"source":"cta-brain","n":5}],"evidence":[{"file":"2.BRAIN.pdf","loc":"Page 2","text":"Brain protective layers • Skull . • Meninges. • Cerebrospinsal fluid (CSF).","egyptian":"أغلفة حماية الدماغ: الجمجمة العظمية + السحايا الثلاثة + السائل النخاعي اللي بيلعب حواليهم وبيحمي."},{"file":"2.BRAIN.pdf","loc":"Page 3","text":"SKULL • The skull is formed from 8 bones ; frontal, parietal (2), temporal (2), sphenoid, occipital and ethmoid. • They ossify separately and gradually become united at the skull sutures. • The skull has inner and outer tables of cortical bone with central cancellous bone called dipolic space.","egyptian":"الجمجمة 8 عظام: الجبهي والجداري (2) والصدغي (2) والوتدي والقذالي والغربالي — بتتعظم منفصلة وبعدين بتتحد عند الغرز؛ والجمجمة فيها طاولة داخلية وخارجية من عظم قشري وبينهم العظم الإسفنجي (المساحة الديبلوية)."},{"file":"2.BRAIN.pdf","loc":"Page 4","text":"Sutures • The main sutures of the skull are the coronal, sagittal, lambdoid and squamosal sutures. • Coronal suture - unites the frontal bone with theparietal bones • Sagittal suture - unites the 2 parietal bones in the midline • Lambdoid suture - unites the parietal bones with the occipital bone • Squamosal suture - unites the squamous portion of the temporal bone with the parietal bones • Metopic suture - (if present) unites the 2 fontal bones","egyptian":"الغرز: الإكليلي بيوحد الجبهي مع الجداريين؛ والسهمي بيوحد الجداريين في النص؛ واللامي بيوحد الجداريين مع القذالي؛ والحرشفي بين الحرشفي للصدغي والجداري؛ والميتوبيك (لو موجود) بين نصفي الجبهي."},{"file":"2.BRAIN.pdf","loc":"Page 6","text":"Inside the skull are three distinct areas: anterior, middle, and posterior fossae. • Anterior cranial fossa accommodates the anterior part of the frontal lobes • Middle cranial fossa accommodate the temporal lobes • Posterior cranial fossa accommodates the cerebellum and brain stem • Pituitary fossa (PF) accommodates the pituitary gland","egyptian":"جوه الجمجمة 3 مناطق: الحفرة الأمامية للفصوص الجبهية، والوسطى للفصوص الصدغية، والخلفية للمخيخ وجذع الدماغ — وحفرة النخامية للغدة النخامية."}],"quiz":[{"type":"mcq","q":"How many bones form the skull, and which are paired?","options":["8 bones; parietal and temporal are paired","8 bones; frontal and occipital are paired","6 bones; parietal only is paired","22 bones; none paired"],"answer":0,"why":"Eight bones: frontal, parietal (2), temporal (2), sphenoid, occipital and ethmoid.","source":{"source":"cta-brain","n":3},"points":1},{"type":"mcq","q":"Which suture unites the parietal bones with the occipital bone?","options":["Lambdoid","Coronal","Sagittal","Squamosal"],"answer":0,"why":"The lambdoid suture unites the parietal bones with the occipital bone.","source":{"source":"cta-brain","n":4},"points":1}],"cards":[{"id":"2721bec490","front":"Count the skull bones","back":"8: جبهي + جداري (2) + صدغي (2) + وتدي + قذالي + غربالي.","en":"Eight: frontal, parietal (2), temporal (2), sphenoid, occipital, ethmoid.","tag":"fact"},{"id":"742c072919","front":"Name the four main sutures and what they unite","back":"الإكليلي (جبهي-جداري)؛ السهمي (الجداريين)؛ اللامي (جداري-قذالي)؛ الحرشفي (صدغي-جداري).","en":"Coronal (frontal-parietal), sagittal (two parietals), lambdoid (parietal-occipital), squamosal (temporal-parietal).","tag":"fact"},{"id":"185f90bce0","front":"Match each cranial fossa to its content","back":"الأمامية: الفصوص الجبهية؛ الوسطى: الصدغية؛ الخلفية: المخيخ وجذع الدماغ؛ + حفرة النخامية للغدة.","en":"Anterior: frontal lobes; middle: temporal lobes; posterior: cerebellum and brainstem; plus pituitary fossa.","tag":"fact"},{"id":"8f1dd72932","front":"Describe the skull tables","back":"طاولة داخلية وخارجية قشرية وبينهم العظم الإسفنجي (المساحة الديبلوية).","en":"Inner and outer cortical tables with the cancellous diploic space between.","tag":"fact"},{"id":"aad8cc0bcc","front":"How many bones form the skull, and which are paired?","back":"8 bones; parietal and temporal are paired — Eight bones: frontal, parietal (2), temporal (2), sphenoid, occipital and ethmoid.","en":"8 bones; parietal and temporal are paired","tag":"quiz"},{"id":"2fa212dd92","front":"Which suture unites the parietal bones with the occipital bone?","back":"Lambdoid — The lambdoid suture unites the parietal bones with the occipital bone.","en":"Lambdoid","tag":"quiz"}],"midterm":[{"part":0,"n":1,"q":"Which structure is NOT listed among the protective layers of the brain?","options":["Meninges","Skull","Corpus callosum","Cerebrospinal fluid"],"answer":2,"why":"The lecture identifies skull, meninges, and CSF as the protective layers of the brain.","type":"mcq","points":1,"label":"Midterm bank · Brain Q1","source":{"part":0,"qn":1}},{"part":0,"n":2,"q":"The skull is formed from how many bones according to the lecture?","options":["8","6","10","7"],"answer":0,"why":"The skull is formed from 8 bones: frontal, parietal (2), temporal (2), sphenoid, occipital, and ethmoid.","type":"mcq","points":1,"label":"Midterm bank · Brain Q2","source":{"part":0,"qn":2}},{"part":0,"n":3,"q":"Which bone is paired in the skull?","options":["Sphenoid","Ethmoid","Temporal","Occipital"],"answer":2,"why":"The temporal bones are paired.","type":"mcq","points":1,"label":"Midterm bank · Brain Q3","source":{"part":0,"qn":3}},{"part":0,"n":5,"q":"Which suture unites the frontal bone with the parietal bones?","options":["Lambdoid","Squamosal","Sagittal","Coronal"],"answer":3,"why":"The coronal suture joins the frontal bone to the parietal bones.","type":"mcq","points":1,"label":"Midterm bank · Brain Q5","source":{"part":0,"qn":5}},{"part":0,"n":6,"q":"The sagittal suture unites: [Page 4]","options":["Occipital and parietal bones","Temporal and parietal bones","Frontal and parietal bones","The two parietal bones"],"answer":3,"why":"The sagittal suture joins both parietal bones in the midline.","type":"mcq","points":1,"label":"Midterm bank · Brain Q6","source":{"part":0,"qn":6}},{"part":0,"n":7,"q":"Which suture joins the parietal bones with the occipital bone?","options":["Coronal","Lambdoid","Metopic","Squamosal"],"answer":1,"why":"The lambdoid suture joins parietal bones with the occipital bone.","type":"mcq","points":1,"label":"Midterm bank · Brain Q7","source":{"part":0,"qn":7}},{"part":0,"n":8,"q":"If present, the metopic suture joins:","options":["Two parietal bones","Two frontal bones","Occipital and parietal bones","Temporal and parietal bones"],"answer":1,"why":"The metopic suture joins the two frontal bones.","type":"mcq","points":1,"label":"Midterm bank · Brain Q8","source":{"part":0,"qn":8}},{"part":0,"n":10,"q":"The anterior cranial fossa accommodates primarily the:","options":["Cerebellum","Pituitary gland","Anterior part of frontal lobes","Brainstem"],"answer":2,"why":"The anterior cranial fossa contains the anterior frontal lobes.","type":"mcq","points":1,"label":"Midterm bank · Brain Q10","source":{"part":0,"qn":10}},{"part":0,"n":11,"q":"Which structure is accommodated by the pituitary fossa?","options":["Cerebellum","Pituitary gland","Pons","Third ventricle"],"answer":1,"why":"The pituitary fossa accommodates the pituitary gland.","type":"mcq","points":1,"label":"Midterm bank · Brain Q11","source":{"part":0,"qn":11}},{"part":0,"n":22,"q":"Sulci are best defined as:","options":["White matter tracts","Furrows located between gyri","CSF-producing structures","Folds of cortex"],"answer":1,"why":"Sulci are furrows between gyri and contain CSF.","type":"mcq","points":1,"label":"Midterm bank · Brain Q22","source":{"part":0,"qn":22}},{"part":0,"n":24,"q":"Which ventricular system component is paired?","options":["Cerebral aqueduct","Third ventricle","Fourth ventricle","Lateral ventricles"],"answer":3,"why":"The lateral ventricles are paired.","type":"mcq","points":1,"label":"Midterm bank · Brain Q24","source":{"part":0,"qn":24}},{"part":0,"n":31,"q":"Which fissure separates the cerebral hemispheres?","options":["Central sulcus","Interhemispheric fissure","Tentorium","Sylvian fissure"],"answer":1,"why":"The interhemispheric fissure separates both hemispheres.","type":"mcq","points":1,"label":"Midterm bank · Brain Q31","source":{"part":0,"qn":31}},{"part":0,"n":32,"q":"The Sylvian fissure separates the:","options":["Frontal and parietal lobes","Parietal and occipital lobes","Frontal and temporal lobes","Cerebrum and cerebellum"],"answer":2,"why":"The Sylvian fissure separates frontal and temporal lobes.","type":"mcq","points":1,"label":"Midterm bank · Brain Q32","source":{"part":0,"qn":32}},{"part":0,"n":35,"q":"Which structure performs higher functions including reasoning, speech, learning, and fine movement control?","options":["Pons","Cerebrum","Cerebellum","Brainstem"],"answer":1,"why":"These functions are attributed to the cerebrum.","type":"mcq","points":1,"label":"Midterm bank · Brain Q35","source":{"part":0,"qn":35}},{"part":0,"n":37,"q":"The cerebellar equivalent of cerebral gyri is called:","options":["Sulci","Fissures","Folia","Cisterns"],"answer":2,"why":"Cerebellar gyri are termed folia.","type":"mcq","points":1,"label":"Midterm bank · Brain Q37","source":{"part":0,"qn":37}},{"part":0,"n":38,"q":"The midline structure connecting the two cerebellar hemispheres is the:","options":["Tentorium","Pons","Falx","Vermis"],"answer":3,"why":"The cerebellar hemispheres are connected by the vermis.","type":"mcq","points":1,"label":"Midterm bank · Brain Q38","source":{"part":0,"qn":38}},{"part":0,"n":40,"q":"Ten of the twelve cranial nerves originate from the:","options":["Brainstem","Cerebellum","Cerebrum","Thalamus"],"answer":0,"why":"The lecture states that ten cranial nerves arise from the brainstem.","type":"mcq","points":1,"label":"Midterm bank · Brain Q40","source":{"part":0,"qn":40}},{"part":0,"n":49,"q":"The structure that “hugs” the folds and grooves of the brain surface is the:","options":["Pia mater","Arachnoid mater","Dura mater","Falx cerebri"],"answer":0,"why":"Pia mater closely follows the cortical surface and sulci.","type":"mcq","points":1,"label":"Midterm bank · Brain Q49","source":{"part":0,"qn":49}},{"part":0,"n":50,"q":"Which integrated statement is completely correct according to the lecture? [Page 12]","options":["Subdural space contains CSF; Sylvian fissure separates frontal and parietal lobes","Choroid plexus produces CSF; fourth ventricle lies between brainstem and cerebellum; CSF absorbed by arachnoid villi","Tentorium separates hemispheres; corpus callosum is gray matter","Falx separates cerebrum from cerebellum; CSF produced by arachnoid villi"],"answer":1,"why":"All three statements are directly supported by the lecture and integrate ventricular, meningeal, and CSF-circulation concepts. Part 2 Q","type":"mcq","points":1,"label":"Midterm bank · Brain Q50","source":{"part":0,"qn":50}}],"audios":[{"src":"Audio/CTA-Brain-1.m4a","title":"Brain anatomy — lecture 1","start":0,"end":0}],"visuals":[{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 2","n":2,"asset":"images\\2.BRAIN\\page-2.png","path":"Assets/cta-brain/page-2.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 3","n":3,"asset":"images\\2.BRAIN\\page-3.png","path":"Assets/cta-brain/page-3.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 4","n":4,"asset":"images\\2.BRAIN\\page-4.png","path":"Assets/cta-brain/page-4.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 6","n":6,"asset":"images\\2.BRAIN\\page-6.png","path":"Assets/cta-brain/page-6.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 5","n":5,"asset":"images\\2.BRAIN\\page-5.png","path":"Assets/cta-brain/page-5.png"}]},{"id":"cta-brain-meninges","titleAr":"السحايا ومساحات السائل النخاعي","titleEn":"Meninges and CSF spaces","summaryAr":"الأغشية الثلاثة + الشوكة والخيمة + المساحات + السحايى والعنكبوتية + البطينات والأهداب والصهاريج القاعدية.","summaryEn":"The three meningeal layers, falx and tentorium, subdural/subarachnoid spaces, ventricles with choroid plexus, fissures and basal cisterns.","objectivesAr":["رتّب طبقات السحايا.","سمّ طيات الأم الصلبة.","تتبع مسار السائل النخاعي."],"objectivesEn":["Order the meningeal layers.","Name the dural folds.","Trace the CSF pathway."],"refs":[{"source":"cta-brain","n":7},{"source":"cta-brain","n":8},{"source":"cta-brain","n":10},{"source":"cta-brain","n":11},{"source":"cta-brain","n":12},{"source":"cta-brain","n":13},{"source":"cta-brain","n":14},{"source":"cta-brain","n":15},{"source":"cta-brain","n":16}],"galleryRefs":[{"source":"cta-brain","n":9},{"source":"cta-brain","n":17},{"source":"cta-brain","n":18},{"source":"cta-brain","n":19},{"source":"cta-brain","n":20},{"source":"cta-brain","n":21}],"evidence":[{"file":"2.BRAIN.pdf","loc":"Page 7","text":"Meninges • The brain and spinal cord are covered and protected by three layers of tissue called meninges. From the outermost layer inward they are: • Outer layer:the dura mater. • Middle layer: arachnoid mater. • Inner layer: pia mater.","egyptian":"السحايا 3 طبقات من بره لجوه: الأم الجامعة (الصلبة) ثم العنكبوتية ثم الأم الحنون الملتصقة بالدماغ."},{"file":"2.BRAIN.pdf","loc":"Page 8","text":"Meninges… • The dura mater is a strong, thick membrane that closely lines the inside of the skull; its two layers, the periosteal and meningeal dura, are fused and separate only to form venous sinuses. • There are two special dural folds, the falx cerebri and the tentorium cerebelli. The falx separates the right and left hemispheres of the brain and the tentorium separates the cerebrum from the cerebellum. They are visible on CT imaging. Elsewhere the meningeal layers are not visible .","egyptian":"الأم الجامعة غلاف قوي مبطن لجوه الجمجمة بطبقتين ملتصقتين (سمحاقية وجنفية) بيفترقوا بس عند الجيوب الوريدية؛ وليها طيتين ظاهرتين على CT: منجل المخ بين نصفي الكرة والخيمة بين المخ والمخيخ — باقي السحايا مش ظاهرة على الـ CT."},{"file":"2.BRAIN.pdf","loc":"Page 10","text":"Meninges… • The arachnoid mater is a thin, web-like membrane that covers the entire brain. The space between the dura and arachnoid membranes is called the subdural space. • The pia mater hugs the surface of the brain following its folds and grooves. The space between the arachnoid and pia is called the subarachnoid space. It is where the cerebrospinal fluid bathes and cushions the brain.","egyptian":"العنكبوتية غشاء رقيق نسيجي بيغطي الدماغ كله — والمساحة بينها وبين الجامعة اسمها تحت الجامعة Subdural؛ والأم الحنون بتغلف سطح الدماغ بثنياته — والمساحة بينهم تحت العنكبوتية Subarachnoid وفيها السائل النخاعي بيلعب ويحمي الدماغ."},{"file":"2.BRAIN.pdf","loc":"Page 11","text":"CSF spaces • The brain is surrounded by cerebrospinal fluid (CSF) within the sulci, fissures and basal cisterns and ventricles together form the 'CSF spaces', also known as the 'extra- axial spaces'. • The brain surface is formed by folds of the cerebral cortex known as gyri. Between these gyri there are furrows, known as sulci, which contain CSF.","egyptian":"مساحات السائل: السائل النخاعي بيملا الأثلام والشقوق والصهاريج القاعدية والبطينات — واسمها التاني المساحات خارج المحورية؛ وسطح الدماغ من ثنيات قشرية اسمها التلافيف Gyri وبينهم الأثلام Sulci فيها سائل."},{"file":"2.BRAIN.pdf","loc":"Page 12","text":"ventricles • Two lateral ventricles. • Third ventricle. • Fourth ventricle.","egyptian":"البطينات 4: جانبيان + ثالث + رابع."},{"file":"2.BRAIN.pdf","loc":"Page 13","text":"Lateral ventricles • The paired lateral ventricles are located on either side of the brain. • Each ventricle has trigone, body,frontal , temporal & occipital horns • They contain the choroid plexus which produces CSF. Note : The choroid plexus is almost always calcified in adults.","egyptian":"البطونين الجانبيين على كل جانب وكل واحد له مثلث وجسم وقرون: جبهي وصدغي وقذالي — وجواهم الضفيرة المشيمية اللي بتفرز السائل، وهي في البالغين مكلسة تقريبًا دايمًا (علامة تعريف مفيدة)."},{"file":"2.BRAIN.pdf","loc":"Page 14","text":"Third ventricle • The third ventricle is located centrally. • The lateral ventricles communicate with the third ventricle via small holes (foramina of Monro).","egyptian":"البطين الثالث في المنتصف؛ والجانبيين بيتواصلوا معاه عبر ثقبَي مونرو."},{"file":"2.BRAIN.pdf","loc":"Page 15","text":"Fourth ventricle • Is located in the posterior fossa between the brain stem and cerebellum. • It communicates with the third ventricle above via a very narrow canal, the aqueduct of Sylvius . • Basal cisterns CSF in the basal cisterns surrounds the brain stem structures.","egyptian":"البطين الرابع في الحفرة الخلفية بين جذع الدماغ والمخيخ — بيتواصل مع الثالث فوق عبر قناة سيلفيوس الضيقة؛ وسائل الصهاريج القاعدية بيطوق بنى الجذع."},{"file":"2.BRAIN.pdf","loc":"Page 16","text":"Fissures • The interhemispheric fissure separates both cerebral hemispheres. • The Sylvian fissures separate the frontal and temporal lobes.","egyptian":"الشقوق: الشق بين النصفين بيفصل نصفي كرة المخ؛ وشقوق سيلفيوس بتفصل الجبهي عن الصدغي."}],"quiz":[{"type":"mcq","q":"Which dural fold separates the cerebrum from the cerebellum?","options":["Tentorium cerebelli","Falx cerebri","Tentorium falx","Diaphragma sellae"],"answer":0,"why":"The tentorium separates cerebrum from cerebellum; the falx separates the hemispheres — both visible on CT.","source":{"source":"cta-brain","n":8},"points":1},{"type":"mcq","q":"Where does CSF bathe and cushion the brain?","options":["The subarachnoid space","The subdural space","The diploic space","The epidural space"],"answer":0,"why":"The space between arachnoid and pia is the subarachnoid space, where CSF cushions the brain.","source":{"source":"cta-brain","n":10},"points":1}],"cards":[{"id":"a825c28bc6","front":"Order the meninges from outside in","back":"الجامعة ← العنكبوتية ← الحنون.","en":"Dura, arachnoid, pia.","tag":"fact"},{"id":"66b7a369e3","front":"Name the two dural folds and what they separate","back":"منجل المخ بين نصفي الكرة؛ الخيمة بين المخ والمخيخ — الاتنين ظاهرين على CT.","en":"Falx cerebri between hemispheres; tentorium between cerebrum and cerebellum — both seen on CT.","tag":"fact"},{"id":"b13aa61366","front":"Where is CSF located around the brain?","back":"في الأثلام والشقوق والصهاريج القاعدية والبطينات (المساحات خارج المحورية).","en":"In sulci, fissures, basal cisterns and ventricles (extra-axial spaces).","tag":"fact"},{"id":"97598833cc","front":"Trace CSF from lateral ventricles to the fourth","back":"الجانبي ← ثقبَي مونرو ← الثالث ← قناة سيلفيوس ← الرابع ← الصهاريج القاعدية.","en":"Lateral ventricles, foramina of Monro, third, aqueduct of Sylvius, fourth, basal cisterns.","tag":"fact"},{"id":"a7bbb30799","front":"What calcifies in adults inside the ventricles?","back":"الضفيرة المشيمية — تقريبًا دايمًا في البالغين.","en":"The choroid plexus, almost always in adults.","tag":"fact"},{"id":"affe2d8849","front":"Which dural fold separates the cerebrum from the cerebellum?","back":"Tentorium cerebelli — The tentorium separates cerebrum from cerebellum; the falx separates the hemispheres — both visible on CT.","en":"Tentorium cerebelli","tag":"quiz"},{"id":"2c7ce8987a","front":"Where does CSF bathe and cushion the brain?","back":"The subarachnoid space — The space between arachnoid and pia is the subarachnoid space, where CSF cushions the brain.","en":"The subarachnoid space","tag":"quiz"}],"midterm":[{"part":0,"n":12,"q":"The meningeal layer closest to the skull is the:","options":["Arachnoid mater","Dura mater","Pia mater","Cortex"],"answer":1,"why":"Dura mater is the outermost meningeal layer.","type":"mcq","points":1,"label":"Midterm bank · Brain Q12","source":{"part":0,"qn":12}},{"part":0,"n":13,"q":"Correct order of meninges from outermost to innermost is:","options":["Pia → Arachnoid → Dura","Dura → Arachnoid → Pia","Dura → Pia → Arachnoid","Arachnoid → Dura → Pia"],"answer":1,"why":"Dura is outermost, arachnoid is middle, pia is innermost.","type":"mcq","points":1,"label":"Midterm bank · Brain Q13","source":{"part":0,"qn":13}},{"part":0,"n":14,"q":"The dura mater consists of which two fused layers?","options":["Arachnoid and pia","Inner and outer","Periosteal and meningeal","Cortical and medullary"],"answer":2,"why":"The dura consists of periosteal and meningeal layers.","type":"mcq","points":1,"label":"Midterm bank · Brain Q14","source":{"part":0,"qn":14}},{"part":0,"n":15,"q":"Separation of the dural layers forms:","options":["Venous sinuses","Cisterns","Sulci","Ventricles"],"answer":0,"why":"The dural layers separate only to form venous sinuses.","type":"mcq","points":1,"label":"Midterm bank · Brain Q15","source":{"part":0,"qn":15}},{"part":0,"n":16,"q":"Which dural fold separates the right and left cerebral hemispheres?","options":["Sylvian fissure","Corpus callosum","Tentorium cerebelli","Falx cerebri"],"answer":3,"why":"Falx cerebri separates the cerebral hemispheres.","type":"mcq","points":1,"label":"Midterm bank · Brain Q16","source":{"part":0,"qn":16}},{"part":0,"n":17,"q":"Tentorium cerebelli separates: [Page 6]","options":["Frontal and parietal lobes","Right and left hemispheres","Pons and medulla","Cerebrum and cerebellum"],"answer":3,"why":"Tentorium separates the cerebrum from the cerebellum.","type":"mcq","points":1,"label":"Midterm bank · Brain Q17","source":{"part":0,"qn":17}},{"part":0,"n":18,"q":"Which meningeal layer is described as a thin web-like membrane?","options":["Falx","Arachnoid mater","Pia mater","Dura mater"],"answer":1,"why":"The arachnoid is described as a thin web-like membrane.","type":"mcq","points":1,"label":"Midterm bank · Brain Q18","source":{"part":0,"qn":18}},{"part":0,"n":19,"q":"The subdural space lies between the:","options":["Arachnoid and pia","Pia and cortex","Skull and dura","Dura and arachnoid"],"answer":3,"why":"The space between dura and arachnoid is called the subdural space.","type":"mcq","points":1,"label":"Midterm bank · Brain Q19","source":{"part":0,"qn":19}},{"part":0,"n":20,"q":"The subarachnoid space is located between:","options":["Dura and arachnoid","Dura and skull","Pia and cortex","Arachnoid and pia"],"answer":3,"why":"The subarachnoid space lies between arachnoid and pia.","type":"mcq","points":1,"label":"Midterm bank · Brain Q20","source":{"part":0,"qn":20}},{"part":0,"n":21,"q":"CSF directly bathes and cushions the brain within the:","options":["Falx","Subdural space","Subarachnoid space","Diploic space"],"answer":2,"why":"CSF occupies the subarachnoid space.","type":"mcq","points":1,"label":"Midterm bank · Brain Q21","source":{"part":0,"qn":21}},{"part":0,"n":25,"q":"Which structure produces CSF?","options":["Falx cerebri","Foramen of Monro","Aqueduct of Sylvius","Choroid plexus"],"answer":3,"why":"CSF is produced by the choroid plexus.","type":"mcq","points":1,"label":"Midterm bank · Brain Q25","source":{"part":0,"qn":25}},{"part":0,"n":26,"q":"Which imaging finding is described as almost always present in the adult choroid plexus?","options":["Hemorrhage","Calcification","Enhancement","Atrophy"],"answer":1,"why":"Choroid plexus calcification is almost always present in adults.","type":"mcq","points":1,"label":"Midterm bank · Brain Q26","source":{"part":0,"qn":26}},{"part":0,"n":28,"q":"Which ventricle is centrally located? [Page 8]","options":["Left lateral ventricle","Right lateral ventricle","Fourth ventricle","Third ventricle"],"answer":3,"why":"The third ventricle is centrally located.","type":"mcq","points":1,"label":"Midterm bank · Brain Q28","source":{"part":0,"qn":28}},{"part":0,"n":29,"q":"The fourth ventricle lies between the:","options":["Cerebral hemispheres","Temporal lobes","Frontal lobes","Cerebellum and brainstem"],"answer":3,"why":"The fourth ventricle is located between the brainstem and cerebellum.","type":"mcq","points":1,"label":"Midterm bank · Brain Q29","source":{"part":0,"qn":29}}],"audios":[{"src":"Audio/CTA-Brain-1.m4a","title":"Brain anatomy — lecture 1","start":0,"end":0}],"visuals":[{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 7","n":7,"asset":"images\\2.BRAIN\\page-7.png","path":"Assets/cta-brain/page-7.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 8","n":8,"asset":"images\\2.BRAIN\\page-8.png","path":"Assets/cta-brain/page-8.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 10","n":10,"asset":"images\\2.BRAIN\\page-10.png","path":"Assets/cta-brain/page-10.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 11","n":11,"asset":"images\\2.BRAIN\\page-11.png","path":"Assets/cta-brain/page-11.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 12","n":12,"asset":"images\\2.BRAIN\\page-12.png","path":"Assets/cta-brain/page-12.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 13","n":13,"asset":"images\\2.BRAIN\\page-13.png","path":"Assets/cta-brain/page-13.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 14","n":14,"asset":"images\\2.BRAIN\\page-14.png","path":"Assets/cta-brain/page-14.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 15","n":15,"asset":"images\\2.BRAIN\\page-15.png","path":"Assets/cta-brain/page-15.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 16","n":16,"asset":"images\\2.BRAIN\\page-16.png","path":"Assets/cta-brain/page-16.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 9","n":9,"asset":"images\\2.BRAIN\\page-9.png","path":"Assets/cta-brain/page-9.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 17","n":17,"asset":"images\\2.BRAIN\\page-17.png","path":"Assets/cta-brain/page-17.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 18","n":18,"asset":"images\\2.BRAIN\\page-18.png","path":"Assets/cta-brain/page-18.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 19","n":19,"asset":"images\\2.BRAIN\\page-19.png","path":"Assets/cta-brain/page-19.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 20","n":20,"asset":"images\\2.BRAIN\\page-20.png","path":"Assets/cta-brain/page-20.png"}]},{"id":"cta-brain-structures","titleAr":"بنية الدماغ: المادة الرمادية والبيضاء","titleEn":"Brain structures: grey and white matter","summaryAr":"المخ وفصوصه + المخيخ وجذع الدماغ + الفرق بين الرمادي والأبيض على CT + العقد القاعدية والمهاد والكبسولة الداخلية والجسم الثفني.","summaryEn":"Cerebrum and lobes, cerebellum, brainstem; grey versus white matter on CT; basal ganglia, thalamus, internal capsule and corpus callosum.","objectivesAr":["عدّ فصوص نصف كرة المخ.","ميّز الرمادي عن الأبيض كثافةً.","سمّ ماصلات المادة البيضاء."],"objectivesEn":["Count the hemisphere lobes.","Distinguish grey from white by density.","Name the white-matter tracts."],"refs":[{"source":"cta-brain","n":22},{"source":"cta-brain","n":23},{"source":"cta-brain","n":24},{"source":"cta-brain","n":25},{"source":"cta-brain","n":26},{"source":"cta-brain","n":27},{"source":"cta-brain","n":28},{"source":"cta-brain","n":29}],"galleryRefs":[{"source":"cta-brain","n":30}],"evidence":[{"file":"2.BRAIN.pdf","loc":"Page 22","text":"Brain. •The brain is composed of the: •Cerebrum. •Cerebellum. •Brain stem.","egyptian":"الدماغ مكوّن من: المخ + المخيخ + جذع الدماغ."},{"file":"2.BRAIN.pdf","loc":"Page 23","text":"Brain. • The cerebrum is the largest part of the brain and is composed of right and left hemispheres. It performs higher functions like interpreting, touch, vision and hearing, as well as speech, reasoning, emotions, learning, and fine control of movement. • The cerebral hemispheres have distinct fissures, which divide the brain into lobes. Each hemisphere has 4 lobes: frontal, temporal, parietal, and occipital.","egyptian":"المخ أكبر جزء ومن نصفي كرة — مسؤول عن الوظائف العليا: اللمس والبصر والسمع والكلام والتفكير والمشاعر والتعلم والتحكم الدقيق للحركة؛ وكل نصف كرة 4 فصوص: جبهي وصدغي وجداري وقذالي."},{"file":"2.BRAIN.pdf","loc":"Page 24","text":"Brain lobes - CT brain (superior slice) On both sides the frontal lobes are separated from the parietal lobes by the central sulcus Note: The large frontal lobes as compared to parietal and occipital lobes Brain lobes - CT brain (inferior slice) the frontal lobes at anterior cranial fossae .The temporal lobes at middle cranial fossae .The cerebellum and brain stem at the posterior fossa","egyptian":"على القطاع العلوي: الجبهيان متشالين عن الجداريين بالثلم المركزي — ولاحظ حجم الجبهيين الكبير مقارنة بالجداري والقذالي؛ وعلى السفلي: الجبهي في الحفرة الأمامية والصدغي في الوسطى والمخيخ وجذع الدماغ في الخلفية."},{"file":"2.BRAIN.pdf","loc":"Page 25","text":"Brain... • The cerebellum is located under the cerebrum. • it’s two hemishperes with midline structure named vermis. • Its function is to coordinate muscle movements, maintain posture, and balance. • Note the gyri in cerebellum is named foli","egyptian":"المخيخ تحت المخ: نصفي كرة وبينهم الدودة Vermis في النص — وظيفته تنسيق الحركة والحفاظ على الوضعية والتوازن؛ وثنياته اسمها الأوراق Folli."},{"file":"2.BRAIN.pdf","loc":"Page 26","text":"Brain... • The brainstem is the lower extension of the brain, located in front of the cerebellum and connected to the spinal cord. • It consists of three structures; the midbrain, pons and medulla oblongata. • It performs many automatic functions such as breathing, heart rate, body temperature, wake and sleep cycles, digestion, sneezing, coughing, vomiting, and swallowing. Ten of the twelve cranial nerves originate in the brainstem. Destruction of these regions of the brain will cause \"brain death.\" Without these key functions, humans cannot survive.","egyptian":"جذع الدماغ امتداد سفلي قدام المخيخ ومتصل بالنخاع الشوكي — من 3 أجزاء: الدماغ المتوسط والجسر والبصلة؛ ووظايفه التلقائية: التنفس وضربات القلب والحرارة ودورات النوم والهضم والعطس والكحة والتقيؤ والبلع — و10 من الأعصاب المخية الـ 12 بيطلعوا منه؛ وتدميره = موت الدماغ."},{"file":"2.BRAIN.pdf","loc":"Page 27","text":"• The brain consists of grey and white matter structures which are differentiated on CT by differences in density. • White matter has a high content of myelinated axons. • Grey matter contains relatively few axons and a higher number of cell bodies. • As myelin is a fatty substance it is of relatively low density compared to the cellular grey matter. White matter, therefore, appears blacker than grey matter. Grey / white matter","egyptian":"الدماغ مادة رمادية وبيضاء بتتفرق على CT بالكثافة: البيضاء مليانة ألياف ميالينية والرمارية أجسام خلوية — والميالين مادة دهنية كثافتها أقل، فالبيضاء تظهر أسود من الرمادية."},{"file":"2.BRAIN.pdf","loc":"Page 28","text":"Grey matter structures Important grey matter structures visible on CT : • Cortex, insula. • Basal ganglia( lentiform nucleus + caudate nucleus ). • Thalamus .","egyptian":"أهم الرمادية الظاهرة على CT: القشرة والجزيرة + العقد القاعدية (النواة العدسية + النواة الذيلية) + المهاد."},{"file":"2.BRAIN.pdf","loc":"Page 29","text":"White matter structures The internal capsules are white matter tracts which connect with the corona radiata superiorly with the brain stem inferiorly. The corpus callosum is a white matter tract located in the midline. It arches over the lateral ventricles and connects white matter of the left and right cerebral hemispheres.","egyptian":"البيضاء: الكبسولات الداخلية ماصلات بتربط التاج المشع فوق بجذع الدماغ تحت؛ والجسم الثفني في المنتصف بيقوس فوق البطينين الجانبيين وبيوصل مادة البيضاء بين نصفي المخ."}],"quiz":[{"type":"mcq","q":"Why does white matter appear blacker than grey matter on CT?","options":["Myelin is fatty and relatively low in density","White matter has more cell bodies","Grey matter contains CSF","White matter calcifies"],"answer":0,"why":"Myelin is a fatty substance of relatively low density compared with cellular grey matter.","source":{"source":"cta-brain","n":27},"points":1},{"type":"mcq","q":"Which grey-matter structures are listed as visible on CT?","options":["Cortex/insula, basal ganglia and thalamus","Cortex, amygdala and hippocampus","Thalamus, pituitary and pineal only","Basal ganglia and cerebellar foli only"],"answer":0,"why":"The visible grey matter: cortex and insula, basal ganglia (lentiform + caudate) and thalamus.","source":{"source":"cta-brain","n":28},"points":1}],"cards":[{"id":"afd92504ed","front":"List the four lobes of each hemisphere","back":"جبهي وصدغي وجداري وقذالي.","en":"Frontal, temporal, parietal, occipital.","tag":"fact"},{"id":"b2d93b2553","front":"What separates frontal from parietal on a superior slice?","back":"الثلم المركزي.","en":"The central sulcus.","tag":"fact"},{"id":"1ce68f462b","front":"Why is white matter darker than grey on CT?","back":"الميالين دهني وكثافته أقل من خلايا الرمادية.","en":"Myelin is fatty and relatively hypodense to cellular grey matter.","tag":"fact"},{"id":"a0dc8c3015","front":"Name the visible grey-matter structures on CT","back":"القشرة والجزيرة + العقد القاعدية (عدسية + ذيلية) + المهاد.","en":"Cortex/insula, basal ganglia (lentiform + caudate), thalamus.","tag":"fact"},{"id":"28df26ce39","front":"What are the internal capsule and corpus callosum?","back":"الكبسولة الداخلية ماصلات بتربط التاج المشع بجذع الدماغ؛ والجسم الثفني ماصل نصفي المخ في النص فوق البطينين.","en":"Internal capsule: tracts linking corona radiata to brainstem; corpus callosum: midline tract connecting the hemispheres.","tag":"fact"},{"id":"8592f5463f","front":"Brainstem parts and one vital fact","back":"متوسط + جسر + بصلة — 10 من 12 عصب مخي منه وتدميره = موت دماغ.","en":"Midbrain, pons, medulla; ten of twelve cranial nerves arise here; destruction = brain death.","tag":"fact"},{"id":"40bdb565b9","front":"Why does white matter appear blacker than grey matter on CT?","back":"Myelin is fatty and relatively low in density — Myelin is a fatty substance of relatively low density compared with cellular grey matter.","en":"Myelin is fatty and relatively low in density","tag":"quiz"},{"id":"2555eeca25","front":"Which grey-matter structures are listed as visible on CT?","back":"Cortex/insula, basal ganglia and thalamus — The visible grey matter: cortex and insula, basal ganglia (lentiform + caudate) and thalamus.","en":"Cortex/insula, basal ganglia and thalamus","tag":"quiz"}],"midterm":[{"part":0,"n":9,"q":"Which cranial fossa accommodates the temporal lobes?","options":["Pituitary fossa","Posterior cranial fossa","Middle cranial fossa","Anterior cranial fossa"],"answer":2,"why":"The middle cranial fossa accommodates the temporal lobes.","type":"mcq","points":1,"label":"Midterm bank · Brain Q9","source":{"part":0,"qn":9}},{"part":0,"n":36,"q":"The central sulcus separates the:","options":["Parietal and occipital lobes","Temporal and occipital lobes","Frontal and temporal lobes","Frontal and parietal lobes"],"answer":3,"why":"The central sulcus divides frontal from parietal lobes.","type":"mcq","points":1,"label":"Midterm bank · Brain Q36","source":{"part":0,"qn":36}},{"part":0,"n":41,"q":"Destruction of the brainstem regions responsible for automatic functions results in:","options":["Brain death","Cerebellar ataxia","Hydrocephalus","Aphasia"],"answer":0,"why":"The lecture explicitly states destruction of these regions causes brain death.","type":"mcq","points":1,"label":"Midterm bank · Brain Q41","source":{"part":0,"qn":41}},{"part":0,"n":42,"q":"On CT, white matter appears darker than gray matter primarily because:","options":["It contains more vessels","It contains more calcification","Myelin is relatively low density","It contains more CSF"],"answer":2,"why":"Myelin is fatty and lower density than gray matter.","type":"mcq","points":1,"label":"Midterm bank · Brain Q42","source":{"part":0,"qn":42}},{"part":0,"n":43,"q":"Which structure is classified as gray matter in the lecture?","options":["Thalamus","Corona radiata","Internal capsule","Corpus callosum"],"answer":0,"why":"The thalamus is listed among gray matter structures.","type":"mcq","points":1,"label":"Midterm bank · Brain Q43","source":{"part":0,"qn":43}},{"part":0,"n":44,"q":"The basal ganglia in this lecture consist of the:","options":["Lentiform nucleus and caudate nucleus","Corpus callosum and corona radiata","Thalamus and insula","Internal capsule and thalamus"],"answer":0,"why":"Basal ganglia are described as lentiform plus caudate nuclei.","type":"mcq","points":1,"label":"Midterm bank · Brain Q44","source":{"part":0,"qn":44}},{"part":0,"n":45,"q":"The internal capsules are white matter tracts connecting:","options":["Cerebellum to cerebrum","Thalamus to insula","Corpus callosum to falx","Corona radiata superiorly with brainstem inferiorly"],"answer":3,"why":"This relationship is specifically emphasized in the lecture.","type":"mcq","points":1,"label":"Midterm bank · Brain Q45","source":{"part":0,"qn":45}},{"part":0,"n":46,"q":"The corpus callosum is best described as:","options":["White matter tract connecting both hemispheres","CSF-producing structure","Dural fold between hemispheres","Gray matter nucleus in the midline"],"answer":0,"why":"The corpus callosum connects white matter of both cerebral hemispheres.","type":"mcq","points":1,"label":"Midterm bank · Brain Q46","source":{"part":0,"qn":46}},{"part":0,"n":48,"q":"A structure arches over the lateral ventricles and connects the white matter of both hemispheres. It is the:","options":["Falx cerebri","Thalamus","Lentiform nucleus","Corpus callosum"],"answer":3,"why":"This is the exact lecture description of the corpus callosum.","type":"mcq","points":1,"label":"Midterm bank · Brain Q48","source":{"part":0,"qn":48}}],"audios":[{"src":"Audio/CTA-Brain-1.m4a","title":"Brain anatomy — lecture 1","start":0,"end":0}],"visuals":[{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 22","n":22,"asset":"images\\2.BRAIN\\page-22.png","path":"Assets/cta-brain/page-22.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 23","n":23,"asset":"images\\2.BRAIN\\page-23.png","path":"Assets/cta-brain/page-23.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 24","n":24,"asset":"images\\2.BRAIN\\page-24.png","path":"Assets/cta-brain/page-24.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 25","n":25,"asset":"images\\2.BRAIN\\page-25.png","path":"Assets/cta-brain/page-25.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 26","n":26,"asset":"images\\2.BRAIN\\page-26.png","path":"Assets/cta-brain/page-26.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 27","n":27,"asset":"images\\2.BRAIN\\page-27.png","path":"Assets/cta-brain/page-27.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 28","n":28,"asset":"images\\2.BRAIN\\page-28.png","path":"Assets/cta-brain/page-28.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 29","n":29,"asset":"images\\2.BRAIN\\page-29.png","path":"Assets/cta-brain/page-29.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 30","n":30,"asset":"images\\2.BRAIN\\page-30.png","path":"Assets/cta-brain/page-30.png"}]},{"id":"cta-brain-axial","titleAr":"المقاطع الأكسية للرأس بالترتيب","titleEn":"Axial CT head sections level by level","summaryAr":"جولة بالصور من أسفل لفوق: مستوى الثقب الكبير → البطين الرابع → فوق الرابع → الخيمي → البطين الثالث → الجانبيين → فوق البطينات.","summaryEn":"A level-by-level image walk: foramen magnum, fourth ventricle, above fourth, tentorial, third ventricle, lateral ventricles and above.","objectivesAr":["رتّب مستويات المقاطع.","حدد علامة كل مستوى.","تعرّف على البنى في كل قطاع."],"objectivesEn":["Order the section levels.","Identify each level's landmark.","Recognize structures per slice."],"refs":[{"source":"cta-brain","n":31}],"galleryRefs":[{"source":"cta-brain","n":32},{"source":"cta-brain","n":33},{"source":"cta-brain","n":34},{"source":"cta-brain","n":35},{"source":"cta-brain","n":36},{"source":"cta-brain","n":37},{"source":"cta-brain","n":38},{"source":"cta-brain","n":39}],"evidence":[{"file":"2.BRAIN.pdf","loc":"Page 31","text":"AXIAL SECTIONS OF CT HEAD POSTERIOR FOSSA CUTS -ABOVE THE FORAMEN MAGNUM LEVEL -LEVEL OF THE FOURTH VENTRICLE -ABOVE THE FOURTH VENTRICULAR LEVEL -TENTORIAL SUPRATENTORIAL CUTS -THIRD VENTRICULAR LEVEL -LATERAL VENTRICULAR LEVEL -ABOVE THE VENTRICULAR LEVEL","egyptian":"المقاطع الأكسية للرأس بالترتيب من تحت لفوق — تحت الخيمة: فوق مستوى الثقب الكبير ثم مستوى البطين الرابع ثم فوقه ثم المستوى الخيمي؛ وفوق الخيمة: مستوى البطين الثالث ثم الجانبيين ثم فوق البطينات."}],"quiz":[{"type":"mcq","q":"In the taught order of axial head sections, which level comes right after the fourth-ventricle level?","options":["Above the fourth ventricular level","Third ventricular level","Lateral ventricular level","Foramen magnum level"],"answer":0,"why":"Order: above foramen magnum, fourth ventricle, above fourth ventricle, tentorial, then supratentorial levels.","source":{"source":"cta-brain","n":31},"points":1},{"type":"mcq","q":"The supratentorial cuts in the taught order include all EXCEPT:","options":["Foramen magnum level","Third ventricular level","Lateral ventricular level","Above the ventricular level"],"answer":0,"why":"Foramen magnum belongs to the posterior-fossa (infratentorial) group.","source":{"source":"cta-brain","n":31},"points":1}],"cards":[{"id":"3c052215d5","front":"Order the infratentorial axial levels","back":"فوق الثقب الكبير ← مستوى البطين الرابع ← فوقه ← الخيمي.","en":"Above foramen magnum, fourth-ventricle, above fourth, tentorial.","tag":"fact"},{"id":"17532bc27a","front":"Order the supratentorial axial levels","back":"البطين الثالث ← الجانبيان ← فوق البطينات.","en":"Third ventricle, lateral ventricles, above ventricular.","tag":"fact"},{"id":"562f60fe80","front":"What is the surface pattern of gyri and sulci?","back":"ثنيات قشرية (Gyri) وبينهم أثلام (Sulci) فيها سائل.","en":"Folds (gyri) with CSF-containing grooves (sulci).","tag":"fact"},{"id":"c91a09b836","front":"In the taught order of axial head sections, which level comes right after the fourth-ventricle level?","back":"Above the fourth ventricular level — Order: above foramen magnum, fourth ventricle, above fourth ventricle, tentorial, then supratentorial levels.","en":"Above the fourth ventricular level","tag":"quiz"},{"id":"cc22aa518c","front":"The supratentorial cuts in the taught order include all EXCEPT:","back":"Foramen magnum level — Foramen magnum belongs to the posterior-fossa (infratentorial) group.","en":"Foramen magnum level","tag":"quiz"}],"midterm":[{"part":0,"n":23,"q":"The extra-axial CSF spaces include sulci, fissures, cisterns, and:","options":["Brainstem nuclei","Internal capsules","Basal ganglia","Ventricles"],"answer":3,"why":"CSF spaces include sulci, fissures, basal cisterns, and ventricles.","type":"mcq","points":1,"label":"Midterm bank · Brain Q23","source":{"part":0,"qn":23}}],"audios":[{"src":"Audio/CTA-Brain-2.m4a","title":"Brain anatomy — lecture 2","start":0,"end":0}],"visuals":[{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 31","n":31,"asset":"images\\2.BRAIN\\page-31.png","path":"Assets/cta-brain/page-31.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 32","n":32,"asset":"images\\2.BRAIN\\page-32.png","path":"Assets/cta-brain/page-32.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 33","n":33,"asset":"images\\2.BRAIN\\page-33.png","path":"Assets/cta-brain/page-33.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 34","n":34,"asset":"images\\2.BRAIN\\page-34.png","path":"Assets/cta-brain/page-34.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 35","n":35,"asset":"images\\2.BRAIN\\page-35.png","path":"Assets/cta-brain/page-35.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 36","n":36,"asset":"images\\2.BRAIN\\page-36.png","path":"Assets/cta-brain/page-36.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 37","n":37,"asset":"images\\2.BRAIN\\page-37.png","path":"Assets/cta-brain/page-37.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 38","n":38,"asset":"images\\2.BRAIN\\page-38.png","path":"Assets/cta-brain/page-38.png"},{"source":"cta-brain","file":"2.BRAIN.pdf","loc":"Page 39","n":39,"asset":"images\\2.BRAIN\\page-39.png","path":"Assets/cta-brain/page-39.png"}]},{"id":"cta-brain-arteries","titleAr":"الشرايين: الكاروتيد والدائرة الشريانية","titleEn":"Arterial supply: carotids and Circle of Willis","summaryAr":"الدوران الأمامي والخلفي + قطع الـ ICA السبعة + ACA وMCA وPCA بقطعهم + دائرة ويليس + التروية الإقليمية والـ CTA.","summaryEn":"Anterior and posterior circulation, the seven ICA segments, ACA/MCA/PCA segments, Circle of Willis, regional supply and CT angiography.","objectivesAr":["تتبع الـ ICA بقطعه.","اربط كل شريان بمنطقته.","ارسم دائرة ويليس مكوناتها."],"objectivesEn":["Trace the ICA segments.","Match each artery to its territory.","Assemble the Circle of Willis."],"refs":[{"source":"cta-brain","n":40},{"source":"cta-brain","n":41},{"source":"cta-brain","n":43},{"source":"cta-brain","n":44},{"source":"cta-brain","n":45},{"source":"cta-brain","n":46},{"source":"cta-brain","n":47},{"source":"cta-brain","n":48},{"source":"cta-brain","n":49},{"source":"cta-brain","n":50}],"galleryRefs":[],"evidence":[{"file":"2.BRAIN.pdf","loc":"Page 40","text":"Arterial blood supply of the brain • There are two paired arteries responsible for the blood supply to the brain:- • Anterior circulation:Internal carotid arteries (ICAs). • Posterior circulation: (vertebro- basilar system). • The terminal branches of these arteries form an anastomotic circle, called the Circle of Willis. The branches arise from this circle supply the majority of the cerebrum.","egyptian":"تروية الدماغ من زوجين شرايين: أمامي = الكاروتيد الداخلية ICA وخلفي = الفقري-القاعدي؛ وفروعهم النهائية بيكوّنوا دائرة تشريك اسمها دائرة ويليس وفروعها بتروي معظم المخ."},{"file":"2.BRAIN.pdf","loc":"Page 41","text":"Internal carotid arteries • The (ICAs) originate at the bifurcation of CCAs, at the level of (C4). • They ascend within the carotid sheath, and enter the brain via the carotid canal of the temporal bone. • No branches to the face or neck. • It has seven segments ; cervical, petrous, lacerum, cavernous, clinoid, ophthalmic and supraclinoid. • Supraclinoid segment gives rise to anterior cerebral artery ( ACA) and middle cerebral artery (MCA).","egyptian":"الـ ICA بتبدأ عند تفرع الكاروتيد المشترك عند مستوى الفقرة C4 — بتصعد في غمد الكاروتيد وتدخل القحف عبر القناة الكاروتيدية في الصدغي؛ مالهاش فروع للوجه أو الرقبة؛ وليها 7 قطع: عنقي وصخري وخرقي وكهفي وسريري وحجاجي وفوق السريري — وفوق السريري بيطلع الدماغي الأمامي ACA والأوسط MCA."},{"file":"2.BRAIN.pdf","loc":"Page 43","text":"The ACA is divided into five segments • A1(pre-communicating) : horizontal , terminating at the anterior communicating A. • A2 (post-communicating, infracallosal):vertical from ACOM, to callosomarginal A. at the genu of the corpus callosum . • A3 (precallosal): distal to the callosomarginal artery, turns directly posterior above the corpus callosum • A4 (supracallosal): above the body of the corpus callosum . • A5 (postcallosal): above the body of the corpus callosum posterior to the plane of the coronal suture.","egyptian":"الـ ACA خمس قطع: A1 أفقي قبل الموصلية الأمامية؛ A2 رأسي بعدها تحت الغرابي؛ A3 قدام الثفني بيلف فوقه؛ A4 فوق جسم الثفني؛ A5 خلف مستوى الغرز الإكليلي."},{"file":"2.BRAIN.pdf","loc":"Page 44","text":"Middle cerebral artery segments • Horizontal M1-segment supply parts of basal ganglia and internal capsule. • Sylvian M2-segment supply the temporal lobe and insular cortex , parts of parietal and frontal lobes • Cortical M3-segment supply the lateral cerebral cortex","egyptian":"الـ MCA: M1 أفقي بيرجو أجزاء من العقد القاعدية والكبسولة الداخلية؛ M2 سيلفيوس بيرجو الصدغي والجزيرة وأجزاء من الجداري والجبهي؛ M3 قشري للقشرة الجانبية."},{"file":"2.BRAIN.pdf","loc":"Page 45","text":"Vertebral Arteries • Arise from the subclavian arteries, then ascend through foramena transversarium. • Enter the cranial cavity via the foramen magnum. • After this, the two vertebral arteries converge to form the basilar artery. • The basilar artery terminates by bifurcating into the posterior cerebral arteries ( PCA).","egyptian":"الشريانان الفقريان من تحت الترقوة بيصعدوا عبر الثقوب المستعرضة ويدخلوا عبر الثقب الكبير — وبعدين بيندمجوا في القاعدي اللي بيتفرع في الآخر للدماغيين الخلفيين PCA."},{"file":"2.BRAIN.pdf","loc":"Page 46","text":"The PCA is divided into 4 segments: • P1: from its origin at the termination of the basilar artery to posterior communicating artery (PCOM), within interpeduncular cistern • P2: from the PCOM around the midbrain • P3: within the quadrigeminal cistern • P4: cortical segment.","egyptian":"الـ PCA أربع قطع: P1 من تفرع القاعدي للموصلية الخلفية جوه الصهريج بين الساقين؛ P2 حوالين الدماغ المتوسط؛ P3 جوه الصهريج الرباعي؛ P4 قشري."},{"file":"2.BRAIN.pdf","loc":"Page 47","text":"Arterial Circle of Willis • The terminal branches of the vertebral and internal carotid arteries all anastomose to form a circular blood vessel, called the Circle of Willis. • There are three main (paired) constituents of the Circle of Willis: • ACAs ( A1 segment). • ICAs ( C7 segment). • PCAs (P1 segment). • To complete the circle, two ‘connecting vessels’ are also present: • Anterior communicating artery (Acom) : – connects the two ACAs. • Posterior communicating artery (Pcom) :– branch of the internal carotid artery connects the ICA to the PCA.","egyptian":"دائرة ويليس من 3 مكونات رئيسية مزدوجة: A1 (للأمامي) وC7 (للكاروتيد) وP1 (للخلفي) — ويكمّلوا الدائرة موصلين: الأمامي Acom بين الأحمرين والخلفي Pcom فرع من الكاروتيد بيوصله بالخلفي."},{"file":"2.BRAIN.pdf","loc":"Page 48","text":"Regional Blood Supply to the brain • Cerebrum: • ACA:supply the antero-medial portion. • MCA: supply the lateral portion. • PCA: supply the posterior cerebrum & mid brain. • Cerebellum and brain stem are supplied by branches arise from vertebro-basilar arteries","egyptian":"التروية الإقليمية: ACA للجزء الأمامي-الأنسي من المخ وMCA للجانبي وPCA للخلفي والمتوسط — والمخيخ وجذع الدماغ من فروع الفقري-القاعدي."},{"file":"2.BRAIN.pdf","loc":"Page 49","text":"Ct angiography","egyptian":"الـ CTA: تصوير شرايين بالتباين بيوضح الدائرة وفروعها بالتفصيل."},{"file":"2.BRAIN.pdf","loc":"Page 50","text":"Ct angiography","egyptian":"الـ CTA: إعادة بناء ثلاثية الأبعاد للأوعية الدماغية."}],"quiz":[{"type":"mcq","q":"Through which opening do the vertebral arteries enter the cranial cavity?","options":["Foramen magnum","Carotid canal","Foramen transversarium","Jugular foramen"],"answer":0,"why":"The vertebrals ascend through the transverse foramina, then enter via the foramen magnum.","source":{"source":"cta-brain","n":45},"points":1},{"type":"mcq","q":"Which segments form the main paired constituents of the Circle of Willis?","options":["A1, C7 and P1","A2, C4 and P2","M1, M2 and M3","A1, A2 and P1"],"answer":0,"why":"The paired constituents: ACAs (A1), ICAs (C7) and PCAs (P1), completed by Acom and Pcom.","source":{"source":"cta-brain","n":47},"points":1}],"cards":[{"id":"6ea1d018fa","front":"Name the two circulations of the brain","back":"أمامي: الكاروتيد الداخلية؛ خلفي: الفقري-القاعدي.","en":"Anterior: ICAs; posterior: vertebro-basilar.","tag":"fact"},{"id":"a88ae9bc5e","front":"List the seven ICA segments","back":"عنقي صخري خرقي كهفي سريري حجاجي فوق-سريري (C7 بيدي ACA وMCA).","en":"Cervical, petrous, lacerum, cavernous, clinoid, ophthalmic, supraclinoid (gives ACA and MCA).","tag":"fact"},{"id":"0e3ceb7893","front":"What supplies the lateral cerebrum?","back":"الشريان الدماغي الأوسط MCA.","en":"The middle cerebral artery.","tag":"fact"},{"id":"33c9ca8bbb","front":"Assemble the Circle of Willis","back":"3 أزواج: A1 وC7 وP1 + موصلين: Acom وPcom.","en":"Paired A1, C7, P1 plus the connecting Acom and Pcom.","tag":"fact"},{"id":"0e30cd3c8c","front":"Which vessels supply the cerebellum and brainstem?","back":"فروع الفقري-القاعدي.","en":"Vertebro-basilar branches.","tag":"fact"},{"id":"90e3298c26","front":"Through which opening do the vertebral arteries enter the cranial cavity?","back":"Foramen magnum — The vertebrals ascend through the transverse foramina, then enter via the foramen magnum.","en":"Foramen magnum","tag":"quiz"},{"id":"c3ef7b7b57","front":"Which segments form the main paired constituents of the Circle of Willis?","back":"A1, C7 and P1 — The paired constituents: ACAs (A1), ICAs (C7) and PCAs (P1), completed by Acom and Pcom.","en":"A1, C7 and P1","tag":"quiz"}],"midterm":[{"part":0,"n":4,"q":"The cancellous bone located between the inner and outer cortical tables is termed:","options":["Tentorium","Sulcus","Falx","Diploic space"],"answer":3,"why":"The skull contains inner and outer tables separated by the diploic space.","type":"mcq","points":1,"label":"Midterm bank · Brain Q4","source":{"part":0,"qn":4}},{"part":0,"n":27,"q":"The lateral ventricles communicate with the third ventricle through the:","options":["Foramina of Monro","Median aperture","Aqueduct of Sylvius","Lateral aperture"],"answer":0,"why":"The foramina of Monro connect the lateral ventricles with the third ventricle.","type":"mcq","points":1,"label":"Midterm bank · Brain Q27","source":{"part":0,"qn":27}},{"part":0,"n":30,"q":"The fourth ventricle communicates with the third ventricle through the:","options":["Sylvian fissure","Central canal","Foramen of Monro","Aqueduct of Sylvius"],"answer":3,"why":"The aqueduct of Sylvius connects the third and fourth ventricles.","type":"mcq","points":1,"label":"Midterm bank · Brain Q30","source":{"part":0,"qn":30}},{"part":0,"n":33,"q":"Which cistern is specifically listed among the main CSF cisterns?","options":["Interpeduncular cistern","Ambient cistern","Suprasellar cistern","Prepontine cistern"],"answer":2,"why":"The lecture specifically lists the suprasellar cistern.","type":"mcq","points":1,"label":"Midterm bank · Brain Q33","source":{"part":0,"qn":33}},{"part":0,"n":39,"q":"Which function is specifically attributed to the cerebellum? [Page 10]","options":["Vision","Speech
